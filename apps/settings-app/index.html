<!DOCTYPE html>
<html lang="en" class="h-full bg-transparent" data-theme="black" x-data="settingsApp()" x-init="init()">
<head>
  <script data-hayos-prepaint-settings>
    (function applyHayOSPrepaintSettings() {
      try {
        var root = document.documentElement;
        var params = new URLSearchParams(window.location.search);
        var fromQueryLang = (params.get('lang') || params.get('language') || '').trim().toLowerCase();
        var fromQueryTheme = (params.get('theme') || '').trim();
        var stored = null;
        try {
          var raw = window.localStorage.getItem('hayos.settings');
          stored = raw ? JSON.parse(raw) : null;
        } catch {
          stored = null;
        }
        var language = fromQueryLang === 'hy' || fromQueryLang === 'en'
          ? fromQueryLang
          : (stored && stored.language === 'hy' ? 'hy' : 'en');
        var theme = fromQueryTheme
          || (stored && typeof stored.theme === 'string' ? stored.theme.trim() : '')
          || 'black';
        root.lang = language;
        root.setAttribute('data-theme', theme);
      } catch {
        // ignore prepaint bootstrap failures
      }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title x-text="t('pageTitle')">Settings</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <script>
    function loadHayOSClient() {
      const debugMode = new URLSearchParams(window.location.search).get('debug') === '1';
      const isLocalhost =
        window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1';
      const clientUrl = isLocalhost
        ? 'http://localhost:5173/hayos-client.js'
        : `/hayos-client.js${debugMode ? `?v=${Date.now()}` : ''}`;

      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = clientUrl;
        script.onload = () => resolve(script.src || clientUrl);
        script.onerror = () =>
          reject(new Error(`Failed to load HayOSClient from ${clientUrl}`));
        document.head.appendChild(script);
      });
    }
  </script>

  <script>
    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        plugins: [require('daisyui')],
        daisyui: { themes: true },
      };
    }
  </script>
</head>
<body class="h-full">
  <div class="mx-auto h-full max-w-6xl px-4 py-6" x-cloak>
    <div class="card bg-base-200 shadow p-5">
      <h1 class="text-xl font-semibold" x-text="t('title')"></h1>
      <p class="mt-1 text-sm opacity-70" x-text="t('description')"></p>
      <div class="mt-3 text-sm">
        <span class="font-semibold" x-text="`${t('statusLabel')}:`"></span>
        <span x-text="status"></span>
      </div>
      <div class="mt-2 text-error text-sm" x-show="error" x-text="error"></div>
    </div>
    <div class="mt-3 card bg-base-200 shadow p-4" x-show="debugMode">
      <h2 class="text-sm font-semibold">Debug trace</h2>
      <div class="mt-1 text-xs font-mono opacity-70" x-text="`client: ${clientBuildStamp || 'unknown'}`"></div>
      <div class="mt-2 max-h-40 overflow-auto text-xs font-mono opacity-80">
        <template x-for="item in debugEntries" :key="item.id">
          <div x-text="item.text"></div>
        </template>
      </div>
    </div>

    <div class="mt-4 grid grid-cols-1 gap-4 lg:grid-cols-[260px_1fr]">
      <aside class="card bg-base-200 shadow p-3">
        <h2 class="mb-2 px-2 text-xs font-semibold uppercase opacity-70" x-text="t('sectionsTitle')"></h2>
        <div class="space-y-1">
          <template x-for="module in modules" :key="module.id">
            <button
              type="button"
              class="btn btn-block justify-start"
              :class="selectedModuleId === module.id ? 'btn-primary' : 'btn-ghost'"
              @click="selectModule(module.id, { historyMode: 'push' })"
            >
              <span x-text="displayModuleTitle(module)"></span>
            </button>
          </template>
        </div>
        <div class="mt-3 text-sm opacity-70" x-show="!loading && modules.length === 0" x-text="t('emptyModules')"></div>
      </aside>

      <main class="card bg-base-200 shadow overflow-hidden">
        <div class="border-b border-base-300 px-4 py-3 text-sm">
          <span class="font-semibold" x-text="`${t('activeSectionLabel')}:`"></span>
          <span x-text="activeModuleTitle"></span>
        </div>
        <div class="relative h-[70vh] min-h-[420px] bg-base-100">
          <template x-if="activeModuleSrc">
            <iframe
              x-ref="moduleFrame"
              title="Settings section"
              :src="activeModuleSrc"
              allow="accelerometer; gyroscope; magnetometer"
              sandbox="allow-scripts allow-modals allow-same-origin allow-pointer-lock"
              class="h-full w-full border-0 bg-transparent"
              @load="status = t('statusReady')"
            ></iframe>
          </template>
          <template x-if="!activeModuleSrc">
            <div class="grid h-full place-items-center text-sm opacity-70" x-text="t('selectSectionHint')"></div>
          </template>
        </div>
      </main>
    </div>
  </div>

  <script>
    function settingsApp() {
      return {
        appId: 'settings',
        client: null,
        user: null,
        loading: true,
        status: '',
        error: '',
        language: 'en',
        modules: [],
        selectedModuleId: '',
        activeModuleSrc: '',
        hostSessionId: '',
        preferredSection: '',
        unbindModuleEvents: null,
        unbindHistoryEvents: null,
        unbindRelayEvents: null,
        relayRequestRoutes: new Map(),
        debugMode: false,
        debugEntries: [],
        clientBuildStamp: '',
        relayRouteTimeoutMs: 30000,
        relayStaleGraceMs: 5000,
        i18n: {
          en: {
            pageTitle: 'Settings',
            title: 'Settings',
            description: 'Unified configuration hub for HayOS modules.',
            statusLabel: 'Status',
            sectionsTitle: 'Sections',
            activeSectionLabel: 'Active section',
            emptyModules: 'No settings modules found.',
            selectSectionHint: 'Select a section from the left menu.',
            statusInitializing: 'Initializing...',
            statusAuthCheck: 'Checking auth...',
            statusLoadingModules: 'Loading modules...',
            statusReady: 'Ready',
            statusFailed: 'Failed',
            sectionLanguage: 'Language',
            sectionWallpaper: 'Wallpaper',
            errorNotAuthenticated: 'Not authenticated.',
            errorPermissionDenied: 'Permission denied.',
            errorGeneric: 'Something went wrong.',
          },
          hy: {
            pageTitle: 'Կարգավորումներ',
            title: 'Կարգավորումներ',
            description: 'HayOS module-ների միասնական կարգավորումների կենտրոն։',
            statusLabel: 'Կարգավիճակ',
            sectionsTitle: 'Բաժիններ',
            activeSectionLabel: 'Ընթացիկ բաժին',
            emptyModules: 'Settings module չի գտնվել։',
            selectSectionHint: 'Ձախ ընտրացանկից ընտրիր բաժինը։',
            statusInitializing: 'Սկսվում է...',
            statusAuthCheck: 'Ստուգվում է auth-ը...',
            statusLoadingModules: 'Բեռնվում են module-ները...',
            statusReady: 'Պատրաստ է',
            statusFailed: 'Սխալ',
            sectionLanguage: 'Լեզու',
            sectionWallpaper: 'Պաստառ',
            errorNotAuthenticated: 'Մուտք գործած չես։',
            errorPermissionDenied: 'Թույլտվություն չկա։',
            errorGeneric: 'Տեղի ունեցավ սխալ։',
          },
        },
        t(key) {
          const dict = this.i18n[this.language] || this.i18n.en;
          return dict[key] || this.i18n.en[key] || key;
        },
        normalizeLanguage(value) {
          return value === 'hy' ? 'hy' : 'en';
        },
        displayModuleTitle(module) {
          if (!module) return '-';
          const moduleKey = (module.moduleId || module.id || '').trim();
          if (moduleKey === 'language') return this.t('sectionLanguage');
          if (moduleKey === 'wallpaper') return this.t('sectionWallpaper');
          return module.title || module.name || moduleKey || '-';
        },
        localizeErrorMessage(message) {
          const text = typeof message === 'string' ? message.trim() : '';
          if (!text) return '';
          const normalized = text.toLowerCase();
          if (normalized.includes('not authenticated')) return this.t('errorNotAuthenticated');
          if (normalized.includes('permission denied')) return this.t('errorPermissionDenied');
          return text;
        },
        normalizeHostAppId(value) {
          const raw = typeof value === 'string' ? value.trim() : '';
          const knownSettingsAliases = new Set([
            'settings',
            'settings-app',
            'language',
            'language-app',
            'wallpaper',
          ]);
          if (knownSettingsAliases.has(raw)) {
            return 'settings';
          }
          return 'settings';
        },
        pushDebug(text) {
          if (!this.debugMode) return;
          const stamp = new Date().toISOString().slice(11, 23);
          this.debugEntries.push({
            id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
            text: `${stamp} ${text}`,
          });
          if (this.debugEntries.length > 80) {
            this.debugEntries.splice(0, this.debugEntries.length - 80);
          }
        },
        parseBuildStamp(clientUrl) {
          if (typeof clientUrl !== 'string' || clientUrl.trim().length === 0) return 'unknown';
          try {
            const parsed = new URL(clientUrl, window.location.href);
            const stamp = parsed.searchParams.get('v');
            if (stamp && stamp.trim().length > 0) return `v=${stamp.trim()}`;
            return parsed.pathname.split('/').pop() || 'unknown';
          } catch {
            return 'unknown';
          }
        },
        get activeModuleTitle() {
          const found = this.modules.find((module) => module.id === this.selectedModuleId);
          return found ? this.displayModuleTitle(found) : '-';
        },
        makeHostSessionId() {
          const uidPart = this.user?.uid ? this.user.uid.slice(0, 8) : 'anon';
          return `settings-${uidPart}-${Date.now()}`;
        },
        buildModuleSrc(module) {
          if (!module || !module.id || !module.iframePath) return '';
          const currentLanguage = this.normalizeLanguage(this.language);
          if (this.client && typeof this.client.buildHostedModuleSrc === 'function') {
            return this.client.buildHostedModuleSrc(module, {
              hostAppId: this.appId,
              hostSessionId: this.hostSessionId,
              actorUid: this.user?.uid || '',
              moduleMode: 'settings.section',
              device: 'desktop',
              params: {
                section: module.moduleId || module.id,
                lang: currentLanguage,
                language: currentLanguage,
              },
            });
          }
          const params = new URLSearchParams({
            appId: module.id,
            hostAppId: this.appId,
            hostSessionId: this.hostSessionId,
            actorUid: this.user?.uid || '',
            moduleMode: 'settings.section',
            device: 'desktop',
            section: module.moduleId || module.id,
            lang: currentLanguage,
            language: currentLanguage,
          });
          return `${module.iframePath}?${params.toString()}`;
        },
        async loadModules() {
          if (!this.client) return;
          this.status = this.t('statusLoadingModules');
          try {
            let modules = [];
            if (typeof this.client.listModules === 'function') {
              modules = await this.client.listModules({
                moduleType: 'settings.section',
                hostAppId: this.appId,
              });
            } else {
              const apps = await this.client.listApps({
                moduleType: 'settings.section',
                hostAppId: this.appId,
                includeHostOnly: true,
              });
              modules = Array.isArray(apps) ? apps : [];
            }
            this.modules = Array.isArray(modules) ? modules : [];
            if (this.modules.length > 0) {
              let nextModule = null;
              if (this.preferredSection) {
                nextModule = this.modules.find((entry) => (
                  entry.id === this.preferredSection || entry.moduleId === this.preferredSection
                )) || null;
              }
              if (!nextModule && this.selectedModuleId) {
                nextModule = this.modules.find((entry) => entry.id === this.selectedModuleId) || null;
              }
              if (!nextModule) {
                nextModule = this.modules[0];
              }
              this.selectModule(nextModule.id, { historyMode: 'replace' });
            }
            this.status = this.t('statusReady');
          } catch (error) {
            const message = error && error.message ? error.message : String(error);
            this.error = this.localizeErrorMessage(message);
            this.status = this.t('statusFailed');
          }
        },
        syncLocationSection(section, mode = 'replace') {
          const normalizedMode = mode === 'push' ? 'push' : 'replace';
          const nextSection = typeof section === 'string' ? section.trim() : '';
          if (!nextSection) return;
          const nextParams = new URLSearchParams(window.location.search);
          nextParams.set('appId', this.appId);
          nextParams.set('section', nextSection);
          const nextQuery = nextParams.toString();
          const nextUrl = `${window.location.pathname}${nextQuery ? `?${nextQuery}` : ''}`;
          if (normalizedMode === 'push') {
            window.history.pushState({ section: nextSection }, '', nextUrl);
            return;
          }
          window.history.replaceState({ section: nextSection }, '', nextUrl);
        },
        clearRelayRequestRoute(requestId) {
          const key = typeof requestId === 'string' ? requestId.trim() : '';
          if (!key) return;
          const route = this.relayRequestRoutes.get(key);
          if (route && route.timeoutId) {
            window.clearTimeout(route.timeoutId);
          }
          if (route && route.staleTimeoutId) {
            window.clearTimeout(route.staleTimeoutId);
          }
          this.relayRequestRoutes.delete(key);
        },
        clearAllRelayRequestRoutes() {
          this.relayRequestRoutes.forEach((route) => {
            if (route && route.timeoutId) {
              window.clearTimeout(route.timeoutId);
            }
            if (route && route.staleTimeoutId) {
              window.clearTimeout(route.staleTimeoutId);
            }
          });
          this.relayRequestRoutes.clear();
        },
        markRelayRoutesStaleForSection(sectionId) {
          const targetSection = typeof sectionId === 'string' ? sectionId.trim() : '';
          if (!targetSection) return;
          this.relayRequestRoutes.forEach((route, requestId) => {
            if (!route || route.sectionId !== targetSection || route.delivered) {
              return;
            }
            route.stale = true;
            route.staleAt = Date.now();
            if (route.staleTimeoutId) {
              window.clearTimeout(route.staleTimeoutId);
            }
            route.staleTimeoutId = window.setTimeout(() => {
              this.pushDebug(`stale grace expired ${requestId}`);
              this.clearRelayRequestRoute(requestId);
            }, this.relayStaleGraceMs);
          });
        },
        isRelayRouteWithinGrace(route) {
          if (!route || !route.stale) return true;
          const staleAt = typeof route.staleAt === 'number' ? route.staleAt : 0;
          return Date.now() - staleAt <= this.relayStaleGraceMs;
        },
        selectModule(moduleId, options = {}) {
          const module = this.modules.find((entry) => entry.id === moduleId);
          if (!module) return;
          const historyMode = options && options.historyMode === 'push' ? 'push' : 'replace';
          const previousSection = this.selectedModuleId;
          if (previousSection && previousSection !== module.id) {
            this.markRelayRoutesStaleForSection(previousSection);
          }
          this.selectedModuleId = module.id;
          this.preferredSection = module.moduleId || module.id;
          this.activeModuleSrc = this.buildModuleSrc(module);
          this.syncLocationSection(this.preferredSection, historyMode);
        },
        handleHistoryPopState() {
          const params = new URLSearchParams(window.location.search);
          const nextSection =
            (params.get('section') || params.get('moduleId') || params.get('module') || '').trim();
          if (!nextSection) return;
          this.preferredSection = nextSection;
          if (this.modules.length === 0) return;
          const nextModule = this.modules.find((entry) => (
            entry.id === nextSection || entry.moduleId === nextSection
          ));
          if (!nextModule || nextModule.id === this.selectedModuleId) return;
          this.selectModule(nextModule.id, { historyMode: 'replace' });
        },
        setupHistoryEvents() {
          if (this.unbindHistoryEvents) return;
          const handler = () => {
            this.handleHistoryPopState();
          };
          window.addEventListener('popstate', handler);
          this.unbindHistoryEvents = () => {
            window.removeEventListener('popstate', handler);
            this.unbindHistoryEvents = null;
          };
        },
        setupRelayEvents() {
          if (this.unbindRelayEvents) return;
          const handler = (event) => {
            const data = event.data;
            if (!data || typeof data !== 'object') return;
            const moduleFrameWindow = this.$refs?.moduleFrame?.contentWindow || null;
            const isFromModuleFrame = Boolean(moduleFrameWindow) && event.source === moduleFrameWindow;
            const isFromParent = event.source === window.parent;
            const responseRequestId = data.type === 'hayos:response' && typeof data.requestId === 'string'
              ? data.requestId.trim()
              : '';
            const hasKnownResponseRoute = Boolean(
              responseRequestId && this.relayRequestRoutes.has(responseRequestId),
            );
            if (!isFromModuleFrame && !isFromParent && !hasKnownResponseRoute) return;

            if (isFromModuleFrame) {
              if (data.type !== 'hayos:request') {
                return;
              }
              const requestId = typeof data.requestId === 'string' ? data.requestId.trim() : '';
              if (!requestId) return;
              this.pushDebug(`child->host request ${requestId} (${data?.action?.kind || 'unknown'})`);
              this.clearRelayRequestRoute(requestId);
              const timeoutId = window.setTimeout(() => {
                this.pushDebug(`host route timeout ${requestId}`);
                this.clearRelayRequestRoute(requestId);
              }, this.relayRouteTimeoutMs);
              this.relayRequestRoutes.set(requestId, {
                targetWindow: event.source,
                sectionId: this.selectedModuleId || this.preferredSection || '',
                createdAt: Date.now(),
                timeoutId,
                delivered: false,
              });
              const forwardedRequest = {
                ...data,
                sourceAppId: this.appId,
              };
              this.pushDebug(`host->parent request ${requestId}`);
              window.parent.postMessage(forwardedRequest, '*');
              return;
            }

            if (data.type === 'hayos:response') {
              const requestId = responseRequestId;
              if (!requestId) return;
              this.pushDebug(`parent->host response ${requestId} ok=${data.ok === true}`);
              const route = this.relayRequestRoutes.get(requestId);
              if (!route) return;
              let delivered = false;
              const postToTarget = (targetWindow) => {
                if (!targetWindow || typeof targetWindow.postMessage !== 'function') return false;
                try {
                  targetWindow.postMessage(data, '*');
                  return true;
                } catch {
                  return false;
                }
              };
              delivered = postToTarget(route.targetWindow);
              if (!delivered && this.isRelayRouteWithinGrace(route)) {
                const activeFrameWindow = this.$refs?.moduleFrame?.contentWindow || null;
                if (route.sectionId && route.sectionId === this.selectedModuleId) {
                  delivered = postToTarget(activeFrameWindow);
                  if (delivered) {
                    this.pushDebug(`host->child fallback response ${requestId}`);
                  }
                }
              }
              route.delivered = delivered;
              this.pushDebug(delivered ? `host->child response ${requestId}` : `host->child response failed ${requestId}`);
              this.clearRelayRequestRoute(requestId);
              return;
            }

            if (data.type === 'hayos:systemEvent' || data.type === 'hayos:authStateChanged') {
              if (isFromModuleFrame) return;
              if (data.type === 'hayos:systemEvent' && data.event === 'debug.trace') {
                const traceId = data.payload && typeof data.payload.traceId === 'string' ? data.payload.traceId : '';
                const stage = data.payload && typeof data.payload.stage === 'string' ? data.payload.stage : '';
                this.pushDebug(`bridge ${stage} ${traceId}`);
              }
              if (!moduleFrameWindow) return;
              moduleFrameWindow.postMessage(data, '*');
            }
          };
          window.addEventListener('message', handler);
          this.unbindRelayEvents = () => {
            window.removeEventListener('message', handler);
            this.unbindRelayEvents = null;
            this.clearAllRelayRequestRoutes();
          };
        },
        resolveModuleFromNavigateEvent(data) {
          if (!data || data.type !== 'hayos:moduleEvent' || data.event !== 'module.navigate') {
            return null;
          }
          const payload = data.payload && typeof data.payload === 'object' ? data.payload : {};
          const target = typeof payload.target === 'string' ? payload.target.trim() : '';
          const section = typeof payload.section === 'string' ? payload.section.trim() : '';
          const moduleId = typeof payload.moduleId === 'string' ? payload.moduleId.trim() : '';
          const candidates = [target, section, moduleId].filter((value) => value.length > 0);
          if (candidates.length === 0) return null;
          for (const candidate of candidates) {
            const found = this.modules.find((entry) => (
              entry.id === candidate || entry.moduleId === candidate
            ));
            if (found) return found;
          }
          return null;
        },
        setupModuleEvents() {
          if (this.unbindModuleEvents) return;
          const handler = (event) => {
            const frameWindow = this.$refs?.moduleFrame?.contentWindow;
            if (!frameWindow || event.source !== frameWindow) return;
            const nextModule = this.resolveModuleFromNavigateEvent(event.data);
            if (!nextModule || nextModule.id === this.selectedModuleId) return;
            this.selectModule(nextModule.id, { historyMode: 'push' });
          };
          window.addEventListener('message', handler);
          this.unbindModuleEvents = () => {
            window.removeEventListener('message', handler);
            this.unbindModuleEvents = null;
          };
        },
        async init() {
          this.error = '';
          this.status = this.t('statusInitializing');
          try {
            const loadedClientUrl = await loadHayOSClient();
            const urlParams = new URLSearchParams(window.location.search);
            this.debugMode = urlParams.get('debug') === '1';
            this.clientBuildStamp = this.parseBuildStamp(loadedClientUrl);
            this.appId = this.normalizeHostAppId(urlParams.get('appId'));
            this.preferredSection =
              (urlParams.get('section') || urlParams.get('moduleId') || urlParams.get('module') || '').trim();
            this.client = new HayOSClient(this.appId);
            this.status = this.t('statusAuthCheck');
            this.setupHistoryEvents();
            this.setupRelayEvents();

            const auth = await this.client.ensureAuthenticated();
            this.user = auth.user || null;
            this.hostSessionId = this.makeHostSessionId();

            this.language = this.normalizeLanguage(await this.client.getLanguage());
            document.documentElement.lang = this.language;
            document.title = this.t('pageTitle');
            this.client.onLanguageChanged((language) => {
              this.language = this.normalizeLanguage(language);
              document.documentElement.lang = this.language;
              document.title = this.t('pageTitle');
            });

            this.setupModuleEvents();
            await this.loadModules();
          } catch (error) {
            const message = error && error.message ? error.message : String(error);
            this.error = this.localizeErrorMessage(message) || this.t('errorGeneric');
            this.status = this.t('statusFailed');
          } finally {
            this.loading = false;
          }
        },
      };
    }
  </script>
</body>
</html>
