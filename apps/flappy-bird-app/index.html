<!DOCTYPE html>
<html lang="en" class="h-full bg-transparent" data-theme="black" x-data="flappyApp()" x-init="init()">

<head>
  <script data-hayos-prepaint-settings>
    (function applyHayOSPrepaintSettings() {
      try {
        var root = document.documentElement;
        var params = new URLSearchParams(window.location.search);
        var fromQueryLang = (params.get('lang') || params.get('language') || '').trim().toLowerCase();
        var fromQueryTheme = (params.get('theme') || '').trim();
        var stored = null;
        try {
          var raw = window.localStorage.getItem('hayos.settings');
          stored = raw ? JSON.parse(raw) : null;
        } catch {
          stored = null;
        }
        var language = fromQueryLang === 'hy' || fromQueryLang === 'en'
          ? fromQueryLang
          : (stored && stored.language === 'hy' ? 'hy' : 'en');
        var theme = fromQueryTheme
          || (stored && typeof stored.theme === 'string' ? stored.theme.trim() : '')
          || 'black';
        root.lang = language;
        root.setAttribute('data-theme', theme);
      } catch {
        // ignore prepaint bootstrap failures
      }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title x-text="t('pageTitle')">Flappy Hay</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <script>
    function loadHayOSClient() {
      const isLocalhost =
        window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1';
      const clientUrl = isLocalhost
        ? 'http://localhost:5173/hayos-client.js'
        : '/hayos-client.js';

      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = clientUrl;
        script.onload = resolve;
        script.onerror = () =>
          reject(new Error(`Failed to load HayOSClient from ${clientUrl}`));
        document.head.appendChild(script);
      });
    }
  </script>

  <script>
    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        plugins: [require('daisyui')],
        daisyui: { themes: true },
      };
    }
  </script>

  <style>
    [x-cloak] {
      display: none !important;
    }

    .game-canvas {
      touch-action: manipulation;
      user-select: none;
    }
  </style>
</head>

<body class="h-full overflow-hidden">
  <div class="h-full" x-cloak>
    <div class="drawer lg:drawer-open h-full">
      <input id="app-sidebar" type="checkbox" class="drawer-toggle" x-model="sidebarOpen" />
      <div class="drawer-content h-full p-4 lg:p-6 overflow-hidden">
        <div class="mb-4 lg:hidden">
          <label for="app-sidebar" class="btn btn-outline btn-sm">
            <i class="fa-solid fa-bars mr-2"></i>
            <span x-text="t('menuBtn')"></span>
          </label>
        </div>

        <template x-if="loading">
          <div class="h-full flex items-center justify-center">
            <span class="loading loading-spinner loading-lg"></span>
          </div>
        </template>

        <div x-show="!loading" class="h-[calc(100%-2.5rem)] lg:h-full overflow-hidden">
          <section x-show="currentPage === 'game'" class="h-full min-h-0 grid grid-rows-[auto,1fr] gap-3">
            <div class="card bg-base-200 shadow py-3 px-4">
              <div class="flex flex-wrap items-center gap-2 justify-between">
                <div>
                  <h1 class="text-lg font-semibold" x-text="t('gameTitle')"></h1>
                  <p class="text-sm opacity-70" x-text="t('gameHint')"></p>
                </div>
                <div class="flex gap-2 items-center">
                  <span class="badge badge-outline" x-text="`${t('statusLabel')}: ${statusLabel()}`"></span>
                  <span class="badge badge-primary" x-text="`${t('scoreLabel')}: ${score}`"></span>
                  <span class="badge badge-secondary" x-text="`${t('bestLabel')}: ${bestScore}`"></span>
                  <button
                    class="btn btn-xs btn-warning"
                    x-show="gameState === 'playing'"
                    @click="togglePause()"
                    x-text="t('pauseBtn')"></button>
                </div>
              </div>
              <div class="mt-3 text-error text-sm" x-show="error" x-text="error"></div>
            </div>

            <div class="card bg-base-200 shadow overflow-hidden h-full min-h-0">
              <div class="h-full w-full p-2 sm:p-3 relative">
                <canvas
                  x-ref="gameCanvas"
                  class="game-canvas w-full h-full rounded-xl bg-sky-900/70 border border-base-300"
                  @pointerdown.prevent="handleAction()"></canvas>

                <div
                  x-show="gameState !== 'playing'"
                  class="absolute inset-x-0 bottom-4 flex items-center justify-center px-4"
                  x-transition.opacity>
                  <div class="rounded-xl bg-base-300/85 backdrop-blur px-3 py-2 flex flex-wrap items-center justify-center gap-2">
                    <button class="btn btn-primary btn-sm" @click="startGame()" x-show="gameState === 'idle' || gameState === 'gameover'" x-text="t('startBtn')"></button>
                    <button class="btn btn-warning btn-sm" @click="togglePause()" x-show="gameState === 'paused'" x-text="t('resumeBtn')"></button>
                    <button class="btn btn-sm" @click="resetGame()" x-text="t('resetBtn')"></button>
                    <span class="text-xs opacity-70 hidden sm:inline" x-text="t('controlHelp')"></span>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section x-show="currentPage === 'scores'" class="h-full grid grid-rows-[auto,1fr] gap-3">
            <div class="card bg-base-200 shadow p-4">
              <h2 class="text-lg font-semibold" x-text="t('scoresTitle')"></h2>
              <p class="text-sm opacity-70" x-text="t('scoresSubtitle')"></p>
            </div>

            <div class="card bg-base-200 shadow p-4 overflow-auto">
              <div class="flex justify-between items-center mb-3">
                <span class="text-sm" x-text="`${t('runsLabel')}: ${scoreRuns.length}`"></span>
                <button class="btn btn-sm" @click="loadScores()" x-text="t('refreshBtn')"></button>
              </div>

              <template x-if="scoresLoading">
                <div class="py-8 text-center">
                  <span class="loading loading-spinner loading-md"></span>
                </div>
              </template>

              <template x-if="!scoresLoading && scoreRuns.length === 0">
                <div class="alert">
                  <i class="fa-regular fa-circle-info"></i>
                  <span x-text="t('scoresEmpty')"></span>
                </div>
              </template>

              <template x-if="!scoresLoading && scoreRuns.length > 0">
                <div class="overflow-x-auto">
                  <table class="table table-zebra table-sm">
                    <thead>
                      <tr>
                        <th x-text="t('scoreLabel')"></th>
                        <th x-text="t('durationLabel')"></th>
                        <th x-text="t('dateLabel')"></th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="run in scoreRuns" :key="run.id">
                        <tr>
                          <td x-text="run.score"></td>
                          <td x-text="formatDuration(run.durationMs)"></td>
                          <td x-text="formatDate(run.createdAt)"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </template>
            </div>
          </section>

          <section x-show="currentPage === 'settings'" class="h-full grid grid-rows-[auto,1fr] gap-3">
            <div class="card bg-base-200 shadow p-4">
              <h2 class="text-lg font-semibold" x-text="t('settingsTitle')"></h2>
              <p class="text-sm opacity-70" x-text="t('settingsSubtitle')"></p>
            </div>

            <div class="card bg-base-200 shadow p-4 overflow-auto space-y-4">
              <div class="form-control">
                <label class="label cursor-pointer justify-start gap-3">
                  <input type="checkbox" class="toggle" x-model="soundEnabled" @change="persistProfile()" />
                  <span class="label-text" x-text="t('soundLabel')"></span>
                </label>
              </div>

              <div class="form-control">
                <label class="label cursor-pointer justify-start gap-3">
                  <input type="checkbox" class="toggle" x-model="showHitboxes" />
                  <span class="label-text" x-text="t('hitboxLabel')"></span>
                </label>
              </div>

              <div class="divider"></div>

              <div class="text-sm space-y-2">
                <div><span class="font-semibold" x-text="`${t('themeLabel')}: `"></span><span x-text="osTheme || '-' "></span></div>
                <div><span class="font-semibold" x-text="`${t('languageLabel')}: `"></span><span x-text="language === 'hy' ? 'Հայերեն' : 'English'"></span></div>
                <div><span class="font-semibold" x-text="`${t('userLabel')}: `"></span><span x-text="user?.email || user?.displayName || user?.uid || '-' "></span></div>
              </div>

              <div class="divider"></div>

              <div class="text-sm">
                <h3 class="font-semibold mb-2" x-text="t('dataModelTitle')"></h3>
                <ul class="list-disc pl-5 space-y-1 opacity-80">
                  <li>`flappyProfiles/{appId}`: bestScore, lastScore, totalRuns, soundEnabled, updatedAt</li>
                  <li>`flappyRuns/{autoId}`: appId, score, durationMs, createdAt</li>
                  <li x-text="t('ownershipText')"></li>
                </ul>
              </div>
            </div>
          </section>
        </div>
      </div>

      <div class="drawer-side">
        <label for="app-sidebar" class="drawer-overlay"></label>
        <aside class="min-h-full w-72 bg-base-200 border-r border-base-300 p-4">
          <div class="mb-4">
            <p class="text-xs uppercase tracking-wide opacity-60" x-text="t('sidebarLabel')"></p>
          </div>
          <ul class="menu gap-1">
            <template x-for="item in navItems" :key="item.key">
              <li>
                <button
                  class="justify-start"
                  :class="{ 'active': currentPage === item.key }"
                  @click="setPage(item.key)">
                  <i :class="item.icon"></i>
                  <span x-text="t(item.labelKey)"></span>
                </button>
              </li>
            </template>
          </ul>
        </aside>
      </div>
    </div>
  </div>

  <script>
    function flappyApp() {
      return {

        scoresLoading: false,
        status: 'Initializing...',
        error: '',
        appId: 'flappy-hay',
        user: null,
        client: null,
        language: 'en',
        osTheme: '',
        currentPage: 'game',
        sidebarOpen: false,
        navItems: [
          { key: 'game', labelKey: 'menuGame', icon: 'fa-solid fa-gamepad' },
          { key: 'scores', labelKey: 'menuScores', icon: 'fa-solid fa-ranking-star' },
          { key: 'settings', labelKey: 'menuSettings', icon: 'fa-solid fa-gear' },
        ],
        gameState: 'idle',
        score: 0,
        bestScore: 0,
        scoreRuns: [],
        soundEnabled: true,
        showHitboxes: false,
        rafId: null,
        lastFrameTime: 0,
        runStartedAt: 0,
        saveTimer: null,
        keydownHandler: null,
        resizeHandler: null,
        resizeObserver: null,
        canvasReady: false,
        ensureCanvasReadyRaf: null,
        game: {
          width: 960,
          height: 540,
          gravity: 1200,
          jumpVelocity: -380,
          maxDownVelocity: 520,
          pipeSpeed: 220,
          pipeGap: 170,
          pipeWidth: 88,
          minPipeY: 80,
          maxPipeY: 460,
          pipeSpawnEveryMs: 1300,
          timeSinceSpawn: 0,
          groundHeight: 56,
          bird: { x: 220, y: 260, radius: 16, velocity: 0, rotation: 0 },
          pipes: [],
          nextPipeId: 1,
        },
        i18n: {
          en: {
            pageTitle: 'Flappy Hay',
            menuBtn: 'Menu',
            sidebarLabel: 'Navigation',
            menuGame: 'Game',
            menuScores: 'Scores',
            menuSettings: 'Settings',
            gameTitle: 'Flappy Hay',
            gameHint: 'Tap/click/space to flap. Avoid pipes.',
            statusLabel: 'Status',
            scoreLabel: 'Score',
            bestLabel: 'Best',
            startBtn: 'Start',
            pauseBtn: 'Pause',
            resumeBtn: 'Resume',
            resetBtn: 'Reset',
            reloadUserBtn: 'Reload User',
            controlHelp: 'Space / Tap / Click = flap',
            scoresTitle: 'Recent Runs',
            scoresSubtitle: 'Your latest attempts are stored per user.',
            runsLabel: 'Runs',
            refreshBtn: 'Refresh',
            scoresEmpty: 'No runs yet. Play one game to create your first score.',
            durationLabel: 'Duration',
            dateLabel: 'Date',
            settingsTitle: 'Settings',
            settingsSubtitle: 'Gameplay and data model details.',
            soundLabel: 'Enable sound cues',
            hitboxLabel: 'Show debug hitboxes',
            themeLabel: 'OS Theme',
            languageLabel: 'Language',
            userLabel: 'User',
            dataModelTitle: 'Data Model',
            ownershipText: 'Ownership: reads/writes are isolated to current user scope by HayOS bridge.',
            statusInitializing: 'Initializing...',
            statusAuthCheck: 'Checking auth (silent)...',
            statusAuthenticated: 'Authenticated',
            statusReady: 'Ready',
            statusAuthFailed: 'Auth failed',
            statusIdle: 'Idle',
            statusPlaying: 'Playing',
            statusPaused: 'Paused',
            statusGameOver: 'Game Over',
          },
          hy: {
            pageTitle: 'Flappy Hay',
            menuBtn: 'Մենյու',
            sidebarLabel: 'Նավիգացիա',
            menuGame: 'Խաղ',
            menuScores: 'Միավորներ',
            menuSettings: 'Կարգավորումներ',
            gameTitle: 'Flappy Hay',
            gameHint: 'Սեղմիր կամ Space արա։ Խուսափիր խողովակներից։',
            statusLabel: 'Կարգավիճակ',
            scoreLabel: 'Միավոր',
            bestLabel: 'Լավագույն',
            startBtn: 'Սկսել',
            pauseBtn: 'Դադար',
            resumeBtn: 'Շարունակել',
            resetBtn: 'Վերասկսել',
            reloadUserBtn: 'Վերբեռնել օգտատիրոջը',
            controlHelp: 'Space / Tap / Click = թռիչք',
            scoresTitle: 'Վերջին խաղեր',
            scoresSubtitle: 'Քո փորձերը պահվում են ըստ օգտատիրոջ։',
            runsLabel: 'Փորձեր',
            refreshBtn: 'Թարմացնել',
            scoresEmpty: 'Դեռ խաղ չի պահվել։ Խաղա մեկ անգամ։',
            durationLabel: 'Տևողություն',
            dateLabel: 'Ամսաթիվ',
            settingsTitle: 'Կարգավորումներ',
            settingsSubtitle: 'Խաղի պարամետրեր և տվյալների մոդել։',
            soundLabel: 'Միացնել ձայնային նշանները',
            hitboxLabel: 'Ցույց տալ debug hitbox-երը',
            themeLabel: 'OS թեմա',
            languageLabel: 'Լեզու',
            userLabel: 'Օգտատեր',
            dataModelTitle: 'Տվյալների մոդել',
            ownershipText: 'Պատկանելություն՝ կարդալ/գրելը մեկուսացված է ընթացիկ օգտատիրոջ scope-ում։',
            statusInitializing: 'Սկսվում է...',
            statusAuthCheck: 'Ստուգվում է auth-ը...',
            statusAuthenticated: 'Միացված է',
            statusReady: 'Պատրաստ է',
            statusAuthFailed: 'Auth սխալ',
            statusIdle: 'Սպասում',
            statusPlaying: 'Խաղում է',
            statusPaused: 'Դադար',
            statusGameOver: 'Խաղի ավարտ',
          },
        },

        t(key) {
          const dict = this.i18n[this.language] || this.i18n.en;
          return dict[key] || this.i18n.en[key] || key;
        },

        statusLabel() {
          if (this.gameState === 'playing') return this.t('statusPlaying');
          if (this.gameState === 'paused') return this.t('statusPaused');
          if (this.gameState === 'gameover') return this.t('statusGameOver');
          return this.t('statusIdle');
        },

        async init() {
          this.error = '';
          this.status = this.t('statusInitializing');

          try {
            await loadHayOSClient();
            const urlParams = new URLSearchParams(window.location.search);
            this.appId = urlParams.get('appId') || 'flappy-hay';
            this.client = new HayOSClient(this.appId);
            this.resolvePageFromHash();
            window.addEventListener('hashchange', () => this.resolvePageFromHash());
            this.keydownHandler = (event) => this.onKeyDown(event);
            this.resizeHandler = () => this.resizeCanvas();
            window.addEventListener('keydown', this.keydownHandler);
            window.addEventListener('resize', this.resizeHandler);

            this.status = this.t('statusAuthCheck');
            const auth = await this.client.ensureAuthenticated();
            this.user = auth.user || null;
            this.language = await this.client.getLanguage();
            document.documentElement.lang = this.language;
            this.client.onLanguageChanged((language) => {
              this.language = language === 'hy' ? 'hy' : 'en';
              document.documentElement.lang = this.language;
            });
            this.status = this.t('statusAuthenticated');

            await this.loadOsTheme();
            this.bootstrapGameState();
            await this.loadProfile();
            await this.loadScores();
            this.status = this.t('statusReady');
          } catch (error) {
            this.error = error && error.message ? error.message : String(error);
            this.status = this.t('statusAuthFailed');
          } finally {
            this.loading = false;
            this.$nextTick(() => {
              this.observeCanvasContainer();
              this.ensureCanvasReady();
            });
          }
        },

        destroy() {
          if (this.keydownHandler) {
            window.removeEventListener('keydown', this.keydownHandler);
            this.keydownHandler = null;
          }
          if (this.resizeHandler) {
            window.removeEventListener('resize', this.resizeHandler);
            this.resizeHandler = null;
          }
          if (this.rafId) {
            cancelAnimationFrame(this.rafId);
            this.rafId = null;
          }
          if (this.ensureCanvasReadyRaf) {
            cancelAnimationFrame(this.ensureCanvasReadyRaf);
            this.ensureCanvasReadyRaf = null;
          }
          if (this.resizeObserver) {
            this.resizeObserver.disconnect();
            this.resizeObserver = null;
          }
          if (this.client) {
            this.client.destroy();
          }
        },

        onKeyDown(event) {
          if (event.code === 'Space') {
            event.preventDefault();
            this.handleAction();
          }
          if (event.code === 'KeyP') {
            this.togglePause();
          }
        },

        async loadCurrentUser() {
          if (!this.client) return;
          this.error = '';
          try {
            this.user = await this.client.getCurrentUser();
          } catch (error) {
            this.error = error && error.message ? error.message : String(error);
          }
        },

        async loadOsTheme() {
          if (!this.client) return;
          try {
            const value = await this.client.getModuleValue('ui.theme');
            this.osTheme = typeof value === 'string' ? value : '';
            if (this.osTheme) {
              document.documentElement.setAttribute('data-theme', this.osTheme);
            }
          } catch (error) {
            this.osTheme = '';
            console.warn('Failed to resolve OS theme:', error);
          }
        },

        setPage(pageKey) {
          this.currentPage = pageKey;
          window.location.hash = pageKey;
          this.sidebarOpen = false;
          if (pageKey === 'game') {
            this.$nextTick(() => this.ensureCanvasReady());
          }
          if (pageKey === 'scores') {
            this.loadScores();
          }
        },

        resolvePageFromHash() {
          const allowedPages = new Set(this.navItems.map((item) => item.key));
          const hashPage = window.location.hash.replace('#', '').trim();
          this.currentPage = allowedPages.has(hashPage) ? hashPage : 'game';
        },

        observeCanvasContainer() {
          if (!window.ResizeObserver) return;
          const canvas = this.$refs.gameCanvas;
          if (!canvas || this.resizeObserver) return;
          const container = canvas.parentElement;
          if (!container) return;

          this.resizeObserver = new ResizeObserver(() => {
            const resized = this.resizeCanvas();
            if (resized) {
              this.drawFrame();
            }
          });
          this.resizeObserver.observe(container);
        },

        ensureCanvasReady(maxAttempts = 12) {
          let attempt = 0;
          const tick = () => {
            attempt += 1;
            const resized = this.resizeCanvas();
            if (resized) {
              this.canvasReady = true;
              this.drawFrame();
              this.ensureCanvasReadyRaf = null;
              return;
            }
            if (attempt < maxAttempts) {
              this.ensureCanvasReadyRaf = requestAnimationFrame(tick);
            } else {
              this.canvasReady = false;
              this.ensureCanvasReadyRaf = null;
            }
          };

          if (this.ensureCanvasReadyRaf) {
            cancelAnimationFrame(this.ensureCanvasReadyRaf);
            this.ensureCanvasReadyRaf = null;
          }
          this.ensureCanvasReadyRaf = requestAnimationFrame(tick);
        },

        bootstrapGameState() {
          this.game.bird.y = this.game.height / 2;
          this.game.bird.velocity = 0;
          this.game.bird.rotation = 0;
          this.game.pipes = [];
          this.game.timeSinceSpawn = 0;
          this.score = 0;
          this.gameState = 'idle';
          this.runStartedAt = 0;
        },

        resizeCanvas() {
          const canvas = this.$refs.gameCanvas;
          if (!canvas) return false;
          const rect = canvas.getBoundingClientRect();
          if (!rect.width || !rect.height) {
            return false;
          }
          const devicePixelRatio = Math.max(1, window.devicePixelRatio || 1);
          canvas.width = Math.max(1, Math.floor(rect.width * devicePixelRatio));
          canvas.height = Math.max(1, Math.floor(rect.height * devicePixelRatio));
          const ctx = canvas.getContext('2d');
          if (ctx) {
            ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
          }
          this.game.width = Math.max(320, Math.floor(rect.width));
          this.game.height = Math.max(320, Math.floor(rect.height));
          return true;
        },

        startGame() {
          if (this.gameState === 'playing') return;
          this.bootstrapGameState();
          this.gameState = 'playing';
          this.runStartedAt = performance.now();
          this.jump();
          this.lastFrameTime = performance.now();
          this.runLoop();
        },

        togglePause() {
          if (this.gameState === 'playing') {
            this.gameState = 'paused';
            if (this.rafId) {
              cancelAnimationFrame(this.rafId);
              this.rafId = null;
            }
            this.drawFrame();
          } else if (this.gameState === 'paused') {
            this.gameState = 'playing';
            this.lastFrameTime = performance.now();
            this.runLoop();
          }
        },

        resetGame() {
          if (this.rafId) {
            cancelAnimationFrame(this.rafId);
            this.rafId = null;
          }
          this.bootstrapGameState();
          this.drawFrame();
        },

        handleAction() {
          if (this.gameState === 'idle' || this.gameState === 'gameover') {
            this.startGame();
            return;
          }
          if (this.gameState === 'paused') {
            this.togglePause();
            return;
          }
          if (this.gameState === 'playing') {
            this.jump();
          }
        },

        jump() {
          this.game.bird.velocity = this.game.jumpVelocity;
        },

        runLoop() {
          if (this.gameState !== 'playing') return;
          const now = performance.now();
          const deltaMs = Math.min(32, now - this.lastFrameTime);
          const dt = deltaMs / 1000;
          this.lastFrameTime = now;

          this.updateGame(dt, deltaMs);
          this.drawFrame();

          if (this.gameState === 'playing') {
            this.rafId = requestAnimationFrame(() => this.runLoop());
          }
        },

        updateGame(dt, deltaMs) {
          const bird = this.game.bird;
          bird.velocity += this.game.gravity * dt;
          bird.velocity = Math.min(bird.velocity, this.game.maxDownVelocity);
          bird.y += bird.velocity * dt;
          bird.rotation = Math.max(-0.8, Math.min(1.2, bird.velocity / 500));

          this.game.timeSinceSpawn += deltaMs;
          if (this.game.timeSinceSpawn >= this.game.pipeSpawnEveryMs) {
            this.spawnPipe();
            this.game.timeSinceSpawn = 0;
          }

          const moveBy = this.game.pipeSpeed * dt;
          for (const pipe of this.game.pipes) {
            pipe.x -= moveBy;
            if (!pipe.passed && pipe.x + this.game.pipeWidth < bird.x) {
              pipe.passed = true;
              this.score += 1;
            }
          }

          this.game.pipes = this.game.pipes.filter((pipe) => pipe.x + this.game.pipeWidth > -20);

          if (bird.y + bird.radius >= this.game.height - this.game.groundHeight || bird.y - bird.radius <= 0) {
            this.endGame();
            return;
          }

          for (const pipe of this.game.pipes) {
            const hitHorizontally = bird.x + bird.radius > pipe.x && bird.x - bird.radius < pipe.x + this.game.pipeWidth;
            if (!hitHorizontally) continue;

            const topPipeBottom = pipe.gapCenterY - this.game.pipeGap / 2;
            const bottomPipeTop = pipe.gapCenterY + this.game.pipeGap / 2;
            if (bird.y - bird.radius < topPipeBottom || bird.y + bird.radius > bottomPipeTop) {
              this.endGame();
              return;
            }
          }
        },

        spawnPipe() {
          const min = this.game.minPipeY;
          const max = this.game.height - this.game.groundHeight - (this.game.pipeGap / 2) - 30;
          const safeMax = Math.max(min + 10, max);
          const gapCenterY = Math.floor(Math.random() * (safeMax - min) + min);
          this.game.pipes.push({
            id: this.game.nextPipeId++,
            x: this.game.width + 20,
            gapCenterY,
            passed: false,
          });
        },

        async endGame() {
          if (this.gameState === 'gameover') return;
          this.gameState = 'gameover';
          if (this.rafId) {
            cancelAnimationFrame(this.rafId);
            this.rafId = null;
          }

          const durationMs = this.runStartedAt > 0 ? Math.max(0, Math.floor(performance.now() - this.runStartedAt)) : 0;
          if (this.score > this.bestScore) {
            this.bestScore = this.score;
          }
          await this.saveRun(durationMs);
          this.drawFrame();
        },

        drawFrame() {
          const canvas = this.$refs.gameCanvas;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          const w = this.game.width;
          const h = this.game.height;
          const groundY = h - this.game.groundHeight;

          ctx.clearRect(0, 0, w, h);

          const skyGradient = ctx.createLinearGradient(0, 0, 0, h);
          skyGradient.addColorStop(0, '#1d4ed8');
          skyGradient.addColorStop(1, '#0f172a');
          ctx.fillStyle = skyGradient;
          ctx.fillRect(0, 0, w, h);

          ctx.fillStyle = '#34d399';
          for (let i = 0; i < this.game.pipes.length; i += 1) {
            const pipe = this.game.pipes[i];
            const topHeight = pipe.gapCenterY - this.game.pipeGap / 2;
            const bottomY = pipe.gapCenterY + this.game.pipeGap / 2;
            const bottomHeight = groundY - bottomY;
            ctx.fillRect(pipe.x, 0, this.game.pipeWidth, topHeight);
            ctx.fillRect(pipe.x, bottomY, this.game.pipeWidth, bottomHeight);

            if (this.showHitboxes) {
              ctx.strokeStyle = '#f43f5e';
              ctx.strokeRect(pipe.x, 0, this.game.pipeWidth, topHeight);
              ctx.strokeRect(pipe.x, bottomY, this.game.pipeWidth, bottomHeight);
            }
          }

          ctx.fillStyle = '#f59e0b';
          const bird = this.game.bird;
          ctx.save();
          ctx.translate(bird.x, bird.y);
          ctx.rotate(bird.rotation);
          ctx.beginPath();
          ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#111827';
          ctx.beginPath();
          ctx.arc(6, -5, 3, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          if (this.showHitboxes) {
            ctx.strokeStyle = '#f43f5e';
            ctx.beginPath();
            ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
            ctx.stroke();
          }

          ctx.fillStyle = '#166534';
          ctx.fillRect(0, groundY, w, this.game.groundHeight);

          if (this.gameState !== 'playing') {
            const overlayText =
              this.gameState === 'paused'
                ? this.t('statusPaused')
                : this.gameState === 'gameover'
                  ? this.t('statusGameOver')
                  : this.t('statusIdle');
            ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
            ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = '#ffffff';
            ctx.font = '700 34px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(overlayText, w / 2, h / 2 - 8);
            ctx.font = '500 18px sans-serif';
            ctx.fillText(this.t('controlHelp'), w / 2, h / 2 + 24);
          }
        },

        async loadProfile() {
          if (!this.client || !this.user?.uid) return;
          this.error = '';
          try {
            const profileDoc = await this.client.firestoreGet('flappyProfiles', this.appId);
            if (profileDoc && typeof profileDoc === 'object') {
              this.bestScore = Number.isFinite(profileDoc.bestScore) ? Number(profileDoc.bestScore) : 0;
              this.soundEnabled = typeof profileDoc.soundEnabled === 'boolean' ? profileDoc.soundEnabled : true;
            }
          } catch (error) {
            this.error = error && error.message ? error.message : String(error);
          }
        },

        async persistProfile() {
          if (!this.client || !this.user?.uid) return;
          this.error = '';
          try {
            await this.client.firestoreUpdate('flappyProfiles', this.appId, {
              appId: this.appId,
              bestScore: this.bestScore,
              soundEnabled: this.soundEnabled,
            });
          } catch (error) {
            this.error = error && error.message ? error.message : String(error);
          }
        },

        async loadScores() {
          if (!this.client || !this.user?.uid) return;
          this.scoresLoading = true;
          this.error = '';
          try {
            const rows = await this.client.firestoreQuery('flappyRuns', {});
            const filtered = Array.isArray(rows)
              ? rows.filter((row) => row && row.appId === this.appId)
              : [];
            filtered.sort((a, b) => {
              const aTime = new Date(a.createdAt || 0).getTime();
              const bTime = new Date(b.createdAt || 0).getTime();
              return bTime - aTime;
            });
            this.scoreRuns = filtered.slice(0, 30).map((row) => ({
              id: row.id,
              score: Number.isFinite(row.score) ? Number(row.score) : 0,
              durationMs: Number.isFinite(row.durationMs) ? Number(row.durationMs) : 0,
              createdAt: typeof row.createdAt === 'string' ? row.createdAt : '',
            }));
          } catch (error) {
            this.error = error && error.message ? error.message : String(error);
          } finally {
            this.scoresLoading = false;
          }
        },

        scheduleSave(durationMs) {
          if (this.saveTimer) {
            clearTimeout(this.saveTimer);
          }
          this.saveTimer = setTimeout(() => {
            this.saveTimer = null;
            this.saveRunNow(durationMs);
          }, 120);
        },

        async saveRun(durationMs) {
          this.scheduleSave(durationMs);
        },

        async saveRunNow(durationMs) {
          if (!this.client || !this.user?.uid) return;
          this.error = '';
          try {
            await this.client.firestoreAdd('flappyRuns', {
              appId: this.appId,
              score: this.score,
              durationMs,
            });
            await this.client.firestoreUpdate('flappyProfiles', this.appId, {
              appId: this.appId,
              bestScore: this.bestScore,
              lastScore: this.score,
              totalRuns: this.scoreRuns.length + 1,
              soundEnabled: this.soundEnabled,
            });
            await this.loadScores();
          } catch (error) {
            this.error = error && error.message ? error.message : String(error);
          }
        },

        formatDuration(durationMs) {
          const seconds = Math.floor(Math.max(0, durationMs) / 1000);
          const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
          const secs = (seconds % 60).toString().padStart(2, '0');
          return `${mins}:${secs}`;
        },

        formatDate(value) {
          if (!value) return '-';
          const date = new Date(value);
          if (Number.isNaN(date.getTime())) return '-';
          return new Intl.DateTimeFormat(this.language === 'hy' ? 'hy-AM' : 'en-US', {
            year: 'numeric',
            month: 'short',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
          }).format(date);
        },
      };
    }

    window.addEventListener('beforeunload', () => {
      const host = document.documentElement;
      if (host && host.__x && typeof host.__x.$data?.destroy === 'function') {
        host.__x.$data.destroy();
      }
    });
  </script>
