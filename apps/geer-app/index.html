<!DOCTYPE html>
<html lang="hy" class="h-full bg-transparent" data-theme="black" x-data="templateApp()" x-init="init()">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title x-text="t('pageTitle')">Geer App</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="../shared/contract.js"></script>

  <style>
    [x-cloak] { display: none !important; }

    .mobile-shell {
      width: min(100vw, 460px);
      margin: 0 auto;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 100% -10%, rgba(63, 130, 255, 0.16), transparent 35%),
        radial-gradient(circle at 0% 120%, rgba(54, 191, 130, 0.12), transparent 35%),
        color-mix(in oklab, var(--fallback-b1, #121212) 97%, #000);
    }

    .safe-main {
      padding-bottom: calc(5.25rem + env(safe-area-inset-bottom));
    }

    .mobile-nav {
      padding-bottom: env(safe-area-inset-bottom);
    }

    *:focus-visible {
      outline: 2px solid color-mix(in oklab, var(--fallback-p, #4f46e5) 80%, white);
      outline-offset: 2px;
    }
  </style>

  <script>
    function loadHayOSClient() {
      const isLocalhost =
        window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1';
      const clientUrl = isLocalhost
        ? 'http://localhost:5173/hayos-client.js'
        : '/hayos-client.js';

      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = clientUrl;
        script.onload = resolve;
        script.onerror = () =>
          reject(new Error(`Failed to load HayOSClient from ${clientUrl}`));
        document.head.appendChild(script);
      });
    }
  </script>

  <script>
    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        plugins: [require('daisyui')],
        daisyui: { themes: true },
      };
    }
  </script>
</head>

<body class="h-full bg-base-100">
  <div class="mobile-shell border-x border-base-300/40" x-cloak>
    <header class="sticky top-0 z-20 px-4 pt-4 pb-3 border-b border-base-300/70 bg-base-100/90 backdrop-blur">
      <div class="flex items-center justify-between gap-2">
        <h1 class="text-base font-semibold truncate" x-text="t('pageTitle')"></h1>
        <span class="badge badge-outline text-[11px]" x-text="status"></span>
      </div>
      <p class="text-xs opacity-70 mt-1 truncate" x-show="user" x-text="user?.email || user?.displayName || user?.uid"></p>
      <p class="text-xs text-error mt-1" x-show="error" x-text="error"></p>
    </header>

    <main class="safe-main px-4 py-4 space-y-4">
      <section x-show="currentPage === 'overview'" class="space-y-4">
        <div class="card bg-base-200 shadow-sm">
          <div class="card-body p-4">
            <h2 class="text-base font-semibold" x-text="t('starterTitle')"></h2>
            <p class="text-sm opacity-80 mt-1" x-text="t('starterDescription')"></p>
          </div>
        </div>

        <div class="card bg-base-200 shadow-sm">
          <div class="card-body p-4 space-y-3">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-semibold" x-text="t('inputTitle')"></h3>
              <span class="badge badge-outline text-[11px]" x-text="geerSourceLabel"></span>
            </div>

            <div class="join w-full">
              <button class="btn btn-sm join-item flex-1" :class="geerSource === 'greech' ? 'btn-primary' : ''" @click="setGeerSource('greech')" x-text="t('sourceGreech')"></button>
              <button class="btn btn-sm join-item flex-1" :class="geerSource === 'custom' ? 'btn-primary' : ''" @click="setGeerSource('custom')" x-text="t('sourceCustom')"></button>
            </div>

            <textarea
              class="textarea textarea-bordered h-32 w-full"
              x-model="geerInput"
              :placeholder="t('inputPlaceholder')"
              @input="onGeerInputChange()"></textarea>
            <p class="text-xs opacity-65" x-show="handoffSummary" x-text="handoffSummary"></p>

            <div class="flex gap-2">
              <button class="btn btn-sm btn-outline flex-1" @click="resolveIncomingText()" x-text="t('reloadIncomingBtn')"></button>
              <button class="btn btn-sm flex-1" @click="clearInput()" x-text="t('clearInputBtn')"></button>
            </div>
          </div>
        </div>

        <div class="card bg-base-200 shadow-sm">
          <div class="card-body p-4 space-y-3">
            <h3 class="text-sm font-semibold" x-text="t('generatorTitle')"></h3>

            <div class="join w-full">
              <button class="btn btn-sm join-item flex-1" :class="captionPreset === 'short' ? 'btn-primary' : ''" @click="captionPreset = 'short'" x-text="t('presetShort')"></button>
              <button class="btn btn-sm join-item flex-1" :class="captionPreset === 'medium' ? 'btn-primary' : ''" @click="captionPreset = 'medium'" x-text="t('presetMedium')"></button>
              <button class="btn btn-sm join-item flex-1" :class="captionPreset === 'punchline' ? 'btn-primary' : ''" @click="captionPreset = 'punchline'" x-text="t('presetPunchline')"></button>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <button class="btn btn-sm btn-primary" @click="generateCaptions()" :disabled="!geerInput.trim() || generationLoading" x-text="generationLoading ? t('generatingBtn') : t('generateBtn')"></button>
              <button class="btn btn-sm" @click="regenerateCaptions()" :disabled="!captions.length || generationLoading" x-text="t('regenerateBtn')"></button>
            </div>

            <div class="flex gap-2" x-show="captions.length">
              <button class="btn btn-xs btn-outline" @click="copyAllCaptions()" x-text="t('copyAllBtn')"></button>
              <p class="text-xs opacity-70 self-center" x-show="copyNotice" x-text="copyNotice"></p>
            </div>

            <div class="space-y-2" x-show="captions.length && !generationLoading">
              <template x-for="(caption, idx) in captions" :key="`${idx}-${caption}`">
                <article class="rounded-lg border border-base-300 bg-base-100 p-3 space-y-2">
                  <p class="text-sm" x-text="caption"></p>
                  <button class="btn btn-xs" @click="copyCaption(caption)" x-text="t('copyBtn')"></button>
                </article>
              </template>
            </div>

            <div class="rounded-lg border border-info/35 bg-info/10 px-3 py-2 text-xs" x-show="generationLoading" x-text="t('captionsLoading')"></div>
            <div class="rounded-lg border border-error/40 bg-error/10 px-3 py-2 text-xs" x-show="generationError" x-text="generationError"></div>
            <p class="text-xs opacity-60" x-show="!captions.length && !generationLoading && !generationError" x-text="t('captionsEmpty')"></p>
          </div>
        </div>

        <div class="card bg-base-200 shadow-sm">
          <div class="card-body p-4 space-y-2 text-sm">
            <p><span class="font-semibold" x-text="t('statusLabel')"></span>: <span x-text="status"></span></p>
            <p><span class="font-semibold" x-text="t('themeLabel')"></span>: <span x-text="osTheme || '(not resolved)'"></span></p>
            <p><span class="font-semibold" x-text="t('languageLabel')"></span>: <span x-text="language === 'hy' ? 'Հայերեն' : 'English'"></span></p>
            <p x-show="user"><span class="font-semibold" x-text="t('userLabel')"></span>: <span x-text="user?.email || user?.displayName || user?.uid"></span></p>
            <p class="text-warning text-xs pt-1" x-text="t('permissionNote')"></p>
          </div>
        </div>
      </section>

      <section x-show="currentPage === 'music'" class="card bg-base-200 shadow-sm">
        <div class="card-body p-4">
          <h2 class="text-base font-semibold" x-text="t('musicTitle')"></h2>
          <p class="text-sm opacity-75 mt-1" x-text="t('musicDescription')"></p>
          <div class="mt-3 border border-base-300 rounded-lg p-3">
            <p class="text-sm" x-text="t('musicPlaceholder')"></p>
          </div>
        </div>
      </section>

      <section x-show="currentPage === 'files'" class="card bg-base-200 shadow-sm">
        <div class="card-body p-4">
          <h2 class="text-base font-semibold" x-text="t('filesTitle')"></h2>
          <p class="text-sm opacity-75 mt-1" x-text="t('filesDescription')"></p>
          <div class="mt-3 border border-base-300 rounded-lg p-3">
            <p class="text-sm" x-text="t('filesPlaceholder')"></p>
          </div>
        </div>
      </section>

      <section x-show="currentPage === 'actions'" class="card bg-base-200 shadow-sm">
        <div class="card-body p-4">
          <h2 class="text-base font-semibold mb-3" x-text="t('actionsTitle')"></h2>
          <div class="grid grid-cols-2 gap-2">
            <button class="btn btn-primary btn-sm" @click="refresh()" x-text="t('refreshBtn')"></button>
            <button class="btn btn-sm" @click="loadCurrentUser()" x-text="t('reloadUserBtn')"></button>
          </div>
          <pre class="mt-3 p-3 rounded bg-base-300 text-xs overflow-auto" x-text="debugText"></pre>
        </div>
      </section>

      <section x-show="currentPage === 'settings'" class="card bg-base-200 shadow-sm">
        <div class="card-body p-4">
          <h2 class="text-base font-semibold" x-text="t('settingsTitle')"></h2>
          <p class="text-sm opacity-75 mt-1" x-text="t('settingsDescription')"></p>
        </div>
      </section>
    </main>

    <nav class="mobile-nav fixed bottom-0 left-0 right-0 mx-auto w-[min(100vw,460px)] bg-base-100/95 backdrop-blur border-t border-base-300 z-30">
      <div class="grid grid-cols-5">
        <template x-for="item in navItems" :key="item.key">
          <button class="btn btn-ghost rounded-none h-14" :class="currentPage === item.key ? 'text-primary' : ''" @click="setPage(item.key)" :aria-label="t(item.labelKey)">
            <div class="flex flex-col items-center gap-1 text-[11px] leading-none">
              <i :class="item.icon"></i>
              <span x-text="t(item.labelKey)"></span>
            </div>
          </button>
        </template>
      </div>
    </nav>
  </div>

  <script>

        status: 'Initializing...',
        error: '',
        appId: 'geer-app',
        user: null,
        client: null,
        language: 'hy',
        osTheme: '',
        currentPage: 'overview',
        sidebarOpen: false,
        debugText: 'Ready.',
        geerSource: 'custom',
        geerInput: '',
        captionPreset: 'short',
        captions: [],
        captionSeed: 0,
        generationLoading: false,
        generationError: '',
        copyNotice: '',
        handoffMeta: null,
        navItems: [
          { key: 'overview', labelKey: 'menuOverview', icon: 'fa-solid fa-house' },
          { key: 'music', labelKey: 'menuMusic', icon: 'fa-solid fa-music' },
          { key: 'files', labelKey: 'menuFiles', icon: 'fa-solid fa-folder-tree' },
          { key: 'actions', labelKey: 'menuActions', icon: 'fa-solid fa-wrench' },

        ],
        i18n: {

            inputTitle: 'Caption Input Pipeline',

            sourceCustom: 'Custom',
            inputPlaceholder: 'Paste source text for caption generation...',
            reloadIncomingBtn: 'Reload incoming',
            clearInputBtn: 'Clear',
            generatorTitle: 'Caption Generator',
            presetShort: 'Short',
            presetMedium: 'Medium',
            presetPunchline: 'Punchline',
            generateBtn: 'Generate',
            generatingBtn: 'Generating...',
            regenerateBtn: 'Regenerate',
            captionsEmpty: 'No captions yet. Generate from input text.',
            captionsLoading: 'Generating caption cards...',
            copyBtn: 'Copy',
            copyAllBtn: 'Copy all',
            copySuccess: 'Copied',
            copyFailed: 'Copy failed',
            statusLabel: 'Status',
            themeLabel: 'OS Theme',
            languageLabel: 'Language',
            userLabel: 'User',
            permissionNote: 'Note: resolving ui.theme requires app permission firestore.read.',
            musicTitle: 'Music Player Page',
            musicDescription: 'Use this page as a base for your player controls and playlist UI.',
            musicPlaceholder: 'Add player controls, queue, and current track metadata here.',
            filesTitle: 'File Manager Page',
            filesDescription: 'Use this page for folders, files, and file actions.',
            filesPlaceholder: 'Add file tree, list, and operation buttons here.',
            actionsTitle: 'Starter Actions',
            refreshBtn: 'Refresh',
            reloadUserBtn: 'Reload User',
            settingsTitle: 'Settings Page',
            settingsDescription: 'Place application-level settings and preferences here.',
            statusInitializing: 'Initializing...',
            statusAuthCheck: 'Checking auth (silent)...',
            statusAuthenticated: 'Authenticated',
            statusReady: 'Ready',
            statusAuthFailed: 'Auth failed',
          },

            pageTitle: 'Geer Հավելված',
            menuBtn: 'Մենյու',
            sidebarLabel: 'Նավիգացիա',
            menuOverview: 'Ընդհանուր',
            menuMusic: 'Երաժշտական նվագարկիչ',
            menuFiles: 'Ֆայլերի կառավարիչ',
            menuActions: 'Գործողություններ',
            menuSettings: 'Կարգավորումներ',
            starterTitle: 'Հավելվածի մեկնարկային տեմփլեյթ',
            starterDescription: 'Ներառում է հիմնական գրադարաններ + silent auth bootstrap։',
            inputTitle: 'Caption մուտքային հոսք',
            sourceGreech: 'Greech-ից',
            sourceCustom: 'Սեփական',
            inputPlaceholder: 'Փակցրու սկզբնական տեքստը caption-ների համար...',
            reloadIncomingBtn: 'Վերբեռնել մուտքը',

            presetShort: 'Կարճ',
            presetMedium: 'Միջին',
            presetPunchline: 'Punchline',
            generateBtn: 'Գեներացնել',
            generatingBtn: 'Գեներացվում է...',
            regenerateBtn: 'Կրկին գեներացնել',
            captionsEmpty: 'Caption դեռ չկա։ Գեներացրու մուտքային տեքստից։',
            captionsLoading: 'Ստեղծվում են caption քարտերը...',
            copyBtn: 'Պատճենել',
            copyAllBtn: 'Պատճենել բոլորը',
            copySuccess: 'Պատճենված է',
            copyFailed: 'Պատճենումը չստացվեց',
            statusLabel: 'Կարգավիճակ',
            themeLabel: 'OS թեմա',
            languageLabel: 'Լեզու',
            userLabel: 'Օգտատեր',
            permissionNote: 'Նշում․ ui.theme կարդալու համար պետք է firestore.read permission։',
            musicTitle: 'Երաժշտական նվագարկչի էջ',
            musicDescription: 'Օգտագործեք այս էջը նվագարկիչի կառավարիչների և playlist-ի UI-ի համար։',
            musicPlaceholder: 'Այստեղ ավելացրեք player controls, queue և current track տվյալները։',
            filesTitle: 'Ֆայլերի կառավարչի էջ',
            filesDescription: 'Օգտագործեք այս էջը թղթապանակների, ֆայլերի և file actions-ի համար։',
            filesPlaceholder: 'Այստեղ ավելացրեք file tree, list և գործառնական կոճակները։',
            actionsTitle: 'Սկզբնական գործողություններ',
            refreshBtn: 'Թարմացնել',
            reloadUserBtn: 'Վերբեռնել օգտատիրոջը',
            settingsTitle: 'Կարգավորումների էջ',
            settingsDescription: 'Այստեղ ավելացրեք ծրագրի կարգավորումները և նախընտրությունները։',
            statusInitializing: 'Սկսվում է...',
            statusAuthCheck: 'Ստուգվում է auth-ը...',
            statusAuthenticated: 'Միացված է',
            statusReady: 'Պատրաստ է',
            statusAuthFailed: 'Auth սխալ',
          },
        },
        t(key) {
          const dict = this.i18n[this.language] || this.i18n.hy;
          return dict[key] || this.i18n.hy[key] || this.i18n.en[key] || key;
        },

        get geerSourceLabel() {
          return this.geerSource === 'greech' ? this.t('sourceGreech') : this.t('sourceCustom');
        },

        get handoffSummary() {
          if (!this.handoffMeta) return '';
          const src = this.handoffMeta.sourceType || 'greech';
          const lang = this.handoffMeta.language || 'hy';
          return `source=${src} · lang=${lang}`;
        },

        async init() {
          this.error = '';
          try {
            await loadHayOSClient();
            const urlParams = new URLSearchParams(window.location.search);
            this.appId = urlParams.get('appId') || 'geer-app';

            this.client = new HayOSClient(this.appId);
            this.resolvePageFromHash();
            window.addEventListener('hashchange', () => this.resolvePageFromHash());
            this.status = this.t('statusAuthCheck');

            const auth = await this.client.ensureAuthenticated();
            this.user = auth.user || null;
            this.language = await this.client.getLanguage();
            document.documentElement.lang = this.language;
            this.client.onLanguageChanged((language) => {
              this.language = language === 'hy' ? 'hy' : 'en';
              document.documentElement.lang = this.language;
              this.status = this.t('statusReady');
            });
            this.status = this.t('statusAuthenticated');
            await this.loadOsTheme();
            this.debugText = JSON.stringify(
              { appId: this.appId, user: this.user, language: this.language, osTheme: this.osTheme || null },
              null,
              2,
            );

            await this.refresh();
          } catch (error) {
            this.error = error && error.message ? error.message : String(error);
            this.status = this.t('statusAuthFailed');
          } finally {
            this.resolveIncomingText();
            this.loading = false;
          }
        },

        async loadCurrentUser() {
          if (!this.client) return;
          this.error = '';
          try {
            this.user = await this.client.getCurrentUser();
            this.debugText = JSON.stringify(
              { appId: this.appId, user: this.user, language: this.language, osTheme: this.osTheme || null },
              null,
              2,
            );
          } catch (error) {
            this.error = error && error.message ? error.message : String(error);
          }
        },

        async refresh() {
          this.error = '';
          await this.loadOsTheme();
          this.status = this.t('statusReady');
        },

        setPage(pageKey) {
          this.currentPage = pageKey;
          window.location.hash = pageKey;
          this.sidebarOpen = false;
        },

        setGeerSource(source) {
          this.geerSource = source === 'greech' ? 'greech' : 'custom';
          this.persistInputDraft();
        },

        onGeerInputChange() {
          this.persistInputDraft();
        },

        clearInput() {
          this.geerInput = '';
          this.geerSource = 'custom';
          this.handoffMeta = null;
          this.persistInputDraft();
        },

        resolveIncomingText() {
          const params = new URLSearchParams(window.location.search);
          const incomingTextFromUrl = (params.get('text') || params.get('input') || '').trim();
          const incomingSourceFromUrl = (params.get('source') || '').trim().toLowerCase();

          const contractHandoff =
            window.HopContract && typeof window.HopContract.getHandoff === 'function'
              ? window.HopContract.getHandoff()
              : null;
          const contractDraft =
            window.HopContract && typeof window.HopContract.getGeerDraft === 'function'
              ? window.HopContract.getGeerDraft()
              : null;

          const incomingTextFromStorage = (localStorage.getItem('hop.geer.handoffText') || '').trim();
          const incomingSourceFromStorage = (localStorage.getItem('hop.geer.handoffSource') || '').trim().toLowerCase();
          const draftText = localStorage.getItem('hop.geer.draftText') || '';
          const draftSource = (localStorage.getItem('hop.geer.draftSource') || '').trim().toLowerCase();

          const text =
            incomingTextFromUrl ||
            ((contractHandoff && contractHandoff.text) || '').trim() ||
            incomingTextFromStorage ||
            ((contractDraft && contractDraft.text) || '').trim() ||
            draftText;

          const sourceRaw = incomingTextFromUrl
            ? incomingSourceFromUrl
            : (contractHandoff && contractHandoff.sourceType)
              ? contractHandoff.sourceType
              : incomingTextFromStorage
                ? incomingSourceFromStorage
                : (contractDraft && contractDraft.sourceType)
                  ? contractDraft.sourceType
                  : draftSource;

          if (!text) return;

          this.geerInput = text;
          this.geerSource = sourceRaw === 'custom' ? 'custom' : 'greech';
          this.handoffMeta =
            contractHandoff && contractHandoff.text
              ? {
                sourceType: contractHandoff.sourceType || 'greech',
                language: contractHandoff.language || 'hy',
                selectedTextId: contractHandoff.selectedTextId || '',
                context: contractHandoff.context || {},
              }
              : null;
          this.persistInputDraft();
        },

        persistInputDraft() {
          if (window.HopContract && typeof window.HopContract.setGeerDraft === 'function') {
            window.HopContract.setGeerDraft({
              text: this.geerInput || '',
              sourceType: this.geerSource || 'custom',
              language: this.language || 'hy',
            });
          }
          localStorage.setItem('hop.geer.draftText', this.geerInput || '');
          localStorage.setItem('hop.geer.draftSource', this.geerSource || 'custom');
        },

        generateCaptions() {
          const source = (this.geerInput || '').trim();
          this.generationError = '';
          this.copyNotice = '';
          if (!source) {
            this.captions = [];
            return;
          }

          this.generationLoading = true;

          try {
            const words = source.split(/\s+/).filter(Boolean);
            const shortBase = words.slice(0, 6).join(' ');
            const mediumBase = words.slice(0, 12).join(' ');
            const lastWord = (words[words.length - 1] || 'flow').replace(/[^a-z0-9ա-ֆ]/gi, '').toLowerCase();
            const variant = this.captionSeed % 3;

            if (this.captionPreset === 'short') {
              this.captions = [
                `${shortBase}...`,
                variant === 0 ? 'Stay real, stay loud.' : (variant === 1 ? 'Քուչեն խոսում է։' : 'Street mood on point.'),
                `#hayhiphop #${lastWord || 'rap'}`,
              ];
              return;
            }

            if (this.captionPreset === 'medium') {
              this.captions = [
                `Այսօրվա vibe-ը՝ ${mediumBase}...`,
                variant === 0 ? 'Տող առ տող, բակ առ բակ, հայկական հոսք։' : (variant === 1 ? 'From text to frame, բառը աշխատում է։' : 'Rhythm, context, and real talk in one take.'),
                'Drop your version in comments.',
              ];
              return;
            }

            this.captions = [
              `${shortBase} — punchline mode.`,
              variant === 0 ? 'No fake bars, only pressure.' : (variant === 1 ? 'Սթեյջը փոքր չի, միտքը մեծ է։' : 'Real bars. Real city. Real timing.'),
              `#punchline #${lastWord || 'bars'}`,
            ];
          } catch (error) {
            this.generationError = error && error.message ? error.message : 'Failed to generate captions.';
            this.captions = [];
          } finally {
            this.generationLoading = false;
          }
        },

        regenerateCaptions() {
          if (!this.geerInput.trim()) return;
          this.captionSeed += 1;
          this.generateCaptions();
        },

        async copyCaption(text) {
          const ok = await this.copyWithFallback(text);
          this.copyNotice = ok ? this.t('copySuccess') : this.t('copyFailed');
        },

        async copyAllCaptions() {
          if (!this.captions.length) return;
          const ok = await this.copyWithFallback(this.captions.join('\n'));
          this.copyNotice = ok ? this.t('copySuccess') : this.t('copyFailed');
        },

        async copyWithFallback(text) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (_error) {
            try {
              const area = document.createElement('textarea');
              area.value = text;
              area.setAttribute('readonly', '');
              area.style.position = 'fixed';
              area.style.opacity = '0';
              document.body.appendChild(area);
              area.select();
              const success = document.execCommand('copy');
              area.remove();
              return Boolean(success);
            } catch (_innerError) {
              return false;
            }
          }
        },

        resolvePageFromHash() {
          const allowedPages = new Set(this.navItems.map((item) => item.key));
          const hashPage = window.location.hash.replace('#', '').trim();
          this.currentPage = allowedPages.has(hashPage) ? hashPage : 'overview';
        },

        async loadOsTheme() {
          if (!this.client) return;
          try {
            const value = await this.client.getModuleValue('ui.theme');
            this.osTheme = typeof value === 'string' ? value : '';
            this.applyOsTheme(this.osTheme);
          } catch (error) {
            console.warn('Failed to resolve OS theme:', error);
            this.osTheme = '';
          }
        },

        applyOsTheme(themeName) {
          if (!themeName || typeof themeName !== 'string') {
            return;
          }
          document.documentElement.setAttribute('data-theme', themeName);
        },

        async firestoreGet(collection, documentId) {
          if (!this.client) throw new Error('Client not initialized');
          return this.client.firestoreGet(collection, documentId);
        },

        async firestoreQuery(collection, queryParams) {
          if (!this.client) throw new Error('Client not initialized');
          return this.client.firestoreQuery(collection, queryParams);
        },

        async firestoreAdd(collection, data) {
          if (!this.client) throw new Error('Client not initialized');
          return this.client.firestoreAdd(collection, data);
        },

        async firestoreUpdate(collection, documentId, data) {
          if (!this.client) throw new Error('Client not initialized');
          return this.client.firestoreUpdate(collection, documentId, data);
        },

        async firestoreDelete(collection, documentId) {
          if (!this.client) throw new Error('Client not initialized');
          return this.client.firestoreDelete(collection, documentId);
        },
      };
    }
  </script>
