<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top Books (Deprecated)</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1220;
      color: #e5e7eb;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      width: min(680px, calc(100vw - 32px));
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 20px;
      box-sizing: border-box;
    }
    h1 { margin: 0 0 10px; font-size: 20px; }
    p { margin: 0; line-height: 1.5; color: #cbd5e1; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Top Books is deprecated</h1>
    <p>This app was removed as part of the global-space cleanup and is no longer supported.</p>
  </main>
</body>
</html>
