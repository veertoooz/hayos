  <script data-hayos-prepaint-settings>
    (function applyHayOSPrepaintSettings() {
      try {
        var root = document.documentElement;
        var params = new URLSearchParams(window.location.search);
        var fromQueryLang = (params.get('lang') || params.get('language') || '').trim().toLowerCase();
        var fromQueryTheme = (params.get('theme') || '').trim();
        var stored = null;
        try {
          var raw = window.localStorage.getItem('hayos.settings');
          stored = raw ? JSON.parse(raw) : null;
        } catch {
          stored = null;
        }
        var language = fromQueryLang === 'hy' || fromQueryLang === 'en'
          ? fromQueryLang
          : (stored && stored.language === 'hy' ? 'hy' : 'en');
        var theme = fromQueryTheme
          || (stored && typeof stored.theme === 'string' ? stored.theme.trim() : '')
          || 'black';
        root.lang = language;
        root.setAttribute('data-theme', theme);
      } catch {
        // ignore prepaint bootstrap failures
      }
    })();
  </script>

    .ios-control {
      border-radius: 0.95rem;
    }

    .ios-input {
      border-radius: 0.95rem;
      min-height: 2.9rem;
    }

    .ios-pill {
      border-radius: 999px;
    }

    .ios-pressed:active {
      transform: scale(0.985);
    }

    .ios-disabled:disabled {
      opacity: 0.46;
      pointer-events: none;
    }

    .press-lift {
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .press-lift:active {
      transform: translateY(0.5px) scale(0.985);
    }

    .surface-hover {
      transition: box-shadow 180ms ease, border-color 180ms ease;

    }

    .safe-bottom {

    }

    .inner-scroll {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .truncate-tight {
      min-width: 0;
    }

      }
    }

        border-radius: 0.8rem;
      }

      .ios-tap {
        min-height: 2.55rem;
      }

      .primary-heading {
        font-size: 1.05rem;
        line-height: 1.3rem;
      }
    }
  </style>

  <script>
    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        plugins: [require('daisyui')],
        daisyui: { themes: true },
      };
    }

    function loadHayOSClient() {
      const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      const clientUrl = isLocalhost ? 'http://localhost:5173/hayos-client.js' : '/hayos-client.js';

      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = clientUrl;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Failed to load HayOSClient from ${clientUrl}`));
        document.head.appendChild(script);
      });
    }
  </script>

          const artist = this.artists.find((item) => item.id === this.selectedArtistId);
          return artist ? `${this.artistNameText(artist)} • ${this.t('tracks')}` : this.t('tracks');
        },

        visibleTracks() {
          const activeTracks = this.tracks.filter((item) => item && item.inactive !== true);
          if (!this.selectedArtistId) return activeTracks;
          return activeTracks.filter((item) => item.artistId === this.selectedArtistId);

        filteredArtists() {

          if (!query) return this.artists;
          return this.artists.filter((item) =>
            this.searchBlob(item.name).includes(query) || this.searchBlob(item.bio).includes(query)
          );

        filteredTracks() {
          const query = this.trackQuery.toLowerCase();
          const source = this.visibleTracks();
          if (!query) return source;
          return source.filter((item) =>
            this.searchBlob(item.title).includes(query) || this.searchBlob(item.artistName).includes(query)
          );

        currentTrackIndex() {
          if (!this.currentTrack) return -1;
          return this.tracks.findIndex((item) => item.id === this.currentTrack.id);
        },

        hasPrevTrack() {
          return this.currentTrackIndex() > 0;

        hasNextTrack() {
          const idx = this.currentTrackIndex();
          return idx > -1 && idx < this.tracks.length - 1;

        openPrevTrack() {
          const idx = this.currentTrackIndex();
          if (idx <= 0) return;
          this.openTrack(this.tracks[idx - 1].id);
        },

        openNextTrack() {
          const idx = this.currentTrackIndex();
          if (idx < 0 || idx >= this.tracks.length - 1) return;
          this.openTrack(this.tracks[idx + 1].id);
        },

        recentTrackList() {
          return this.recentTrackIds
            .map((id) => this.tracks.find((track) => track.id === id))
            .filter(Boolean)
            .slice(0, 4);

        localizedText(value) {
          if (!value) return '';
          if (typeof value === 'string') return value;
          const lang = this.language === 'en' ? 'en' : 'hy';
          return value[lang] || value.hy || value.en || '';
        },

        searchBlob(value) {
          if (!value) return '';
          if (typeof value === 'string') return value.toLowerCase();
          const hy = typeof value.hy === 'string' ? value.hy : '';
          const en = typeof value.en === 'string' ? value.en : '';
          return `${hy} ${en}`.toLowerCase();
        },

        artistNameText(artist) {
          return this.localizedText(artist?.name);
        },

        artistBioText(artist) {
          return this.localizedText(artist?.bio);
        },

        trackTitleText(track) {
          return this.localizedText(track?.title);
        },

        trackArtistText(track) {
          return this.localizedText(track?.artistName);
        },

        lyricsText(track) {
          return this.localizedText(track?.lyrics);
        },

        normalizeLocalized(value) {
          if (typeof value === 'string') {
            return { hy: value, en: value };
          }
          if (value && typeof value === 'object') {
            const hy = typeof value.hy === 'string' && value.hy.trim() ? value.hy.trim() : '';
            const en = typeof value.en === 'string' && value.en.trim() ? value.en.trim() : '';
            if (hy || en) return { hy: hy || en, en: en || hy };
          }
          return { hy: '', en: '' };
        },

        hasLocalizedText(value) {
          if (!value || typeof value !== 'object') return false;
          const hy = typeof value.hy === 'string' ? value.hy.trim() : '';
          const en = typeof value.en === 'string' ? value.en.trim() : '';
          return Boolean(hy || en);
        },

        warnSchemaIssue(scope, reason, payload) {
          try {
            console.warn('[hop-schema]', { scope, reason, payload });
          } catch {
            // ignore logging failures
          }
        },

        normalizeIsoDate(value) {
          if (typeof value !== 'string') return '';
          const trimmed = value.trim();
          if (!trimmed) return '';
          const time = Date.parse(trimmed);
          if (!Number.isFinite(time)) return '';
          return new Date(time).toISOString();
        },

        normalizeTrackDoc(raw) {
          if (!raw || typeof raw !== 'object') return null;
          const id = typeof raw.id === 'string' && raw.id.trim() ? raw.id.trim() : '';
          const artistId = typeof raw.artistId === 'string' && raw.artistId.trim() ? raw.artistId.trim() : '';
          const youtubeId = typeof raw.youtubeId === 'string' ? raw.youtubeId.trim() : '';
          const title = this.normalizeLocalized(raw.title);
          if (!id || !artistId || !youtubeId || !this.hasLocalizedText(title)) return null;
          return {
            id,
            artistId,
            title,
            lyrics: this.normalizeLocalized(raw.lyrics),
            mood: this.normalizeLocalized(raw.mood),
            youtubeId,
            videoUrl: typeof raw.videoUrl === 'string' && raw.videoUrl.trim()
              ? raw.videoUrl.trim()
              : (youtubeId ? `https://www.youtube.com/watch?v=${youtubeId}` : ''),
            publishedAt: this.normalizeIsoDate(raw.publishedAt),
            year: typeof raw.year === 'string' ? raw.year.trim() : '',
            duration: typeof raw.duration === 'string' ? raw.duration.trim() : '',
            sortOrder: Number.isFinite(raw.sortOrder) ? Number(raw.sortOrder) : 0,
            isActive: raw.isActive !== false,
            inactive: raw.inactive === true,
          };
        },

        normalizeArtistDoc(raw) {
          if (!raw || typeof raw !== 'object') return null;
          const id = typeof raw.id === 'string' && raw.id.trim() ? raw.id.trim() : '';
          const name = this.normalizeLocalized(raw.name);
          const bio = this.normalizeLocalized(raw.bio);
          if (!id || !this.hasLocalizedText(name)) return null;
          return {
            id,
            name,
            bio: this.hasLocalizedText(bio) ? bio : { hy: '', en: '' },
            sortOrder: Number.isFinite(raw.sortOrder) ? Number(raw.sortOrder) : 0,
            isActive: raw.isActive !== false,
          };
        },

        loadHopDataFromLocalSeed() {
          const ok = this.applyArtistsDataset(localSeedArtists);
          if (ok) this.activeDataSource = 'local-seed';
          return ok;
        },

        applyArtistsDataset(artistsInput) {
          const sourceArtists = Array.isArray(artistsInput) ? artistsInput : [];
          const artistRows = sourceArtists
            .map((item, index) => {
              const normalized = this.normalizeArtistDoc({ ...item, sortOrder: item?.sortOrder ?? ((index + 1) * 10) });
              if (!normalized) {
                this.warnSchemaIssue('artist', 'invalid-required-fields', { id: item?.id || '', index });
                return null;
              }
              return normalized;
            })
            .filter((item) => item && item.isActive);

          const trackRows = sourceArtists.flatMap((artist) => {
            const artistId = typeof artist?.id === 'string' ? artist.id.trim() : '';
            const tracks = Array.isArray(artist?.tracks) ? artist.tracks : [];
            return tracks
              .map((track, index) => {
                const normalized = this.normalizeTrackDoc({
                  ...track,
                  artistId: track?.artistId || artistId,
                  sortOrder: track?.sortOrder ?? ((index + 1) * 10),
                });
                if (!normalized) {
                  this.warnSchemaIssue('track', 'invalid-required-fields', {
                    artistId: artistId || '(unknown)',
                    trackId: track?.id || '',
                    youtubeId: track?.youtubeId || '',
                    index,
                  });
                  return null;
                }
                return normalized;
              })
              .filter((item) => item && item.isActive && item.inactive !== true);
          });

          if (!artistRows.length || !trackRows.length) return false;
          artistRows.sort((a, b) => (a.sortOrder - b.sortOrder) || this.localizedText(a.name).localeCompare(this.localizedText(b.name)));
          trackRows.sort((a, b) => (a.sortOrder - b.sortOrder) || this.localizedText(a.title).localeCompare(this.localizedText(b.title)));

          const tracksByArtist = new Map();
          trackRows.forEach((track) => {
            if (!tracksByArtist.has(track.artistId)) tracksByArtist.set(track.artistId, []);
            tracksByArtist.get(track.artistId).push(track);
          });

          const nextArtists = artistRows
            .map((artist) => ({
              id: artist.id,
              name: artist.name,
              bio: artist.bio,
              tracks: tracksByArtist.get(artist.id) || [],
            }))
            .filter((artist) => artist.tracks.length > 0);

          const nextTracks = this.buildTracksFromArtists(nextArtists);

          this.artists = nextArtists;
          this.tracks = nextTracks;
          if (this.currentTrack) {
            const found = nextTracks.find((item) => item.id === this.currentTrack.id);
            this.currentTrack = found || null;
          }
          return true;
        },

        buildTracksFromArtists(artistsInput) {
          const artistsSafe = Array.isArray(artistsInput) ? artistsInput : [];
          return artistsSafe.flatMap((artist) =>
            (Array.isArray(artist?.tracks) ? artist.tracks : [])
              .filter((track) => track && track.inactive !== true)
              .map((track) => ({
                ...track,
                artistName: artist.name,
              }))
          );
        },

        async loadHopDataFromGeneratedFile() {
          this.isDataLoading = true;
          this.dataError = '';
          try {
            const cacheBust = Date.now();
            const sourceUrl = `/apps/hop/data/artists.generated.json?v=${cacheBust}`;
            const resp = await fetch(sourceUrl, { cache: 'no-store' });
            if (!resp.ok) {
              this.dataLoadAttempts.push(`generated-file:http-${resp.status}`);
              return false;
            }
            const payload = await resp.json();
            const artistsRaw = Array.isArray(payload) ? payload : (Array.isArray(payload?.artists) ? payload.artists : []);
            const ok = this.applyArtistsDataset(artistsRaw);
            if (ok) this.activeDataSource = 'generated-file';
            if (!ok) this.dataLoadAttempts.push('generated-file:invalid-shape');
            return ok;
          } catch (err) {
            this.dataLoadAttempts.push('generated-file:exception');
            this.dataError = err?.message || String(err);
            return false;
          } finally {
            this.isDataLoading = false;
          }
        },

        async loadHopDataFromBackend() {
          if (!this.client || typeof this.client.firestoreQuery !== 'function') return false;
          this.isDataLoading = true;
          try {
            const [artistsRaw, tracksRaw] = await Promise.all([
              this.client.firestoreQuery('hopArtists', {}),
              this.client.firestoreQuery('hopTracks', {}),
            ]);
            const artistsRows = (Array.isArray(artistsRaw) ? artistsRaw : [])
              .map((item) => this.normalizeArtistDoc(item))
              .filter((item) => item && item.isActive);
            const tracksRows = (Array.isArray(tracksRaw) ? tracksRaw : [])
              .map((item) => this.normalizeTrackDoc(item))
              .filter((item) => item && item.isActive && item.inactive !== true);
            if (!artistsRows.length || !tracksRows.length) return false;

            const tracksByArtist = new Map();
            tracksRows.forEach((track) => {
              if (!tracksByArtist.has(track.artistId)) tracksByArtist.set(track.artistId, []);
              tracksByArtist.get(track.artistId).push(track);
            });
            const nested = artistsRows.map((artist) => ({
              ...artist,
              tracks: tracksByArtist.get(artist.id) || [],
            }));
            const ok = this.applyArtistsDataset(nested);
            if (ok) this.activeDataSource = 'backend';
            if (!ok) this.dataLoadAttempts.push('backend:invalid-shape');
            return ok;
          } catch (err) {
            this.dataLoadAttempts.push('backend:exception');
            this.dataError = err?.message || String(err);
            return false;
          } finally {
            this.isDataLoading = false;
          }
        },

        async loadHopDataByPolicy() {
          this.dataLoadAttempts = [];
          this.dataError = '';
          const mode = this.dataPolicy?.mode || 'generated-first-fallback-only';
          if (mode !== 'generated-first-fallback-only') {
            const ok = this.loadHopDataFromLocalSeed();
            if (!ok) this.dataError = this.t('dataLoadAllFailed');
            return ok;
          }
          const loadedFromGenerated = await this.loadHopDataFromGeneratedFile();
          if (loadedFromGenerated) return true;
          const loadedFromBackend = await this.loadHopDataFromBackend();
          if (loadedFromBackend) return true;
          const loadedFromSeed = this.loadHopDataFromLocalSeed();
          if (loadedFromSeed) {
            this.dataError = this.t('dataLoadFallbackUsed');
            console.warn('hop data fallback', { attempts: this.dataLoadAttempts, activeDataSource: this.activeDataSource });
            return true;
          }
          this.dataError = this.t('dataLoadAllFailed');
          console.error('hop data load failed', { attempts: this.dataLoadAttempts });
          return false;
        },

          return this.viewStack.length > 1;

        pushView(view) {
          this.transitionDirection = 'forward';
          this.viewStack.push(view);
          this.persistUiState();

          this.transitionDirection = 'back';
          this.viewStack = [view];
          if (view !== 'tracks') this.selectedArtistId = '';
          if (view !== 'artists') this.artistQuery = '';
          if (view !== 'tracks') this.trackQuery = '';
          this.persistUiState();
        },

        goBack() {
          if (this.viewStack.length > 1) {
            this.transitionDirection = 'back';
            this.viewStack.pop();
            this.persistUiState();
          }
        },

          return this.transitionDirection === 'back'
            ? 'opacity-0 -translate-x-3'
            : 'opacity-0 translate-x-3';

            ? 'opacity-0 translate-x-3'
            : 'opacity-0 -translate-x-3';

          this.selectedArtistId = artistId;
          this.persistUiState();
          if (this.currentView === 'tracks') return;
          this.pushView('tracks');

        clearArtistFilter() {
          this.selectedArtistId = '';
          this.trackQuery = '';
          this.persistUiState();
        },

        openTrack(trackId) {
          const track = this.tracks.find((item) => item.id === trackId);
          if (!track) return;
          this.currentTrack = track;
          this.recentTrackIds = [trackId, ...this.recentTrackIds.filter((id) => id !== trackId)].slice(0, 8);
          this.persistUiState();
          if (this.currentView === 'track') return;
          this.pushView('track');
        },

        youtubeEmbedUrl(youtubeId) {
          if (!youtubeId) return '';
          const safeId = String(youtubeId).trim().replace(/[^a-zA-Z0-9_-]/g, '');
          if (!safeId) return '';
          return `https://www.youtube-nocookie.com/embed/${safeId}`;
        },

        async copyCurrentLyrics() {
          const text = this.lyricsText(this.currentTrack);
          if (!text) return;
          try {
            await navigator.clipboard.writeText(text);
            this.showFlash(this.t('lyricsCopied'));
          } catch {
            this.showFlash(this.t('copyFailed'));
          }
        },

        showFlash(message) {
          this.flashMessage = message;
          window.clearTimeout(this.flashTimer);
          this.flashTimer = window.setTimeout(() => {
            this.flashMessage = '';
          }, 1400);
        },

        async copyTrackShareText() {
          if (!this.currentTrack) return;
          const shareText = `${this.trackArtistText(this.currentTrack)} — ${this.trackTitleText(this.currentTrack)}`;
          try {
            await navigator.clipboard.writeText(shareText);
            this.showFlash(this.t('trackCopied'));
          } catch {
            this.showFlash(this.t('shareFailed'));
          }

              dataLoading: 'Տվյալները բեռնվում են...',
              dataLoadFailed: 'Չհաջողվեց բեռնել backend տվյալները (օգտագործվում է local fallback)',
              dataLoadFallbackUsed: 'Գեներացված տվյալները չբեռնվեցին, գործարկվում է local fallback',
              dataLoadAllFailed: 'Տվյալները բեռնել չհաջողվեց',
              statusInitializing: 'Նախապատրաստում...',
              statusCheckingAuth: 'Ստուգում...',
              statusReady: 'Պատրաստ է',
            },
            en: {
              appName: 'Hop',
              subtitle: 'Armenian Hip Hop',
              back: 'Back',
              artists: 'Artists',
              tracks: 'Tracks',
              track: 'Track',
              allArtists: 'All artists',
              selectedArtistTracks: 'Selected artist tracks',
              allTracks: 'All tracks',
              tracksCountSuffix: 'tracks',
              artistBadge: 'artist',
              searchArtist: 'Search artist',
              searchTrack: 'Search track',
              openTracksPage: 'Open tracks',
              artistNotFound: 'No artist found.',
              trackNotFound: 'No track found.',
              clear: 'Clear',
              prev: 'Previous',
              next: 'Next',
              copyLyrics: 'Copy lyrics',
              share: 'Share',
              nowPlaying: 'Now playing',
              youtubePlayer: 'YouTube player',
              lyricsTitle: 'Lyrics',
              lyricsCopied: 'Lyrics copied',
              copyFailed: 'Copy failed',
              trackCopied: 'Track info copied',
              shareFailed: 'Share copy failed',
              dataLoading: 'Loading data...',
              dataLoadFailed: 'Failed to load backend data (using local fallback)',
              dataLoadFallbackUsed: 'Generated data unavailable, using local fallback',
              dataLoadAllFailed: 'Failed to load data',
              statusInitializing: 'Initializing...',
              statusCheckingAuth: 'Checking auth...',
              statusReady: 'Ready',
            },
          };
          const lang = this.language === 'en' ? 'en' : 'hy';
          return dict[lang][key] || key;
        },

        syncDocumentLocale() {
          document.documentElement.lang = this.language === 'en' ? 'en' : 'hy';
          document.title = this.t('appName');
        },

        persistUiState() {
          try {
            const state = {
              viewStack: this.viewStack,
              selectedArtistId: this.selectedArtistId,
              currentTrackId: this.currentTrack?.id || '',
              recentTrackIds: this.recentTrackIds,
            };
            window.sessionStorage.setItem('hop.ui.state', JSON.stringify(state));
          } catch {
            // ignore
          }
          void this.persistHopStateToBackend();
        },

        restoreUiState() {
          try {
            const raw = window.sessionStorage.getItem('hop.ui.state');
            if (!raw) return;
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed.viewStack) && parsed.viewStack.length) {
              this.viewStack = parsed.viewStack.filter((v) => ['artists', 'tracks', 'track'].includes(v));
              if (!this.viewStack.length) this.viewStack = ['artists'];
            }
            if (typeof parsed.selectedArtistId === 'string') this.selectedArtistId = parsed.selectedArtistId;
            if (Array.isArray(parsed.recentTrackIds)) this.recentTrackIds = parsed.recentTrackIds.slice(0, 8);
            if (parsed.currentTrackId) {
              const found = this.tracks.find((item) => item.id === parsed.currentTrackId);
              if (found) this.currentTrack = found;
            }
          } catch {
            // ignore
          }
        },

        async persistHopStateToBackend() {
          if (!this.client || typeof this.client.firestoreUpdate !== 'function') return;
          try {
            await this.client.firestoreUpdate('appState', this.appId, {
              appId: this.appId,
              selectedArtistId: this.selectedArtistId || '',
              currentTrackId: this.currentTrack?.id || '',
              recentTrackIds: Array.isArray(this.recentTrackIds) ? this.recentTrackIds.slice(0, 8) : [],
              updatedAt: new Date().toISOString(),
            });
          } catch {
            // silent fallback to local-only state
          }
        },

        async restoreHopStateFromBackend() {
          if (!this.client || typeof this.client.firestoreGet !== 'function') return;
          try {
            const row = await this.client.firestoreGet('appState', this.appId);
            if (!row || typeof row !== 'object') return;
            if (typeof row.selectedArtistId === 'string') this.selectedArtistId = row.selectedArtistId;
            if (Array.isArray(row.recentTrackIds)) this.recentTrackIds = row.recentTrackIds.slice(0, 8);
            if (typeof row.currentTrackId === 'string' && row.currentTrackId) {
              const found = this.tracks.find((item) => item.id === row.currentTrackId);
              if (found) this.currentTrack = found;
            }
          } catch {
            // silent fallback to session state
          }
        },

        async init() {
          let dataLoaded = false;
          try {
            this.restoreUiState();
            this.status = this.t('statusInitializing');
            dataLoaded = await this.loadHopDataByPolicy();
            this.status = this.t('statusCheckingAuth');
            try {
              await loadHayOSClient();
              this.client = window.HayOSClient ? new window.HayOSClient({ appId: this.appId }) : null;

              if (this.client && typeof this.client.ready === 'function') await this.client.ready();
              if (this.client && typeof this.client.authEnsure === 'function') {
                await this.client.authEnsure({ interactive: false });
              }
              if (this.client && typeof this.client.authGetCurrentUser === 'function') {
                this.user = await this.client.authGetCurrentUser();
              }
              if (this.client && typeof this.client.settingsGet === 'function') {
                const settings = await this.client.settingsGet();
                this.language = settings?.language === 'hy' ? 'hy' : 'en';
                this.osTheme = settings?.theme || '';
              }
              await this.restoreHopStateFromBackend();
            } catch (authErr) {
              this.error = authErr?.message || String(authErr);
            }
            this.syncDocumentLocale();

            this.status = this.t('statusReady');
            this.persistUiState();
          } catch (err) {
            this.error = err?.message || String(err);
            if (!dataLoaded) {
              this.loadHopDataFromLocalSeed();
            }
            this.status = this.t('statusReady');
          }
        },
      };
    }
  </script>
</body>

</html>
