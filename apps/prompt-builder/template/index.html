<!DOCTYPE html>
<html lang="en" class="h-full" data-theme="black" x-data="profileApp()" x-init="init()">

<head>
  <script data-hayos-prepaint-settings>
    (function applyHayOSPrepaintSettings() {
      try {
        var root = document.documentElement;
        var params = new URLSearchParams(window.location.search);
        var fromQueryLang = (params.get('lang') || params.get('language') || '').trim().toLowerCase();
        var fromQueryTheme = (params.get('theme') || '').trim();
        var stored = null;
        try {
          var raw = window.localStorage.getItem('hayos.settings');
          stored = raw ? JSON.parse(raw) : null;
        } catch {
          stored = null;
        }
        var language = fromQueryLang === 'hy' || fromQueryLang === 'en'
          ? fromQueryLang
          : (stored && stored.language === 'hy' ? 'hy' : 'en');
        var theme = fromQueryTheme
          || (stored && typeof stored.theme === 'string' ? stored.theme.trim() : '')
          || 'black';
        root.lang = language;
        root.setAttribute('data-theme', theme);
      } catch {
        // ignore prepaint bootstrap failures
      }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    [x-cloak] {
      display: none !important;
    }

    .safe-pb {
      padding-bottom: calc(env(safe-area-inset-bottom) + 0.75rem);
    }
  </style>

  <script>
    function loadHayOSClient() {
      const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      const clientUrl = isLocalhost ? 'http://localhost:5173/hayos-client.js' : '/hayos-client.js';

      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = clientUrl;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Failed to load HayOSClient from ${clientUrl}`));
        document.head.appendChild(script);
      });
    }
  </script>
</head>

<body class="h-full bg-base-200">
  <main class="min-h-full p-3 sm:p-4 safe-pb" x-cloak>
    <div class="mx-auto w-full max-w-md space-y-3">
      <header class="navbar bg-base-100 rounded-box shadow-sm border border-base-300 px-3 min-h-0">
        <div class="flex-1">
          <h1 class="text-base font-semibold">Profile</h1>
        </div>
        <div class="flex-none">
          <span class="badge badge-outline badge-sm" x-text="language === 'hy' ? 'Հայ' : 'EN'"></span>
        </div>
      </header>

      <section class="card bg-base-100 border border-base-300 shadow-sm">
        <div class="card-body p-4 gap-4">
          <div class="flex items-center gap-3">
            <div class="avatar">
              <div class="w-20 rounded-full ring ring-base-300 ring-offset-base-100 ring-offset-2">
                <img :src="avatarPreview" alt="Avatar" loading="lazy" @error="handleAvatarImageError" />
              </div>
            </div>
            <div class="min-w-0">
              <p class="text-sm font-semibold truncate" x-text="username || user?.displayName || 'No username yet'"></p>
              <p class="text-xs opacity-70 truncate" x-text="user?.email || user?.uid || '-' "></p>
            </div>
          </div>

          <div class="alert alert-info py-2" x-show="loading" x-cloak>
            <span class="loading loading-spinner loading-xs"></span>
            <span class="text-sm">Loading profile...</span>
          </div>

          <div class="alert alert-success py-2" x-show="successMessage" x-cloak>
            <span class="text-sm" x-text="successMessage"></span>
          </div>

          <div class="alert alert-error py-2" x-show="errorMessage" x-cloak>
            <span class="text-sm" x-text="errorMessage"></span>
          </div>
        </div>
      </section>

      <section class="card bg-base-100 border border-base-300 shadow-sm">
        <div class="card-body p-4 gap-3">
          <h2 class="card-title text-base">Username</h2>

          <label class="form-control w-full">
            <div class="label pb-1">
              <span class="label-text">Username</span>
            </div>
            <input
              type="text"
              class="input input-bordered w-full"
              placeholder="username"
              maxlength="30"
              x-model="username"
              @input="clearFeedback()"
              autocomplete="nickname"
            />
            <div class="label pt-1">
              <span class="label-text-alt">3-30 chars, letters, numbers, . _ -</span>
            </div>
          </label>

          <button
            class="btn btn-primary w-full"
            :class="{ 'btn-disabled': isSavingUsername }"
            :disabled="isSavingUsername || loading"
            @click="saveUsername()">
            <span class="loading loading-spinner loading-xs" x-show="isSavingUsername" x-cloak></span>
            <span x-text="isSavingUsername ? 'Saving...' : 'Save Username'"></span>
          </button>
        </div>
      </section>

      <section class="card bg-base-100 border border-base-300 shadow-sm">
        <div class="card-body p-4 gap-3">
          <h2 class="card-title text-base">Avatar</h2>

          <label class="form-control w-full">
            <div class="label pb-1">
              <span class="label-text">Avatar image URL</span>
            </div>
            <input
              type="url"
              class="input input-bordered w-full"
              placeholder="https://example.com/avatar.jpg"
              x-model="avatarUrl"
              @input="clearFeedback()"
              autocomplete="url"
              inputmode="url"
            />
          </label>

          <button
            class="btn btn-secondary w-full"
            :class="{ 'btn-disabled': isSavingAvatar }"
            :disabled="isSavingAvatar || loading"
            @click="saveAvatar()">
            <span class="loading loading-spinner loading-xs" x-show="isSavingAvatar" x-cloak></span>
            <span x-text="isSavingAvatar ? 'Saving...' : 'Save Avatar'"></span>
          </button>
        </div>
      </section>

      <section class="card bg-base-100 border border-base-300 shadow-sm">
        <div class="card-body p-4">
          <button class="btn btn-outline btn-error w-full" :disabled="isLoggingOut || loading" @click="openLogoutModal()">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <span>Log out</span>
          </button>
        </div>
      </section>
    </div>

    <div class="modal" :class="{ 'modal-open': logoutModalOpen }" x-cloak>
      <div class="modal-box">
        <h3 class="font-semibold text-lg">Log out?</h3>
        <p class="py-2 text-sm opacity-80">You will be signed out from your account on this device.</p>
        <div class="modal-action">
          <button class="btn" :disabled="isLoggingOut" @click="logoutModalOpen = false">Cancel</button>
          <button class="btn btn-error" :disabled="isLoggingOut" @click="logout()">
            <span class="loading loading-spinner loading-xs" x-show="isLoggingOut" x-cloak></span>
            <span x-text="isLoggingOut ? 'Logging out...' : 'Log out'"></span>
          </button>
        </div>
      </div>
      <div class="modal-backdrop" @click="logoutModalOpen = false"></div>
    </div>
  </main>

  <script>
    function profileApp() {
      return {
        appId: 'profile',
        client: null,
        user: null,
        profile: null,
        loading: true,
        language: 'en',
        username: '',
        avatarUrl: '',
        avatarFallback: 'https://ui-avatars.com/api/?name=User&background=2a323c&color=fff&size=256',
        successMessage: '',
        errorMessage: '',
        isSavingUsername: false,
        isSavingAvatar: false,
        isLoggingOut: false,
        logoutModalOpen: false,

        get avatarPreview() {
          return this.avatarUrl && this.avatarUrl.trim() ? this.avatarUrl.trim() : this.avatarFallback;
        },

        clearFeedback() {
          this.successMessage = '';
          this.errorMessage = '';
        },

        handleAvatarImageError(event) {
          if (event && event.target) {
            event.target.src = this.avatarFallback;
          }
        },

        usernameIsValid(value) {
          const normalized = (value || '').trim();
          if (normalized.length < 3 || normalized.length > 30) return false;
          return /^[a-zA-Z0-9._-]+$/.test(normalized);
        },

        isValidHttpUrl(value) {
          if (!value) return true;
          try {
            const url = new URL(value);
            return url.protocol === 'http:' || url.protocol === 'https:';
          } catch {
            return false;
          }
        },

        resolveAvatarFallback() {
          const seed = (this.username || this.user?.displayName || this.user?.email || this.user?.uid || 'User').trim();
          this.avatarFallback = `https://ui-avatars.com/api/?name=${encodeURIComponent(seed)}&background=2a323c&color=fff&size=256`;
        },

        buildUpdatePayload(overrides = {}) {
          const displayName = (overrides.displayName ?? this.username ?? this.profile?.displayName ?? '').trim();
          const avatarUrlRaw = (overrides.avatarUrl ?? this.avatarUrl ?? this.profile?.avatarUrl ?? '').trim();

          return {
            displayName,
            bio: typeof this.profile?.bio === 'string' ? this.profile.bio : '',
            avatarUrl: avatarUrlRaw.length > 0 ? avatarUrlRaw : null,
            defaultVisibility: typeof this.profile?.defaultVisibility === 'string' ? this.profile.defaultVisibility : 'followers',
          };
        },

        mapError(error, fallback) {
          if (!error) return fallback;
          const text = typeof error.message === 'string' ? error.message : String(error);
          if (text.includes('PERMISSION_DENIED')) return 'Permission denied.';
          if (text.includes('VALIDATION_ERROR')) return 'Validation failed. Check your input values.';
          if (text.includes('NOT_FOUND')) return 'Profile not found.';
          return text || fallback;
        },

        async init() {
          this.loading = true;
          this.clearFeedback();

          try {
            await loadHayOSClient();
            this.client = new HayOSClient(this.appId);

            const auth = await this.client.ensureAuthenticated();
            this.user = auth?.user || null;
            if (!this.user) {
              throw new Error('Not authenticated');
            }

            this.language = await this.client.getLanguage();
            document.documentElement.lang = this.language;
            this.client.onLanguageChanged((nextLanguage) => {
              this.language = nextLanguage === 'hy' ? 'hy' : 'en';
              document.documentElement.lang = this.language;
            });

            await this.loadProfile();
          } catch (error) {
            this.errorMessage = this.mapError(error, 'Failed to initialize profile app.');
          } finally {
            this.loading = false;
          }
        },

        async loadProfile() {
          this.clearFeedback();
          const currentUser = this.user || await this.client.getCurrentUser();
          if (!currentUser) {
            throw new Error('Not authenticated');
          }
          this.user = currentUser;

          try {
            this.profile = await this.client.socialProfileGet();
          } catch {
            this.profile = null;
          }

          this.username = (this.profile?.displayName || this.user?.displayName || '').trim();
          this.avatarUrl = (this.profile?.avatarUrl || this.user?.photoURL || '').trim();
          this.resolveAvatarFallback();
        },

        async saveUsername() {
          if (this.loading || this.isSavingUsername) return;
          this.clearFeedback();

          const normalized = (this.username || '').trim();
          if (!this.usernameIsValid(normalized)) {
            this.errorMessage = 'Username must be 3-30 characters and contain only letters, numbers, . _ -';
            return;
          }

          this.isSavingUsername = true;
          try {
            const payload = this.buildUpdatePayload({ displayName: normalized });
            const nextProfile = await this.client.socialProfileUpdate(payload);
            this.profile = nextProfile;
            this.username = nextProfile?.displayName || normalized;
            this.resolveAvatarFallback();
            this.successMessage = 'Username updated successfully.';
          } catch (error) {
            this.errorMessage = this.mapError(error, 'Failed to update username.');
          } finally {
            this.isSavingUsername = false;
          }
        },

        async saveAvatar() {
          if (this.loading || this.isSavingAvatar) return;
          this.clearFeedback();

          const normalized = (this.avatarUrl || '').trim();
          if (normalized.length > 0 && !this.isValidHttpUrl(normalized)) {
            this.errorMessage = 'Avatar URL must be a valid http/https link.';
            return;
          }

          this.isSavingAvatar = true;
          try {
            const payload = this.buildUpdatePayload({ avatarUrl: normalized });
            const nextProfile = await this.client.socialProfileUpdate(payload);
            this.profile = nextProfile;
            this.avatarUrl = nextProfile?.avatarUrl || '';
            this.successMessage = 'Avatar updated successfully.';
          } catch (error) {
            this.errorMessage = this.mapError(error, 'Failed to update avatar.');
          } finally {
            this.isSavingAvatar = false;
          }
        },

        openLogoutModal() {
          this.clearFeedback();
          this.logoutModalOpen = true;
        },

        async logout() {
          if (this.isLoggingOut) return;
          this.clearFeedback();
          this.isLoggingOut = true;

          try {
            await this.client.signOut();
            this.logoutModalOpen = false;
            this.successMessage = 'Logged out successfully.';
            setTimeout(() => {
              window.location.reload();
            }, 600);
          } catch (error) {
            this.errorMessage = this.mapError(error, 'Failed to log out.');
          } finally {
            this.isLoggingOut = false;
          }
        },
      };
    }
  </script>
</body>

</html>
