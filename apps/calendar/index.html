<!DOCTYPE html>
<html lang="hy" class="h-full bg-transparent" data-theme="black" x-data="calendarApp()" x-init="init()">

<head>
  <script data-hayos-prepaint-settings>
    (function applyHayOSPrepaintSettings() {
      try {
        var root = document.documentElement;
        var params = new URLSearchParams(window.location.search);
        var fromQueryLang = (params.get('lang') || params.get('language') || '').trim().toLowerCase();
        var fromQueryTheme = (params.get('theme') || '').trim();
        var stored = null;
        try {
          var raw = window.localStorage.getItem('hayos.settings');
          stored = raw ? JSON.parse(raw) : null;
        } catch {
          stored = null;
        }
        var language = fromQueryLang === 'hy' || fromQueryLang === 'en'
          ? fromQueryLang
          : (stored && stored.language === 'hy' ? 'hy' : 'en');
        var theme = fromQueryTheme
          || (stored && typeof stored.theme === 'string' ? stored.theme.trim() : '')
          || 'black';
        root.lang = language;
        root.setAttribute('data-theme', theme);
      } catch {
        // ignore prepaint bootstrap failures
      }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Օրացույց</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    [x-cloak] {
      display: none !important;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    .safe-pb {
      padding-bottom: calc(env(safe-area-inset-bottom) + 0.75rem);
    }

    .mobile-shell {
      width: min(100vw, 520px);
      height: 100dvh;
      margin: 0 auto;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 100% -10%, color-mix(in oklab, var(--color-primary) 22%, transparent), transparent 46%),
        radial-gradient(circle at -10% 120%, color-mix(in oklab, var(--color-accent) 18%, transparent), transparent 44%),
        var(--color-base-200);
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 0.35rem;
    }

    .day-cell {
      min-height: 3.15rem;
    }

    .day-cell-muted {
      opacity: 0.45;
    }

    @media (max-height: 760px) {
      .day-cell {
        min-height: 2.75rem;
      }
    }
  </style>

  <script>
    function loadHayOSClient() {
      const isLocalhost =
        window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1';
      const clientUrl = isLocalhost
        ? 'http://localhost:5173/hayos-client.js'
        : '/hayos-client.js';

      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = clientUrl;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Failed to load HayOSClient from ${clientUrl}`));
        document.head.appendChild(script);
      });
    }

    function calendarApp() {
      const STORAGE_KEY = 'calendar.events.v1';
      const CALENDAR_EVENTS_COLLECTION = 'calendarEvents';
      const DEFAULT_THEME = 'black';
      const ALLOWED_DAISY_THEMES = new Set([
        'light', 'dark', 'cupcake', 'bumblebee', 'emerald', 'corporate', 'synthwave', 'retro',
        'cyberpunk', 'valentine', 'halloween', 'garden', 'forest', 'aqua', 'lofi', 'pastel',
        'fantasy', 'wireframe', 'black', 'luxury', 'dracula', 'cmyk', 'autumn', 'business',
        'acid', 'lemonade', 'night', 'coffee', 'winter', 'dim', 'nord', 'sunset', 'caramellatte',
        'abyss', 'silk',
      ]);

      return {
        appId: 'calendar',
        client: null,
        user: null,
        loading: true,
        errorMessage: '',
        successMessage: '',
        syncStatus: 'local-only',
        syncTimerId: null,
        syncing: false,
        localStateUpdatedAt: 0,
        osTheme: DEFAULT_THEME,
        unsubs: [],

        currentMonthStart: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
        selectedDateKey: '',
        eventsByDate: {},

        editorOpen: false,
        editorMode: 'create',
        editingEventId: null,
        editingOriginDateKey: '',
        editingEventMeta: null,
        draft: {
          dateKey: '',
          title: '',
          tag: '',
          note: '',
          startTime: '09:00',
          endTime: '10:00',
          allDay: false,
          color: 'primary',
        },

        weekdayLabels: ['Երկ', 'Երք', 'Չրք', 'Հնգ', 'Ուրբ', 'Շբթ', 'Կիր'],
        colorOptions: ['primary', 'secondary', 'accent', 'info', 'success', 'warning', 'error'],

        async init() {
          this.selectedDateKey = this.toDateKey(new Date());
          this.loadEvents();

          try {
            await loadHayOSClient();
            this.client = new HayOSClient(this.appId);
            const auth = await this.client.ensureAuthenticated();
            this.user = auth?.user || null;
            await this.refreshThemeFromModuleValue();
            this.startThemeSync();
            await this.runLegacyMigrationIfNeeded();
            await this.loadEventsFromFirestore();
          } catch (_error) {
            this.user = null;
            this.syncStatus = 'local-only';
            this.applyThemeFromOs(DEFAULT_THEME);
          } finally {
            this.loading = false;
          }
        },

        get monthLabel() {
          return new Intl.DateTimeFormat('hy-AM', {
            month: 'long',
            year: 'numeric',
          }).format(this.currentMonthStart);
        },

        get selectedDateLabel() {
          const date = this.dateFromKey(this.selectedDateKey);
          return new Intl.DateTimeFormat('hy-AM', {
            weekday: 'long',
            month: 'long',
            day: 'numeric',
            year: 'numeric',
          }).format(date);
        },

        get monthCells() {
          const year = this.currentMonthStart.getFullYear();
          const month = this.currentMonthStart.getMonth();

          const start = new Date(year, month, 1);
          const startWeekday = (start.getDay() + 6) % 7;
          const firstCellDate = new Date(year, month, 1 - startWeekday);

          const cells = [];
          for (let i = 0; i < 42; i += 1) {
            const date = new Date(firstCellDate.getFullYear(), firstCellDate.getMonth(), firstCellDate.getDate() + i);
            const dateKey = this.toDateKey(date);
            cells.push({
              date,
              dateKey,
              day: date.getDate(),
              inCurrentMonth: date.getMonth() === month,
              isToday: this.isToday(dateKey),
              isSelected: this.selectedDateKey === dateKey,
              eventsCount: (this.eventsByDate[dateKey] || []).length,
            });
          }
          return cells;
        },

        get selectedEvents() {
          const list = [...(this.eventsByDate[this.selectedDateKey] || [])];
          return list.sort((a, b) => {
            if (a.allDay && !b.allDay) return -1;
            if (!a.allDay && b.allDay) return 1;
            return (a.startTime || '').localeCompare(b.startTime || '');
          });
        },

        clearMessages() {
          this.errorMessage = '';
          this.successMessage = '';
        },

        setError(text) {
          this.errorMessage = text;
          this.successMessage = '';
        },

        setSuccess(text) {
          this.successMessage = text;
          this.errorMessage = '';
        },

        toDateKey(date) {
          const y = date.getFullYear();
          const m = String(date.getMonth() + 1).padStart(2, '0');
          const d = String(date.getDate()).padStart(2, '0');
          return `${y}-${m}-${d}`;
        },

        dateFromKey(key) {
          const [y, m, d] = key.split('-').map(Number);
          return new Date(y, (m || 1) - 1, d || 1);
        },

        isToday(key) {
          return key === this.toDateKey(new Date());
        },

        isSameMonthAsCurrent(dateKey) {
          const date = this.dateFromKey(dateKey);
          return date.getMonth() === this.currentMonthStart.getMonth() && date.getFullYear() === this.currentMonthStart.getFullYear();
        },

        formatTime(eventItem) {
          if (eventItem.allDay) return 'Ամբողջ օր';
          return `${eventItem.startTime || '--:--'} - ${eventItem.endTime || '--:--'}`;
        },

        loadEvents() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            const value = raw ? JSON.parse(raw) : {};

            if (
              value &&
              typeof value === 'object'
            ) {
              this.eventsByDate = {};
              this.localStateUpdatedAt = typeof value.updatedAt === 'number' ? value.updatedAt : 0;
              if (typeof value.selectedDateKey === 'string' && value.selectedDateKey) {
                this.selectedDateKey = value.selectedDateKey;
              }
              if (typeof value.currentMonthStart === 'string' && value.currentMonthStart) {
                const parsedMonth = new Date(value.currentMonthStart);
                if (!Number.isNaN(parsedMonth.getTime())) {
                  this.currentMonthStart = new Date(parsedMonth.getFullYear(), parsedMonth.getMonth(), 1);
                }
              }
              return;
            }

            this.eventsByDate = {};
            this.localStateUpdatedAt = 0;
          } catch (_error) {
            this.eventsByDate = {};
            this.localStateUpdatedAt = 0;
          }
        },

        nowIso() {
          return new Date().toISOString();
        },

        normalizeEventRecord(raw, fallbackDateKey = '') {
          const row = raw && typeof raw === 'object' ? raw : {};
          const id = typeof row.id === 'string' && row.id.trim().length > 0
            ? row.id.trim()
            : (window.crypto?.randomUUID ? window.crypto.randomUUID() : `ev-${Date.now()}`);
          const dateKey = typeof row.dateKey === 'string' && row.dateKey.trim().length > 0
            ? row.dateKey.trim()
            : fallbackDateKey;
          const createdAt = typeof row.createdAt === 'string' && row.createdAt.trim().length > 0
            ? row.createdAt.trim()
            : this.nowIso();
          const updatedAt = typeof row.updatedAt === 'string' && row.updatedAt.trim().length > 0
            ? row.updatedAt.trim()
            : createdAt;
          const createdBy = typeof row.createdBy === 'string' && row.createdBy.trim().length > 0
            ? row.createdBy.trim()
            : (this.user?.uid || null);
          const updatedBy = typeof row.updatedBy === 'string' && row.updatedBy.trim().length > 0
            ? row.updatedBy.trim()
            : (this.user?.uid || createdBy || null);

          return {
            id,
            appId: this.appId,
            sourceCollection: CALENDAR_EVENTS_COLLECTION,
            dateKey,
            title: typeof row.title === 'string' ? row.title.trim() : '',
            tag: typeof row.tag === 'string' ? row.tag.trim() : '',
            note: typeof row.note === 'string' ? row.note.trim() : '',
            startTime: typeof row.startTime === 'string' ? row.startTime : '',
            endTime: typeof row.endTime === 'string' ? row.endTime : '',
            allDay: Boolean(row.allDay),
            color: this.colorOptions.includes(row.color) ? row.color : 'primary',
            createdAt,
            updatedAt,
            createdBy,
            updatedBy,
          };
        },

        isOwnedByCurrentUser(eventItem) {
          const owner = eventItem && typeof eventItem.createdBy === 'string'
            ? eventItem.createdBy.trim()
            : '';
          const uid = this.user && typeof this.user.uid === 'string'
            ? this.user.uid.trim()
            : '';
          return Boolean(uid) && owner === uid;
        },

        normalizeEventsByDate(input) {
          if (!input || typeof input !== 'object') return {};
          const output = {};
          Object.entries(input).forEach(([dateKey, value]) => {
            const list = Array.isArray(value) ? value : [];
            const normalizedList = list
              .map((item) => this.normalizeEventRecord(item, dateKey))
              .filter((item) => item.dateKey);
            if (normalizedList.length > 0) {
              output[dateKey] = normalizedList;
            }
          });
          return output;
        },

        buildEventsByDateFromRows(rows) {
          const grouped = {};
          rows.forEach((row) => {
            if (!row || !row.dateKey) return;
            if (!grouped[row.dateKey]) grouped[row.dateKey] = [];
            grouped[row.dateKey].push(row);
          });
          return grouped;
        },

        extractLegacyEventsFromLocalStorage() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return [];
            const value = JSON.parse(raw);
            if (!value || typeof value !== 'object') return [];

            let candidate = null;
            if (value.eventsByDate && typeof value.eventsByDate === 'object') {
              candidate = value.eventsByDate;
            } else {
              const hasArrayEntries = Object.values(value).some((entry) => Array.isArray(entry));
              if (hasArrayEntries) {
                candidate = value;
              }
            }
            if (!candidate || typeof candidate !== 'object') return [];

            const normalized = this.normalizeEventsByDate(candidate);
            return Object.values(normalized).flat();
          } catch (_error) {
            return [];
          }
        },

        canUseFirestoreCrud() {
          return Boolean(
            this.client &&
            this.user &&
            typeof this.client.firestoreGet === 'function' &&
            typeof this.client.firestoreQuery === 'function' &&
            typeof this.client.firestoreAdd === 'function' &&
            typeof this.client.firestoreUpdate === 'function' &&
            typeof this.client.firestoreDelete === 'function',
          );
        },

        async markMigrationDone(existingMigrations, importedCount) {
          if (!this.client || typeof this.client.firestoreUpdate !== 'function') return;
          const nowIso = this.nowIso();
          await this.client.firestoreUpdate('appState', this.appId, {
            appId: this.appId,
            sourceCollection: 'appState',
            updatedAt: nowIso,
            migrations: {
              ...(existingMigrations && typeof existingMigrations === 'object' ? existingMigrations : {}),
              localEventsToFirebaseV1: {
                done: true,
                ranAt: nowIso,
                importedCount,
              },
            },
          });
        },

        async runLegacyMigrationIfNeeded() {
          if (!this.canUseFirestoreCrud()) return;

          let stateDoc = null;
          let existingMigrations = {};
          try {
            stateDoc = await this.client.firestoreGet('appState', this.appId);
            existingMigrations = stateDoc && typeof stateDoc === 'object' && stateDoc.migrations && typeof stateDoc.migrations === 'object'
              ? stateDoc.migrations
              : {};
          } catch (_error) {
            existingMigrations = {};
          }

          const marker =
            existingMigrations &&
            typeof existingMigrations === 'object' &&
            existingMigrations.localEventsToFirebaseV1 &&
            typeof existingMigrations.localEventsToFirebaseV1 === 'object'
              ? existingMigrations.localEventsToFirebaseV1
              : null;
          if (marker && marker.done === true) {
            return;
          }

          const legacyEvents = this.extractLegacyEventsFromLocalStorage();
          if (legacyEvents.length === 0) {
            await this.markMigrationDone(existingMigrations, 0);
            return;
          }

          this.syncStatus = 'migrating';
          let importedCount = 0;
          try {
            const existingRowsRaw = await this.client.firestoreQuery(CALENDAR_EVENTS_COLLECTION, {});
            const existingIds = new Set(
              Array.isArray(existingRowsRaw)
                ? existingRowsRaw
                  .map((row) => (row && typeof row.id === 'string' ? row.id.trim() : ''))
                  .filter((id) => id.length > 0)
                : [],
            );

            for (const legacy of legacyEvents) {
              const normalized = this.normalizeEventRecord(legacy, legacy.dateKey || '');
              if (!normalized.dateKey) continue;

              let targetId = normalized.id;
              if (!targetId || existingIds.has(targetId)) {
                targetId = window.crypto?.randomUUID ? window.crypto.randomUUID() : `ev-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
              }

              await this.client.firestoreUpdate(CALENDAR_EVENTS_COLLECTION, targetId, {
                ...normalized,
                id: targetId,
                createdBy: this.user?.uid || '',
                updatedBy: this.user?.uid || '',
              });
              existingIds.add(targetId);
              importedCount += 1;
            }

            await this.markMigrationDone(existingMigrations, importedCount);
          } catch (_error) {
            this.syncStatus = 'local-only';
            return;
          }
        },

        async loadEventsFromFirestore() {
          if (!this.canUseFirestoreCrud()) {
            this.syncStatus = 'local-only';
            return;
          }
          try {
            const rowsRaw = await this.client.firestoreQuery(CALENDAR_EVENTS_COLLECTION, {});
            const rows = Array.isArray(rowsRaw)
              ? rowsRaw
                .map((row) => this.normalizeEventRecord(row, typeof row?.dateKey === 'string' ? row.dateKey : ''))
                .filter((row) => this.isOwnedByCurrentUser(row))
                .filter((row) => row.dateKey)
              : [];
            this.eventsByDate = this.buildEventsByDateFromRows(rows);
            this.syncStatus = 'firebase';
            this.localStateUpdatedAt = Date.now();
            this.persistSelectionOnly();
          } catch (_error) {
            this.syncStatus = 'local-only';
          }
        },

        saveEvents() {
          this.localStateUpdatedAt = Date.now();
          const payload = {
            version: 1,
            updatedAt: this.localStateUpdatedAt,
            selectedDateKey: this.selectedDateKey,
            currentMonthStart: this.currentMonthStart.toISOString(),
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        },

        persistSelectionOnly() {
          const payload = {
            version: 1,
            updatedAt: this.localStateUpdatedAt,
            selectedDateKey: this.selectedDateKey,
            currentMonthStart: this.currentMonthStart.toISOString(),
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        },

        normalizeTheme(value) {
          if (typeof value !== 'string') return '';
          const clean = value.trim();
          return ALLOWED_DAISY_THEMES.has(clean) ? clean : '';
        },

        applyThemeFromOs(theme) {
          const safe = this.normalizeTheme(theme);
          if (!safe) return;
          this.osTheme = safe;
          document.documentElement.setAttribute('data-theme', safe);
        },

        async refreshThemeFromModuleValue() {
          if (!this.client || typeof this.client.getModuleValue !== 'function') return;
          try {
            const value = await this.client.getModuleValue('ui.theme');
            this.applyThemeFromOs(value);
          } catch (_error) {
            this.applyThemeFromOs(DEFAULT_THEME);
          }
        },

        startThemeSync() {
          const onSystemEvent = (event) => {
            const data = event && event.data ? event.data : null;
            if (!data || data.type !== 'hayos:systemEvent' || data.event !== 'themeChanged') {
              return;
            }
            const nextTheme = data.payload && typeof data.payload.theme === 'string'
              ? data.payload.theme
              : '';
            if (nextTheme) {
              this.applyThemeFromOs(nextTheme);
              return;
            }
            this.refreshThemeFromModuleValue();
          };
          window.addEventListener('message', onSystemEvent);
          this.unsubs.push(() => window.removeEventListener('message', onSystemEvent));

          const onVisibility = () => {
            if (document.visibilityState === 'visible') {
              this.refreshThemeFromModuleValue();
            }
          };
          document.addEventListener('visibilitychange', onVisibility);
          this.unsubs.push(() => document.removeEventListener('visibilitychange', onVisibility));
          window.addEventListener('beforeunload', () => this.cleanup(), { once: true });
        },

        cleanup() {
          while (this.unsubs.length > 0) {
            const fn = this.unsubs.pop();
            try {
              if (typeof fn === 'function') fn();
            } catch (_error) {
              // no-op
            }
          }
        },

        syncBadgeClass() {
          if (this.syncStatus === 'migrating') return 'badge badge-warning badge-outline';
          if (this.syncStatus === 'saving') return 'badge badge-warning badge-outline';
          if (this.syncStatus === 'firebase') return 'badge badge-success badge-outline';
          return 'badge badge-neutral badge-outline';
        },

        previousMonth() {
          this.currentMonthStart = new Date(this.currentMonthStart.getFullYear(), this.currentMonthStart.getMonth() - 1, 1);
        },

        nextMonth() {
          this.currentMonthStart = new Date(this.currentMonthStart.getFullYear(), this.currentMonthStart.getMonth() + 1, 1);
        },

        goToToday() {
          const today = new Date();
          this.currentMonthStart = new Date(today.getFullYear(), today.getMonth(), 1);
          this.selectedDateKey = this.toDateKey(today);
          this.persistSelectionOnly();
        },

        selectDate(dateKey) {
          this.selectedDateKey = dateKey;
          if (!this.isSameMonthAsCurrent(dateKey)) {
            const date = this.dateFromKey(dateKey);
            this.currentMonthStart = new Date(date.getFullYear(), date.getMonth(), 1);
          }
          this.persistSelectionOnly();
        },

        openCreateModal(dateKey = this.selectedDateKey) {
          this.clearMessages();
          this.editorMode = 'create';
          this.editingEventId = null;
          this.editingOriginDateKey = dateKey;
          this.editingEventMeta = null;
          this.draft = {
            dateKey,
            title: '',
            tag: '',
            note: '',
            startTime: '09:00',
            endTime: '10:00',
            allDay: false,
            color: 'primary',
          };
          this.editorOpen = true;
        },

        openEditModal(dateKey, eventId) {
          const items = this.eventsByDate[dateKey] || [];
          const found = items.find((item) => item.id === eventId);
          if (!found) return;
          if (!this.isOwnedByCurrentUser(found)) {
            this.setError('Դուք չեք կարող փոփոխել ուրիշի իրադարձությունը։');
            return;
          }

          this.clearMessages();
          this.editorMode = 'edit';
          this.editingEventId = eventId;
          this.editingOriginDateKey = dateKey;
          this.editingEventMeta = {
            createdAt: typeof found.createdAt === 'string' && found.createdAt ? found.createdAt : this.nowIso(),
            createdBy: typeof found.createdBy === 'string' && found.createdBy ? found.createdBy : (this.user?.uid || null),
          };
          this.draft = {
            dateKey,
            title: found.title || '',
            tag: found.tag || '',
            note: found.note || '',
            startTime: found.startTime || '09:00',
            endTime: found.endTime || '10:00',
            allDay: Boolean(found.allDay),
            color: found.color || 'primary',
          };
          this.editorOpen = true;
        },

        closeEditor() {
          this.editorOpen = false;
        },

        validateDraft() {
          if (!this.draft.title.trim()) {
            this.setError('Վերնագիրը պարտադիր է։');
            return false;
          }
          if (!this.draft.dateKey) {
            this.setError('Օրը պարտադիր է։');
            return false;
          }

          if (!this.draft.allDay) {
            if (!this.draft.startTime || !this.draft.endTime) {
              this.setError('Ժամի դաշտերը պարտադիր են։');
              return false;
            }
            if (this.draft.startTime >= this.draft.endTime) {
              this.setError('Սկիզբի ժամը պետք է փոքր լինի ավարտի ժամից։');
              return false;
            }
          }

          return true;
        },

        async upsertEvent() {
          this.clearMessages();
          if (!this.validateDraft()) return;

          const targetDateKey = this.draft.dateKey;
          const originDateKey = this.editingOriginDateKey || targetDateKey;
          const originList = [...(this.eventsByDate[originDateKey] || [])];
          const nowIso = this.nowIso();
          const previousCreatedAt =
            this.editingEventMeta && typeof this.editingEventMeta.createdAt === 'string'
              ? this.editingEventMeta.createdAt
              : nowIso;
          const previousCreatedBy =
            this.editingEventMeta && typeof this.editingEventMeta.createdBy === 'string'
              ? this.editingEventMeta.createdBy
              : (this.user?.uid || '');

          const eventPayload = {
            appId: this.appId,
            sourceCollection: CALENDAR_EVENTS_COLLECTION,
            dateKey: targetDateKey,
            title: this.draft.title.trim(),
            tag: this.draft.tag.trim(),
            note: this.draft.note.trim(),
            startTime: this.draft.allDay ? '' : this.draft.startTime,
            endTime: this.draft.allDay ? '' : this.draft.endTime,
            allDay: Boolean(this.draft.allDay),
            color: this.draft.color || 'primary',
            createdAt: previousCreatedAt,
            updatedAt: nowIso,
            createdBy: previousCreatedBy || (this.user?.uid || ''),
            updatedBy: this.user?.uid || previousCreatedBy || '',
          };

          if (this.canUseFirestoreCrud()) {
            this.syncing = true;
            this.syncStatus = 'saving';
            try {
              if (this.editingEventId) {
                await this.client.firestoreUpdate(CALENDAR_EVENTS_COLLECTION, this.editingEventId, eventPayload);
              } else {
                const newId = await this.client.firestoreAdd(CALENDAR_EVENTS_COLLECTION, eventPayload);
                if (typeof newId === 'string' && newId.trim().length > 0) {
                  eventPayload.id = newId.trim();
                }
              }
              await this.loadEventsFromFirestore();
              this.selectDate(targetDateKey);
              this.setSuccess(this.editorMode === 'edit' ? 'Իրադարձությունը թարմացվեց։' : 'Իրադարձությունը ավելացվեց։');
              this.editorOpen = false;
            } catch (error) {
              this.setError(error && error.message ? error.message : 'Չհաջողվեց պահել իրադարձությունը։');
            } finally {
              this.syncing = false;
              if (this.syncStatus === 'saving') {
                this.syncStatus = 'firebase';
              }
            }
            return;
          }

          const fallbackEventPayload = {
            id: this.editingEventId || (window.crypto?.randomUUID ? window.crypto.randomUUID() : `ev-${Date.now()}`),
            ...eventPayload,
          };
          let nextOriginList = originList;
          if (this.editingEventId) {
            nextOriginList = originList.filter((item) => item.id !== this.editingEventId);
          }

          const targetList = targetDateKey === originDateKey
            ? nextOriginList
            : [...(this.eventsByDate[targetDateKey] || [])];

          targetList.push(fallbackEventPayload);
          this.eventsByDate = {
            ...this.eventsByDate,
            [originDateKey]: targetDateKey === originDateKey ? targetList : nextOriginList,
            [targetDateKey]: targetList,
          };

          if (!this.eventsByDate[originDateKey].length) {
            delete this.eventsByDate[originDateKey];
          }

          this.saveEvents();
          this.selectDate(targetDateKey);
          this.setSuccess(this.editorMode === 'edit' ? 'Իրադարձությունը թարմացվեց։' : 'Իրադարձությունը ավելացվեց։');
          this.editorOpen = false;
        },

        async removeEvent(dateKey, eventId) {
          const currentEvents = this.eventsByDate[dateKey] || [];
          const targetEvent = currentEvents.find((item) => item.id === eventId) || null;
          if (targetEvent && !this.isOwnedByCurrentUser(targetEvent)) {
            this.setError('Դուք չեք կարող ջնջել ուրիշի իրադարձությունը։');
            return;
          }

          if (this.canUseFirestoreCrud()) {
            this.syncing = true;
            this.syncStatus = 'saving';
            try {
              await this.client.firestoreDelete(CALENDAR_EVENTS_COLLECTION, eventId);
              await this.loadEventsFromFirestore();
              this.setSuccess('Իրադարձությունը ջնջվեց։');
            } catch (error) {
              this.setError(error && error.message ? error.message : 'Չհաջողվեց ջնջել իրադարձությունը։');
            } finally {
              this.syncing = false;
              if (this.syncStatus === 'saving') {
                this.syncStatus = 'firebase';
              }
            }
            if (this.editingEventId === eventId) {
              this.closeEditor();
            }
            return;
          }

          const current = this.eventsByDate[dateKey] || [];
          const next = current.filter((item) => item.id !== eventId);
          this.eventsByDate = { ...this.eventsByDate, [dateKey]: next };
          if (!next.length) {
            delete this.eventsByDate[dateKey];
          }
          this.saveEvents();
          this.setSuccess('Իրադարձությունը ջնջվեց։');
          if (this.editingEventId === eventId) {
            this.closeEditor();
          }
        },

        eventBadgeClass(color) {
          const safe = this.colorOptions.includes(color) ? color : 'primary';
          return `badge badge-${safe} badge-sm`;
        },

        eventTagClass(color) {
          const safe = this.colorOptions.includes(color) ? color : 'primary';
          return `badge badge-${safe} badge-soft badge-sm`;
        },

        dayButtonClass(cell) {
          const classes = ['btn', 'btn-sm', 'h-full', 'w-full', 'day-cell', 'justify-start', 'items-start', 'p-2', 'normal-case'];

          if (cell.isSelected) {
            classes.push('btn-primary');
          } else if (cell.isToday) {
            classes.push('btn-accent');
          } else {
            classes.push('btn-ghost');
          }

          if (!cell.inCurrentMonth) {
            classes.push('day-cell-muted');
          }
          if (cell.eventsCount > 0 && !cell.isSelected && !cell.isToday) {
            classes.push('btn-outline');
          }

          return classes.join(' ');
        },
      };
    }
  </script>
</head>

<body class="h-full">
  <div class="mobile-shell" x-cloak>
    <main class="flex-1 min-h-0 overflow-y-auto p-3 sm:p-4 safe-pb">
      <div class="mx-auto w-full max-w-lg space-y-3">
        <header class="navbar bg-base-100 border border-base-300 rounded-box shadow-sm min-h-0 px-3">
          <div class="flex-1 min-w-0">
            <h1 class="text-base font-semibold truncate">Օրացույց</h1>
          </div>
          <div class="flex-none flex items-center gap-2">
            <span :class="syncBadgeClass()" x-text="syncStatus"></span>
            <span class="badge badge-outline" x-text="user ? 'Signed' : 'Guest'"></span>
          </div>
        </header>

        <div class="alert alert-info py-2" x-show="loading" x-cloak>
          <span class="loading loading-spinner loading-xs"></span>
          <span>Բեռնվում է...</span>
        </div>

        <div class="alert alert-error py-2" x-show="errorMessage" x-cloak>
          <span x-text="errorMessage"></span>
        </div>

        <div class="alert alert-success py-2" x-show="successMessage" x-cloak>
          <span x-text="successMessage"></span>
        </div>

        <section class="card bg-base-100 border border-base-300 shadow-sm">
          <div class="card-body p-3 gap-3">
            <div class="flex items-center justify-between gap-2">
              <button class="btn btn-ghost btn-sm" @click="previousMonth()">‹</button>
              <h2 class="text-sm font-semibold text-center" x-text="monthLabel"></h2>
              <button class="btn btn-ghost btn-sm" @click="nextMonth()">›</button>
            </div>

            <button class="btn btn-outline btn-primary btn-sm" @click="goToToday()">Այսօր</button>

            <div class="flex flex-wrap items-center gap-1">
              <span class="badge badge-accent badge-outline">Այսօր</span>
              <span class="badge badge-primary">Ընտրված</span>
              <span class="badge badge-secondary badge-outline">Իրադարձություն կա</span>
            </div>

            <div class="days-grid text-center text-xs opacity-70 font-medium">
              <template x-for="day in weekdayLabels" :key="day">
                <div class="py-1" x-text="day"></div>
              </template>
            </div>

            <div class="days-grid">
              <template x-for="cell in monthCells" :key="cell.dateKey">
                <button type="button" :class="dayButtonClass(cell)" @click="selectDate(cell.dateKey)">
                  <div class="flex w-full items-start justify-between gap-1">
                    <span class="text-xs font-semibold" x-text="cell.day"></span>
                    <span class="badge badge-xs badge-secondary" x-show="cell.eventsCount > 0" x-text="cell.eventsCount"></span>
                  </div>
                </button>
              </template>
            </div>
          </div>
        </section>

        <section class="card bg-base-100 border border-base-300 shadow-sm">
          <div class="card-body p-3 gap-3">
            <div class="flex items-center justify-between gap-2">
              <h3 class="text-sm font-semibold truncate" x-text="selectedDateLabel"></h3>
              <button class="btn btn-primary btn-sm" @click="openCreateModal()">+ Ավելացնել</button>
            </div>

            <template x-if="!selectedEvents.length">
              <div class="alert">
                <span>Այս օրվա համար իրադարձություն չկա։</span>
              </div>
            </template>

            <div class="space-y-2" x-show="selectedEvents.length">
              <template x-for="eventItem in selectedEvents" :key="eventItem.id">
                <article class="card bg-base-200 border border-base-300">
                  <div class="card-body p-3 gap-2">
                    <div class="flex items-center justify-between gap-2">
                      <h4 class="font-medium text-sm truncate" x-text="eventItem.title"></h4>
                      <span :class="eventBadgeClass(eventItem.color)" x-text="formatTime(eventItem)"></span>
                    </div>
                    <div x-show="eventItem.tag" class="flex">
                      <span :class="eventTagClass(eventItem.color)" x-text="eventItem.tag"></span>
                    </div>
                    <p class="text-xs opacity-80 whitespace-pre-wrap" x-show="eventItem.note" x-text="eventItem.note"></p>
                    <div class="card-actions justify-end gap-2">
                      <button class="btn btn-xs btn-outline" @click="openEditModal(selectedDateKey, eventItem.id)">Փոփոխել</button>
                      <button class="btn btn-xs btn-error btn-outline" @click="removeEvent(selectedDateKey, eventItem.id)">Ջնջել</button>
                    </div>
                  </div>
                </article>
              </template>
            </div>
          </div>
        </section>
      </div>
    </main>

    <div class="modal" :class="{ 'modal-open': editorOpen }" x-cloak>
      <div class="modal-box">
        <h3 class="font-semibold text-lg" x-text="editorMode === 'edit' ? 'Փոփոխել իրադարձությունը' : 'Նոր իրադարձություն'"></h3>

        <div class="form-control mt-3">
          <label class="label"><span class="label-text">Օր</span></label>
          <input type="date" class="input input-bordered" x-model="draft.dateKey" />
        </div>

        <div class="form-control mt-2">
          <label class="label"><span class="label-text">Վերնագիր</span></label>
          <input type="text" class="input input-bordered" maxlength="90" placeholder="Օրինակ՝ Հանդիպում" x-model="draft.title" />
        </div>

        <div class="form-control mt-2">
          <label class="label"><span class="label-text">Tag</span></label>
          <input type="text" class="input input-bordered" maxlength="32" placeholder="Օրինակ՝ Work, Family" x-model="draft.tag" />
        </div>

        <div class="form-control mt-2">
          <label class="label cursor-pointer justify-start gap-2">
            <input type="checkbox" class="checkbox checkbox-primary" x-model="draft.allDay" />
            <span class="label-text">Ամբողջ օր</span>
          </label>
        </div>

        <div class="grid grid-cols-2 gap-2 mt-2" x-show="!draft.allDay">
          <div class="form-control">
            <label class="label"><span class="label-text">Սկիզբ</span></label>
            <input type="time" class="input input-bordered" x-model="draft.startTime" />
          </div>
          <div class="form-control">
            <label class="label"><span class="label-text">Ավարտ</span></label>
            <input type="time" class="input input-bordered" x-model="draft.endTime" />
          </div>
        </div>

        <div class="form-control mt-2">
          <label class="label"><span class="label-text">Գույն</span></label>
          <select class="select select-bordered" x-model="draft.color">
            <template x-for="color in colorOptions" :key="color">
              <option :value="color" x-text="color"></option>
            </template>
          </select>
        </div>

        <div class="form-control mt-2">
          <label class="label"><span class="label-text">Նկարագրություն</span></label>
          <textarea class="textarea textarea-bordered" rows="3" maxlength="240" placeholder="Նշում" x-model="draft.note"></textarea>
        </div>

        <div class="modal-action">
          <button class="btn" @click="closeEditor()">Փակել</button>
          <button class="btn btn-primary" @click="upsertEvent()" x-text="editorMode === 'edit' ? 'Պահպանել' : 'Ավելացնել'"></button>
        </div>
      </div>
      <div class="modal-backdrop" @click="closeEditor()"></div>
    </div>
  </div>
</body>

</html>
