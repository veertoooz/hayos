<!DOCTYPE html>
<html lang="en" class="h-full bg-transparent" data-theme="black">
<head>
  <script data-hayos-prepaint-settings>
    (function applyHayOSPrepaintSettings() {
      try {
        var root = document.documentElement;
        var params = new URLSearchParams(window.location.search);
        var fromQueryLang = (params.get('lang') || params.get('language') || '').trim().toLowerCase();
        var fromQueryTheme = (params.get('theme') || '').trim();
        var stored = null;
        try {
          var raw = window.localStorage.getItem('hayos.settings');
          stored = raw ? JSON.parse(raw) : null;
        } catch {
          stored = null;
        }
        var language = fromQueryLang === 'hy' || fromQueryLang === 'en'
          ? fromQueryLang
          : (stored && stored.language === 'hy' ? 'hy' : 'en');
        var theme = fromQueryTheme
          || (stored && typeof stored.theme === 'string' ? stored.theme.trim() : '')
          || 'black';
        root.lang = language;
        root.setAttribute('data-theme', theme);
      } catch {
        // ignore prepaint bootstrap failures
      }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Player</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    body { overscroll-behavior: contain; }
  </style>
</head>
<body class="h-full bg-base-100">
  <div id="app" class="h-full"></div>

  <script>
    function loadHayOSClient() {
      const isLocalhost =
        window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1';
      const clientUrl = isLocalhost
        ? 'http://localhost:5173/hayos-client.js'
        : '/hayos-client.js';

      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = clientUrl;
        script.onload = resolve;
        script.onerror = () =>
          reject(new Error(`Failed to load HayOSClient from ${clientUrl}`));
        document.head.appendChild(script);
      });
    }
  </script>

  <script>
    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        plugins: [require('daisyui')],
        daisyui: { themes: true },
      };
    }
  </script>

  <script type="module">
    import React from 'https://esm.sh/react@19.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@19.2.0/client';

    const h = React.createElement;

    const i18n = {
      en: {
        title: 'Music Player',
        subtitle: 'Local songs and mobile playback',
        pickSongs: 'Pick songs',
        uploadSongs: 'Upload songs',
        refresh: 'Refresh',
        empty: 'No local audio yet.',
        nowPlaying: 'Now Playing',
        notPlayable: 'Not playable in this session',
        play: 'Play',
        pause: 'Pause',
        prev: 'Prev',
        next: 'Next',
        queue: 'Queue',
        uploading: 'Uploading...',
        ready: 'Ready',
      },
      hy: {
        title: 'Երաժշտական Նվագարկիչ',
        subtitle: 'Local երգեր և mobile նվագարկում',
        pickSongs: 'Ընտրել երգեր',
        uploadSongs: 'Վերբեռնել երգեր',
        refresh: 'Թարմացնել',
        empty: 'Local audio դեռ չկա։',
        nowPlaying: 'Հիմա Նվագում է',
        notPlayable: 'Այս սեսիայի մեջ նվագարկումը հասանելի չէ',
        play: 'Նվագարկել',
        pause: 'Դադար',
        prev: 'Նախորդ',
        next: 'Հաջորդ',
        queue: 'Ցանկ',
        uploading: 'Վերբեռնվում է...',
        ready: 'Պատրաստ է',
      },
    };

    function formatDuration(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return '00:00';
      const total = Math.floor(seconds);
      const mm = String(Math.floor(total / 60)).padStart(2, '0');
      const ss = String(total % 60).padStart(2, '0');
      return `${mm}:${ss}`;
    }

    function inferTitle(name) {
      if (typeof name !== 'string' || !name.trim()) return 'Untitled';
      return name.replace(/\.[a-z0-9]{2,5}$/i, '').trim() || name.trim();
    }

    function applyOsTheme(themeName) {
      if (typeof themeName !== 'string') return;
      const normalized = themeName.trim();
      if (!normalized) return;
      document.documentElement.setAttribute('data-theme', normalized);
    }

    function MusicPlayerApp() {
      const [client, setClient] = React.useState(null);
      const [user, setUser] = React.useState(null);
      const [language, setLanguage] = React.useState('en');
      const [status, setStatus] = React.useState('Loading...');
      const [error, setError] = React.useState('');
      const [songs, setSongs] = React.useState([]);
      const [uploadQueue, setUploadQueue] = React.useState([]);
      const [uploading, setUploading] = React.useState(false);
      const [nowPlayingId, setNowPlayingId] = React.useState('');
      const [isPlaying, setIsPlaying] = React.useState(false);
      const [currentTime, setCurrentTime] = React.useState(0);
      const [duration, setDuration] = React.useState(0);
      const [seekValue, setSeekValue] = React.useState(0);
      const audioRef = React.useRef(null);
      const musicFolderIdRef = React.useRef('');

      const t = (key) => {
        const dict = i18n[language] || i18n.en;
        return dict[key] || i18n.en[key] || key;
      };

      const nowPlayingIndex = songs.findIndex((song) => song.id === nowPlayingId);
      const nowPlaying = nowPlayingIndex >= 0 ? songs[nowPlayingIndex] : null;

      const ensureMusicFolderId = React.useCallback(async (apiClient) => {
        if (!apiClient) return '';
        if (musicFolderIdRef.current) return musicFolderIdRef.current;
        const rows = await apiClient.filesList({ space: 'local', limit: 400 });
        const list = Array.isArray(rows) ? rows : [];
        const existing = list.find((row) =>
          row &&
          row.kind === 'folder' &&
          typeof row.name === 'string' &&
          row.name.trim().toLowerCase() === 'music'
        );
        if (existing && typeof existing.id === 'string' && existing.id.trim()) {
          musicFolderIdRef.current = existing.id.trim();
          return musicFolderIdRef.current;
        }
        const created = await apiClient.filesCreateFolder('Music', { space: 'local', parentId: null });
        const folderId = created && typeof created.id === 'string' ? created.id.trim() : '';
        if (!folderId) throw new Error('Failed to create Music folder');
        musicFolderIdRef.current = folderId;
        return folderId;
      }, []);

      const loadSongs = React.useCallback(async (apiClient) => {
        if (!apiClient) return;
        try {
          setError('');
          const musicFolderId = await ensureMusicFolderId(apiClient);
          const rows = await apiClient.filesList({ space: 'local', limit: 400 });
          const all = Array.isArray(rows) ? rows : [];
          const localAudio = await Promise.all(all
            .filter((row) =>
              row &&
              row.kind !== 'folder' &&
              row.parentId === musicFolderId &&
              typeof row?.mimeType === 'string' &&
              row.mimeType.startsWith('audio/')
            )
            .map(async (row) => {
              const fileId = typeof row.id === 'string' ? row.id : '';
              const fileName = row.fileName || row.name || fileId;
              let remoteUrl = '';
              if (fileId) {
                try {
                  const resolved = await apiClient.storageFilesGetDownloadUrl(fileId);
                  remoteUrl = typeof resolved?.url === 'string' ? resolved.url : '';
                } catch {
                  remoteUrl = '';
                }
              }
              return {
                id: fileId,
                name: fileName,
                title: inferTitle(fileName),
                mimeType: row.mimeType || 'audio/mpeg',
                sizeBytes: typeof row.sizeBytes === 'number' ? row.sizeBytes : 0,
                createdAt: row.createdAt || '',
                visibility: row.visibility || 'private',
                playableUrl: remoteUrl || '',
              };
            }));
          setSongs(localAudio);
          setStatus('Ready');
        } catch (err) {
          const message = err && err.message ? err.message : String(err);
          setError(message);
          setStatus(message);
        }
      }, [ensureMusicFolderId]);

      React.useEffect(() => {
        let mounted = true;
        let offLanguage = null;
        const handleThemeChanged = (event) => {
          const data = event && event.data ? event.data : null;
          if (!data || data.type !== 'hayos:systemEvent' || data.event !== 'themeChanged') {
            return;
          }
          const theme = data.payload && typeof data.payload.theme === 'string'
            ? data.payload.theme
            : '';
          applyOsTheme(theme);
        };
        window.addEventListener('message', handleThemeChanged);

        async function init() {
          try {
            try {
              const parentTheme = window.parent?.document?.documentElement?.getAttribute('data-theme') || '';
              applyOsTheme(parentTheme);
            } catch {
              // Ignore cross-window access issues.
            }
            await loadHayOSClient();
            const appId = new URLSearchParams(window.location.search).get('appId') || 'music-player';
            const apiClient = new window.HayOSClient(appId);
            const auth = await apiClient.ensureAuthenticated();
            if (!mounted) return;
            setClient(apiClient);
            setUser(auth.user || null);
            const lang = await apiClient.getLanguage();
            if (!mounted) return;
            const normalized = lang === 'hy' ? 'hy' : 'en';
            setLanguage(normalized);
            document.documentElement.lang = normalized;
            offLanguage = apiClient.onLanguageChanged((next) => {
              const resolved = next === 'hy' ? 'hy' : 'en';
              setLanguage(resolved);
              document.documentElement.lang = resolved;
            });
            await loadSongs(apiClient);
          } catch (err) {
            if (!mounted) return;
            const message = err && err.message ? err.message : String(err);
            setError(message);
            setStatus(message);
          }
        }

        init();

        return () => {
          mounted = false;
          if (typeof offLanguage === 'function') offLanguage();
          window.removeEventListener('message', handleThemeChanged);
        };
      }, []);

      React.useEffect(() => {
        setSeekValue(currentTime);
      }, [currentTime]);

      const setCurrentTrack = (songId) => {
        setNowPlayingId(songId);
        setCurrentTime(0);
        setDuration(0);
      };

      const handlePickSongs = (event) => {
        const files = Array.from(event?.target?.files || []);
        if (files.length === 0) return;
        const prepared = files
          .filter((file) => typeof file.type === 'string' && file.type.startsWith('audio/'))
          .map((file) => ({
            file,
            localId: `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`,
          }));
        setUploadQueue(prepared);
      };

      const uploadSongs = async () => {
        if (!client || uploadQueue.length === 0) return;
        setUploading(true);
        setStatus(t('uploading'));
        try {
          const musicFolderId = await ensureMusicFolderId(client);
          for (const item of uploadQueue) {
            const f = item.file;
            const initData = await client.storageUploadInit({
              fileName: f.name,
              mimeType: f.type || 'audio/mpeg',
              sizeBytes: f.size,
              visibility: 'private',
            });
            const sessionId = typeof initData?.sessionId === 'string' ? initData.sessionId : '';
            if (!sessionId) {
              throw new Error('Upload session init failed');
            }
            const bytes = new Uint8Array(await f.arrayBuffer());
            const chunkSize = 256 * 1024;
            const totalChunks = Math.max(1, Math.ceil(bytes.length / chunkSize));
            for (let chunkIndex = 0; chunkIndex < totalChunks; chunkIndex += 1) {
              const start = chunkIndex * chunkSize;
              const end = Math.min(start + chunkSize, bytes.length);
              let binary = '';
              const slice = bytes.subarray(start, end);
              for (let i = 0; i < slice.length; i += 1) {
                binary += String.fromCharCode(slice[i]);
              }
              const chunkBase64 = btoa(binary);
              await client.storageUploadWriteChunk(sessionId, chunkBase64, chunkIndex, totalChunks);
            }
            const completeData = await client.storageUploadComplete(sessionId);
            const fileId = typeof completeData?.fileId === 'string' ? completeData.fileId : sessionId;
            if (fileId) {
              await client.filesMove(fileId, musicFolderId, { space: 'local' });
            }
          }
          setUploadQueue([]);
          await loadSongs(client);
          setStatus(t('ready'));
        } catch (err) {
          const message = err && err.message ? err.message : String(err);
          setError(message);
          setStatus(message);
        } finally {
          setUploading(false);
        }
      };

      const playSong = async (song) => {
        if (!song || !song.playableUrl || !audioRef.current) return;
        if (nowPlayingId !== song.id) {
          setCurrentTrack(song.id);
        }
        try {
          audioRef.current.src = song.playableUrl;
          await audioRef.current.play();
          setIsPlaying(true);
        } catch (err) {
          setError(err && err.message ? err.message : String(err));
        }
      };

      const togglePlayPause = async () => {
        if (!audioRef.current || !nowPlaying) return;
        if (!nowPlaying.playableUrl) return;
        try {
          if (audioRef.current.paused) {
            await audioRef.current.play();
            setIsPlaying(true);
          } else {
            audioRef.current.pause();
            setIsPlaying(false);
          }
        } catch (err) {
          setError(err && err.message ? err.message : String(err));
        }
      };

      const playByIndex = async (nextIndex) => {
        if (nextIndex < 0 || nextIndex >= songs.length) return;
        const song = songs[nextIndex];
        if (!song?.playableUrl) return;
        await playSong(song);
      };

      const playNext = async () => {
        if (songs.length === 0) return;
        const start = nowPlayingIndex >= 0 ? nowPlayingIndex + 1 : 0;
        for (let i = 0; i < songs.length; i += 1) {
          const idx = (start + i) % songs.length;
          if (songs[idx].playableUrl) {
            await playByIndex(idx);
            return;
          }
        }
      };

      const playPrev = async () => {
        if (songs.length === 0) return;
        const start = nowPlayingIndex > 0 ? nowPlayingIndex - 1 : songs.length - 1;
        for (let i = 0; i < songs.length; i += 1) {
          const idx = (start - i + songs.length) % songs.length;
          if (songs[idx].playableUrl) {
            await playByIndex(idx);
            return;
          }
        }
      };

      const onSeekCommit = (value) => {
        if (!audioRef.current) return;
        const nextTime = Number(value);
        if (!Number.isFinite(nextTime) || nextTime < 0) return;
        audioRef.current.currentTime = nextTime;
        setCurrentTime(nextTime);
      };

      return h(
        'main',
        { className: 'h-full max-w-md mx-auto flex flex-col bg-base-100' },
        h(
          'header',
          { className: 'sticky top-0 z-10 border-b border-base-300 bg-base-100/95 backdrop-blur p-3 space-y-2' },
          h(
            'div',
            { className: 'flex items-start justify-between gap-3' },
            h('div', null,
              h('h1', { className: 'text-lg font-semibold leading-tight' }, t('title')),
              h('p', { className: 'text-xs opacity-70' }, t('subtitle'))
            ),
            h('div', { className: 'text-right text-[10px] opacity-70' }, user && user.uid ? user.uid.slice(0, 10) : '-')
          ),
          h(
            'div',
            { className: 'grid grid-cols-2 gap-2' },
            h('label', { className: `btn btn-sm btn-outline ${uploading ? 'btn-disabled' : ''}` },
              h('i', { className: 'fa-solid fa-file-audio mr-2' }),
              t('pickSongs'),
              h('input', {
                type: 'file',
                multiple: true,
                accept: 'audio/*',
                className: 'hidden',
                disabled: uploading,
                onChange: handlePickSongs,
              })
            ),
            h('button', {
              className: `btn btn-sm btn-primary ${uploading ? 'loading' : ''}`,
              onClick: uploadSongs,
              disabled: uploading || uploadQueue.length === 0,
            }, t('uploadSongs'))
          ),
          h(
            'button',
            { className: 'btn btn-xs btn-ghost', onClick: () => loadSongs(client), disabled: !client || uploading },
            h('i', { className: 'fa-solid fa-rotate mr-1' }),
            t('refresh')
          )
        ),
        h(
          'section',
          { className: 'flex-1 overflow-auto p-3 pb-48 space-y-2' },
          error ? h('div', { className: 'alert alert-error text-sm' }, error) : null,
          h('div', { className: 'text-xs opacity-70' }, `Status: ${status}`),
          uploadQueue.length > 0
            ? h('div', { className: 'alert alert-info text-xs' }, `${uploadQueue.length} file(s) queued`)
            : null,
          songs.length === 0
            ? h('div', { className: 'card bg-base-200 p-4 text-sm opacity-70' }, t('empty'))
            : null,
          songs.map((song) =>
            h(
              'article',
              { key: song.id, className: `card border p-3 ${nowPlayingId === song.id ? 'border-primary bg-base-200' : 'border-base-300 bg-base-200/60'}` },
              h(
                'div',
                { className: 'flex items-center justify-between gap-2' },
                h(
                  'div',
                  { className: 'min-w-0' },
                  h('p', { className: 'text-sm font-medium truncate' }, song.title),
                  h('p', { className: 'text-[11px] opacity-70 truncate' }, song.name)
                ),
                h(
                  'button',
                  {
                    className: `btn btn-xs ${song.playableUrl ? 'btn-primary' : 'btn-outline'}`,
                    disabled: !song.playableUrl,
                    onClick: () => playSong(song),
                  },
                  h('i', { className: 'fa-solid fa-play mr-1' }),
                  song.playableUrl ? t('play') : t('notPlayable')
                )
              )
            )
          )
        ),
        h(
          'footer',
          { className: 'fixed bottom-0 left-0 right-0 mx-auto max-w-md border-t border-base-300 bg-base-100/95 backdrop-blur p-3 space-y-3' },
          h('audio', {
            ref: audioRef,
            onTimeUpdate: () => {
              const next = audioRef.current?.currentTime || 0;
              setCurrentTime(next);
            },
            onLoadedMetadata: () => {
              setDuration(audioRef.current?.duration || 0);
            },
            onEnded: playNext,
          }),
          h('div', { className: 'text-xs opacity-70' }, t('nowPlaying')),
          h('div', { className: 'text-sm font-medium truncate' }, nowPlaying ? nowPlaying.title : '-'),
          h('input', {
            type: 'range',
            min: 0,
            max: Number.isFinite(duration) && duration > 0 ? duration : 0,
            value: seekValue,
            className: 'range range-primary range-sm',
            onChange: (event) => setSeekValue(Number(event.target.value)),
            onMouseUp: (event) => onSeekCommit(event.target.value),
            onTouchEnd: (event) => onSeekCommit(event.target.value),
          }),
          h(
            'div',
            { className: 'flex items-center justify-between text-[11px] opacity-70' },
            h('span', null, formatDuration(currentTime)),
            h('span', null, formatDuration(duration))
          ),
          h(
            'div',
            { className: 'grid grid-cols-3 gap-2' },
            h('button', { className: 'btn btn-sm btn-outline', onClick: playPrev }, t('prev')),
            h('button', { className: 'btn btn-sm btn-primary', onClick: togglePlayPause, disabled: !nowPlaying || !nowPlaying.playableUrl }, isPlaying ? t('pause') : t('play')),
            h('button', { className: 'btn btn-sm btn-outline', onClick: playNext }, t('next'))
          ),
          h('div', { className: 'text-[11px] opacity-60' }, `${t('queue')}: ${songs.length}`)
        )
      );
    }

    const root = createRoot(document.getElementById('app'));
    root.render(h(MusicPlayerApp));
  </script>
</body>
</html>
