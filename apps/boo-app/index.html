        normalizeUid(value) {
          return typeof value === 'string' ? value.trim() : '';
        },

        isValidIso(value) {
          if (typeof value !== 'string' || !value.trim()) return false;
          const parsed = new Date(value);
          return !Number.isNaN(parsed.getTime());
        },

        normalizeSearchText(value) {
          if (typeof value !== 'string') return '';
          return value
            .normalize('NFKC')
            .trim()
            .toLocaleLowerCase();
        },

        fallbackUserLabel(uid) {
          const normalized = this.normalizeUid(uid);
          if (!normalized) return 'user';
          return `user-${normalized.slice(0, 6)}`;
        },

        buildInitials(value) {
          if (typeof value !== 'string' || !value.trim()) return '?';
          const words = value.trim().split(/\s+/).filter(Boolean);
          if (words.length === 0) return '?';
          if (words.length === 1) {
            return words[0].slice(0, 2).toUpperCase();
          }
          return `${words[0].slice(0, 1)}${words[1].slice(0, 1)}`.toUpperCase();
        },

        formatMessageTime(isoValue) {
          if (!this.isValidIso(isoValue)) return '';
          const date = new Date(isoValue);
          return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        },

        formatListTime(isoValue) {
          if (!this.isValidIso(isoValue)) return '';
          const date = new Date(isoValue);
          const now = new Date();
          const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          const startOfDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
          const diffDays = Math.round((startOfToday.getTime() - startOfDate.getTime()) / 86_400_000);
          if (diffDays <= 0) return this.formatMessageTime(isoValue);
          if (diffDays === 1) return this.t('yesterday');
          return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
        },

        resolveMessageDateLabel(isoValue) {
          if (!this.isValidIso(isoValue)) return this.t('today');
          const date = new Date(isoValue);
          const now = new Date();
          const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          const startOfDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
          const diffDays = Math.round((startOfToday.getTime() - startOfDate.getTime()) / 86_400_000);
          if (diffDays <= 0) return this.t('today');
          if (diffDays === 1) return this.t('yesterday');
          return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
        },

        buildParticipant(peerUid, profile) {
          const uid = this.normalizeUid(peerUid);
          const username = typeof profile?.username === 'string' ? profile.username.trim() : '';
          const displayName = typeof profile?.displayName === 'string' ? profile.displayName.trim() : '';
          const primaryName = username || displayName || this.fallbackUserLabel(uid);
          const subtitle = displayName && displayName !== primaryName ? displayName : this.t('offline');
          const photoUrlRaw = typeof profile?.photoUrl === 'string'
            ? profile.photoUrl
            : (typeof profile?.avatarUrl === 'string' ? profile.avatarUrl : '');
          const photoUrl = photoUrlRaw && photoUrlRaw.trim().length > 0 ? photoUrlRaw.trim() : null;
          return {
            id: uid,
            name: primaryName,
            username,
            displayName,
            initials: this.buildInitials(primaryName),
            status: subtitle,
            photoUrl,
          };
        },

        normalizeDmMessages(rows) {
          const list = Array.isArray(rows) ? rows : [];
          const normalized = list
            .map((row, index) => {
              const source = row && typeof row === 'object' ? row : {};
              const createdAt = typeof source.createdAt === 'string' ? source.createdAt : '';
              const senderId = this.normalizeUid(source.senderUid);
              const text = typeof source.text === 'string' ? source.text.trim() : '';
              const clientMessageId = this.normalizeUid(source.clientMessageId);
              const fallbackId = `msg_${Date.now()}_${index}`;
              const id = typeof source.id === 'string' && source.id.trim() ? source.id.trim() : fallbackId;
              return {
                id,
                clientMessageId,
                senderId,
                text,
                timestamp: this.formatMessageTime(createdAt),
                status: senderId === this.currentUserId ? this.t('sent') : '',
                createdAt,
              };
            })
            .filter((item) => item.text.length > 0)
            .sort((left, right) => (left.createdAt || '').localeCompare(right.createdAt || ''));
          return this.dedupeThreadMessages(normalized);
        },

        normalizeMessageForKey(message) {
          const source = message && typeof message === 'object' ? message : {};
          const id = this.normalizeUid(source.id);
          const clientMessageId = this.normalizeUid(source.clientMessageId);
          const senderId = this.normalizeUid(source.senderId);
          const text = typeof source.text === 'string' ? source.text.trim() : '';
          const createdAt = typeof source.createdAt === 'string' ? source.createdAt : '';
          return {
            id,
            clientMessageId,
            senderId,
            text,
            createdAt,
            status: typeof source.status === 'string' ? source.status : '',
            timestamp: typeof source.timestamp === 'string' ? source.timestamp : this.formatMessageTime(createdAt),
          };
        },

        messageMergeKey(message) {
          const normalized = this.normalizeMessageForKey(message);
          if (normalized.clientMessageId) {
            return `cm:${normalized.senderId}|${normalized.clientMessageId}`;
          }
          if (normalized.id) return `id:${normalized.id}`;
          return `sig:${normalized.senderId}|${normalized.createdAt}|${normalized.text}`;
        },

        dedupeThreadMessages(messages) {
          const source = Array.isArray(messages) ? messages : [];
          const byKey = new Map();
          source.forEach((message) => {
            const normalized = this.normalizeMessageForKey(message);
            if (!normalized.text) return;
            const key = this.messageMergeKey(normalized);
            const previous = byKey.get(key);
            if (!previous) {
              byKey.set(key, normalized);
              return;
            }
            const previousIsPending = this.normalizeUid(previous.id).startsWith('pending_');
            const nextIsPending = this.normalizeUid(normalized.id).startsWith('pending_');
            if (previousIsPending && !nextIsPending) {
              byKey.set(key, normalized);
              return;
            }
            if ((normalized.createdAt || '').localeCompare(previous.createdAt || '') > 0) {
              byKey.set(key, normalized);
              return;
            }
            if (
              normalized.createdAt === previous.createdAt
              && normalized.id
              && normalized.id.localeCompare(previous.id || '') > 0
            ) {
              byKey.set(key, normalized);
            }
          });
          return Array.from(byKey.values())
            .sort((left, right) => (left.createdAt || '').localeCompare(right.createdAt || ''));
        },

        mergeThreadMessages(existingMessages, serverMessages) {
          const existing = Array.isArray(existingMessages) ? existingMessages : [];
          const incoming = Array.isArray(serverMessages) ? serverMessages : [];
          const serverDeduped = this.dedupeThreadMessages(incoming);
          const serverKeys = new Set(serverDeduped.map((message) => this.messageMergeKey(message)));
          const pendingFromExisting = existing.filter((message) => {
            const normalizedId = this.normalizeUid(message?.id);
            if (!normalizedId.startsWith('pending_')) return false;
            const key = this.messageMergeKey(message);
            return !serverKeys.has(key);
          });
          return this.dedupeThreadMessages([...serverDeduped, ...pendingFromExisting]);
        },

        resolveThreadPeerUid(threadRow) {
          const source = threadRow && typeof threadRow === 'object' ? threadRow : {};
          const members = Array.isArray(source.members)
            ? source.members.map((value) => this.normalizeUid(value)).filter(Boolean)
            : [];
          if (members.length === 0 || !members.includes(this.currentUserId)) {
            return '';
          }
          const peer = members.find((uid) => uid !== this.currentUserId);
          return peer || '';
        },

        resolveLastSummary(messages, fallbackIso) {
          if (messages.length > 0) {
            const tail = messages[messages.length - 1];
            const iso = this.isValidIso(tail.createdAt) ? tail.createdAt : fallbackIso;
            const timestamp = this.formatListTime(iso);
            return {
              text: tail.text,
              timestamp,
              iso,
            };
          }
          return {
            text: this.t('noMessagesYet'),
            timestamp: this.formatListTime(fallbackIso),
            iso: fallbackIso,
          };
        },

        resolveThreadSummary(threadRow) {
          const source = threadRow && typeof threadRow === 'object' ? threadRow : {};
          const updatedAt = typeof source.updatedAt === 'string' ? source.updatedAt : '';
          const lastMessageAt = typeof source.lastMessageAt === 'string' ? source.lastMessageAt : '';
          const iso = this.isValidIso(lastMessageAt)
            ? lastMessageAt
            : (this.isValidIso(updatedAt) ? updatedAt : '');
          const textRaw = typeof source.lastMessageText === 'string' ? source.lastMessageText.trim() : '';
          const text = textRaw || this.t('noMessagesYet');
          return {
            text,
            timestamp: this.formatListTime(iso),
            iso,
          };
        },

        buildChatRecord(params) {
          const threadId = this.normalizeUid(params?.threadId);
          const peerUid = this.normalizeUid(params?.peerUid);
          const messages = Array.isArray(params?.messages) ? params.messages : [];
          const updatedAt = typeof params?.updatedAt === 'string' ? params.updatedAt : '';
          const summaryCandidate = params?.summary && typeof params.summary === 'object' ? params.summary : null;
          const summary = summaryCandidate
            ? {
              text: typeof summaryCandidate.text === 'string' && summaryCandidate.text.trim()
                ? summaryCandidate.text.trim()
                : this.t('noMessagesYet'),
              timestamp: typeof summaryCandidate.timestamp === 'string'
                ? summaryCandidate.timestamp
                : this.formatListTime(typeof summaryCandidate.iso === 'string' ? summaryCandidate.iso : updatedAt),
              iso: typeof summaryCandidate.iso === 'string' ? summaryCandidate.iso : updatedAt,
            }
            : this.resolveLastSummary(messages, updatedAt);
          return {
            id: threadId,
            participant: this.buildParticipant(peerUid, params?.profile || null),
            unreadCount: 0,
            lastMessage: {
              text: summary.text,
              timestamp: summary.timestamp,
            },
            lastTime: summary.timestamp,
            messages,
            peerUid,
            updatedAt: summary.iso || updatedAt,
          };
        },

        messageIdentityKey(message) {
          const source = message && typeof message === 'object' ? message : {};
          const stableId = this.normalizeUid(source.id);
          if (stableId) return `id:${stableId}`;
          const senderId = this.normalizeUid(source.senderId);
          const createdAt = typeof source.createdAt === 'string' ? source.createdAt : '';
          const text = typeof source.text === 'string' ? source.text.trim() : '';
          return `sig:${senderId}|${createdAt}|${text}`;
        },

        countIncomingMessagesDelta(previousMessages, nextMessages) {
          const previous = Array.isArray(previousMessages) ? previousMessages : [];
          const next = Array.isArray(nextMessages) ? nextMessages : [];
          const knownKeys = new Set(previous.map((message) => this.messageIdentityKey(message)).filter(Boolean));
          let delta = 0;
          next.forEach((message) => {
            const key = this.messageIdentityKey(message);
            if (!key || knownKeys.has(key)) return;
            knownKeys.add(key);
            const senderId = this.normalizeUid(message?.senderId);
            if (senderId && senderId !== this.currentUserId) {
              delta += 1;
            }
          });
          return delta;
        },

        mergeChatsSnapshot(nextChats, options = {}) {
          const incoming = Array.isArray(nextChats) ? nextChats : [];
          const current = Array.isArray(this.chats) ? this.chats : [];
          const currentById = new Map(
            current
              .map((chat) => [this.normalizeUid(chat?.id), chat])
              .filter(([id]) => Boolean(id)),
          );
          const initialLoad = Boolean(options.initialLoad);
          const activeId = this.normalizeUid(this.activeChatId);

          const merged = incoming
            .map((nextChat) => {
              const chatId = this.normalizeUid(nextChat?.id);
              if (!chatId) return null;
              const existing = currentById.get(chatId) || null;
              const baseUnread = typeof existing?.unreadCount === 'number' ? existing.unreadCount : 0;

              let unreadCount = baseUnread;
              if (chatId === activeId) {
                unreadCount = 0;
              } else if (existing) {
                unreadCount = baseUnread + this.countIncomingMessagesDelta(existing.messages, nextChat.messages);
              } else if (initialLoad) {
                unreadCount = 0;
              } else {
                unreadCount = this.countIncomingMessagesDelta([], nextChat.messages);
              }

              return {
                ...nextChat,
                participant: {
                  ...(existing?.participant || {}),
                  ...(nextChat?.participant || {}),
                },
                unreadCount: Math.max(0, unreadCount),
              };
            })
            .filter(Boolean);

          const deduped = this.dedupeChatsByPeer(merged);
          deduped.sort((left, right) => (right.updatedAt || '').localeCompare(left.updatedAt || ''));
          this.chats = deduped;

          if (!this.activeChatId || !deduped.some((chat) => chat.id === this.activeChatId)) {
            this.activeChatId = deduped[0]?.id || null;
          }
        },

        dedupeChatsByPeer(chats) {
          const source = Array.isArray(chats) ? chats : [];
          const byPeer = new Map();
          source.forEach((chat) => {
            const peerUid = this.normalizeUid(chat?.peerUid || chat?.participant?.id);
            const chatId = this.normalizeUid(chat?.id);
            if (!peerUid || !chatId) return;
            const previous = byPeer.get(peerUid);
            if (!previous) {
              byPeer.set(peerUid, chat);
              return;
            }
            const prevUpdatedAt = typeof previous.updatedAt === 'string' ? previous.updatedAt : '';
            const nextUpdatedAt = typeof chat.updatedAt === 'string' ? chat.updatedAt : '';
            if (nextUpdatedAt.localeCompare(prevUpdatedAt) > 0) {
              byPeer.set(peerUid, chat);
              return;
            }
            if (nextUpdatedAt === prevUpdatedAt) {
              const prevMessagesCount = Array.isArray(previous.messages) ? previous.messages.length : 0;
              const nextMessagesCount = Array.isArray(chat.messages) ? chat.messages.length : 0;
              if (nextMessagesCount > prevMessagesCount) {
                byPeer.set(peerUid, chat);
                return;
              }
              if (nextMessagesCount === prevMessagesCount && chatId.localeCompare(this.normalizeUid(previous.id)) > 0) {
                byPeer.set(peerUid, chat);
              }
            }
          });
          return Array.from(byPeer.values());
        },

        getStableVisibleChats() {
          const source = Array.isArray(this.chats) ? this.chats : [];
          const deduped = this.dedupeChatsByPeer(source);
          deduped.sort((left, right) => {
            const rightTs = typeof right.updatedAt === 'string' ? right.updatedAt : '';
            const leftTs = typeof left.updatedAt === 'string' ? left.updatedAt : '';
            const tsCompare = rightTs.localeCompare(leftTs);
            if (tsCompare !== 0) return tsCompare;
            const rightId = this.normalizeUid(right?.id);
            const leftId = this.normalizeUid(left?.id);
            return rightId.localeCompare(leftId);
          });
          return deduped;
        },

        markChatAsRead(chatId) {
          const targetId = this.normalizeUid(chatId);
          if (!targetId) return;
          this.chats = this.chats.map((chat) => (
            chat.id === targetId
              ? { ...chat, unreadCount: 0 }
              : chat
          ));
        },

        async resolveProfile(peerUid, options = {}) {
          const uid = this.normalizeUid(peerUid);
          if (!uid || !this.client || typeof this.client.socialProfileGet !== 'function') return null;
          const force = Boolean(options.force);
          const cacheOnly = Boolean(options.cacheOnly);
          if (!force && this.profileCacheByUid[uid]) {
            return this.profileCacheByUid[uid];
          }
          if (cacheOnly) return null;
          try {
            const profile = await this.client.socialProfileGet(uid);
            this.profileCacheByUid = {
              ...this.profileCacheByUid,
              [uid]: profile,
            };
            return profile;
          } catch (error) {
            if (!force && this.profileCacheByUid[uid]) {
              return this.profileCacheByUid[uid];
            }
            return null;
          }
        },

        async buildChatFromThread(threadRow, existingChat = null) {
          const source = threadRow && typeof threadRow === 'object' ? threadRow : {};
          const threadId = this.normalizeUid(source.id);
          if (!threadId) return null;
          const peerUid = this.resolveThreadPeerUid(source);
          if (!peerUid) return null;

          const profile = await this.resolveProfile(peerUid, { cacheOnly: true });
          const messages = Array.isArray(existingChat?.messages) ? existingChat.messages : [];
          const updatedAt = typeof source.updatedAt === 'string' ? source.updatedAt : '';
          const lastMessageAt = typeof source.lastMessageAt === 'string' ? source.lastMessageAt : updatedAt;
          const threadSummary = this.resolveThreadSummary(source);
          const messageSummary = this.resolveLastSummary(messages, lastMessageAt);
          const hasThreadSummary = threadSummary.iso && threadSummary.iso.localeCompare(messageSummary.iso || '') >= 0;
          const summary = hasThreadSummary ? threadSummary : messageSummary;
          return this.buildChatRecord({
            threadId,
            peerUid,
            profile,
            messages,
            summary,
            updatedAt: lastMessageAt,
          });
        },

        async hydrateListProfiles(chats, options = {}) {
          if (!Array.isArray(chats) || chats.length === 0) return;
          const limitRaw = typeof options.limit === 'number' && Number.isFinite(options.limit) ? options.limit : 12;
          const limitCount = Math.max(1, Math.floor(limitRaw));
          const candidateUids = chats
            .map((chat) => this.normalizeUid(chat?.peerUid || chat?.participant?.id))
            .filter(Boolean);
          const dedupedUids = Array.from(new Set(candidateUids)).slice(0, limitCount);
          if (dedupedUids.length === 0) return;

          const profileRows = await Promise.all(dedupedUids.map(async (uid) => {
            const profile = await this.resolveProfile(uid);
            return profile ? [uid, profile] : null;
          }));
          const profileByUid = new Map(profileRows.filter(Boolean));
          if (profileByUid.size === 0) return;

          this.chats = this.chats.map((chat) => {
            const uid = this.normalizeUid(chat?.participant?.id || chat?.peerUid);
            const profile = profileByUid.get(uid);
            if (!profile) return chat;
            return {
              ...chat,
              participant: this.buildParticipant(uid, profile),
            };
          });
        },

        async loadChatsFromApi(options = {}) {
          if (!this.client || typeof this.client.socialDmListThreads !== 'function') return;
          const silent = Boolean(options.silent);
          const initialLoad = Boolean(options.initialLoad);
          const retriedAfterAuthRefresh = Boolean(options.retriedAfterAuthRefresh);
          const retriedAfterSessionRecovery = Boolean(options.retriedAfterSessionRecovery);
          const syncRequestId = Number.isFinite(options.syncRequestId)
            ? Number(options.syncRequestId)
            : (this.syncRequestCounter += 1);
          if (syncRequestId > this.latestSyncRequestId) {
            this.latestSyncRequestId = syncRequestId;
          }
          if (!silent) {
            this.isLoadingChats = true;
            this.status = this.t('syncingChats');
            this.error = '';
          }
          this.appendDebugEvent({
            kind: 'boo.sync.start',
            payload: {
              operation: 'social.dm.listThreads',
              silent,
              initialLoad,
              syncRequestId,
            },
          });
          try {
            const threads = await this.client.socialDmListThreads();
            const activeChatId = this.normalizeUid(this.activeChatId);
            const existingByThreadId = new Map(
              (Array.isArray(this.chats) ? this.chats : [])
                .map((chat) => [this.normalizeUid(chat?.id), chat])
                .filter(([id]) => Boolean(id)),
            );
            const mapped = await Promise.all((Array.isArray(threads) ? threads : []).map((row) => {
              const threadId = this.normalizeUid(row?.id);
              return this.buildChatFromThread(row, threadId ? existingByThreadId.get(threadId) : null);
            }));
            const nextChats = mapped
              .filter(Boolean)
              .sort((left, right) => (right.updatedAt || '').localeCompare(left.updatedAt || ''));
            if (this.isStaleSyncRequest(syncRequestId)) {
              this.appendDebugEvent({
                kind: 'boo.sync.drop',
                payload: {
                  operation: 'social.dm.listThreads',
                  reason: 'stale-success',
                  syncRequestId,
                  latestSyncRequestId: this.latestSyncRequestId,
                },
              });
              return;
            }
            this.mergeChatsSnapshot(nextChats, { initialLoad });
            const activeBefore = activeChatId
              ? this.normalizeUid(existingByThreadId.get(activeChatId)?.updatedAt || '')
              : '';
            const activeAfter = activeChatId
              ? this.normalizeUid((nextChats.find((chat) => this.normalizeUid(chat?.id) === activeChatId)?.updatedAt) || '')
              : '';
            if (
              this.integrationMode === 'connected'
              && this.view === 'thread'
              && activeChatId
              && activeAfter
              && activeAfter !== activeBefore
            ) {
              this.refreshChatMessages(activeChatId, { markAsRead: true }).catch((error) => {
                console.warn(`Failed to refresh active thread ${activeChatId} after list sync:`, error);
              });
            }
            this.hydrateListProfiles(nextChats, { limit: 12 }).catch((error) => {
              console.warn('Failed to hydrate Boo chat profiles:', error);
            });
            this.lastSuccessfulSyncAt = new Date().toISOString();
            this.error = '';
            this.lastFailure = null;
            this.appendDebugEvent({
              kind: 'boo.sync.ok',
              payload: {
                operation: 'social.dm.listThreads',
                threadCount: Array.isArray(threads) ? threads.length : 0,
                chatCount: nextChats.length,
                syncRequestId,
              },
            });
          } catch (error) {
            if (this.isStaleSyncRequest(syncRequestId)) {
              this.appendDebugEvent({
                kind: 'boo.sync.drop',
                payload: {
                  operation: 'social.dm.listThreads',
                  reason: 'stale-failure',
                  syncRequestId,
                  latestSyncRequestId: this.latestSyncRequestId,
                },
              });
              return;
            }
            if (
              !retriedAfterAuthRefresh
              && this.integrationMode === 'connected'
              && this.isPermissionDeniedError(error)
              && this.client
              && typeof this.client.getIdToken === 'function'
            ) {
              try {
                await this.client.getIdToken(true);
                this.appendDebugEvent({
                  kind: 'boo.auth.refresh',
                  payload: { reason: 'permission-denied', operation: 'social.dm.listThreads', syncRequestId },
                });
                await this.loadChatsFromApi({
                  ...options,
                  syncRequestId,
                  retriedAfterAuthRefresh: true,
                });
                return;
              } catch (refreshError) {
                console.warn('Boo auth refresh retry failed:', refreshError);
              }
            }
            if (
              !retriedAfterSessionRecovery
              && this.integrationMode === 'connected'
              && this.isPermissionDeniedError(error)
            ) {
              const recovered = await this.attemptSessionRecovery('social.dm.listThreads.permissionDenied');
              if (recovered) {
                await this.loadChatsFromApi({
                  ...options,
                  syncRequestId,
                  retriedAfterSessionRecovery: true,
                });
                return;
              }
            }
            this.captureFailure('social.dm.listThreads', error, {
              silent,
              retried: retriedAfterAuthRefresh,
              recovered: retriedAfterSessionRecovery,
              integrationMode: this.integrationMode,
              appId: this.appId,
              uid: this.currentUserId,
              syncRequestId,
            });
            if (!silent) {
              this.error = this.mapSocialError(error);
              this.status = this.t('syncFailed');
            }
            console.warn('Failed to sync Boo chats:', error);
          } finally {
            if (!silent && !this.isStaleSyncRequest(syncRequestId)) {
              this.isLoadingChats = false;
            }
          }
        },

        async refreshProfileForUid(uid) {
          const profile = await this.resolveProfile(uid, { force: true });
          if (!profile) return;
          const normalizedUid = this.normalizeUid(uid);
          if (!normalizedUid) return;
          this.chats = this.chats.map((chat) => {
            if (chat.participant.id !== normalizedUid) return chat;
            return {
              ...chat,
              participant: this.buildParticipant(normalizedUid, profile),
            };
          });
        },

        async refreshChatMessages(chatId, options = {}) {
          if (!this.client || typeof this.client.socialDmListMessages !== 'function') return;
          const activeId = this.normalizeUid(chatId);
          if (!activeId) return;
          const refreshSeq = this.nextMessageRefreshSeq(activeId);
          const markAsRead = Boolean(options.markAsRead);
          try {
            const rows = await this.client.socialDmListMessages(activeId, undefined, 80);
            if (this.isStaleMessageRefresh(activeId, refreshSeq)) {
              return;
            }
            const existing = this.chats.find((chat) => chat.id === activeId);
            if (!existing) return;
            const serverMessages = this.normalizeDmMessages(rows);
            const messages = this.mergeThreadMessages(existing.messages, serverMessages);
            const summary = this.resolveLastSummary(messages, existing.updatedAt || '');
            const incomingDelta = this.countIncomingMessagesDelta(existing.messages, messages);
            const shouldAutoScroll = this.shouldAutoScrollThread(activeId, {
              incoming: incomingDelta > 0,
            });
            const unreadCount = markAsRead || activeId === this.activeChatId
              ? 0
              : Math.max(0, (typeof existing.unreadCount === 'number' ? existing.unreadCount : 0) + incomingDelta);
            this.chats = this.chats.map((chat) => {
              if (chat.id !== activeId) return chat;
              return {
                ...chat,
                messages,
                unreadCount,
                lastMessage: {
                  text: summary.text,
                  timestamp: summary.timestamp,
                },
                lastTime: summary.timestamp,
                updatedAt: summary.iso || chat.updatedAt,
              };
            });
            if (shouldAutoScroll) {
              this.clearPendingIncoming(activeId);
              this.scheduleScrollThreadToBottom({ smooth: incomingDelta > 0 });
            } else if (incomingDelta > 0) {
              this.incrementPendingIncoming(activeId, incomingDelta);
            }
          } catch (error) {
            if (this.isStaleMessageRefresh(activeId, refreshSeq)) {
              return;
            }
            console.warn(`Failed to refresh messages for ${activeId}:`, error);
          }
        },

        upsertChat(nextChat) {
          if (!nextChat || !nextChat.id) return;
          const nextId = this.normalizeUid(nextChat.id);
          if (!nextId) return;
          const nextPeerUid = this.normalizeUid(nextChat.peerUid || nextChat?.participant?.id);
          const current = Array.isArray(this.chats) ? this.chats : [];
          const indexById = current.findIndex((chat) => this.normalizeUid(chat.id) === nextId);
          const indexByPeer = indexById >= 0
            ? -1
            : current.findIndex((chat) => this.normalizeUid(chat.peerUid || chat?.participant?.id) === nextPeerUid);
          const targetIndex = indexById >= 0 ? indexById : indexByPeer;

          let nextList = [];
          if (targetIndex >= 0) {
            const existing = current[targetIndex];
            const merged = {
              ...existing,
              ...nextChat,
              participant: {
                ...(existing?.participant || {}),
                ...(nextChat?.participant || {}),
              },
              unreadCount: typeof existing?.unreadCount === 'number' ? existing.unreadCount : 0,
            };
            nextList = current.map((chat, idx) => (idx === targetIndex ? merged : chat));
          } else {
            nextList = [nextChat, ...current];
          }

          const deduped = this.dedupeChatsByPeer(nextList);
          deduped.sort((left, right) => (right.updatedAt || '').localeCompare(left.updatedAt || ''));
          this.chats = deduped;
        },

        async openChatWithProfile(profileRow) {
          if (this.isOpeningThread) return;
          const peerUid = this.normalizeUid(profileRow?.uid);
          if (!peerUid || peerUid === this.currentUserId) return;

          const existing = this.chats.find((chat) => chat.peerUid === peerUid || chat.participant.id === peerUid);
          if (existing) {
            this.closeNewChatComposer();
            await this.openChat(existing.id);
            return;
          }

          if (
            this.integrationMode !== 'connected'
            || !this.client
            || typeof this.client.socialDmOpenThread !== 'function'
            || typeof this.client.socialDmListMessages !== 'function'
          ) {
            this.newChatError = this.t('newChatUnavailable');
            return;
          }

          this.isOpeningThread = true;
          this.newChatError = '';
          try {
            const openResult = await this.client.socialDmOpenThread(peerUid);
            const threadId = this.normalizeUid(openResult?.threadId);
            if (!threadId) {
              throw new Error('Failed to open DM thread');
            }

            let rows = [];
            try {
              rows = await this.client.socialDmListMessages(threadId, undefined, 80);
            } catch (error) {
              console.warn(`Failed to list initial messages for ${threadId}:`, error);
            }
            const messages = this.normalizeDmMessages(rows);
            const cached = await this.resolveProfile(peerUid, { force: true });
            const fallbackProfile = {
              uid: peerUid,
              username: typeof profileRow?.username === 'string' ? profileRow.username : '',
              displayName: typeof profileRow?.displayName === 'string' ? profileRow.displayName : '',
              photoUrl: typeof profileRow?.photoUrl === 'string' ? profileRow.photoUrl : null,
              avatarUrl: typeof profileRow?.avatarUrl === 'string' ? profileRow.avatarUrl : null,
            };
            const chat = this.buildChatRecord({
              threadId,
              peerUid,
              profile: cached || fallbackProfile,
              messages,
              updatedAt: new Date().toISOString(),
            });
            this.upsertChat(chat);
            this.closeNewChatComposer();
            await this.openChat(threadId);
          } catch (error) {
            this.newChatError = this.mapSocialError(error);
            console.warn('Failed to open chat from profile search:', error);
          } finally {
            this.isOpeningThread = false;
          }
        },

        appendMessage(chatId, message) {
          const targetId = this.normalizeUid(chatId);
          if (!targetId) return;
          const isOutgoing = this.normalizeUid(message?.senderId) === this.currentUserId;
          const shouldAutoScroll = this.shouldAutoScrollThread(targetId, {
            outgoing: isOutgoing,
            incoming: !isOutgoing,
          });
          const previewTimestamp = this.formatListTime(message.createdAt || new Date().toISOString());
          this.chats = this.chats.map((chat) => {
            if (chat.id !== targetId) return chat;
            const nextMessages = this.mergeThreadMessages(chat.messages, [message]);
            return {
              ...chat,
              messages: nextMessages,
              lastMessage: {
                text: message.text,
                timestamp: previewTimestamp,
              },
              lastTime: previewTimestamp,
              updatedAt: message.createdAt || chat.updatedAt,
            };
          });
          if (shouldAutoScroll) {
            this.clearPendingIncoming(targetId);
            this.scheduleScrollThreadToBottom({ smooth: true });
          } else if (!isOutgoing) {
            this.incrementPendingIncoming(targetId, 1);
          }
        },

        patchMessage(chatId, messageId, patch) {
          const targetId = this.normalizeUid(chatId);
          const targetMessageId = this.normalizeUid(messageId);
          if (!targetId || !targetMessageId) return;
          const shouldAutoScroll = this.shouldAutoScrollThread(targetId);
          this.chats = this.chats.map((chat) => {
            if (chat.id !== targetId) return chat;
            const patchClientMessageId = this.normalizeUid(patch?.clientMessageId);
            const nextMessages = chat.messages.map((message) => {
              const currentId = this.normalizeUid(message?.id);
              const currentClientMessageId = this.normalizeUid(message?.clientMessageId);
              const shouldPatchById = currentId === targetMessageId;
              const shouldPatchByClientMessageId = Boolean(
                patchClientMessageId
                && currentClientMessageId
                && patchClientMessageId === currentClientMessageId,
              );
              if (!shouldPatchById && !shouldPatchByClientMessageId) {
                return message;
              }
              return { ...message, ...patch };
            });
            const dedupedMessages = this.dedupeThreadMessages(nextMessages);
            return {
              ...chat,
              messages: dedupedMessages,
            };
          });
          if (shouldAutoScroll) {
            this.scheduleScrollThreadToBottom({ smooth: false });
          }
        },

        async loadLanguage() {
          if (!this.client || typeof this.client.getLanguage !== 'function') return;
          try {
            const language = await this.client.getLanguage();
            this.applyLanguage(language);
          } catch (error) {
            console.warn('Failed to resolve language:', error);
          }
        },

        subscribeLanguageChanges() {
          if (!this.client || typeof this.client.onLanguageChanged !== 'function') return;
          this.client.onLanguageChanged((language) => {
            this.applyLanguage(language);
          });
        },

        subscribeRealtimeContracts() {
          this.subscribeSocialProfileUpdates();
          this.subscribeDebugTrace();
        },

        subscribeSocialProfileUpdates() {
          if (!this.client || typeof this.client.onSocialProfileUpdated !== 'function') return;
          this.client.onSocialProfileUpdated((payload) => {
            this.appendDebugEvent({ kind: 'social.profile.updated', payload });
            if (payload && typeof payload.uid === 'string' && payload.uid.trim()) {
              void this.refreshProfileForUid(payload.uid);
            }
          });
        },

        subscribeDebugTrace() {
          if (!this.client || typeof this.client.onDebugTrace !== 'function') return;
          this.client.onDebugTrace((payload) => {
            this.appendDebugEvent({ kind: 'debug.trace', payload });
          });
        },

        appendDebugEvent(payload) {
          if (!this.debugEnabled) return;
          const next = [
            {
              at: new Date().toISOString(),
              payload,
            },
            ...this.debugEvents,
          ];
          this.debugEvents = next.slice(0, 80);
        },

        applyLanguage(language) {
          const normalized = language === 'hy' ? 'hy' : 'en';
          this.language = normalized;
          document.documentElement.lang = normalized;
        },

        async loadOsTheme() {
          if (!this.client || typeof this.client.getModuleValue !== 'function') return;
          try {
            const value = await this.client.getModuleValue('ui.theme');
            this.osTheme = typeof value === 'string' && value.trim().length > 0 ? value.trim() : 'black';
            this.applyOsTheme(this.osTheme);
          } catch (error) {
            this.osTheme = 'black';
            this.applyOsTheme(this.osTheme);
            console.warn('Failed to resolve OS theme:', error);
          }
        },

        applyOsTheme(themeName) {
          if (!themeName || typeof themeName !== 'string') {
            document.documentElement.setAttribute('data-theme', 'black');
            return;
          }
          document.documentElement.setAttribute('data-theme', themeName);
        },

        filteredChats() {
          const q = this.normalizeSearchText(this.searchQuery);
          let visible = this.getStableVisibleChats();
          if (this.activeTab === 'unread') {
            visible = visible.filter((chat) => chat.unreadCount > 0);
          }
          if (!q) return visible;
          return visible.filter((chat) =>
            this.normalizeSearchText(chat?.participant?.name || '').includes(q)
            || this.normalizeSearchText(chat?.participant?.username || '').includes(q)
            || this.normalizeSearchText(chat?.participant?.displayName || '').includes(q)
            || this.normalizeSearchText(chat?.lastMessage?.text || '').includes(q),
          );
        },

        activeChat() {
          return this.chats.find((chat) => chat.id === this.activeChatId) || null;
        },

        activeChatRawMessages() {
          return this.activeChat()?.messages || [];
        },

        activeChatMessages() {
          const raw = this.activeChatRawMessages();
          let previousLabel = '';
          return raw.flatMap((message, index) => {
            const label = this.resolveMessageDateLabel(message?.createdAt);
            if (!label || label === previousLabel) {
              return [message];
            }
            previousLabel = label;
            return [{
              id: `sep_${index}_${encodeURIComponent(label)}`,
              type: 'separator',
              label,
            }, message];
          });
        },

        isMessagesListNearBottom() {
          const el = this.$refs?.messagesList;
          if (!el) return true;
          const distance = el.scrollHeight - (el.scrollTop + el.clientHeight);
          return distance <= this.messageListBottomThresholdPx;
        },

        updateMessagesPinnedState() {
          this.messagesPinnedToBottom = this.isMessagesListNearBottom();
          if (this.messagesPinnedToBottom) {
            this.clearPendingIncomingForActiveChat();
          }
        },

        incrementPendingIncoming(chatId, delta = 1) {
          const targetId = this.normalizeUid(chatId);
          if (!targetId) return;
          const safeDelta = Number.isFinite(delta) ? Math.max(0, Math.floor(delta)) : 0;
          if (!safeDelta) return;
          const current = Number(this.pendingIncomingCountByChat[targetId] || 0);
          this.pendingIncomingCountByChat = {
            ...this.pendingIncomingCountByChat,
            [targetId]: current + safeDelta,
          };
        },

        clearPendingIncoming(chatId) {
          const targetId = this.normalizeUid(chatId);
          if (!targetId || !this.pendingIncomingCountByChat[targetId]) return;
          const next = { ...this.pendingIncomingCountByChat };
          delete next[targetId];
          this.pendingIncomingCountByChat = next;
        },

        clearPendingIncomingForActiveChat() {
          this.clearPendingIncoming(this.activeChatId);
        },

        pendingIncomingCountForActiveChat() {
          const activeId = this.normalizeUid(this.activeChatId);
          if (!activeId) return 0;
          const value = Number(this.pendingIncomingCountByChat[activeId] || 0);
          return Number.isFinite(value) && value > 0 ? value : 0;
        },

        showJumpToLatestButton() {
          return !this.messagesPinnedToBottom && this.pendingIncomingCountForActiveChat() > 0;
        },

        bindMessagesListObserver() {
          if (this.messageListObserver) return;
          const el = this.$refs?.messagesList;
          if (!el || typeof MutationObserver !== 'function') return;
          this.messageListObserver = new MutationObserver(() => {
            if (this.view !== 'thread') return;
            if (!this.messagesPinnedToBottom) return;
            this.scheduleScrollThreadToBottom({ smooth: false });
          });
          this.messageListObserver.observe(el, {
            childList: true,
            subtree: true,
            characterData: true,
          });
        },

        unbindMessagesListObserver() {
          if (!this.messageListObserver) return;
          this.messageListObserver.disconnect();
          this.messageListObserver = null;
        },

        cancelScheduledThreadScroll() {
          if (this.threadScrollRafId) {
            cancelAnimationFrame(this.threadScrollRafId);
            this.threadScrollRafId = null;
          }
          if (this.threadScrollRafNestedId) {
            cancelAnimationFrame(this.threadScrollRafNestedId);
            this.threadScrollRafNestedId = null;
          }
        },

        shouldAutoScrollThread(chatId, options = {}) {
          const targetId = this.normalizeUid(chatId);
          const activeId = this.normalizeUid(this.activeChatId);
          if (!targetId || !activeId || targetId !== activeId) return false;
          if (options.force) return true;
          if (options.outgoing) return true;
          if (options.incoming && !this.messagesPinnedToBottom && !this.isMessagesListNearBottom()) {
            return false;
          }
          return this.messagesPinnedToBottom || this.isMessagesListNearBottom();
        },

        scrollThreadToBottom(options = {}) {
          const el = this.$refs?.messagesList;
          if (!el) return;
          const smooth = Boolean(options.smooth);
          if (smooth && typeof el.scrollTo === 'function') {
            el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
          } else {
            el.scrollTop = el.scrollHeight;
          }
          this.messagesPinnedToBottom = true;
        },

        scheduleScrollThreadToBottom(options = {}) {
          this.cancelScheduledThreadScroll();
          this.$nextTick(() => {
            this.threadScrollRafId = requestAnimationFrame(() => {
              this.threadScrollRafId = null;
              this.threadScrollRafNestedId = requestAnimationFrame(() => {
                this.threadScrollRafNestedId = null;
                this.scrollThreadToBottom(options);
              });
            });
          });
        },

        jumpToLatestMessages() {
          this.scheduleScrollThreadToBottom({ smooth: true });
          this.clearPendingIncomingForActiveChat();
        },

        messageDirection(message) {
          return message.senderId === this.currentUserId ? 'outgoing' : 'incoming';
        },

        isMessageDeleting(messageId) {
          const normalized = this.normalizeUid(messageId);
          return Boolean(normalized && this.deletingMessageIds[normalized]);
        },

        canDeleteMessage(message) {
          if (!message || message.type === 'separator') return false;
          if (this.messageDirection(message) !== 'outgoing') return false;
          const messageId = this.normalizeUid(message.id);
          if (!messageId || messageId.startsWith('pending_')) return false;
          return true;
        },

        removeMessageFromChat(chatId, messageId) {
          const targetChatId = this.normalizeUid(chatId);
          const targetMessageId = this.normalizeUid(messageId);
          if (!targetChatId || !targetMessageId) return;
          const shouldAutoScroll = this.shouldAutoScrollThread(targetChatId);
          this.chats = this.chats.map((chat) => {
            if (chat.id !== targetChatId) return chat;
            const nextMessages = Array.isArray(chat.messages)
              ? chat.messages.filter((item) => this.normalizeUid(item.id) !== targetMessageId)
              : [];
            const summary = this.resolveLastSummary(nextMessages, chat.updatedAt || '');
            return {
              ...chat,
              messages: nextMessages,
              lastMessage: {
                text: summary.text,
                timestamp: summary.timestamp,
              },
              lastTime: summary.timestamp,
              updatedAt: summary.iso || chat.updatedAt,
            };
          });
          if (shouldAutoScroll) {
            this.scheduleScrollThreadToBottom({ smooth: false });
          }
        },

        async deleteMessage(message) {
          if (!this.canDeleteMessage(message)) return;
          const chat = this.activeChat();
          if (!chat) return;
          const chatId = this.normalizeUid(chat.id);
          const messageId = this.normalizeUid(message.id);
          if (!chatId || !messageId || this.isMessageDeleting(messageId)) return;

          if (
            this.integrationMode !== 'connected'
            || !this.client
            || typeof this.client.socialDmDeleteMessage !== 'function'
          ) {
            this.removeMessageFromChat(chatId, messageId);
            this.status = this.t('messageDeletedStatus');
            return;
          }

          this.deletingMessageIds = {
            ...this.deletingMessageIds,
            [messageId]: true,
          };
          this.error = '';
          try {
            await this.client.socialDmDeleteMessage(chatId, messageId);
            this.removeMessageFromChat(chatId, messageId);
            this.status = this.t('messageDeletedStatus');
            await this.refreshChatMessages(chatId, { markAsRead: true });
          } catch (error) {
            const mappedError = this.mapSocialError(error);
            this.error = mappedError === this.t('syncFailed')
              ? this.t('deleteMessageFailed')
              : mappedError;
            this.status = this.t('syncFailed');
            console.warn('Failed to delete DM message:', error);
          } finally {
            const next = { ...this.deletingMessageIds };
            delete next[messageId];
            this.deletingMessageIds = next;
          }
        },

        unreadChatsCount() {
          return this.getStableVisibleChats().filter((chat) => chat.unreadCount > 0).length;
        },

        isTypingActive() {
          return this.integrationMode === 'mock' && this.typingChatId === this.activeChatId;
        },

        canSendMessage() {
          if (this.composerText.trim().length === 0) return false;
          if (this.activeChatIsBlocked()) return false;
          if (this.isActiveChatRateLimited()) return false;
          const activeId = this.normalizeUid(this.activeChatId);
          if (activeId && this.sendingMessageByThreadId[activeId]) return false;
          if (this.integrationMode === 'connected' && this.isSendingMessage) return false;
          return true;
        },

        autoGrowComposer() {
          if (!this.$refs.composer) return;
          const el = this.$refs.composer;
          el.style.height = 'auto';
          el.style.height = `${Math.min(el.scrollHeight, 112)}px`;
        },

        async sendMessage() {
          const text = this.composerText.trim();
          if (!text) return;
          const chat = this.activeChat();
          if (!chat) return;
          const chatId = this.normalizeUid(chat.id);
          if (!chatId) return;
          if (this.sendingMessageByThreadId[chatId]) return;
          if (this.activeChatIsBlocked()) {
            this.error = this.t('blockedHint');
            return;
          }
          this.sendingMessageByThreadId = {
            ...this.sendingMessageByThreadId,
            [chatId]: true,
          };
          if (this.integrationMode !== 'connected' || !this.client || typeof this.client.socialDmSendMessage !== 'function') {
            this.appendMessage(chat.id, {
              id: `m_${Date.now()}`,
              senderId: this.currentUserId,
              text,
              timestamp: this.timeNow(),
              status: 'Delivered',
              createdAt: '',
            });
            this.composerText = '';
            if (this.$refs.composer) {
              this.$refs.composer.style.height = 'auto';
            }
            this.startTypingAndAutoReply(chat.id);
            const next = { ...this.sendingMessageByThreadId };
            delete next[chatId];
            this.sendingMessageByThreadId = next;
            return;
          }

          const createdAt = new Date().toISOString();
          const clientMessageId = (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function')
            ? crypto.randomUUID()
            : `cm_${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;
          const pendingId = `pending_${clientMessageId}`;
          this.appendMessage(chat.id, {
            id: pendingId,
            clientMessageId,
            senderId: this.currentUserId,
            text,
            timestamp: this.formatMessageTime(createdAt),
            status: this.t('pending'),
            createdAt,
          });
          this.composerText = '';
          if (this.$refs.composer) {
            this.$refs.composer.style.height = 'auto';
          }

          this.isSendingMessage = true;
          this.error = '';
          try {
            const result = await this.client.socialDmSendMessage(chat.id, text, clientMessageId);
            const persistedId = typeof result?.id === 'string' && result.id.trim().length > 0 ? result.id.trim() : pendingId;
            const persistedCreatedAt = this.isValidIso(result?.createdAt) ? result.createdAt : createdAt;
            const persistedClientMessageId = this.normalizeUid(result?.clientMessageId) || clientMessageId;
            this.patchMessage(chat.id, pendingId, {
              id: persistedId,
              clientMessageId: persistedClientMessageId,
              createdAt: persistedCreatedAt,
              timestamp: this.formatMessageTime(persistedCreatedAt),
              status: this.t('sent'),
            });
            await this.refreshChatMessages(chat.id, { markAsRead: true });
          } catch (error) {
            this.patchMessage(chat.id, pendingId, {
              status: this.t('failed'),
            });
            const rateLimitSeconds = this.extractRateLimitSeconds(error);
            if (rateLimitSeconds !== null) {
              this.startSendCooldown(chat.id, rateLimitSeconds);
              const remaining = this.getSendCooldownSeconds(chat.id) || rateLimitSeconds;
              this.error = this.formatRateLimitedMessage(remaining);
              this.status = this.error;
              return;
            }
            this.error = this.mapSocialError(error);
            if (this.error === this.t('blockedRelationError')) {
              await this.loadBlockedUsers();
            }
            this.status = this.t('syncFailed');
            console.warn('Failed to send DM message:', error);
          } finally {
            this.isSendingMessage = false;
            const next = { ...this.sendingMessageByThreadId };
            delete next[chatId];
            this.sendingMessageByThreadId = next;
          }
        },

        timeNow() {
          const d = new Date();
          return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        },

        startTypingAndAutoReply(chatId) {
          // UI-only mock typing. Remove after realtime events are wired.
          if (this.typingTimerId) {
            clearTimeout(this.typingTimerId);
            this.typingTimerId = null;
          }
          this.typingChatId = chatId;
          this.typingTimerId = setTimeout(() => {
            const chat = this.chats.find((item) => item.id === chatId);
            if (!chat) return;
            const replyText = 'Looks good. UI-only flow works.';
            const timestamp = this.timeNow();
            this.appendMessage(chat.id, {
              id: `m_${Date.now()}_reply`,
              senderId: chat.participant.id,
              text: replyText,
              timestamp,
              createdAt: '',
            });
            this.typingChatId = null;
            this.typingTimerId = null;
          }, 1200);
        },

        async openChat(chatId) {
          this.activeChatId = chatId;
          this.clearPendingIncoming(chatId);
          this.markChatAsRead(chatId);
          this.view = 'thread';
          this.$nextTick(() => {
            this.bindMessagesListObserver();
          });
          if (this.integrationMode === 'connected') {
            this.startActiveThreadPolling();
          }
          if (this.integrationMode === 'connected') {
            await this.refreshChatMessages(chatId, { markAsRead: true });
          }
          this.scheduleScrollThreadToBottom({ smooth: false });
        },

        goBack() {
          this.stopActiveThreadPolling();
          this.unbindMessagesListObserver();
          this.view = 'chats';
        },

        // Integration contracts for next phase.
        chatContract() {
          return {
            id: 'string',
            participant: {
              id: 'string',
              name: 'string',
              username: 'string',
              displayName: 'string',
              initials: 'string',
              status: 'string',
              photoUrl: 'string?'
            },
            unreadCount: 'number',
            lastMessage: { text: 'string', timestamp: 'string' },
            lastTime: 'string',
            messages: [{ id: 'string', senderId: 'string', text: 'string', timestamp: 'string', status: 'string?', createdAt: 'string?' }],
          };
        },

        integrationTodos() {
          return [
            'TODO(api): add unread/read-receipt persistence',
            'TODO(realtime): replace startTypingAndAutoReply() with socket events',
          ];
        },
      };
    }
  </script>
