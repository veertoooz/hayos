<!DOCTYPE html>
<html lang="en" class="h-full bg-transparent" data-theme="black" x-data="booApp()" x-init="init()">

<head>
  <script data-hayos-prepaint-settings>
    (function applyHayOSPrepaintSettings() {
      try {
        var root = document.documentElement;
        var params = new URLSearchParams(window.location.search);
        var fromQueryLang = (params.get('lang') || params.get('language') || '').trim().toLowerCase();
        var fromQueryTheme = (params.get('theme') || '').trim();
        var stored = null;
        try {
          var raw = window.localStorage.getItem('hayos.settings');
          stored = raw ? JSON.parse(raw) : null;
        } catch {
          stored = null;
        }
        var language = fromQueryLang === 'hy' || fromQueryLang === 'en'
          ? fromQueryLang
          : (stored && stored.language === 'hy' ? 'hy' : 'en');
        var theme = fromQueryTheme
          || (stored && typeof stored.theme === 'string' ? stored.theme.trim() : '')
          || 'black';
        root.lang = language;
        root.setAttribute('data-theme', theme);
      } catch {
        // ignore prepaint bootstrap failures
      }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boo Messenger UI</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script>
    function loadHayOSClient() {
      if (typeof HayOSClient !== 'undefined') {
        return Promise.resolve();
      }

      const isLocalhost =
        window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1';
      const clientUrl = isLocalhost
        ? 'http://localhost:5173/hayos-client.js'
        : '/hayos-client.js';

      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = clientUrl;
        script.onload = resolve;
        script.onerror = () =>
          reject(new Error(`Failed to load HayOSClient from ${clientUrl}`));
        document.head.appendChild(script);
      });
    }
  </script>

  <style>
    [x-cloak] {
      display: none !important;
    }

    .thread-shell {
      height: calc(100dvh - 0.75rem);
      min-height: 34rem;
    }

    .bubble-out {
      border-radius: 1.1rem 1.1rem .35rem 1.1rem;
    }

    .bubble-in {
      border-radius: 1.1rem 1.1rem 1.1rem .35rem;
    }

    .chat-row-active {
      background: color-mix(in oklab, var(--color-primary) 8%, transparent);
    }

    .composer-textarea {
      resize: none;
      max-height: 7rem;
    }
  </style>
</head>

<body class="h-full">
  <main class="mx-auto w-full max-w-md p-2 sm:p-3" x-cloak>
    <section class="thread-shell relative rounded-3xl border border-base-300 bg-base-100 shadow-sm overflow-hidden">

      <div x-show="view === 'chats'" x-transition.opacity class="flex h-full flex-col">
        <header class="border-b border-base-200 bg-base-100 px-3.5 pt-2.5 pb-3">
          <div class="navbar min-h-0 p-0">
            <div class="flex-1">
              <div>
                <h1 class="text-[22px] font-semibold leading-none tracking-tight">Boo</h1>
                <p class="mt-1 text-[11px] opacity-60" x-text="t('allConversations')"></p>
              </div>
            </div>
            <div class="flex-none gap-1.5">
              <button
                x-show="debugEnabled"
                class="btn btn-ghost btn-sm btn-circle bg-base-200/60 border border-base-300/50"
                type="button"
                aria-label="Toggle diagnostics"
                @click="debugPanelOpen = !debugPanelOpen">
                <i class="fa-solid fa-bug"></i>
              </button>
              <button class="btn btn-ghost btn-sm btn-circle bg-base-200/60 border border-base-300/50" type="button" aria-label="Filter">
                <i class="fa-solid fa-sliders"></i>
              </button>
              <button
                class="btn btn-ghost btn-sm btn-circle bg-base-200/60 border border-base-300/50"
                type="button"
                aria-label="New chat"
                @click="openNewChatComposer()">
                <i class="fa-solid fa-pen-to-square"></i>
              </button>
            </div>
          </div>
          <label class="input input-bordered input-sm mt-3 flex items-center gap-2 rounded-full border-base-300/80 bg-base-100 focus-within:border-primary/50 focus-within:ring-2 focus-within:ring-primary/20 transition">
            <i class="fa-solid fa-magnifying-glass opacity-70"></i>
            <input type="text" class="grow text-sm text-base-content/90 placeholder:opacity-70" :placeholder="t('searchChats')" x-model="searchQuery" />
          </label>
          <div class="tabs tabs-box bg-base-200/60 mt-2.5 p-0.5 rounded-2xl">
            <button
              type="button"
              class="tab tab-sm h-9 flex-1 gap-1.5 rounded-xl text-xs font-medium"
              :class="activeTab === 'all' ? 'tab-active bg-base-100 shadow-sm' : 'opacity-75'"
              @click="activeTab = 'all'">
              <span x-text="t('allTab')"></span>
              <span class="badge badge-ghost badge-xs min-w-5 px-1.5" x-text="chats.length"></span>
            </button>
            <button
              type="button"
              class="tab tab-sm h-9 flex-1 gap-1.5 rounded-xl text-xs font-medium"
              :class="activeTab === 'unread' ? 'tab-active bg-base-100 shadow-sm' : 'opacity-75'"
              @click="activeTab = 'unread'">
              <span x-text="t('unreadTab')"></span>
              <span class="badge badge-primary badge-xs min-w-5 px-1.5" x-text="unreadChatsCount()"></span>
            </button>
          </div>
          <p class="mt-2 text-[11px] opacity-65" x-show="isLoadingChats || isLoadingBlockedUsers" x-text="status"></p>
          <p class="mt-1 text-[11px] text-error" x-show="error" x-text="error"></p>
          <div
            x-show="debugEnabled && debugPanelOpen"
            class="mt-2 rounded-xl border border-base-300/70 bg-base-200/50 p-2 text-[10px]">
            <p class="font-semibold opacity-80">Diagnostics</p>
            <p class="mt-1 opacity-70">mode: <span x-text="integrationMode"></span> | appId: <span x-text="appId"></span></p>
            <p class="opacity-70">uid: <span x-text="currentUserId || 'unknown'"></span></p>
            <p class="opacity-70">last sync: <span x-text="lastSuccessfulSyncAt || 'never'"></span></p>
            <template x-if="lastFailure">
              <div class="mt-1 rounded-lg border border-error/30 bg-error/10 p-1.5 text-error">
                <p class="font-semibold">last failure: <span x-text="lastFailure.operation"></span></p>
                <p>at: <span x-text="lastFailure.at"></span></p>
                <p>error: <span x-text="lastFailure.rawError"></span></p>
                <p x-show="lastFailure.mappedError">mapped: <span x-text="lastFailure.mappedError"></span></p>
                <p x-show="lastFailure.retried">retried: yes</p>
              </div>
            </template>
            <div class="mt-1.5 max-h-24 overflow-y-auto rounded-lg border border-base-300/60 bg-base-100/70 p-1">
              <template x-for="event in debugEvents.slice(0, 8)" :key="event.at + JSON.stringify(event.payload)">
                <p class="truncate opacity-75">
                  <span x-text="event.at"></span>
                  <span class="mx-1">|</span>
                  <span x-text="formatDebugEventLine(event)"></span>
                </p>
              </template>
            </div>
          </div>
        </header>

        <div class="flex-1 overflow-y-auto px-2 py-1.5">
          <div x-show="filteredChats().length === 0" class="px-3 py-8 text-center">
            <div class="mx-auto mb-3 flex size-12 items-center justify-center rounded-2xl bg-base-200">
              <i class="fa-solid fa-inbox opacity-70"></i>
            </div>
            <p class="text-sm font-medium" x-text="t('noChatsFound')"></p>
            <p class="mt-1 text-xs opacity-60" x-text="t('trySearchFilter')"></p>
          </div>
          <template x-for="chat in filteredChats()" :key="chat.id">
            <button
              type="button"
              class="w-full rounded-2xl border border-transparent px-3 py-2.5 text-left transition hover:bg-base-200/70 active:scale-[0.995]"
              :class="{ 'chat-row-active border-primary/15': chat.id === activeChatId }"
              @click="openChat(chat.id)">
              <div class="flex items-center gap-3">
                <div class="avatar">
                  <div class="size-10 rounded-2xl bg-base-200/80 text-base-content ring-1 ring-base-300/40 overflow-hidden">
                    <img
                      x-show="chat.participant.photoUrl"
                      :src="chat.participant.photoUrl"
                      :alt="chat.participant.name"
                      class="h-full w-full object-cover" />
                    <span
                      x-show="!chat.participant.photoUrl"
                      class="flex h-full w-full items-center justify-center text-[15px] font-semibold tracking-tight"
                      x-text="chat.participant.initials"></span>
                  </div>
                </div>
                <div class="min-w-0 flex-1">
                  <div class="flex items-center justify-between gap-2">
                    <p class="truncate text-sm font-semibold" x-text="chat.participant.name"></p>
                    <p class="shrink-0 text-[10px] opacity-50" x-text="chat.lastTime"></p>
                  </div>
                  <div class="mt-0.5 flex items-center justify-between gap-2">
                    <p class="truncate text-[12px] opacity-65" x-text="chat.lastMessage.text"></p>
                    <span class="badge badge-primary badge-xs min-w-5 px-1.5" x-show="chat.unreadCount > 0" x-text="chat.unreadCount"></span>
                  </div>
                </div>
              </div>
            </button>
          </template>
        </div>
      </div>

      <div x-show="view === 'thread'" x-transition.opacity class="relative flex h-full flex-col">
        <header class="border-b border-base-200 bg-base-100 px-2 py-2">
          <div class="navbar min-h-0 p-0">
            <div class="flex-none">
              <button class="btn btn-sm btn-ghost btn-circle" type="button" @click="goBack()" aria-label="Back">
                <i class="fa-solid fa-chevron-left"></i>
              </button>
            </div>
            <div class="flex-1 min-w-0 gap-2 pl-1">
              <div class="avatar">
                <div class="h-8 w-8 rounded-xl bg-base-200/80 text-base-content ring-1 ring-base-300/40 overflow-hidden">
                  <img
                    x-show="activeChat()?.participant.photoUrl"
                    :src="activeChat()?.participant.photoUrl || ''"
                    :alt="activeChat()?.participant.name || 'Chat'"
                    class="h-full w-full object-cover" />
                  <span
                    x-show="!activeChat()?.participant.photoUrl"
                    class="flex h-full w-full items-center justify-center text-[11px] font-semibold tracking-tight"
                    x-text="activeChat()?.participant.initials || '?'"></span>
                </div>
              </div>
              <div class="min-w-0">
                <p class="truncate text-sm font-semibold" x-text="activeChat()?.participant.name || 'Chat'"></p>
                <p class="text-[11px] opacity-60" x-text="activeChat()?.participant.status || t('offline')"></p>
              </div>
            </div>
            <div class="flex-none">
              <button
                class="btn btn-sm btn-ghost btn-circle"
                type="button"
                :disabled="isUpdatingBlock || !activeChat()?.peerUid"
                :aria-label="isPeerBlocked(activeChat()?.peerUid) ? t('unblockUserAction') : t('blockUserAction')"
                :title="isPeerBlocked(activeChat()?.peerUid) ? t('unblockUserAction') : t('blockUserAction')"
                @click="toggleActivePeerBlock()">
                <i
                  class="fa-solid"
                  :class="isPeerBlocked(activeChat()?.peerUid) ? 'fa-user-lock' : 'fa-user-slash'"></i>
              </button>
            </div>
          </div>
        </header>

        <div
          x-ref="messagesList"
          class="flex-1 space-y-2 overflow-y-auto px-3 py-2.5"
          @scroll.passive="updateMessagesPinnedState()">
          <div x-show="activeChatRawMessages().length === 0" class="flex h-full items-center justify-center">
            <div class="text-center">
              <div class="mx-auto mb-3 flex size-12 items-center justify-center rounded-2xl bg-base-200">
                <i class="fa-regular fa-message opacity-70"></i>
              </div>
              <p class="text-sm font-medium" x-text="t('noMessagesYet')"></p>
              <p class="mt-1 text-xs opacity-60" x-text="t('startConversation')"></p>
            </div>
          </div>

          <template x-for="message in activeChatMessages()" :key="message.id">
            <div>
              <div x-show="message.type === 'separator'" class="my-2 flex justify-center">
                <span class="rounded-full bg-base-200 px-3 py-1 text-[11px] opacity-70" x-text="message.label"></span>
              </div>
              <div x-show="message.type !== 'separator'" class="chat" :class="messageDirection(message) === 'outgoing' ? 'chat-end' : 'chat-start'">
                <div class="chat-bubble text-sm" :class="messageDirection(message) === 'outgoing' ? 'bg-primary text-primary-content bubble-out' : 'bg-base-200 bubble-in'" x-text="message.text"></div>
                <div class="chat-footer mt-1 flex items-center gap-1 text-[10px] opacity-60">
                  <span x-text="message.timestamp"></span>
                  <span x-show="messageDirection(message) === 'outgoing'" x-text="message.status || 'Sent'"></span>
                  <button
                    x-show="canDeleteMessage(message)"
                    class="btn btn-ghost btn-xs btn-circle"
                    type="button"
                    :disabled="isMessageDeleting(message.id)"
                    :aria-label="t('deleteMessageAction')"
                    :title="t('deleteMessageAction')"
                    @click="deleteMessage(message)">
                    <i
                      class="fa-regular"
                      :class="isMessageDeleting(message.id) ? 'fa-circle-notch fa-spin' : 'fa-trash-can'"></i>
                  </button>
                </div>
              </div>
            </div>
          </template>

          <div x-show="isTypingActive()" class="chat chat-start">
            <div class="chat-bubble bubble-in bg-base-200">
              <span class="loading loading-dots loading-sm"></span>
            </div>
          </div>
          <div x-show="activeChatIsBlocked()" class="rounded-2xl border border-warning/40 bg-warning/10 px-3 py-2 text-[11px] text-warning-content">
            <span x-text="t('blockedHint')"></span>
          </div>
          <div
            x-show="!activeChatIsBlocked() && isActiveChatRateLimited()"
            class="rounded-2xl border border-error/30 bg-error/10 px-3 py-2 text-[11px] text-error">
            <span x-text="activeChatCooldownText()"></span>
          </div>
        </div>

        <div
          x-show="showJumpToLatestButton()"
          class="pointer-events-none absolute inset-x-0 bottom-20 z-10 flex justify-center px-3">
          <button
            class="btn btn-sm btn-primary pointer-events-auto rounded-full shadow-lg"
            type="button"
            @click="jumpToLatestMessages()">
            <i class="fa-solid fa-arrow-down"></i>
            <span x-text="t('jumpToLatest')"></span>
            <span class="badge badge-neutral badge-sm" x-text="pendingIncomingCountForActiveChat()"></span>
          </button>
        </div>

        <footer class="border-t border-base-200 bg-base-100 px-3 py-3">
          <div class="flex items-end gap-2">
            <button class="btn btn-sm btn-ghost btn-circle" type="button" aria-label="Attach">
              <i class="fa-solid fa-plus"></i>
            </button>
            <label class="flex min-h-10 flex-1 items-end gap-2 rounded-2xl border border-base-300 bg-base-100 px-3 py-2">
              <textarea
                x-ref="composer"
                class="composer-textarea w-full bg-transparent text-sm leading-5 outline-none"
                :placeholder="activeChatIsBlocked() ? t('blockedComposerPlaceholder') : t('composerPlaceholder')"
                rows="1"
                x-model="composerText"
                :disabled="activeChatIsBlocked()"
                @input="autoGrowComposer()"
                @keydown.enter.exact.prevent="sendMessage()"></textarea>
              <i class="fa-regular fa-face-smile opacity-60"></i>
            </label>
            <button
              class="btn btn-sm btn-primary btn-circle"
              type="button"
              aria-label="Send"
              :disabled="!canSendMessage()"
              @click="sendMessage()">
              <i class="fa-solid fa-arrow-up"></i>
            </button>
          </div>
        </footer>
      </div>

      <div
        x-show="composeChatOpen"
        x-transition.opacity
        class="absolute inset-0 z-30 flex items-end bg-base-content/25 p-3 sm:p-4"
        @keydown.escape.window="closeNewChatComposer()">
        <div class="w-full rounded-3xl border border-base-300 bg-base-100 shadow-xl">
          <div class="flex items-center justify-between border-b border-base-200 px-4 py-3">
            <div>
              <h2 class="text-sm font-semibold" x-text="t('newChatTitle')"></h2>
              <p class="mt-0.5 text-[11px] opacity-65" x-text="t('newChatHint')"></p>
            </div>
            <button class="btn btn-ghost btn-xs btn-circle" type="button" @click="closeNewChatComposer()" :aria-label="t('closeLabel')">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <div class="px-4 pt-3 pb-4">
            <label class="input input-bordered input-sm flex items-center gap-2 rounded-full border-base-300/80 bg-base-100 focus-within:border-primary/50 focus-within:ring-2 focus-within:ring-primary/20 transition">
              <i class="fa-solid fa-at opacity-70"></i>
              <input
                type="text"
                class="grow text-sm text-base-content/90 placeholder:opacity-70"
                :placeholder="t('searchUsersPlaceholder')"
                x-model="newChatQuery"
                @input="debounceNewChatSearch()" />
            </label>
            <p class="mt-2 text-[11px] text-error" x-show="newChatError" x-text="newChatError"></p>
            <div class="mt-2 max-h-72 space-y-1 overflow-y-auto">
              <p class="px-1 py-2 text-[11px] opacity-65" x-show="isSearchingProfiles" x-text="t('searchingUsers')"></p>
              <template x-for="profile in newChatResults" :key="profile.uid">
                <button
                  type="button"
                  class="w-full rounded-2xl border border-transparent px-2.5 py-2 text-left transition hover:bg-base-200/70 active:scale-[0.995]"
                  :disabled="isOpeningThread"
                  @click="openChatWithProfile(profile)">
                  <div class="flex items-center gap-2.5">
                    <div class="avatar">
                      <div class="size-9 rounded-xl bg-base-200/80 text-base-content ring-1 ring-base-300/40 overflow-hidden">
                        <img
                          x-show="profile.photoUrl"
                          :src="profile.photoUrl"
                          :alt="profile.displayName || profile.username || profile.uid"
                          class="h-full w-full object-cover" />
                        <span
                          x-show="!profile.photoUrl"
                          class="flex h-full w-full items-center justify-center text-[12px] font-semibold tracking-tight"
                          x-text="buildInitials(profile.displayName || profile.username || fallbackUserLabel(profile.uid))"></span>
                      </div>
                    </div>
                    <div class="min-w-0 flex-1">
                      <p class="truncate text-sm font-semibold" x-text="profile.displayName || profile.username || fallbackUserLabel(profile.uid)"></p>
                      <p class="truncate text-[11px] opacity-65" x-text="profile.username ? `@${profile.username}` : fallbackUserLabel(profile.uid)"></p>
                    </div>
                    <span
                      class="badge badge-xs"
                      :class="isPeerBlocked(profile.uid) ? 'badge-warning' : (hasExistingChatWithPeer(profile.uid) ? 'badge-outline' : 'badge-primary')"
                      x-text="isPeerBlocked(profile.uid) ? t('blockedStateLabel') : (hasExistingChatWithPeer(profile.uid) ? t('openChatAction') : t('startChatAction'))"></span>
                  </div>
                </button>
              </template>
              <p
                class="px-1 py-2 text-[11px] opacity-65"
                x-show="!isSearchingProfiles && normalizedNewChatQuery().length >= 2 && newChatResults.length === 0"
                x-text="t('noUsersFound')"></p>
            </div>
          </div>
        </div>
      </div>

    </section>
  </main>

  <script>

            permissionDeniedError: 'Այս գործողության համար permission չկա',
            rateLimitedError: 'Չափազանց շատ հաղորդագրություններ։ Փորձիր նորից {seconds}վ հետո։',
            deleteMessageAction: 'Ջնջել հաղորդագրությունը',
            messageDeletedStatus: 'Հաղորդագրությունը ջնջվեց',
            deleteMessageFailed: 'Չհաջողվեց ջնջել հաղորդագրությունը',

        },

        t(key) {
          const dict = this.i18n[this.language] || this.i18n.en;
          return dict[key] || this.i18n.en[key] || key;
        },

        formatRateLimitedMessage(seconds) {
          const safeSeconds = Number.isFinite(seconds) && seconds > 0
            ? Math.max(1, Math.floor(seconds))
            : 8;
          return this.t('rateLimitedError').replace('{seconds}', String(safeSeconds));
        },

        extractRateLimitSeconds(error) {
          const raw = typeof error === 'string'
            ? error
            : (error && typeof error.message === 'string' ? error.message : String(error || ''));
          const normalized = raw.trim();
          const match = /^RATE_LIMITED(?::(\d{1,3}))?$/.exec(normalized);
          if (!match) return null;
          const parsed = Number(match[1]);
          if (Number.isFinite(parsed) && parsed > 0) {
            return Math.min(120, Math.floor(parsed));
          }
          return 8;
        },

        isPermissionDeniedError(error) {
          const raw = typeof error === 'string'
            ? error
            : (error && typeof error.message === 'string' ? error.message : String(error || ''));
          const normalized = raw.trim().toLowerCase();
          return normalized === 'permission_denied'
            || normalized.includes('missing or insufficient permissions');
        },

        mapSocialError(error) {
          const raw = typeof error === 'string'
            ? error
            : (error && typeof error.message === 'string' ? error.message : String(error || ''));
          const normalized = raw.trim();
          const normalizedLower = normalized.toLowerCase();
          const rateLimitSeconds = this.extractRateLimitSeconds(normalized);
          if (rateLimitSeconds !== null) {
            return this.formatRateLimitedMessage(rateLimitSeconds);
          }
          if (normalized === 'BLOCKED_RELATION') return this.t('blockedRelationError');
          if (normalized === 'PERMISSION_DENIED') return this.t('permissionDeniedError');
          if (normalizedLower.includes('missing or insufficient permissions')) return this.t('permissionDeniedError');
          if (normalized.length > 0) return normalized;
          return this.t('syncFailed');
        },

        captureFailure(operation, error, extra = {}) {
          const raw = typeof error === 'string'
            ? error
            : (error && typeof error.message === 'string' ? error.message : String(error || ''));
          const mapped = this.mapSocialError(error);
          this.lastFailure = {
            at: new Date().toISOString(),
            operation,
            rawError: raw.trim(),
            mappedError: mapped,
            retried: Boolean(extra?.retried),
            context: extra,
          };
          this.appendDebugEvent({
            kind: 'boo.failure',
            payload: {
              operation,
              rawError: raw.trim(),
              mappedError: mapped,
              ...extra,
            },
          });
        },

        formatDebugEventLine(event) {
          const payload = event && typeof event.payload === 'object' ? event.payload : {};
          const kind = typeof payload.kind === 'string' ? payload.kind : '';
          const trace = payload && typeof payload.payload === 'object' ? payload.payload : {};
          const stage = typeof trace.stage === 'string' ? trace.stage : '';
          const action = typeof trace.action === 'string' ? trace.action : '';
          const error = typeof trace.error === 'string' ? trace.error : '';
          if (kind === 'boo.failure') {
            const operation = typeof trace.operation === 'string' ? trace.operation : '';
            return `boo.failure ${operation} ${error || ''}`.trim();
          }
          if (kind === 'boo.sync.start') {
            const operation = typeof trace.operation === 'string' ? trace.operation : '';
            return `boo.sync.start ${operation}`.trim();
          }
          if (kind === 'boo.sync.ok') {
            const operation = typeof trace.operation === 'string' ? trace.operation : '';
            const count = typeof trace.chatCount === 'number' ? trace.chatCount : 0;
            return `boo.sync.ok ${operation} chats=${count}`.trim();
          }
          if (kind === 'boo.recovery.start') {
            const reason = typeof trace.reason === 'string' ? trace.reason : '';
            return `boo.recovery.start ${reason}`.trim();
          }
          if (kind === 'boo.recovery.ok') {
            return 'boo.recovery.ok';
          }
          if (kind === 'boo.recovery.fail') {
            const recoveryError = typeof trace.error === 'string' ? trace.error : '';
            return `boo.recovery.fail ${recoveryError}`.trim();
          }
          if (kind === 'boo.auth.refresh') {
            const operation = typeof trace.operation === 'string' ? trace.operation : '';
            return `boo.auth.refresh ${operation}`.trim();
          }
          if (kind === 'debug.trace') {
            return `bridge ${action} ${stage} ${error}`.trim();
          }
          return kind || 'event';
        },

        async attemptSessionRecovery(reason = 'unknown') {
          if (!this.client) return false;
          this.appendDebugEvent({
            kind: 'boo.recovery.start',
            payload: {
              reason,
              appId: this.appId,
              uid: this.currentUserId,
            },
          });
          try {
            if (typeof this.client.ensureAuthenticated === 'function') {
              const auth = await this.client.ensureAuthenticated();
              if (auth && auth.user && typeof auth.user.uid === 'string' && auth.user.uid.trim()) {
                this.currentUserId = auth.user.uid.trim();
              }
            } else {
              if (typeof this.client.getCurrentUser === 'function') {
                const user = await this.client.getCurrentUser();
                if (user && typeof user.uid === 'string' && user.uid.trim()) {
                  this.currentUserId = user.uid.trim();
                }
              }
              if (typeof this.client.getIdToken === 'function') {
                await this.client.getIdToken(true);
              }
            }
            if (typeof this.loadBlockedUsers === 'function') {
              await this.loadBlockedUsers();
            }
            this.appendDebugEvent({
              kind: 'boo.recovery.ok',
              payload: { reason, uid: this.currentUserId },
            });
            return true;
          } catch (error) {
            this.appendDebugEvent({
              kind: 'boo.recovery.fail',
              payload: {
                reason,
                error: error && error.message ? error.message : String(error),
              },
            });
            return false;
          }
        },

        normalizedNewChatQuery() {
          const raw = typeof this.newChatQuery === 'string' ? this.newChatQuery : '';
          return raw.trim().replace(/^@+/, '');
        },

        isPeerBlocked(peerUid) {
          const uid = this.normalizeUid(peerUid);
          return Boolean(uid && this.blockedByMe[uid]);
        },

        activeChatIsBlocked() {
          const chat = this.activeChat();
          if (!chat) return false;
          return this.isPeerBlocked(chat.peerUid || chat?.participant?.id);
        },

        isBusyForBackgroundSync() {
          if (this.isSendingMessage || this.isOpeningThread || this.isUpdatingBlock) return true;
          if (this.isRefreshingActiveThread) return true;
          if (this.composeChatOpen) return true;
          return Object.keys(this.deletingMessageIds || {}).length > 0;
        },

        bindLifecycleHooks() {
          if (this.lifecycleHooksBound) return;
          this.visibilityChangeHandler = () => {
            if (document.hidden) {
              this.stopChatsPolling();
              this.stopActiveThreadPolling();
              return;
            }
            if (this.integrationMode === 'connected') {
              this.startChatsPolling();
              if (this.view === 'thread') {
                this.startActiveThreadPolling();
                void this.pollActiveThreadSilently();
              }
              void this.pollChatsSilently();
            }
          };
          this.beforeUnloadHandler = () => {
            this.stopChatsPolling();
            this.stopActiveThreadPolling();
            this.stopSendCooldownTicker();
            this.cancelScheduledThreadScroll();
            this.unbindMessagesListObserver();
            this.clearNewChatSearchTimer();
            if (this.typingTimerId) {
              clearTimeout(this.typingTimerId);
              this.typingTimerId = null;
            }
          };
          this.resizeHandler = () => {
            if (this.view !== 'thread') return;
            if (!this.messagesPinnedToBottom) return;
            this.scheduleScrollThreadToBottom({ smooth: false });
          };
          document.addEventListener('visibilitychange', this.visibilityChangeHandler);
          window.addEventListener('beforeunload', this.beforeUnloadHandler);
          window.addEventListener('resize', this.resizeHandler, { passive: true });
          this.lifecycleHooksBound = true;
        },

        bindUiWatchers() {
          if (this.uiWatchersBound) return;
          if (typeof this.$watch !== 'function') return;
          this.$watch('view', (nextView) => {
            if (nextView !== 'thread') {
              this.cancelScheduledThreadScroll();
              this.unbindMessagesListObserver();
              return;
            }
            this.$nextTick(() => {
              this.bindMessagesListObserver();
              this.updateMessagesPinnedState();
              if (this.messagesPinnedToBottom) {
                this.clearPendingIncomingForActiveChat();
                this.scheduleScrollThreadToBottom({ smooth: false });
              }
            });
          });
          this.$watch('activeChatId', (nextChatId) => {
            this.clearPendingIncoming(nextChatId);
            this.messagesPinnedToBottom = true;
          });
          this.uiWatchersBound = true;
        },

        startChatsPolling() {
          if (this.integrationMode !== 'connected') return;
          if (this.chatsPollTimerId) return;
          this.chatsPollTimerId = setInterval(() => {
            void this.pollChatsSilently();
          }, this.chatPollingIntervalMs);
        },

        stopChatsPolling() {
          if (!this.chatsPollTimerId) return;
          clearInterval(this.chatsPollTimerId);
          this.chatsPollTimerId = null;
        },

        async pollChatsSilently() {
          if (this.integrationMode !== 'connected') return;
          if (document.hidden) return;
          if (this.isBusyForBackgroundSync()) return;
          await this.loadChatsFromApi({ silent: true });
        },

        startActiveThreadPolling() {
          if (this.integrationMode !== 'connected') return;
          if (this.view !== 'thread') return;
          const activeId = this.normalizeUid(this.activeChatId);
          if (!activeId) return;
          if (this.activeThreadPollTimerId) return;
          this.activeThreadPollTimerId = setInterval(() => {
            void this.pollActiveThreadSilently();
          }, this.activeThreadPollingIntervalMs);
        },

        stopActiveThreadPolling() {
          if (!this.activeThreadPollTimerId) return;
          clearInterval(this.activeThreadPollTimerId);
          this.activeThreadPollTimerId = null;
        },

        async pollActiveThreadSilently() {
          if (this.integrationMode !== 'connected') return;
          if (document.hidden) return;
          if (this.view !== 'thread') return;
          const activeId = this.normalizeUid(this.activeChatId);
          if (!activeId) return;
          if (this.isRefreshingActiveThread) return;
          if (this.isOpeningThread || this.isUpdatingBlock || this.composeChatOpen) return;
          if (Object.keys(this.deletingMessageIds || {}).length > 0) return;
          this.isRefreshingActiveThread = true;
          try {
            await this.refreshChatMessages(activeId, { markAsRead: true });
          } finally {
            this.isRefreshingActiveThread = false;
          }
        },

        isStaleSyncRequest(requestId) {
          if (!Number.isFinite(requestId)) return false;
          return requestId < this.latestSyncRequestId;
        },

        nextMessageRefreshSeq(chatId) {
          const normalizedChatId = this.normalizeUid(chatId);
          if (!normalizedChatId) return 0;
          const current = Number(this.messageRefreshSeqByChatId[normalizedChatId] || 0);
          const next = Number.isFinite(current) ? current + 1 : 1;
          this.messageRefreshSeqByChatId = {
            ...this.messageRefreshSeqByChatId,
            [normalizedChatId]: next,
          };
          this.messageRefreshLatestSeqByChatId = {
            ...this.messageRefreshLatestSeqByChatId,
            [normalizedChatId]: next,
          };
          return next;
        },

        isStaleMessageRefresh(chatId, seq) {
          const normalizedChatId = this.normalizeUid(chatId);
          if (!normalizedChatId || !Number.isFinite(seq)) return false;
          const latest = Number(this.messageRefreshLatestSeqByChatId[normalizedChatId] || 0);
          return seq < latest;
        },

        startSendCooldownTicker() {
          if (this.sendCooldownTickerId) return;
          this.sendCooldownTickerId = setInterval(() => {
            this.pruneExpiredSendCooldowns();
          }, 1000);
        },

        stopSendCooldownTicker() {
          if (!this.sendCooldownTickerId) return;
          clearInterval(this.sendCooldownTickerId);
          this.sendCooldownTickerId = null;
        },

        pruneExpiredSendCooldowns() {
          const now = Date.now();
          this.cooldownNowMs = now;
          const source = this.sendCooldownUntilByChat && typeof this.sendCooldownUntilByChat === 'object'
            ? this.sendCooldownUntilByChat
            : {};
          const next = {};
          Object.entries(source).forEach(([chatId, until]) => {
            const value = typeof until === 'number' ? until : Number(until);
            if (!Number.isFinite(value) || value <= now) return;
            next[chatId] = value;
          });
          this.sendCooldownUntilByChat = next;
          if (Object.keys(next).length === 0) {
            this.stopSendCooldownTicker();
          }
        },

        startSendCooldown(chatId, seconds) {
          const normalizedChatId = this.normalizeUid(chatId);
          if (!normalizedChatId) return;
          const safeSeconds = Number.isFinite(seconds) && seconds > 0
            ? Math.min(120, Math.floor(seconds))
            : 8;
          const now = Date.now();
          const nextUntil = now + safeSeconds * 1000;
          const currentUntil = Number(this.sendCooldownUntilByChat[normalizedChatId] || 0);
          this.sendCooldownUntilByChat = {
            ...this.sendCooldownUntilByChat,
            [normalizedChatId]: Math.max(currentUntil, nextUntil),
          };
          this.cooldownNowMs = now;
          this.startSendCooldownTicker();
        },

        getSendCooldownSeconds(chatId) {
          const normalizedChatId = this.normalizeUid(chatId);
          if (!normalizedChatId) return 0;
          const until = Number(this.sendCooldownUntilByChat[normalizedChatId] || 0);
          if (!Number.isFinite(until) || until <= 0) return 0;
          const remainingMs = until - this.cooldownNowMs;
          if (remainingMs <= 0) return 0;
          return Math.max(1, Math.ceil(remainingMs / 1000));
        },

        activeChatCooldownSeconds() {
          return this.getSendCooldownSeconds(this.activeChatId);
        },

        isActiveChatRateLimited() {
          return this.activeChatCooldownSeconds() > 0;
        },

        activeChatCooldownText() {
          const seconds = this.activeChatCooldownSeconds();
          if (seconds <= 0) return '';
          return this.formatRateLimitedMessage(seconds);
        },

        async loadBlockedUsers() {
          if (!this.client || typeof this.client.socialBlockList !== 'function') return;
          this.isLoadingBlockedUsers = true;
          try {
            const rows = await this.client.socialBlockList();
            const next = {};
            (Array.isArray(rows) ? rows : []).forEach((row) => {
              const uid = this.normalizeUid(row?.targetUid);
              if (!uid) return;
              next[uid] = true;
            });
            this.blockedByMe = next;
          } catch (error) {
            console.warn('Failed to load blocked users for Boo:', error);
          } finally {
            this.isLoadingBlockedUsers = false;
          }
        },

        async toggleActivePeerBlock() {
          if (this.isUpdatingBlock) return;
          const chat = this.activeChat();
          if (!chat) return;
          const peerUid = this.normalizeUid(chat.peerUid || chat?.participant?.id);
          if (!peerUid) return;
          if (
            this.integrationMode !== 'connected'
            || !this.client
            || typeof this.client.socialBlockCreate !== 'function'
            || typeof this.client.socialBlockDelete !== 'function'
          ) {
            this.error = this.t('newChatUnavailable');
            return;
          }

          this.isUpdatingBlock = true;
          this.error = '';
          try {
            if (this.isPeerBlocked(peerUid)) {
              await this.client.socialBlockDelete(peerUid);
              const next = { ...this.blockedByMe };
              delete next[peerUid];
              this.blockedByMe = next;
              this.status = this.t('unblockedStatus');
            } else {
              await this.client.socialBlockCreate(peerUid);
              this.blockedByMe = {
                ...this.blockedByMe,
                [peerUid]: true,
              };
              this.status = this.t('blockedStatus');
            }
          } catch (error) {
            this.error = this.mapSocialError(error) || this.t('blockActionFailed');
            console.warn('Failed to update block state in Boo:', error);
          } finally {
            this.isUpdatingBlock = false;
          }
        },

        clearNewChatSearchTimer() {
          if (this.newChatSearchTimerId) {
            clearTimeout(this.newChatSearchTimerId);
            this.newChatSearchTimerId = null;
          }
        },

        openNewChatComposer() {
          this.composeChatOpen = true;
          this.newChatError = '';
          this.newChatQuery = '';
          this.newChatResults = [];
          this.isSearchingProfiles = false;
          this.isOpeningThread = false;
          this.newChatSearchToken += 1;
          this.clearNewChatSearchTimer();
        },

        closeNewChatComposer() {
          this.composeChatOpen = false;
          this.newChatError = '';
          this.newChatQuery = '';
          this.newChatResults = [];
          this.isSearchingProfiles = false;
          this.isOpeningThread = false;
          this.newChatSearchToken += 1;
          this.clearNewChatSearchTimer();
        },

        debounceNewChatSearch() {
          this.newChatError = '';
          this.clearNewChatSearchTimer();
          const query = this.normalizedNewChatQuery();
          if (query.length === 0) {
            this.newChatResults = [];
            this.isSearchingProfiles = false;
            return;
          }
          this.newChatSearchTimerId = setTimeout(() => {
            this.newChatSearchTimerId = null;
            void this.searchProfilesForNewChat();
          }, 220);
        },

        hasExistingChatWithPeer(peerUid) {
          const uid = this.normalizeUid(peerUid);
          if (!uid) return false;
          return this.chats.some((chat) => chat.peerUid === uid || chat.participant.id === uid);
        },

        normalizeProfileSearchRows(rows) {
          const unique = new Set();
          const list = [];
          const sourceRows = Array.isArray(rows) ? rows : [];
          sourceRows.forEach((row) => {
            const uid = this.normalizeUid(row?.uid);
            if (!uid || uid === this.currentUserId || unique.has(uid)) return;
            unique.add(uid);
            const username = typeof row?.username === 'string' ? row.username.trim() : '';
            const displayName = typeof row?.displayName === 'string' ? row.displayName.trim() : username;
            const photoRaw = typeof row?.photoUrl === 'string'
              ? row.photoUrl
              : (typeof row?.avatarUrl === 'string' ? row.avatarUrl : '');
            const photoUrl = photoRaw && photoRaw.trim().length > 0 ? photoRaw.trim() : null;
            list.push({
              uid,
              username,
              displayName: displayName || username || this.fallbackUserLabel(uid),
              photoUrl,
              avatarUrl: photoUrl,
            });
          });
          return list;
        },

        async searchProfilesForNewChat() {
          const query = this.normalizedNewChatQuery();
          const requestToken = this.newChatSearchToken + 1;
          this.newChatSearchToken = requestToken;
          if (query.length < 2) {
            this.newChatResults = [];
            this.isSearchingProfiles = false;
            return;
          }
          if (
            this.integrationMode !== 'connected'
            || !this.client
            || typeof this.client.socialProfileSearch !== 'function'
          ) {
            this.newChatResults = [];
            this.newChatError = this.t('newChatUnavailable');
            this.isSearchingProfiles = false;
            return;
          }

          this.isSearchingProfiles = true;
          this.newChatError = '';
          try {
            const rows = await this.client.socialProfileSearch(query, 12);
            if (requestToken !== this.newChatSearchToken) return;
            const normalized = this.normalizeProfileSearchRows(rows);
            this.newChatResults = normalized;
            if (normalized.length > 0) {
              const nextCache = { ...this.profileCacheByUid };
              normalized.forEach((item) => {
                nextCache[item.uid] = {
                  uid: item.uid,
                  username: item.username,
                  displayName: item.displayName,
                  photoUrl: item.photoUrl,
                  avatarUrl: item.avatarUrl,
                };
              });
              this.profileCacheByUid = nextCache;
            }
          } catch (error) {
            if (requestToken !== this.newChatSearchToken) return;
            this.newChatResults = [];
            this.newChatError = this.mapSocialError(error);
          } finally {
            if (requestToken === this.newChatSearchToken) {
              this.isSearchingProfiles = false;
            }
          }
        },

        async init() {
          this.chats = [];

            this.status = 'Mock mode';

            this.captureFailure('init', error, { integrationMode: 'mock' });

        },
