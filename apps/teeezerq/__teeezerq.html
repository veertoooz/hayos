<!DOCTYPE html>
<html lang="hy" class="h-full bg-transparent" data-theme="black" x-data="templateApp()" x-init="init()">

<head>
  <script data-hayos-prepaint-settings>
    (function applyHayOSPrepaintSettings() {
      try {
        var root = document.documentElement;
        var params = new URLSearchParams(window.location.search);
        var fromQueryLang = (params.get('lang') || params.get('language') || '').trim().toLowerCase();
        var fromQueryTheme = (params.get('theme') || '').trim();
        var stored = null;
        try {
          var raw = window.localStorage.getItem('hayos.settings');
          stored = raw ? JSON.parse(raw) : null;
        } catch {
          stored = null;
        }
        var language = fromQueryLang === 'hy' || fromQueryLang === 'en'
          ? fromQueryLang
          : (stored && stored.language === 'hy' ? 'hy' : 'en');
        var theme = fromQueryTheme
          || (stored && typeof stored.theme === 'string' ? stored.theme.trim() : '')
          || 'black';
        root.lang = language;
        root.setAttribute('data-theme', theme);
      } catch {
        // ignore prepaint bootstrap failures
      }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title x-text="t('pageTitle')">TeeezerQ App</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <!-- <script src="../shared/contract.js"></script> -->

  <style>
    [x-cloak] { display: none !important; }

    :root {
      --knowledge-connector-alpha: 18%;
      --knowledge-selected-alpha: 14%;
      --knowledge-line-alpha: 75%;
    }

    :root[data-knowledge-tone="light"] {
      --knowledge-connector-alpha: 30%;
      --knowledge-selected-alpha: 20%;
      --knowledge-line-alpha: 82%;
    }

    :root {
      --knowledge-orbit-path-fill: color-mix(in oklab, var(--fallback-p, #4f46e5) 72%, var(--fallback-b1, #0f172a) 28%);
      --knowledge-orbit-file-fill: color-mix(in oklab, var(--fallback-bc, #ffffff) 62%, var(--fallback-b1, #0f172a) 38%);
      --knowledge-orbit-halo: color-mix(in oklab, var(--fallback-p, #4f46e5) 50%, transparent);
      --knowledge-orbit-bg1: color-mix(in oklab, var(--fallback-p, #4f46e5) 18%, transparent);
      --knowledge-orbit-bg2: color-mix(in oklab, var(--fallback-a, #22c55e) 14%, transparent);
      --knowledge-orbit-bg3: color-mix(in oklab, var(--fallback-b2, #171717) 95%, black);
    }

    :root[data-knowledge-tone="light"] {
      --knowledge-orbit-path-fill: color-mix(in oklab, var(--fallback-p, #4f46e5) 58%, white 42%);
      --knowledge-orbit-file-fill: color-mix(in oklab, var(--fallback-bc, #1f2937) 58%, white 42%);
      --knowledge-orbit-halo: color-mix(in oklab, var(--fallback-p, #4f46e5) 32%, transparent);
      --knowledge-orbit-bg1: color-mix(in oklab, var(--fallback-p, #4f46e5) 11%, transparent);
      --knowledge-orbit-bg2: color-mix(in oklab, var(--fallback-a, #22c55e) 9%, transparent);
      --knowledge-orbit-bg3: color-mix(in oklab, var(--fallback-b2, #f5f7fb) 96%, white);
    }

    .mobile-shell {
      width: min(100vw, 460px);
      margin: 0 auto;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 100% -10%, rgba(63, 130, 255, 0.16), transparent 35%),
        radial-gradient(circle at 0% 120%, rgba(54, 191, 130, 0.12), transparent 35%),
        color-mix(in oklab, var(--fallback-b1, #121212) 97%, #000);
    }

    .safe-main {
      padding-bottom: calc(5.25rem + env(safe-area-inset-bottom));
    }

    .mobile-nav {
      padding-bottom: env(safe-area-inset-bottom);
    }

    *:focus-visible {
      outline: 2px solid color-mix(in oklab, var(--fallback-p, #4f46e5) 80%, white);
      outline-offset: 2px;
    }

    .knowledge-layout {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: 1fr;
    }

    @media (min-width: 1024px) {
      .knowledge-layout {
        grid-template-columns: minmax(220px, 0.95fr) minmax(260px, 1.2fr) minmax(260px, 1fr);
      }
    }

    .knowledge-panel {
      min-height: 22rem;
    }

    .dot-node {
      font-size: 1.05rem;
      line-height: 1;
    }

    .dot-node--path {
      color: color-mix(in oklab, var(--fallback-p, #4f46e5) 70%, var(--fallback-bc, #fff) 30%);
    }

    .dot-node--file {
      color: color-mix(in oklab, var(--fallback-n, #222) 60%, var(--fallback-bc, #fff) 40%);
    }

    .tree-row-selected {
      background: color-mix(in oklab, var(--fallback-p, #4f46e5) var(--knowledge-selected-alpha), transparent);
    }

    .tree-connector {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 1px;
      background: color-mix(in oklab, var(--fallback-bc, #fff) var(--knowledge-connector-alpha), transparent);
      pointer-events: none;
    }

    .tree-connector-elbow {
      position: absolute;
      top: 50%;
      left: 0;
      width: 10px;
      height: 1px;
      background: color-mix(in oklab, var(--fallback-bc, #fff) var(--knowledge-connector-alpha), transparent);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .tree-drop-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: color-mix(in oklab, var(--fallback-p, #4f46e5) var(--knowledge-line-alpha), white 25%);
      pointer-events: none;
    }

    .tree-drop-line--before {
      top: -1px;
    }

    .tree-drop-line--after {
      bottom: -1px;
    }

    .tree-drop-inside {
      position: absolute;
      inset: 0;
      border: 1px dashed color-mix(in oklab, var(--fallback-p, #4f46e5) 60%, transparent 40%);
      border-radius: 0.5rem;
      pointer-events: none;
    }

    .knowledge-orbit-canvas {
      position: relative;
      min-height: 18rem;
      border-radius: 0.75rem;
      border: 1px solid color-mix(in oklab, var(--fallback-bc, #fff) 14%, transparent);
      background:
        radial-gradient(circle at 30% 16%, var(--knowledge-orbit-bg1), transparent 38%),
        radial-gradient(circle at 78% 84%, var(--knowledge-orbit-bg2), transparent 34%),
        var(--knowledge-orbit-bg3);
      transition: background-position 240ms ease;
      overflow: hidden;
    }

    .knowledge-orbit-svg {
      width: 100%;
      height: 100%;
      min-height: 18rem;
      display: block;
    }
  </style>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('themeSwitcher', (opts = {}) => ({
        get themes() {
          return typeof opts.getThemes === 'function' ? opts.getThemes() : [];
        },
        get value() {
          return typeof opts.getTheme === 'function' ? opts.getTheme() : 'black';
        },
        apply(event) {
          if (typeof opts.onChange !== 'function') return;
          const value = event?.target?.value || '';
          opts.onChange(value);
        },
      }));

      Alpine.data('permissionPill', (opts = {}) => ({
        get text() {
          return typeof opts.getText === 'function' ? opts.getText() : '-';
        },
        get badgeClass() {
          return typeof opts.getClassName === 'function' ? opts.getClassName() : 'badge-ghost';
        },
      }));

      Alpine.data('treeNode', (opts = {}) => ({
        select() {
          if (typeof opts.onSelect === 'function') opts.onSelect();
        },
        activate() {
          if (typeof opts.onActivate === 'function') opts.onActivate();
        },
        dragStart(event) {
          if (typeof opts.onDragStart === 'function') opts.onDragStart(event);
        },
        dragEnd() {
          if (typeof opts.onDragEnd === 'function') opts.onDragEnd();
        },
      }));

      Alpine.data('markdownEditor', (opts = {}) => ({
        get mode() {
          return typeof opts.getMode === 'function' ? opts.getMode() : 'split';
        },
        setMode(nextMode) {
          if (typeof opts.setMode === 'function') opts.setMode(nextMode);
        },
        get value() {
          return typeof opts.getValue === 'function' ? opts.getValue() : '';
        },
        setValue(nextValue) {
          if (typeof opts.setValue === 'function') opts.setValue(nextValue);
        },
        onInput(event) {
          this.setValue(event?.target?.value || '');
          if (typeof opts.onInput === 'function') opts.onInput();
        },
        get isDirty() {
          return typeof opts.getIsDirty === 'function' ? opts.getIsDirty() : false;
        },
      }));
    });

    function loadHayOSClient() {
      const isLocalhost =
        window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1';
      const clientUrl = isLocalhost
        ? 'http://localhost:5173/hayos-client.js'
        : '/hayos-client.js';

      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = clientUrl;
        script.onload = resolve;
        script.onerror = () =>
          reject(new Error(`Failed to load HayOSClient from ${clientUrl}`));
        document.head.appendChild(script);
      });
    }
  </script>

  <script>
    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        plugins: [require('daisyui')],
        daisyui: { themes: true },
      };
    }
  </script>
</head>

<body class="h-full bg-base-100">
  <div class="mobile-shell border-x border-base-300/40" x-cloak>
    <header class="sticky top-0 z-20 px-4 pt-4 pb-3 border-b border-base-300/70 bg-base-100/90 backdrop-blur">
      <div class="flex items-center justify-between gap-2">
        <h1 class="text-base font-semibold truncate" x-text="t('pageTitle')"></h1>
        <span class="badge badge-outline text-[11px]" x-text="status"></span>
      </div>
      <p class="text-xs opacity-70 mt-1 truncate" x-show="user" x-text="user?.email || user?.displayName || user?.uid"></p>
      <p class="text-xs text-error mt-1" x-show="error" x-text="error"></p>
    </header>

    <main class="safe-main px-4 py-4 space-y-4">
      <section x-show="currentPage === 'overview'" class="space-y-4">
        <div class="card bg-base-200 shadow-sm">
          <div class="card-body p-4">
            <h2 class="text-base font-semibold" x-text="t('starterTitle')"></h2>
            <p class="text-sm opacity-80 mt-1" x-text="t('starterDescription')"></p>
          </div>
        </div>

        <div class="card bg-base-200 shadow-sm">
          <div class="card-body p-4 space-y-3">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-semibold" x-text="t('inputTitle')"></h3>
              <span class="badge badge-outline text-[11px]" x-text="geerSourceLabel"></span>
            </div>

            <div class="join w-full">
              <button class="btn btn-sm join-item flex-1" :class="geerSource === 'greech' ? 'btn-primary' : ''" @click="setGeerSource('greech')" x-text="t('sourceGreech')"></button>
              <button class="btn btn-sm join-item flex-1" :class="geerSource === 'custom' ? 'btn-primary' : ''" @click="setGeerSource('custom')" x-text="t('sourceCustom')"></button>
            </div>

            <textarea
              class="textarea textarea-bordered h-32 w-full"
              x-model="geerInput"
              :placeholder="t('inputPlaceholder')"
              @input="onGeerInputChange()"></textarea>
            <p class="text-xs opacity-65" x-show="handoffSummary" x-text="handoffSummary"></p>

            <div class="flex gap-2">
              <button class="btn btn-sm btn-outline flex-1" @click="resolveIncomingText()" x-text="t('reloadIncomingBtn')"></button>
              <button class="btn btn-sm flex-1" @click="clearInput()" x-text="t('clearInputBtn')"></button>
            </div>
          </div>
        </div>

        <div class="card bg-base-200 shadow-sm">
          <div class="card-body p-4 space-y-3">
            <h3 class="text-sm font-semibold" x-text="t('generatorTitle')"></h3>

            <div class="join w-full">
              <button class="btn btn-sm join-item flex-1" :class="captionPreset === 'short' ? 'btn-primary' : ''" @click="captionPreset = 'short'" x-text="t('presetShort')"></button>
              <button class="btn btn-sm join-item flex-1" :class="captionPreset === 'medium' ? 'btn-primary' : ''" @click="captionPreset = 'medium'" x-text="t('presetMedium')"></button>
              <button class="btn btn-sm join-item flex-1" :class="captionPreset === 'punchline' ? 'btn-primary' : ''" @click="captionPreset = 'punchline'" x-text="t('presetPunchline')"></button>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <button class="btn btn-sm btn-primary" @click="generateCaptions()" :disabled="!geerInput.trim() || generationLoading" x-text="generationLoading ? t('generatingBtn') : t('generateBtn')"></button>
              <button class="btn btn-sm" @click="regenerateCaptions()" :disabled="!captions.length || generationLoading" x-text="t('regenerateBtn')"></button>
            </div>

            <div class="flex gap-2" x-show="captions.length">
              <button class="btn btn-xs btn-outline" @click="copyAllCaptions()" x-text="t('copyAllBtn')"></button>
              <p class="text-xs opacity-70 self-center" x-show="copyNotice" x-text="copyNotice"></p>
            </div>

            <div class="space-y-2" x-show="captions.length && !generationLoading">
              <template x-for="(caption, idx) in captions" :key="`${idx}-${caption}`">
                <article class="rounded-lg border border-base-300 bg-base-100 p-3 space-y-2">
                  <p class="text-sm" x-text="caption"></p>
                  <button class="btn btn-xs" @click="copyCaption(caption)" x-text="t('copyBtn')"></button>
                </article>
              </template>
            </div>

            <div class="rounded-lg border border-info/35 bg-info/10 px-3 py-2 text-xs" x-show="generationLoading" x-text="t('captionsLoading')"></div>
            <div class="rounded-lg border border-error/40 bg-error/10 px-3 py-2 text-xs" x-show="generationError" x-text="generationError"></div>
            <p class="text-xs opacity-60" x-show="!captions.length && !generationLoading && !generationError" x-text="t('captionsEmpty')"></p>
          </div>
        </div>

        <div class="card bg-base-200 shadow-sm">
          <div class="card-body p-4 space-y-2 text-sm">
            <p><span class="font-semibold" x-text="t('statusLabel')"></span>: <span x-text="status"></span></p>
            <p><span class="font-semibold" x-text="t('themeLabel')"></span>: <span x-text="osTheme || '(not resolved)'"></span></p>
            <p><span class="font-semibold" x-text="t('languageLabel')"></span>: <span x-text="language === 'hy' ? 'Հայերեն' : 'English'"></span></p>
            <p x-show="user"><span class="font-semibold" x-text="t('userLabel')"></span>: <span x-text="user?.email || user?.displayName || user?.uid"></span></p>
            <p class="text-warning text-xs pt-1" x-text="t('permissionNote')"></p>
          </div>
        </div>
      </section>

      <section x-show="currentPage === 'music'" class="card bg-base-200 shadow-sm">
        <div class="card-body p-4">
          <h2 class="text-base font-semibold" x-text="t('musicTitle')"></h2>
          <p class="text-sm opacity-75 mt-1" x-text="t('musicDescription')"></p>
          <div class="mt-3 border border-base-300 rounded-lg p-3">
            <p class="text-sm" x-text="t('musicPlaceholder')"></p>
          </div>
        </div>
      </section>

      <section x-show="currentPage === 'files'" class="card bg-base-200 shadow-sm">
        <div class="card-body p-3 md:p-4 space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <h2 class="text-base font-semibold" x-text="t('filesTitle')"></h2>
            <div class="join">
              <button
                type="button"
                class="btn btn-xs join-item"
                :class="knowledgeMobileTab === 'tree' ? 'btn-primary' : ''"
                @click="setKnowledgeMobileTab('tree')"
                x-text="t('knowledgeTabTree')"></button>
              <button
                type="button"
                class="btn btn-xs join-item"
                :class="knowledgeMobileTab === 'canvas' ? 'btn-primary' : ''"
                @click="setKnowledgeMobileTab('canvas')"
                x-text="t('knowledgeTabCanvas')"></button>
              <button
                type="button"
                class="btn btn-xs join-item"
                :class="knowledgeMobileTab === 'editor' ? 'btn-primary' : ''"
                @click="setKnowledgeMobileTab('editor')"
                x-text="t('knowledgeTabEditor')"></button>
            </div>
          </div>

          <div class="flex flex-wrap items-center gap-2 rounded-box border border-base-300 bg-base-100/70 p-2">
            <div
              x-data="themeSwitcher({
                getTheme: () => knowledgeState.uiState.activeTheme,
                getThemes: () => knowledgeThemes,
                onChange: (nextTheme) => { knowledgeState.uiState.activeTheme = nextTheme; applyKnowledgeTheme(); },
              })"
              class="flex items-center gap-2">
              <span class="text-[11px] opacity-70" x-text="t('knowledgeThemeLabel')"></span>
              <select class="select select-bordered select-xs max-w-[9rem]" :value="value" @change="apply($event)">
                <template x-for="theme in themes" :key="theme">
                  <option :value="theme" x-text="theme"></option>
                </template>
              </select>
            </div>
            <span class="badge badge-outline badge-xs">
              <span x-text="t('knowledgeContrastLabel')"></span>
              <span class="ml-1" x-text="t('knowledgeContrastOk')"></span>
            </span>
            <div class="join">
              <button class="btn btn-xs btn-outline join-item" @click="createKnowledgePath()" x-text="t('knowledgeAddPath')"></button>
              <button class="btn btn-xs btn-outline join-item" @click="createKnowledgeFile()" x-text="t('knowledgeAddFile')"></button>
              <button class="btn btn-xs btn-outline join-item" @click="runKnowledgeQaSuite()" x-text="t('knowledgeRunQa')"></button>
              <button class="btn btn-xs btn-outline join-item" @click="loadKnowledgeDemoScenario()" x-text="t('knowledgeLoadDemo')"></button>
            </div>
            <input
              type="search"
              class="input input-bordered input-xs flex-1 min-w-[10rem]"
              :placeholder="t('knowledgeSearchPlaceholder')"
              x-model.trim="knowledgeSearch"
              @input="syncKnowledgeStores()" />
          </div>

          <div class="knowledge-layout">
            <section
              class="knowledge-panel rounded-box border border-base-300 bg-base-100/80 p-3"
              x-show="knowledgeMobileTab === 'tree' || isKnowledgeDesktop"
              tabindex="0"
              @keydown.arrow-up.prevent="selectKnowledgeRowByOffset(-1)"
              @keydown.arrow-down.prevent="selectKnowledgeRowByOffset(1)">
              <h3 class="text-sm font-semibold mb-2" x-text="t('knowledgeTreeTitle')"></h3>
              <template x-if="!knowledgeTreeRows.length">
                <p class="text-xs opacity-70" x-text="t('knowledgeEmptyTree')"></p>
              </template>
              <template x-for="row in knowledgeTreeRows" :key="row.node.id">
                <div
                  x-data="treeNode({
                    onSelect: () => selectKnowledgeNode(row.node.id),
                    onActivate: () => activateKnowledgeNode(row.node.id),
                    onDragStart: (event) => onKnowledgeDragStart(row.node.id, event),
                    onDragEnd: () => onKnowledgeDragEnd(),
                  })"
                  class="relative flex items-center gap-1 rounded-md pr-1"
                  :class="isKnowledgeNodeSelected(row.node.id) ? 'tree-row-selected' : ''"
                  @dragover.prevent="onKnowledgeDragOver(row.node.id, $event)"
                  @drop.prevent="onKnowledgeDrop(row.node.id, $event)"
                  @dragleave="onKnowledgeDragLeave(row.node.id, $event)">
                  <span class="tree-drop-line tree-drop-line--before" x-show="knowledgeDropHint.nodeId === row.node.id && knowledgeDropHint.position === 'before'"></span>
                  <span class="tree-drop-line tree-drop-line--after" x-show="knowledgeDropHint.nodeId === row.node.id && knowledgeDropHint.position === 'after'"></span>
                  <span class="tree-drop-inside" x-show="knowledgeDropHint.nodeId === row.node.id && knowledgeDropHint.position === 'inside'"></span>
                  <span class="inline-block w-2" :style="`margin-left:${row.level * 12}px`"></span>
                  <span
                    class="tree-connector"
                    x-show="row.level > 0"
                    :style="`left:${Math.max(0, row.level * 12 - 6)}px`"></span>
                  <span
                    class="tree-connector-elbow"
                    x-show="row.level > 0"
                    :style="`left:${Math.max(0, row.level * 12 - 6)}px`"></span>
                  <button
                    type="button"
                    class="btn btn-ghost btn-xs px-1 min-h-0 h-5 cursor-grab active:cursor-grabbing"
                    draggable="true"
                    @dragstart="dragStart($event)"
                    @dragend="dragEnd()">⋮⋮</button>
                  <button
                    type="button"
                    class="btn btn-ghost btn-xs px-1 min-h-0 h-5"
                    x-show="row.node.type === 'path'"
                    @click="row.node.collapsed = !row.node.collapsed; saveKnowledge()"
                    x-text="row.node.collapsed ? '▸' : '▾'"></button>
                  <button
                    type="button"
                    class="btn btn-ghost btn-xs flex-1 justify-start gap-1"
                    @click="select()"
                    @dblclick="activate()"
                    @keydown.enter.prevent="activate()"
                    @keydown.alt.arrow-up.prevent="reorderKnowledgeWithinParent(row.node.id, -1)"
                    @keydown.alt.arrow-down.prevent="reorderKnowledgeWithinParent(row.node.id, 1)">
                    <span class="dot-node" :class="row.node.type === 'path' ? 'dot-node--path' : 'dot-node--file'" x-text="row.node.type === 'path' ? '●' : '•'"></span>
                    <span class="truncate" x-text="row.node.title"></span>
                  </button>
                  <span
                    x-data="permissionPill({
                      getText: () => permissionBadgeForNode(row.node.id),
                      getClassName: () => permissionBadgeClassForNode(row.node.id),
                    })"
                    class="badge badge-outline badge-xs"
                    :class="badgeClass"
                    x-text="text"></span>
                  <div class="dropdown dropdown-end">
                    <label tabindex="0" class="btn btn-ghost btn-xs px-1 min-h-0 h-5">⋯</label>
                    <ul tabindex="0" class="dropdown-content menu rounded-box z-[30] w-36 border border-base-300 bg-base-100 p-1 shadow-lg">
                      <li><button type="button" @click="renameKnowledgeNode(row.node.id)" x-text="t('knowledgeActionRename')"></button></li>
                      <li><button type="button" @click="duplicateKnowledgeNode(row.node.id)" x-text="t('knowledgeActionDuplicate')"></button></li>
                      <li><button type="button" @click="moveKnowledgeNode(row.node.id)" x-text="t('knowledgeActionMove')"></button></li>
                      <li><button type="button" class="text-error" @click="deleteKnowledgeNode(row.node.id)" x-text="t('knowledgeActionDelete')"></button></li>
                    </ul>
                  </div>
                </div>
              </template>
              <div class="divider my-2"></div>
              <p class="text-[11px] opacity-70" x-text="t('knowledgeBreadcrumbLabel')"></p>
              <p class="text-xs mt-1 break-words" x-text="knowledgeBreadcrumbText"></p>
            </section>

            <section
              class="knowledge-panel rounded-box border border-base-300 bg-base-100/80 p-3"
              x-show="knowledgeMobileTab === 'canvas' || isKnowledgeDesktop">
              <div class="mb-2 flex flex-wrap items-center justify-between gap-2">

                      x-text="t('knowledgeViewGlobal')"></button>

                      class="btn btn-xs join-item"

                    <option value="high" x-text="t('knowledgeQualityHigh')"></option>
                    <option value="medium" x-text="t('knowledgeQualityMedium')"></option>
                    <option value="low" x-text="t('knowledgeQualityLow')"></option>
                  </select>
                  <button
                    type="button"
                    class="btn btn-xs btn-outline"
                    @click="resetKnowledgeOrbitView()"
                    x-text="t('knowledgeViewReset')"></button>
                  <select
                    class="select select-bordered select-xs"
                    x-model="knowledgeValidationScenario">
                    <option value="canonical" x-text="t('knowledgeScenarioCanonical')"></option>
                    <option value="deep" x-text="t('knowledgeScenarioDeep')"></option>
                    <option value="siblings" x-text="t('knowledgeScenarioSiblings')"></option>
                    <option value="permissions" x-text="t('knowledgeScenarioPermissions')"></option>
                  </select>
                  <button
                    type="button"
                    class="btn btn-xs btn-outline"
                    @click="applyKnowledgeValidationScenario(knowledgeValidationScenario)"

                    type="button"
                    class="btn btn-xs btn-outline"
                    :class="knowledgeValidationShuffleActive ? 'btn-warning' : ''"
                    @click="toggleKnowledgeValidationShuffle()"

              </div>

                  viewBox="0 0 640 420"
                  role="img"
                  :aria-label="t('knowledgeCanvasHint')"
                  @wheel.prevent="handleKnowledgeOrbitWheel($event)"
                  @touchstart="onKnowledgeOrbitTouchStart($event)"
                  @touchmove="onKnowledgeOrbitTouchMove($event)"
                  @touchend="onKnowledgeOrbitTouchEnd($event)">
                  <defs>
                    <filter id="knowledge-halo-soft" x="-200%" y="-200%" width="400%" height="400%">
                      <feGaussianBlur stdDeviation="2.8"></feGaussianBlur>
                    </filter>
                  </defs>
                  <g opacity="0.22">
                    <circle
                      x-for="guide in knowledgeOrbitGuides"
                      :key="guide.id"
                      :cx="guide.cx"
                      :cy="guide.cy"
                      :r="guide.r"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1"
                      stroke-dasharray="3 4"></circle>
                  </g>

                  <g opacity="0.45">
                    <line
                      x-for="link in knowledgeOrbitLinks"
                      :key="link.id"
                      :x1="link.x1"
                      :y1="link.y1"
                      :x2="link.x2"
                      :y2="link.y2"
                      stroke="currentColor"
                      stroke-width="1"></line>
                  </g>

                  <g>
                    <g x-for="node in knowledgeOrbitNodes" :key="node.id" :transform="`translate(${node.x}, ${node.y})`">
                      <circle
                        :r="node.size + 7"
                        :fill="node.haloColor"
                        :opacity="node.haloOpacity"
                        filter="url(#knowledge-halo-soft)"></circle>
                      <circle
                        :r="node.size + 3"
                        fill="none"
                        :opacity="node.permissionRingOpacity"
                        :stroke-width="node.permissionRingWidth"
                        :stroke="node.permissionRingColor"></circle>
                      <circle
                        :r="node.size"
                        :fill="node.fill"
                        :opacity="isKnowledgeNodeSelected(node.id) ? 0.95 : 0.76"
                        stroke="color-mix(in oklab, var(--fallback-bc, #fff) 35%, transparent)"
                        stroke-width="1.2"
                        class="cursor-pointer"
                        @click="selectKnowledgeNode(node.id)"
                        @dblclick="lockKnowledgeOrbitCenter(node.id)"></circle>
                      <text
                        x="0"
                        :y="node.size + 13"
                        text-anchor="middle"
                        font-size="10"
                        fill="currentColor"
                        :opacity="node.showLabel ? 0.9 : 0"
                        x-text="node.title"></text>

                  </g>

                  x-text="t('knowledgeCanvasEmpty')"></p>

                  class="absolute right-2 bottom-2 rounded-box border border-base-300/80 bg-base-100/80 px-2 py-1 text-[11px]"

                    <span class="font-semibold" x-text="t('knowledgeNodeTypeLabel')"></span>
                    <span class="ml-1" x-text="knowledgeSelectedNode.type"></span>
                  </div>
                  <label class="form-control">
                    <span class="label-text text-xs" x-text="t('knowledgeTitleLabel')"></span>
                    <input type="text" class="input input-bordered input-sm" x-model="knowledgeSelectedNode.title" @change="saveKnowledge()" />
                  </label>
                  <template x-if="knowledgeSelectedNode.type === 'file'">
                    <label class="form-control">
                      <span class="label-text text-xs" x-text="t('knowledgeTagsLabel')"></span>
                      <input type="text" class="input input-bordered input-sm" x-model="knowledgeSelectedTagsText" @change="saveKnowledge()" />

                  </template>
                  <div class="rounded-box border border-base-300 bg-base-200/60 p-2 text-xs space-y-2">

                      <span x-text="knowledgeEffectivePermissionText"></span>

                    <label class="label cursor-pointer justify-start gap-2 py-0.5">
                      <input type="checkbox" class="toggle toggle-xs" :checked="knowledgeSelectedHasPermissionOverride" @change="setKnowledgePermissionOverride($event.target.checked)" />

                      </div>
                      <div class="flex items-center justify-between gap-2">
                        <span class="badge badge-xs" :class="isDirty ? 'badge-warning' : 'badge-success'" x-text="isDirty ? t('knowledgeUnsaved') : t('knowledgeSaved')"></span>

                      <div class="grid gap-2" :class="mode === 'split' ? 'md:grid-cols-2' : 'grid-cols-1'">

                        </div>
                      </div>
                    </div>
                  </template>
                </div>
              </template>
              <template x-if="!knowledgeSelectedNode">

              </template>
            </section>
          </div>
        </div>
      </section>

            settingsDescription: 'Այստեղ ավելացրեք ծրագրի կարգավորումները և նախընտրությունները։',

        t(key) {
          const dict = this.i18n[this.language] || this.i18n.hy;
          return dict[key] || this.i18n.hy[key] || this.i18n.en[key] || key;
        },

        get isKnowledgeDesktop() {
          return this.knowledgeDesktop;
        },

        get knowledgeNodesById() {
          const map = new Map();
          for (const node of this.knowledgeState.tree) {
            map.set(node.id, node);
          }
          return map;
        },

        get knowledgeChildrenMap() {
          const map = new Map();
          for (const node of this.knowledgeState.tree) {
            const key = node.parentId || '__root__';
            if (!map.has(key)) map.set(key, []);
            map.get(key).push(node);
          }
          for (const children of map.values()) {
            children.sort((left, right) => {
              if ((left.order || 0) !== (right.order || 0)) return (left.order || 0) - (right.order || 0);
              return String(left.title || '').localeCompare(String(right.title || ''));
            });
          }
          return map;
        },

        get knowledgeVisibleRoots() {
          const roots = this.knowledgeChildrenMap.get('__root__') || [];
          if (!this.knowledgeSearch) return roots;
          const query = this.knowledgeSearch.toLowerCase();
          return roots.filter((node) => String(node.title || '').toLowerCase().includes(query));
        },

        get knowledgeTreeRows() {
          const rows = [];
          const query = this.knowledgeSearch ? this.knowledgeSearch.toLowerCase() : '';
          const visit = (parentId, level) => {
            const key = parentId || '__root__';
            const children = this.knowledgeChildrenMap.get(key) || [];
            for (const child of children) {
              const matches = !query || String(child.title || '').toLowerCase().includes(query);
              if (matches) {
                rows.push({ node: child, level });
              }
              if (child.type === 'path' && !child.collapsed) {
                visit(child.id, level + 1);
              }
            }
          };
          visit(null, 0);
          return rows;
        },

        get knowledgeSelectedRowIndex() {
          const id = this.knowledgeState.uiState.selectedNodeId;
          if (!id) return -1;
          return this.knowledgeTreeRows.findIndex((row) => row.node.id === id);
        },

        get knowledgeSelectedNode() {
          if (!this.knowledgeState.uiState.selectedNodeId) return null;
          return this.knowledgeNodesById.get(this.knowledgeState.uiState.selectedNodeId) || null;
        },

        get knowledgeSelectedFileId() {
          const selected = this.knowledgeSelectedNode;
          if (!selected || selected.type !== 'file') return '';
          return selected.id;
        },

        get knowledgeSelectedChildren() {
          const selected = this.knowledgeSelectedNode;
          if (!selected || selected.type !== 'path') return [];
          const children = this.knowledgeChildrenMap.get(selected.id) || [];
          if (!this.knowledgeSearch) return children;
          const query = this.knowledgeSearch.toLowerCase();
          return children.filter((node) => String(node.title || '').toLowerCase().includes(query));
        },

        knowledgeHash(value) {
          const text = String(value || '');
          let out = 2166136261;
          for (let i = 0; i < text.length; i += 1) {
            out ^= text.charCodeAt(i);
            out = Math.imul(out, 16777619);
          }
          return out >>> 0;
        },

        get knowledgeOrbitPerformanceProfile() {
          const totalNodes = Array.isArray(this.knowledgeState?.tree) ? this.knowledgeState.tree.length : 0;
          let tier = this.knowledgeOrbitQualityMode;
          if (!['high', 'medium', 'low'].includes(tier)) {
            if (totalNodes <= 70) tier = 'high';
            else if (totalNodes <= 150) tier = 'medium';
            else tier = 'low';
          }
          if (tier === 'high') {
            return {
              tier,
              maxDepth: 8,
              maxNodes: 240,
              showGuides: true,
              motionScale: 1,
              labelStride: 1,
              cullMargin: 140,
              updateIntervalFrames: 1,
            };
          }
          if (tier === 'medium') {
            return {
              tier,
              maxDepth: 7,
              maxNodes: 160,
              showGuides: true,
              motionScale: 0.82,
              labelStride: 2,
              cullMargin: 100,
              updateIntervalFrames: 2,
            };
          }
          return {
            tier: 'low',
            maxDepth: 6,
            maxNodes: 96,
            showGuides: false,
            motionScale: 0.62,
            labelStride: 4,
            cullMargin: 84,
            updateIntervalFrames: 4,
          };
        },

        get knowledgeOrbitThemeTokens() {
          const tone = this.knowledgeThemeTone === 'light' ? 'light' : 'dark';
          if (tone === 'light') {
            return {
              pathFill: 'var(--knowledge-orbit-path-fill)',
              fileFill: 'var(--knowledge-orbit-file-fill)',
              haloColor: 'var(--knowledge-orbit-halo)',
              haloBaseOpacity: 0.16,
            };
          }
          return {
            pathFill: 'var(--knowledge-orbit-path-fill)',
            fileFill: 'var(--knowledge-orbit-file-fill)',
            haloColor: 'var(--knowledge-orbit-halo)',
            haloBaseOpacity: 0.22,
          };
        },

        get knowledgeOrbitCanvasStyle() {
          const centerX = Number.isFinite(this.knowledgeOrbitViewCenterX) ? this.knowledgeOrbitViewCenterX : 320;
          const centerY = Number.isFinite(this.knowledgeOrbitViewCenterY) ? this.knowledgeOrbitViewCenterY : 210;
          const driftX = ((centerX - 320) / 320) * 6;
          const driftY = ((centerY - 210) / 210) * 5;
          const layerA = `${30 + driftX}% ${16 + driftY}%`;
          const layerB = `${78 - driftX}% ${84 - driftY}%`;
          return `background-position: ${layerA}, ${layerB}, center`;
        },

        get knowledgeOrbitLayout() {
          const nodesById = this.knowledgeNodesById;
          const childrenMap = this.knowledgeChildrenMap;
          const root = nodesById.get('path-life') || this.knowledgeVisibleRoots[0] || null;
          if (!root) {
            return { nodes: [], links: [], guides: [] };
          }

          const canvasWidth = 640;
          const canvasHeight = 420;
          const centerX = canvasWidth / 2;
          const centerY = canvasHeight / 2;
          const compactDepthStart = 5;
          const profile = this.knowledgeOrbitPerformanceProfile;
          const themeTokens = this.knowledgeOrbitThemeTokens;
          const maxDepth = profile.maxDepth;
          const maxNodes = profile.maxNodes;
          const motionScale = profile.motionScale;
          const clockSec = Number.isFinite(this.knowledgeOrbitClockSec) ? this.knowledgeOrbitClockSec : 0;
          const nodes = [];
          const links = [];
          const guides = [];
          const orbitMetaById = new Map();
          const visited = new Set();

          const safePushNode = (node, x, y, depth) => {
            if (nodes.length >= maxNodes) return;
            const childNodes = childrenMap.get(node.id) || [];
            const pathCount = childNodes.filter((child) => child.type === 'path').length;
            const fileCount = childNodes.filter((child) => child.type === 'file').length;
            const baseSize = node.type === 'path' ? 7.5 : 4.8;
            const sizeBoost = node.type === 'path'
              ? Math.min(8, pathCount * 1.2 + fileCount * 0.45)
              : 0;
            const inherited = !node.permissions || node.permissions.inherit !== false;
            const effective = this.resolveKnowledgePermissions(node.id);
            const ringClass = effective.admin
              ? 'var(--fallback-p, #4f46e5)'
              : (effective.write ? 'var(--fallback-s, #ec4899)' : 'var(--fallback-a, #22c55e)');
            nodes.push({
              id: node.id,
              title: node.title,
              type: node.type,
              x,
              y,
              size: node.id === root.id ? 17 : (baseSize + sizeBoost),
              depth,
              orbitRadius: 0,
              orbitSpeed: 0,
              orbitPhase: 0,
              fill: node.type === 'path'
                ? themeTokens.pathFill
                : themeTokens.fileFill,
              haloColor: themeTokens.haloColor,
              haloOpacity: node.id === root.id ? themeTokens.haloBaseOpacity * 1.4 : themeTokens.haloBaseOpacity,
              permissionRingColor: ringClass,
              permissionRingOpacity: inherited ? 0.28 : 0.82,
              permissionRingWidth: inherited ? 0.8 : 1.5,
            });
          };

          const estimateNodeVisualSize = (node) => {
            const childNodes = childrenMap.get(node.id) || [];
            const pathCount = childNodes.filter((child) => child.type === 'path').length;
            const fileCount = childNodes.filter((child) => child.type === 'file').length;
            const baseSize = node.type === 'path' ? 7.5 : 4.8;
            const sizeBoost = node.type === 'path'
              ? Math.min(8, pathCount * 1.2 + fileCount * 0.45)
              : 0;
            return baseSize + sizeBoost;
          };

          const resolveSiblingOrbitPlacements = ({
            parentNodeId,
            children,
            parentX,
            parentY,
            baseRadius,
            baseSpeed,
            phaseBase,
            bandStep,
            maxPerBand,
            gapPad,
            spinDirection,
            kind,
          }) => {
            const placements = [];
            if (!Array.isArray(children) || children.length === 0) return placements;

            const safeBandSize = Math.max(1, maxPerBand);
            const bandCount = Math.ceil(children.length / safeBandSize);
            for (let bandIndex = 0; bandIndex < bandCount; bandIndex += 1) {
              const start = bandIndex * safeBandSize;
              const bandChildren = children.slice(start, start + safeBandSize);
              if (!bandChildren.length) continue;

              const bandSizes = bandChildren.map((child) => estimateNodeVisualSize(child));
              const packedArcLength = bandSizes.reduce((sum, size) => sum + (size * 2 + gapPad), 0);
              const bandBaseRadius = baseRadius + (bandStep * bandIndex);
              const minRadiusForArcFit = packedArcLength / (Math.PI * 2);
              const orbitRadius = Math.max(bandBaseRadius, minRadiusForArcFit);
              const bandDirection = bandIndex % 2 === 0 ? spinDirection : -spinDirection;
              const speedDamping = 1 - Math.min(0.35, bandIndex * 0.12);
              const orbitSpeed = baseSpeed * speedDamping * bandDirection * motionScale;
              const bandPhaseJitter = ((this.knowledgeHash(`${parentNodeId}:${kind}:${bandIndex}`) & 1023) / 1023) * 0.34;
              let cursor = phaseBase + (bandIndex * 0.63) + bandPhaseJitter + (clockSec * orbitSpeed);

              for (let i = 0; i < bandChildren.length; i += 1) {
                const child = bandChildren[i];
                const childArc = (bandSizes[i] * 2) + gapPad;
                const deltaAngle = childArc / Math.max(1, orbitRadius);
                cursor += deltaAngle * 0.5;
                const phase = cursor;
                const childX = parentX + Math.cos(phase) * orbitRadius;
                const childY = parentY + Math.sin(phase) * orbitRadius;
                placements.push({
                  child,
                  x: childX,
                  y: childY,
                  phase,
                  orbitRadius,
                  orbitSpeed,
                  bandIndex,
                });
                cursor += deltaAngle * 0.5;
              }
            }

            return placements;
          };

          const placeTree = (node, x, y, depth) => {
            if (!node || visited.has(node.id) || depth > maxDepth || nodes.length >= maxNodes) return;
            visited.add(node.id);
            safePushNode(node, x, y, depth);

            const children = childrenMap.get(node.id) || [];
            const pathChildren = children.filter((child) => child.type === 'path');
            const fileChildren = children.filter((child) => child.type === 'file');
            const compactScale = depth >= compactDepthStart ? 0.72 : 1;
            const pathOrbitRadius = Math.max(26, (58 + (depth * 10)) * compactScale);
            const fileOrbitRadius = Math.max(14, pathOrbitRadius * 0.46);
            const phaseBase = (this.knowledgeHash(node.id) / 4294967295) * Math.PI * 2;
            const pathOrbitSpeed = Math.min(0.24, 0.04 + (depth * 0.018));
            const fileOrbitSpeed = Math.min(0.3, pathOrbitSpeed * 1.3);
            const pathPlacements = resolveSiblingOrbitPlacements({
              parentNodeId: node.id,
              children: pathChildren,
              parentX: x,
              parentY: y,
              baseRadius: pathOrbitRadius,
              baseSpeed: pathOrbitSpeed,
              phaseBase,
              bandStep: Math.max(20, 16 * compactScale),
              maxPerBand: depth >= compactDepthStart ? 6 : 8,
              gapPad: 15,
              spinDirection: 1,
              kind: 'path',
            });

            const filePlacements = resolveSiblingOrbitPlacements({
              parentNodeId: node.id,
              children: fileChildren,
              parentX: x,
              parentY: y,
              baseRadius: fileOrbitRadius,
              baseSpeed: fileOrbitSpeed,
              phaseBase: phaseBase + Math.PI * 0.35,
              bandStep: Math.max(12, 10 * compactScale),
              maxPerBand: depth >= compactDepthStart ? 10 : 14,
              gapPad: 10,
              spinDirection: -1,
              kind: 'file',
            });

            if (profile.showGuides) {
              const pathGuideRadii = new Set(pathPlacements.map((placement) => Math.round(placement.orbitRadius * 1000)));
              pathGuideRadii.forEach((radiusInt) => {
                guides.push({
                  id: `${node.id}-path-guide-${radiusInt}`,
                  cx: x,
                  cy: y,
                  r: radiusInt / 1000,
                });
              });
              const fileGuideRadii = new Set(filePlacements.map((placement) => Math.round(placement.orbitRadius * 1000)));
              fileGuideRadii.forEach((radiusInt) => {
                guides.push({
                  id: `${node.id}-file-guide-${radiusInt}`,
                  cx: x,
                  cy: y,
                  r: radiusInt / 1000,
                });
              });
            }

            for (let i = 0; i < pathPlacements.length; i += 1) {
              const placement = pathPlacements[i];
              links.push({
                id: `${node.id}->${placement.child.id}`,
                x1: x,
                y1: y,
                x2: placement.x,
                y2: placement.y,
              });
              orbitMetaById.set(placement.child.id, {
                orbitRadius: placement.orbitRadius,
                orbitSpeed: placement.orbitSpeed,
                orbitPhase: placement.phase,
              });
              placeTree(placement.child, placement.x, placement.y, depth + 1);
            }

            for (let i = 0; i < filePlacements.length; i += 1) {
              const placement = filePlacements[i];
              links.push({
                id: `${node.id}->${placement.child.id}`,
                x1: x,
                y1: y,
                x2: placement.x,
                y2: placement.y,
              });
              orbitMetaById.set(placement.child.id, {
                orbitRadius: placement.orbitRadius,
                orbitSpeed: placement.orbitSpeed,
                orbitPhase: placement.phase,
              });
              safePushNode(placement.child, placement.x, placement.y, depth + 1);
            }
          };

          placeTree(root, centerX, centerY, 0);
          nodes.forEach((node) => {
            const meta = orbitMetaById.get(node.id);
            if (!meta) return;
            node.orbitRadius = meta.orbitRadius;
            node.orbitSpeed = meta.orbitSpeed;
            node.orbitPhase = meta.orbitPhase;
          });

          return { nodes, links, guides };
        },

        get knowledgeOrbitViewport() {
          const zoom = Number.isFinite(this.knowledgeOrbitZoom) ? this.knowledgeOrbitZoom : 1;
          const centerX = Number.isFinite(this.knowledgeOrbitViewCenterX) ? this.knowledgeOrbitViewCenterX : 320;
          const centerY = Number.isFinite(this.knowledgeOrbitViewCenterY) ? this.knowledgeOrbitViewCenterY : 210;
          return { zoom, centerX, centerY };
        },

        get knowledgeLabelNodeIds() {
          const selected = this.knowledgeSelectedNode;
          if (!selected) return new Set(['path-life']);
          const focus = new Set(this.knowledgeBreadcrumbNodes.map((node) => node.id));
          const children = this.knowledgeChildrenMap.get(selected.id) || [];
          for (const child of children) {
            focus.add(child.id);
          }
          focus.add('path-life');
          return focus;
        },

        get knowledgeOrbitNodes() {
          return this.knowledgeOrbitRenderState.nodes;
        },

        get knowledgeOrbitLinks() {
          return this.knowledgeOrbitRenderState.links;
        },

        get knowledgeOrbitGuides() {
          return this.knowledgeOrbitRenderState.guides;
        },

        get knowledgeOrbitRenderState() {
          const layout = this.knowledgeOrbitLayout;
          const labels = this.knowledgeLabelNodeIds;
          const viewport = this.knowledgeOrbitViewport;
          const profile = this.knowledgeOrbitPerformanceProfile;
          const screenCenterX = 320;
          const screenCenterY = 210;
          const cullMargin = profile.cullMargin;
          const width = 640;
          const height = 420;
          const stride = Math.max(1, profile.labelStride);
          const targetNodes = layout.nodes
            .map((node) => {
              const x = ((node.x - viewport.centerX) * viewport.zoom) + screenCenterX;
              const y = ((node.y - viewport.centerY) * viewport.zoom) + screenCenterY;
              const size = node.size * viewport.zoom;
              const inBounds = x >= -cullMargin
                && x <= width + cullMargin
                && y >= -cullMargin
                && y <= height + cullMargin;
              const keep = inBounds
                || node.id === this.knowledgeOrbitLockNodeId
                || node.id === this.knowledgeState.uiState.selectedNodeId;
              if (!keep) return null;
              const bucket = this.knowledgeHash(node.id) % stride;
              const showLabel = labels.has(node.id)
                && (node.depth <= 3 || viewport.zoom >= 1.08 || this.knowledgeOrbitLockNodeId === node.id)
                && bucket === 0;
              return {
                ...node,
                x,
                y,
                size,
                haloOpacity: Math.min(0.34, (node.haloOpacity || 0.2) * Math.max(0.72, Math.min(1.2, viewport.zoom))),
                showLabel,
              };
            })
            .filter(Boolean);

          const morphStore = this.knowledgeOrbitMorphById && typeof this.knowledgeOrbitMorphById === 'object'
            ? this.knowledgeOrbitMorphById
            : {};
          const smoothing = this.knowledgeOrbitRelayoutBoostFrames > 0 ? 0.26 : 0.14;
          const nextMorphStore = {};
          const renderedNodes = targetNodes.map((node) => {
            const previous = morphStore[node.id];
            if (!previous) {
              const seeded = { x: node.x, y: node.y, size: node.size };
              nextMorphStore[node.id] = seeded;
              return node;
            }
            const morphed = {
              x: previous.x + ((node.x - previous.x) * smoothing),
              y: previous.y + ((node.y - previous.y) * smoothing),
              size: previous.size + ((node.size - previous.size) * smoothing),
            };
            nextMorphStore[node.id] = morphed;
            return {
              ...node,
              x: morphed.x,
              y: morphed.y,
              size: morphed.size,
            };
          });
          this.knowledgeOrbitMorphById = nextMorphStore;

          const renderedNodeById = new Map(renderedNodes.map((node) => [node.id, node]));
          const minX = -cullMargin;
          const maxX = 640 + cullMargin;
          const minY = -cullMargin;
          const maxY = 420 + cullMargin;
          const renderedLinks = layout.links
            .map((link) => {
              const transformed = {
                ...link,
                x1: ((link.x1 - viewport.centerX) * viewport.zoom) + screenCenterX,
                y1: ((link.y1 - viewport.centerY) * viewport.zoom) + screenCenterY,
                x2: ((link.x2 - viewport.centerX) * viewport.zoom) + screenCenterX,
                y2: ((link.y2 - viewport.centerY) * viewport.zoom) + screenCenterY,
              };
              const sourceId = String(link.id || '').split('->')[0] || '';
              const targetId = String(link.id || '').split('->')[1] || '';
              const sourceNode = renderedNodeById.get(sourceId);
              const targetNode = renderedNodeById.get(targetId);
              if (!sourceNode || !targetNode) return transformed;
              return {
                ...transformed,
                x1: sourceNode.x,
                y1: sourceNode.y,
                x2: targetNode.x,
                y2: targetNode.y,
              };
            })
            .filter((link) => {
              const linkMinX = Math.min(link.x1, link.x2);
              const linkMaxX = Math.max(link.x1, link.x2);
              const linkMinY = Math.min(link.y1, link.y2);
              const linkMaxY = Math.max(link.y1, link.y2);
              return !(linkMaxX < minX || linkMinX > maxX || linkMaxY < minY || linkMinY > maxY);
            });

          const renderedGuides = layout.guides
            .map((guide) => ({
              ...guide,
              cx: ((guide.cx - viewport.centerX) * viewport.zoom) + screenCenterX,
              cy: ((guide.cy - viewport.centerY) * viewport.zoom) + screenCenterY,
              r: guide.r * viewport.zoom,
            }))
            .filter((guide) => {
              const minX = guide.cx - guide.r;
              const maxX = guide.cx + guide.r;
              const minY = guide.cy - guide.r;
              const maxY = guide.cy + guide.r;
              return !(maxX < -cullMargin || minX > 640 + cullMargin || maxY < -cullMargin || minY > 420 + cullMargin);
            });

          return {
            nodes: renderedNodes,
            links: renderedLinks,
            guides: renderedGuides,
          };
        },

        get knowledgeBreadcrumbNodes() {
          const selected = this.knowledgeSelectedNode;
          if (!selected) return [];
          const chain = [];
          let cursor = selected;
          let guard = 0;
          while (cursor && guard < 40) {
            chain.push(cursor);
            cursor = cursor.parentId ? this.knowledgeNodesById.get(cursor.parentId) : null;
            guard += 1;
          }
          return chain.reverse();
        },

        get knowledgeBreadcrumbText() {
          const chain = this.knowledgeBreadcrumbNodes;
          if (!chain.length) return '-';
          return chain.map((node) => node.title).join(' > ');
        },

        get knowledgeEffectivePermissions() {
          const selected = this.knowledgeSelectedNode;
          if (!selected) return { read: false, write: false, admin: false };
          return this.resolveKnowledgePermissions(selected.id);
        },

        get knowledgeEffectivePermissionText() {
          const effective = this.knowledgeEffectivePermissions;
          const tokens = [];
          if (effective.read) tokens.push('R');
          if (effective.write) tokens.push('W');
          if (effective.admin) tokens.push('A');
          return tokens.length ? tokens.join('/') : 'None';
        },

        get knowledgeSelectedMarkdown() {
          const fileId = this.knowledgeSelectedFileId;
          if (!fileId) return '';
          if (typeof this.knowledgeDrafts[fileId] === 'string') {
            return this.knowledgeDrafts[fileId];
          }
          const value = this.knowledgeState.files[fileId];
          return typeof value === 'string' ? value : '';
        },

        set knowledgeSelectedMarkdown(value) {
          const fileId = this.knowledgeSelectedFileId;
          if (!fileId) return;
          this.knowledgeDrafts[fileId] = String(value || '');
        },

        get knowledgeSelectedTagsText() {
          const selected = this.knowledgeSelectedNode;
          if (!selected || selected.type !== 'file') return '';
          const tags = Array.isArray(selected.tags) ? selected.tags : [];
          return tags.join(', ');
        },

        set knowledgeSelectedTagsText(value) {
          const selected = this.knowledgeSelectedNode;
          if (!selected || selected.type !== 'file') return;
          const tags = String(value || '')
            .split(',')
            .map((item) => item.trim())
            .filter(Boolean);
          selected.tags = Array.from(new Set(tags));
        },

        get knowledgeSelectedHasPermissionOverride() {
          const selected = this.knowledgeSelectedNode;
          if (!selected) return false;
          return selected.permissions?.inherit === false;
        },

        get knowledgeSelectedPermissionsModel() {
          const selected = this.knowledgeSelectedNode;
          if (!selected) return { read: false, write: false, admin: false };
          const effective = this.resolveKnowledgePermissions(selected.id);
          if (selected.permissions?.inherit === false) {
            return {
              read: Boolean(selected.permissions.read),
              write: Boolean(selected.permissions.write),
              admin: Boolean(selected.permissions.admin),
            };
          }
          return effective;
        },

        get knowledgeIsSelectedFileDirty() {
          const fileId = this.knowledgeSelectedFileId;
          if (!fileId) return false;
          const stored = typeof this.knowledgeState.files[fileId] === 'string' ? this.knowledgeState.files[fileId] : '';
          const draft = typeof this.knowledgeDrafts[fileId] === 'string' ? this.knowledgeDrafts[fileId] : stored;
          return draft !== stored;
        },

        get geerSourceLabel() {
          return this.geerSource === 'greech' ? this.t('sourceGreech') : this.t('sourceCustom');

        bootstrapKnowledgeLocalState() {
          this.loadKnowledgeState();
          this.loadKnowledgeDrafts();
          for (const fileId of Object.keys(this.knowledgeDrafts)) {
            if (!this.knowledgeNodesById.has(fileId)) {
              delete this.knowledgeDrafts[fileId];
            }
          }
          this.persistKnowledgeDrafts();
          if (!this.knowledgeState.uiState.selectedNodeId && this.knowledgeVisibleRoots[0]) {
            this.knowledgeState.uiState.selectedNodeId = this.knowledgeVisibleRoots[0].id;
          }
          if (!this.knowledgeState.uiState.activeTheme) {
            this.knowledgeState.uiState.activeTheme = document.documentElement.getAttribute('data-theme') || 'black';
          }
          this.applyKnowledgeTheme();
          this.syncKnowledgeStores();
        },

        migrateKnowledgePayload(parsed) {
          if (!parsed || typeof parsed !== 'object') return this.defaultKnowledgeSeed();
          const sourceVersion = Number(parsed.schemaVersion) || 0;
          if (sourceVersion === this.knowledgeSchemaVersion) return parsed;
          // Migration hook for future schema updates.
          if (sourceVersion > 0 && sourceVersion < this.knowledgeSchemaVersion) {
            return {
              ...this.defaultKnowledgeSeed(),
              tree: Array.isArray(parsed.tree) ? parsed.tree : this.defaultKnowledgeSeed().tree,
              files: parsed.files && typeof parsed.files === 'object' ? parsed.files : {},
              uiState: parsed.uiState && typeof parsed.uiState === 'object'
                ? {
                  ...this.defaultKnowledgeSeed().uiState,
                  ...parsed.uiState,
                }
                : this.defaultKnowledgeSeed().uiState,
            };
          }
          return this.defaultKnowledgeSeed();
        },

        loadKnowledgeState() {
          try {
            const raw = localStorage.getItem(this.knowledgeStorageKey);
            if (!raw) {
              this.knowledgeState = this.defaultKnowledgeSeed();
              this.saveKnowledge();
              return;
            }
            const parsed = this.migrateKnowledgePayload(JSON.parse(raw));
            this.knowledgeState = {
              tree: Array.isArray(parsed.tree)
                ? parsed.tree.map((node) => ({
                  ...node,
                  tags: Array.isArray(node?.tags) ? node.tags.filter((tag) => typeof tag === 'string') : [],
                  permissions: node?.permissions && typeof node.permissions === 'object'
                    ? node.permissions
                    : { inherit: true },
                }))
                : [],
              files: parsed.files && typeof parsed.files === 'object' ? parsed.files : {},
              uiState: {
                selectedNodeId: typeof parsed.uiState?.selectedNodeId === 'string' ? parsed.uiState.selectedNodeId : '',
                openPanels: parsed.uiState?.openPanels || { tree: true, canvas: true, editor: true },
                activeTheme: typeof parsed.uiState?.activeTheme === 'string' ? parsed.uiState.activeTheme : 'black',
              },
            };
            this.saveKnowledge();
          } catch {
            this.knowledgeState = this.defaultKnowledgeSeed();
            this.saveKnowledge();
          }
        },

        saveKnowledge() {
          const payload = {
            schemaVersion: this.knowledgeSchemaVersion,
            tree: this.knowledgeState.tree,
            files: this.knowledgeState.files,
            uiState: this.knowledgeState.uiState,
          };
          localStorage.setItem(this.knowledgeStorageKey, JSON.stringify(payload));
          this.knowledgeLastSavedAtIso = new Date().toISOString();
          this.syncKnowledgeStores();
        },

        loadKnowledgeDrafts() {
          try {
            const raw = localStorage.getItem(this.knowledgeDraftStorageKey);
            if (!raw) {
              this.knowledgeDrafts = {};
              return;
            }
            const parsed = JSON.parse(raw);
            if (!parsed || typeof parsed !== 'object') {
              this.knowledgeDrafts = {};
              return;
            }
            this.knowledgeDrafts = Object.fromEntries(
              Object.entries(parsed).filter(([, value]) => typeof value === 'string'),
            );
          } catch {
            this.knowledgeDrafts = {};
          }
        },

        persistKnowledgeDrafts() {
          localStorage.setItem(this.knowledgeDraftStorageKey, JSON.stringify(this.knowledgeDrafts));
          this.syncKnowledgeStores();
        },

        ensureKnowledgeStores() {
          if (typeof Alpine === 'undefined' || typeof Alpine.store !== 'function') return;
          if (!Alpine.store('treeStore')) {
            Alpine.store('treeStore', {
              tree: [],
              selectedNodeId: '',
              draggingNodeId: '',
            });
          }
          if (!Alpine.store('editorStore')) {
            Alpine.store('editorStore', {
              selectedFileId: '',
              mode: 'split',
              isDirty: false,
              lastSavedAt: '',
            });
          }
          if (!Alpine.store('uiStore')) {
            Alpine.store('uiStore', {
              theme: 'black',
              mobileTab: 'tree',
              search: '',
              error: '',
            });
          }
        },

        syncKnowledgeStores() {
          if (typeof Alpine === 'undefined' || typeof Alpine.store !== 'function') return;
          this.ensureKnowledgeStores();
          const treeStore = Alpine.store('treeStore');
          const editorStore = Alpine.store('editorStore');
          const uiStore = Alpine.store('uiStore');
          if (treeStore) {
            treeStore.tree = this.knowledgeState.tree;
            treeStore.selectedNodeId = this.knowledgeState.uiState.selectedNodeId;
            treeStore.draggingNodeId = this.knowledgeDragState.draggingNodeId;
          }
          if (editorStore) {
            editorStore.selectedFileId = this.knowledgeSelectedFileId;
            editorStore.mode = this.knowledgeEditorMode;
            editorStore.isDirty = this.knowledgeIsSelectedFileDirty;
            editorStore.lastSavedAt = this.knowledgeLastSavedAtIso;
          }
          if (uiStore) {
            uiStore.theme = this.knowledgeState.uiState.activeTheme;
            uiStore.mobileTab = this.knowledgeMobileTab;
            uiStore.search = this.knowledgeSearch;
            uiStore.error = this.error;
          }
        },

        emitKnowledgeEvent(name, detail) {
          try {
            window.dispatchEvent(new CustomEvent(name, {
              detail: {
                ...(detail || {}),
                atMs: Date.now(),
              },
            }));
          } catch {
