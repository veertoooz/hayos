          }
        },

        pushKnowledgeToast(message, type) {
          const text = String(message || '').trim();
          if (!text) return;
          const toastType = type === 'success' ? 'success' : (type === 'info' ? 'info' : 'error');
          const id = `toast-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
          this.knowledgeToasts.push({ id, text, type: toastType });
          window.setTimeout(() => {
            this.knowledgeToasts = this.knowledgeToasts.filter((item) => item.id !== id);
          }, 2600);
        },

        runKnowledgeQaSuite() {
          const checks = [];
          const addCheck = (name, ok, details) => {
            checks.push({ name, ok, details: details || '' });
          };

          const tree = Array.isArray(this.knowledgeState.tree) ? this.knowledgeState.tree : [];
          const ids = new Set();
          let duplicateId = '';
          for (const node of tree) {
            if (ids.has(node.id)) {
              duplicateId = node.id;
              break;
            }
            ids.add(node.id);
          }
          addCheck('unique_ids', !duplicateId, duplicateId ? `duplicate: ${duplicateId}` : '');

          const missingParentNode = tree.find((node) => node.parentId && !ids.has(node.parentId)) || null;
          addCheck('parent_exists', !missingParentNode, missingParentNode ? `node: ${missingParentNode.id}` : '');

          const cycleCheck = (() => {
            for (const node of tree) {
              const seen = new Set([node.id]);
              let cursor = node;
              let guard = 0;
              while (cursor.parentId && guard < 80) {
                if (seen.has(cursor.parentId)) {
                  return { ok: false, nodeId: node.id };
                }
                seen.add(cursor.parentId);
                cursor = tree.find((item) => item.id === cursor.parentId) || { parentId: null };
                guard += 1;
              }
            }
            return { ok: true, nodeId: '' };
          })();
          addCheck('acyclic_tree', cycleCheck.ok, cycleCheck.ok ? '' : `node: ${cycleCheck.nodeId}`);

          const byParent = new Map();
          for (const node of tree) {
            const key = node.parentId || '__root__';
            if (!byParent.has(key)) byParent.set(key, []);
            byParent.get(key).push(node);
          }
          let orderIssue = '';
          for (const [parentId, siblings] of byParent.entries()) {
            const orders = siblings.map((node) => Number(node.order || 0)).sort((a, b) => a - b);
            const contiguous = orders.every((value, index) => value === index);
            if (!contiguous) {
              orderIssue = `parent=${parentId} orders=${orders.join(',')}`;
              break;
            }
          }
          addCheck('sibling_order_contiguous', !orderIssue, orderIssue);

          const fileNodes = tree.filter((node) => node.type === 'file');
          const missingContent = fileNodes.find((node) => typeof this.knowledgeState.files[node.id] !== 'string') || null;
          addCheck('file_content_binding', !missingContent, missingContent ? `file: ${missingContent.id}` : '');

          const migrated = this.migrateKnowledgePayload({
            schemaVersion: this.knowledgeSchemaVersion - 1,
            tree: this.knowledgeState.tree,
            files: this.knowledgeState.files,
            uiState: this.knowledgeState.uiState,
          });
          const migrationOk = migrated && Array.isArray(migrated.tree);
          addCheck('migration_hook', Boolean(migrationOk), migrationOk ? '' : 'migrate returned invalid payload');

          const failed = checks.filter((item) => !item.ok);
          const ok = failed.length === 0;
          this.debugText = JSON.stringify({
            kind: 'knowledge.qa.report',
            ok,
            generatedAt: new Date().toISOString(),
            checks,
          }, null, 2);
          this.pushKnowledgeToast(ok ? this.t('knowledgeQaPassed') : this.t('knowledgeQaFailed'), ok ? 'success' : 'error');
        },

        handleKnowledgeKeyboardShortcuts(event) {
          const selected = this.knowledgeSelectedNode;
          if (!selected) return;
          const isSave = (event.metaKey || event.ctrlKey) && String(event.key || '').toLowerCase() === 's';
          if (isSave) {
            event.preventDefault();
            if (this.knowledgeSelectedFileId) {
              this.saveKnowledgeSelectedFileNow();
              this.pushKnowledgeToast(this.t('knowledgeSaved'), 'success');
            } else {
              this.saveKnowledge();
              this.pushKnowledgeToast(this.t('knowledgeSaved'), 'success');
            }
            return;
          }
          const isDelete = !event.metaKey && !event.ctrlKey && !event.altKey && (event.key === 'Delete' || event.key === 'Backspace');
          if (isDelete && selected.id !== 'path-life') {
            event.preventDefault();
            this.deleteKnowledgeNode(selected.id);
          }
        },

        selectKnowledgeRowByOffset(offset) {
          const rows = this.knowledgeTreeRows;
          if (!rows.length) return;
          const currentIndex = this.knowledgeSelectedRowIndex;
          const safeCurrent = currentIndex < 0 ? 0 : currentIndex;
          const nextIndex = Math.max(0, Math.min(rows.length - 1, safeCurrent + offset));
          const next = rows[nextIndex];
          if (!next) return;
          this.selectKnowledgeNode(next.node.id);
        },

        scheduleKnowledgeSave() {
          if (this.knowledgeAutosaveTimer) {
            window.clearTimeout(this.knowledgeAutosaveTimer);
          }
          this.knowledgeAutosaveTimer = window.setTimeout(() => {
            this.saveKnowledge();
            this.knowledgeAutosaveTimer = null;
          }, 220);
        },

        scheduleKnowledgeDraftSave() {
          if (this.knowledgeDraftAutosaveTimer) {
            window.clearTimeout(this.knowledgeDraftAutosaveTimer);
          }
          this.knowledgeDraftAutosaveTimer = window.setTimeout(() => {
            this.persistKnowledgeDrafts();
            this.knowledgeDraftAutosaveTimer = null;
          }, 220);
        },

        resolveKnowledgePermissions(nodeId) {
          const chain = [];
          let cursor = this.knowledgeNodesById.get(nodeId) || null;
          let guard = 0;
          while (cursor && guard < 40) {
            chain.push(cursor);
            cursor = cursor.parentId ? this.knowledgeNodesById.get(cursor.parentId) : null;
            guard += 1;
          }
          const defaults = { read: true, write: false, admin: false };
          for (let i = chain.length - 1; i >= 0; i -= 1) {
            const permissions = chain[i].permissions || {};
            if (permissions.inherit !== false) continue;
            return {
              read: Boolean(permissions.read),
              write: Boolean(permissions.write),
              admin: Boolean(permissions.admin),
            };
          }
          return defaults;
        },

        selectKnowledgeNode(nodeId) {
          if (!this.knowledgeNodesById.has(nodeId)) return;
          this.knowledgeState.uiState.selectedNodeId = nodeId;
          this.knowledgeOrbitFocusNodeId = nodeId;
          if (!this.knowledgeOrbitLockNodeId) {
            this.knowledgeOrbitTargetZoom = 1.06;
          }
          this.saveKnowledge();
          this.emitKnowledgeEvent('node:selected', { nodeId });
        },

        setKnowledgeMobileTab(tabKey) {
          this.knowledgeMobileTab = ['tree', 'canvas', 'editor'].includes(tabKey) ? tabKey : 'tree';
          this.syncKnowledgeStores();
        },

        setKnowledgeEditorMode(mode) {
          this.knowledgeEditorMode = ['write', 'preview', 'split'].includes(mode) ? mode : 'split';
          this.syncKnowledgeStores();
        },

        isKnowledgeNodeSelected(nodeId) {
          return this.knowledgeState.uiState.selectedNodeId === nodeId;
        },

        permissionBadgeForNode(nodeId) {
          const effective = this.resolveKnowledgePermissions(nodeId);
          const tokens = [];
          if (effective.read) tokens.push('R');
          if (effective.write) tokens.push('W');
          if (effective.admin) tokens.push('A');
          return tokens.length ? tokens.join('/') : '-';
        },

        permissionBadgeClassForNode(nodeId) {
          const effective = this.resolveKnowledgePermissions(nodeId);
          if (effective.admin) return 'badge-primary';
          if (effective.write) return 'badge-secondary';
          if (effective.read) return 'badge-accent';
          return 'badge-ghost';
        },

        activateKnowledgeNode(nodeId) {
          const node = this.knowledgeNodesById.get(nodeId);
          if (!node) return;
          this.selectKnowledgeNode(nodeId);
          if (node.type === 'path') {
            node.collapsed = !node.collapsed;
            this.saveKnowledge();
            return;
          }
          this.setKnowledgeMobileTab('editor');
        },

        nextKnowledgeOrder(parentId) {
          const siblings = this.knowledgeState.tree.filter((node) => (node.parentId || null) === (parentId || null));
          return siblings.length;
        },

        sortedKnowledgeSiblings(parentId, excludedId) {
          return this.knowledgeState.tree
            .filter((node) => (node.parentId || null) === (parentId || null) && node.id !== excludedId)
            .sort((left, right) => (left.order || 0) - (right.order || 0));
        },

        reindexKnowledgeOrders(parentId) {
          const siblings = this.sortedKnowledgeSiblings(parentId, '');
          siblings.forEach((node, index) => {
            node.order = index;
          });
        },

        reorderKnowledgeWithinParent(nodeId, delta) {
          const node = this.knowledgeNodesById.get(nodeId);
          if (!node) return;
          const parentId = node.parentId || null;
          const siblings = this.sortedKnowledgeSiblings(parentId, '').sort((left, right) => (left.order || 0) - (right.order || 0));
          const index = siblings.findIndex((item) => item.id === nodeId);
          if (index < 0) return;
          const nextIndex = index + delta;
          if (nextIndex < 0 || nextIndex >= siblings.length) return;
          const [moved] = siblings.splice(index, 1);
          siblings.splice(nextIndex, 0, moved);
          siblings.forEach((item, orderIndex) => {
            item.order = orderIndex;
          });
          this.selectKnowledgeNode(nodeId);
          this.saveKnowledge();
          this.emitKnowledgeEvent('node:moved', {
            nodeId,
            mode: 'reorder',
            parentId: parentId || null,
            order: this.knowledgeNodesById.get(nodeId)?.order ?? 0,
          });
        },

        onKnowledgeDragStart(nodeId, event) {
          this.knowledgeDragState.draggingNodeId = nodeId;
          this.syncKnowledgeStores();
          if (event?.dataTransfer) {
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', nodeId);
          }
        },

        onKnowledgeDragEnd() {
          this.knowledgeDragState.draggingNodeId = '';
          this.knowledgeDropHint.nodeId = '';
          this.knowledgeDropHint.position = '';
          this.syncKnowledgeStores();
        },

        resolveKnowledgeDropPosition(overNodeId, event) {
          const overNode = this.knowledgeNodesById.get(overNodeId);
          if (!overNode) return 'after';
          const target = event?.currentTarget;
          if (!target || typeof target.getBoundingClientRect !== 'function') return 'after';
          const rect = target.getBoundingClientRect();
          const offsetY = event.clientY - rect.top;
          const ratio = rect.height > 0 ? (offsetY / rect.height) : 0.5;
          if (overNode.type === 'path' && ratio >= 0.33 && ratio <= 0.66) return 'inside';
          if (ratio < 0.5) return 'before';
          return 'after';
        },

        onKnowledgeDragOver(overNodeId, event) {
          if (!this.knowledgeDragState.draggingNodeId) return;
          const position = this.resolveKnowledgeDropPosition(overNodeId, event);
          this.knowledgeDropHint.nodeId = overNodeId;
          this.knowledgeDropHint.position = position;
          if (event?.dataTransfer) {
            event.dataTransfer.dropEffect = 'move';
          }
        },

        onKnowledgeDragLeave(overNodeId, event) {
          if (!this.knowledgeDropHint.nodeId) return;
          const related = event?.relatedTarget;
          if (related && event?.currentTarget && event.currentTarget.contains(related)) return;
          if (this.knowledgeDropHint.nodeId === overNodeId) {
            this.knowledgeDropHint.nodeId = '';
            this.knowledgeDropHint.position = '';
          }
        },

        onKnowledgeDrop(overNodeId, event) {
          const sourceId = this.knowledgeDragState.draggingNodeId
            || event?.dataTransfer?.getData('text/plain')
            || '';
          if (!sourceId) return;
          const position = this.knowledgeDropHint.nodeId === overNodeId && this.knowledgeDropHint.position
            ? this.knowledgeDropHint.position
            : this.resolveKnowledgeDropPosition(overNodeId, event);
          this.applyKnowledgeDrop(sourceId, overNodeId, position);
          this.onKnowledgeDragEnd();
        },

        applyKnowledgeDrop(sourceId, overNodeId, position) {
          const sourceNode = this.knowledgeNodesById.get(sourceId);
          const overNode = this.knowledgeNodesById.get(overNodeId);
          if (!sourceNode || !overNode) return;
          if (sourceId === overNodeId) return;

          let targetParentId = null;
          let targetIndex = 0;
          if (position === 'inside') {
            if (overNode.type !== 'path') return;
            targetParentId = overNode.id;
            targetIndex = this.sortedKnowledgeSiblings(targetParentId, sourceId).length;
          } else {
            targetParentId = overNode.parentId || null;
            const siblings = this.sortedKnowledgeSiblings(targetParentId, sourceId);
            const overIndex = siblings.findIndex((node) => node.id === overNode.id);
            if (overIndex < 0) return;
            targetIndex = position === 'before' ? overIndex : overIndex + 1;
          }

          if (targetParentId === sourceNode.id) {
            this.error = this.t('knowledgeErrorMoveInvalid');
            this.pushKnowledgeToast(this.error, 'error');
            return;
          }
          if (targetParentId && this.isKnowledgeDescendant(targetParentId, sourceNode.id)) {
            this.error = this.t('knowledgeErrorMoveInvalid');
            this.pushKnowledgeToast(this.error, 'error');
            return;
          }

          const oldParentId = sourceNode.parentId || null;
          sourceNode.parentId = targetParentId;
          const siblingsAfterMove = this.sortedKnowledgeSiblings(targetParentId, sourceId);
          const safeIndex = Math.max(0, Math.min(targetIndex, siblingsAfterMove.length));
          siblingsAfterMove.splice(safeIndex, 0, sourceNode);
          siblingsAfterMove.forEach((node, index) => {
            node.order = index;
          });
          if (oldParentId !== targetParentId) {
            this.reindexKnowledgeOrders(oldParentId);
          }
          this.selectKnowledgeNode(sourceId);
          this.saveKnowledge();
          this.emitKnowledgeEvent('node:moved', {
            nodeId: sourceId,
            mode: 'drag-drop',
            parentId: targetParentId || null,
            order: sourceNode.order,
          });
        },

        generateKnowledgeId(prefix) {
          return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
        },

        renameKnowledgeNode(nodeId) {
          const node = this.knowledgeNodesById.get(nodeId);
          if (!node) return;
          const nextTitle = (window.prompt(this.t('knowledgePromptRename'), node.title || '') || '').trim();
          if (!nextTitle) return;
          node.title = nextTitle;
          this.saveKnowledge();
        },

        deleteKnowledgeNode(nodeId) {
          if (nodeId === 'path-life') {
            this.error = this.t('knowledgeErrorDeleteRoot');
            this.pushKnowledgeToast(this.error, 'error');
            return;
          }
          if (!window.confirm(this.t('knowledgeDeleteConfirm'))) {
            return;
          }
          const node = this.knowledgeNodesById.get(nodeId);
          if (!node) return;
          const ids = new Set([nodeId]);
          let changed = true;
          while (changed) {
            changed = false;
            for (const item of this.knowledgeState.tree) {
              if (!ids.has(item.id) && item.parentId && ids.has(item.parentId)) {
                ids.add(item.id);
                changed = true;
              }
            }
          }
          this.knowledgeState.tree = this.knowledgeState.tree.filter((item) => !ids.has(item.id));
          for (const id of ids) {
            delete this.knowledgeState.files[id];
            delete this.knowledgeDrafts[id];
          }
          if (ids.has(this.knowledgeState.uiState.selectedNodeId)) {
            const fallback = this.knowledgeState.tree[0];
            this.knowledgeState.uiState.selectedNodeId = fallback ? fallback.id : '';
          }
          this.saveKnowledge();
          this.persistKnowledgeDrafts();
        },

        duplicateKnowledgeNode(nodeId) {
          const node = this.knowledgeNodesById.get(nodeId);
          if (!node) return;
          if (node.type === 'file') {
            const id = this.generateKnowledgeId('file');
            const duplicate = {
              ...node,
              id,
              title: `${node.title} Copy`,
              order: this.nextKnowledgeOrder(node.parentId || null),
            };
            this.knowledgeState.tree.push(duplicate);
            this.knowledgeState.files[id] = this.knowledgeState.files[node.id] || '';
            if (typeof this.knowledgeDrafts[node.id] === 'string') {
              this.knowledgeDrafts[id] = this.knowledgeDrafts[node.id];
            }
            this.selectKnowledgeNode(id);
            this.saveKnowledge();
            this.persistKnowledgeDrafts();
            return;
          }

          const toClone = [];
          const queue = [node];
          while (queue.length > 0) {
            const current = queue.shift();
            if (!current) continue;
            toClone.push(current);
            const children = this.knowledgeState.tree
              .filter((item) => item.parentId === current.id)
              .sort((left, right) => (left.order || 0) - (right.order || 0));
            queue.push(...children);
          }

          const idMap = new Map();
          for (const item of toClone) {
            const prefix = item.type === 'path' ? 'path' : 'file';
            idMap.set(item.id, this.generateKnowledgeId(prefix));
          }

          const cloned = toClone.map((item) => {
            const newId = idMap.get(item.id);
            const parentId = item.id === node.id
              ? item.parentId
              : (item.parentId ? idMap.get(item.parentId) : null);
            return {
              ...item,
              id: newId,
              parentId: parentId || null,
              title: item.id === node.id ? `${item.title} Copy` : item.title,
              order: item.id === node.id ? this.nextKnowledgeOrder(item.parentId || null) : item.order,
            };
          });

          this.knowledgeState.tree.push(...cloned);
          for (const item of toClone) {
            if (item.type !== 'file') continue;
            const newId = idMap.get(item.id);
            this.knowledgeState.files[newId] = this.knowledgeState.files[item.id] || '';
            if (typeof this.knowledgeDrafts[item.id] === 'string') {
              this.knowledgeDrafts[newId] = this.knowledgeDrafts[item.id];
            }
          }
          const rootDuplicateId = idMap.get(node.id);
          this.selectKnowledgeNode(rootDuplicateId);
          this.saveKnowledge();
          this.persistKnowledgeDrafts();
        },

        isKnowledgeDescendant(targetId, maybeAncestorId) {
          let cursor = this.knowledgeNodesById.get(targetId) || null;
          let guard = 0;
          while (cursor && guard < 60) {
            if (cursor.parentId === maybeAncestorId) return true;
            cursor = cursor.parentId ? this.knowledgeNodesById.get(cursor.parentId) : null;
            guard += 1;
          }
          return false;
        },

        moveKnowledgeNode(nodeId) {
          const node = this.knowledgeNodesById.get(nodeId);
          if (!node) return;
          const input = (window.prompt(this.t('knowledgePromptMove'), node.parentId || 'path-life') || '').trim();
          if (!input) return;
          const target = this.knowledgeNodesById.get(input);
          if (!target || target.type !== 'path' || input === node.id || this.isKnowledgeDescendant(input, node.id)) {
            this.error = this.t('knowledgeErrorMoveInvalid');
            this.pushKnowledgeToast(this.error, 'error');
            return;
          }
          node.parentId = target.id;
          node.order = this.nextKnowledgeOrder(target.id);
          this.saveKnowledge();
          this.emitKnowledgeEvent('node:moved', {
            nodeId,
            mode: 'prompt-move',
            parentId: target.id,
            order: node.order,
          });
        },

        createKnowledgePath() {
          const parent = this.knowledgeSelectedNode && this.knowledgeSelectedNode.type === 'path'
            ? this.knowledgeSelectedNode
            : this.knowledgeNodesById.get('path-life');
          const parentId = parent ? parent.id : null;
          const siblings = this.knowledgeState.tree.filter((node) => (node.parentId || null) === parentId);
          const nextOrder = siblings.length;
          const id = `path-${Date.now()}`;
          this.knowledgeState.tree.push({
            id,
            type: 'path',
            parentId,
            title: `Նոր Path ${nextOrder + 1}`,
            order: nextOrder,
            permissions: { inherit: true },
            collapsed: false,
          });
          this.selectKnowledgeNode(id);
          this.saveKnowledge();
        },

        createKnowledgeFile() {
          const parent = this.knowledgeSelectedNode && this.knowledgeSelectedNode.type === 'path'
            ? this.knowledgeSelectedNode
            : this.knowledgeNodesById.get('path-life');
          const parentId = parent ? parent.id : 'path-life';
          const siblings = this.knowledgeState.tree.filter((node) => (node.parentId || null) === parentId);
          const nextOrder = siblings.length;
          const id = `file-${Date.now()}`;
          this.knowledgeState.tree.push({
            id,
            type: 'file',
            parentId,
            title: `Նոր File ${nextOrder + 1}`,
            order: nextOrder,
            permissions: { inherit: true },
            collapsed: false,
          });
          this.knowledgeState.files[id] = '# Hello\n';
          this.selectKnowledgeNode(id);
          this.saveKnowledge();
        },

        onKnowledgeMarkdownInput() {
          this.scheduleKnowledgeDraftSave();
        },

        saveKnowledgeSelectedFileNow() {
          const fileId = this.knowledgeSelectedFileId;
          if (!fileId) return;
          const draft = typeof this.knowledgeDrafts[fileId] === 'string' ? this.knowledgeDrafts[fileId] : '';
          this.knowledgeState.files[fileId] = draft;
          delete this.knowledgeDrafts[fileId];
          this.saveKnowledge();
          this.persistKnowledgeDrafts();
          this.emitKnowledgeEvent('file:saved', { fileId });
        },

        setKnowledgePermissionOverride(enabled) {
          const selected = this.knowledgeSelectedNode;
          if (!selected) return;
          if (!enabled) {
            selected.permissions = { inherit: true };
            this.saveKnowledge();
            return;
          }
          const effective = this.resolveKnowledgePermissions(selected.id);
          selected.permissions = {
            inherit: false,
            read: Boolean(effective.read),
            write: Boolean(effective.write),
            admin: Boolean(effective.admin),
          };
          this.saveKnowledge();
        },

        setKnowledgePermissionFlag(flag, value) {
          const selected = this.knowledgeSelectedNode;
          if (!selected) return;
          if (selected.permissions?.inherit !== false) return;
          if (!['read', 'write', 'admin'].includes(flag)) return;
          selected.permissions[flag] = Boolean(value);
          if (flag === 'admin' && value) {
            selected.permissions.read = true;
            selected.permissions.write = true;
          }
          if ((flag === 'read' || flag === 'write') && !value && selected.permissions.admin) {
            selected.permissions.admin = false;
          }
          this.saveKnowledge();
        },

        applyKnowledgeTheme() {
          const theme = (this.knowledgeState.uiState.activeTheme || '').trim() || 'black';
          document.documentElement.setAttribute('data-theme', theme);
          this.knowledgeThemeTone = ['black', 'abyss', 'coffee'].includes(theme) ? 'dark' : 'light';
          document.documentElement.setAttribute('data-knowledge-tone', this.knowledgeThemeTone);
          this.knowledgeState.uiState.activeTheme = theme;
          try {
            const raw = localStorage.getItem('hayos.settings');
            const parsed = raw ? JSON.parse(raw) : {};
            const next = {
              ...(parsed && typeof parsed === 'object' ? parsed : {}),
              theme,
            };
            localStorage.setItem('hayos.settings', JSON.stringify(next));
          } catch {
            // ignore settings storage sync failures
          }
          this.saveKnowledge();
          this.emitKnowledgeEvent('theme:changed', { theme });
        },

        lockKnowledgeOrbitCenter(nodeId) {
          if (!nodeId || !this.knowledgeNodesById.has(nodeId)) return;
          const nextLock = this.knowledgeOrbitLockNodeId === nodeId ? '' : nodeId;
          this.knowledgeOrbitLockNodeId = nextLock;
          this.knowledgeOrbitFocusNodeId = nodeId;
          this.knowledgeOrbitViewMode = nextLock ? 'focus' : this.knowledgeOrbitViewMode;
          this.knowledgeOrbitTargetZoom = nextLock ? 1.18 : 1.06;
        },

        clampKnowledgeOrbitUserZoom(value) {
          const numeric = Number.isFinite(value) ? value : 1;
          return Math.min(1.95, Math.max(0.62, numeric));
        },

        setKnowledgeOrbitViewMode(mode) {
          if (mode !== 'global' && mode !== 'focus') return;
          this.knowledgeOrbitViewMode = mode;
          if (mode === 'global') {
            this.knowledgeOrbitLockNodeId = '';
            this.knowledgeOrbitTargetZoom = this.clampKnowledgeOrbitUserZoom(this.knowledgeOrbitUserZoom);
            return;
          }
          this.knowledgeOrbitFocusNodeId = this.knowledgeState.uiState.selectedNodeId || this.knowledgeOrbitFocusNodeId || 'path-life';
        },

        setKnowledgeOrbitQualityMode(mode) {
          if (!['auto', 'high', 'medium', 'low'].includes(mode)) return;
          this.knowledgeOrbitQualityMode = mode;
          this.knowledgeOrbitFrameIndex = 0;
        },

        resetKnowledgeOrbitView() {
          this.knowledgeOrbitLockNodeId = '';
          this.knowledgeOrbitViewMode = 'global';
          this.knowledgeOrbitUserZoom = 1;
          this.knowledgeOrbitTargetZoom = 1;
          this.knowledgeOrbitZoom = 1;
        },

        handleKnowledgeOrbitWheel(event) {
          const deltaY = Number(event?.deltaY) || 0;
          const direction = deltaY > 0 ? -1 : 1;
          const step = direction > 0 ? 0.08 : -0.08;
          const next = this.clampKnowledgeOrbitUserZoom(this.knowledgeOrbitUserZoom + step);
          this.knowledgeOrbitUserZoom = next;
        },

        onKnowledgeOrbitTouchStart(event) {
          const touches = event?.touches;
          if (!touches || touches.length !== 2) return;
          const dx = touches[0].clientX - touches[1].clientX;
          const dy = touches[0].clientY - touches[1].clientY;
          this.knowledgeOrbitTouchDistance = Math.hypot(dx, dy);
          this.knowledgeOrbitTouchStartZoom = this.knowledgeOrbitUserZoom;
        },

        onKnowledgeOrbitTouchMove(event) {
          const touches = event?.touches;
          if (!touches || touches.length !== 2 || !this.knowledgeOrbitTouchDistance) return;
          const dx = touches[0].clientX - touches[1].clientX;
          const dy = touches[0].clientY - touches[1].clientY;
          const distance = Math.hypot(dx, dy);
          if (!distance) return;
          const ratio = distance / this.knowledgeOrbitTouchDistance;
          this.knowledgeOrbitUserZoom = this.clampKnowledgeOrbitUserZoom(this.knowledgeOrbitTouchStartZoom * ratio);
        },

        onKnowledgeOrbitTouchEnd() {
          this.knowledgeOrbitTouchDistance = 0;
          this.knowledgeOrbitTouchStartZoom = this.knowledgeOrbitUserZoom;
        },

        handleKnowledgeOrbitVisibility() {
          if (document.visibilityState === 'hidden') {
            this.knowledgeOrbitPausedAtMs = performance.now();
            return;
          }
          if (this.knowledgeOrbitPausedAtMs && this.knowledgeOrbitEpochMs) {
            const hiddenDuration = Math.max(0, performance.now() - this.knowledgeOrbitPausedAtMs);
            this.knowledgeOrbitEpochMs += hiddenDuration;
          }
          this.knowledgeOrbitPausedAtMs = null;
        },

        computeKnowledgeOrbitLayoutSignature() {
          const source = Array.isArray(this.knowledgeState?.tree) ? this.knowledgeState.tree : [];
          return source
            .map((node) => `${node.id}|${node.parentId || 'root'}|${Number(node.order) || 0}|${node.type}`)
            .sort()
            .join(';');
        },

        startKnowledgeOrbitAnimation() {
          if (this.knowledgeOrbitAnimationFrameId) return;
          const now = performance.now();
          if (!this.knowledgeOrbitEpochMs) {
            this.knowledgeOrbitEpochMs = now - (this.knowledgeOrbitClockSec * 1000);
          }
          const tick = (frameNow) => {
            if (document.visibilityState !== 'hidden') {
              this.knowledgeOrbitFrameIndex += 1;
              const profile = this.knowledgeOrbitPerformanceProfile;
              const updateEvery = Math.max(1, profile.updateIntervalFrames);
              if ((this.knowledgeOrbitFrameIndex % updateEvery) === 0) {
                this.knowledgeOrbitClockSec = Math.max(0, (frameNow - this.knowledgeOrbitEpochMs) / 1000);
                const signature = this.computeKnowledgeOrbitLayoutSignature();
                if (signature !== this.knowledgeOrbitLastLayoutSignature) {
                  this.knowledgeOrbitLastLayoutSignature = signature;
                  this.knowledgeOrbitRelayoutBoostFrames = 16;
                }
                const layout = this.knowledgeOrbitLayout;
                const focusId = this.knowledgeOrbitViewMode === 'focus'
                  ? (
                    this.knowledgeOrbitLockNodeId
                    || this.knowledgeOrbitFocusNodeId
                    || this.knowledgeState.uiState.selectedNodeId
                    || 'path-life'
                  )
                  : 'path-life';
                const focusNode = layout.nodes.find((node) => node.id === focusId) || null;
                const targetX = focusNode ? focusNode.x : 320;
                const targetY = focusNode ? focusNode.y : 210;
                const modeBaseZoom = this.knowledgeOrbitViewMode === 'focus'
                  ? (this.knowledgeOrbitLockNodeId ? 1.18 : 1.08)
                  : 1;
                const targetZoom = this.clampKnowledgeOrbitUserZoom(modeBaseZoom * this.knowledgeOrbitUserZoom);
                this.knowledgeOrbitViewTargetX = targetX;
                this.knowledgeOrbitViewTargetY = targetY;
                this.knowledgeOrbitTargetZoom = targetZoom;
              }

              const centerLerp = 0.12;
              const zoomLerp = 0.1;
              this.knowledgeOrbitViewCenterX += (this.knowledgeOrbitViewTargetX - this.knowledgeOrbitViewCenterX) * centerLerp;
              this.knowledgeOrbitViewCenterY += (this.knowledgeOrbitViewTargetY - this.knowledgeOrbitViewCenterY) * centerLerp;
              this.knowledgeOrbitZoom += (this.knowledgeOrbitTargetZoom - this.knowledgeOrbitZoom) * zoomLerp;
              if (this.knowledgeOrbitRelayoutBoostFrames > 0) {
                this.knowledgeOrbitRelayoutBoostFrames -= 1;
              }
            }
            this.knowledgeOrbitAnimationFrameId = window.requestAnimationFrame(tick);
          };
          this.knowledgeOrbitAnimationFrameId = window.requestAnimationFrame(tick);
        },

        stopKnowledgeOrbitAnimation() {
          if (this.knowledgeOrbitAnimationFrameId) {
            window.cancelAnimationFrame(this.knowledgeOrbitAnimationFrameId);
            this.knowledgeOrbitAnimationFrameId = 0;
          }
        },

        onKnowledgeResize() {
          this.knowledgeDesktop = window.matchMedia('(min-width: 1024px)').matches;
        },

        get handoffSummary() {
          if (!this.handoffMeta) return '';
          const src = this.handoffMeta.sourceType || 'greech';
          const lang = this.handoffMeta.language || 'hy';
          return `source=${src} · lang=${lang}`;
        },

        async init() {
          this.error = '';
          try {
            await loadHayOSClient();
            const urlParams = new URLSearchParams(window.location.search);
            this.appId = urlParams.get('appId') || 'teeezerq';

            this.client = new HayOSClient(this.appId);
            this.ensureKnowledgeStores();
            this.resolvePageFromHash();
            window.addEventListener('hashchange', () => this.resolvePageFromHash());
            window.addEventListener('resize', () => this.onKnowledgeResize());
            this.knowledgeKeydownHandler = (event) => this.handleKnowledgeKeyboardShortcuts(event);
            window.addEventListener('keydown', this.knowledgeKeydownHandler);
            this.knowledgeOrbitVisibilityHandler = () => this.handleKnowledgeOrbitVisibility();
            document.addEventListener('visibilitychange', this.knowledgeOrbitVisibilityHandler);
            this.knowledgeOrbitBeforeUnloadHandler = () => this.stopKnowledgeOrbitAnimation();
            window.addEventListener('beforeunload', this.knowledgeOrbitBeforeUnloadHandler);
            this.onKnowledgeResize();
            this.startKnowledgeOrbitAnimation();
            this.bootstrapKnowledgeLocalState();
            this.knowledgeOrbitFocusNodeId = this.knowledgeState.uiState.selectedNodeId || 'path-life';
            this.knowledgeOrbitLastLayoutSignature = this.computeKnowledgeOrbitLayoutSignature();
            this.syncKnowledgeStores();

            this.status = this.t('statusAuthCheck');
            try {
              const auth = await this.client.ensureAuthenticated();
              this.user = auth.user || null;
              this.language = await this.client.getLanguage();
              document.documentElement.lang = this.language;
              this.client.onLanguageChanged((language) => {
                this.language = language === 'hy' ? 'hy' : 'en';
                document.documentElement.lang = this.language;
                this.status = this.t('statusReady');
              });
              this.status = this.t('statusAuthenticated');
              await this.loadOsTheme();
              if (!this.knowledgeState.uiState.activeTheme) {
                this.knowledgeState.uiState.activeTheme = this.osTheme || 'black';
              }
              this.applyKnowledgeTheme();
            } catch (authError) {
              this.status = this.t('statusReady');
              this.pushKnowledgeToast(this.t('knowledgeBackendOffline'), 'info');
              console.warn('Backend auth unavailable, continuing with local-only mode:', authError);
            }

            this.debugText = JSON.stringify(
              { appId: this.appId, user: this.user, language: this.language, osTheme: this.osTheme || null },
              null,
            2,
            );

            await this.refresh();
          } catch (error) {
            this.error = error && error.message ? error.message : String(error);
            this.status = this.t('statusAuthFailed');
            this.pushKnowledgeToast(this.error, 'error');
          } finally {
            this.resolveIncomingText();
            this.loading = false;
          }
        },

        async loadCurrentUser() {
          if (!this.client) return;
          this.error = '';
          try {
            this.user = await this.client.getCurrentUser();
            this.debugText = JSON.stringify(
              { appId: this.appId, user: this.user, language: this.language, osTheme: this.osTheme || null },
              null,
              2,
            );
          } catch (error) {
            this.error = error && error.message ? error.message : String(error);
            this.pushKnowledgeToast(this.error, 'error');
          }
        },

        async refresh() {
          this.error = '';
          await this.loadOsTheme();
          this.applyKnowledgeTheme();
          this.status = this.t('statusReady');
        },

        setPage(pageKey) {
          this.currentPage = pageKey;
          window.location.hash = pageKey;
          this.sidebarOpen = false;
        },

        setGeerSource(source) {
          this.geerSource = source === 'greech' ? 'greech' : 'custom';
          this.persistInputDraft();
        },

        onGeerInputChange() {
          this.persistInputDraft();
        },

        clearInput() {
          this.geerInput = '';
          this.geerSource = 'custom';
          this.handoffMeta = null;
          this.persistInputDraft();
        },

        resolveIncomingText() {
          const params = new URLSearchParams(window.location.search);
          const incomingTextFromUrl = (params.get('text') || params.get('input') || '').trim();
          const incomingSourceFromUrl = (params.get('source') || '').trim().toLowerCase();

          const contractHandoff =
            window.HopContract && typeof window.HopContract.getHandoff === 'function'
              ? window.HopContract.getHandoff()
              : null;
          const contractDraft =
            window.HopContract && typeof window.HopContract.getTeeezerqDraft === 'function'
              ? window.HopContract.getTeeezerqDraft()
              : (window.HopContract && typeof window.HopContract.getGeerDraft === 'function'
                ? window.HopContract.getGeerDraft()
                : null);

          const incomingTextFromStorage = (
            localStorage.getItem('hop.teeezerq.handoffText')
            || localStorage.getItem('hop.geer.handoffText')
            || ''
          ).trim();
          const incomingSourceFromStorage = (
            localStorage.getItem('hop.teeezerq.handoffSource')
            || localStorage.getItem('hop.geer.handoffSource')
            || ''
          ).trim().toLowerCase();
          const draftText = localStorage.getItem('hop.teeezerq.draftText')
            || localStorage.getItem('hop.geer.draftText')
            || '';
          const draftSource = (
            localStorage.getItem('hop.teeezerq.draftSource')
            || localStorage.getItem('hop.geer.draftSource')
            || ''
          ).trim().toLowerCase();

          const text =
            incomingTextFromUrl ||
            ((contractHandoff && contractHandoff.text) || '').trim() ||
            incomingTextFromStorage ||
            ((contractDraft && contractDraft.text) || '').trim() ||
            draftText;

          const sourceRaw = incomingTextFromUrl
            ? incomingSourceFromUrl
            : (contractHandoff && contractHandoff.sourceType)
              ? contractHandoff.sourceType
              : incomingTextFromStorage
                ? incomingSourceFromStorage
                : (contractDraft && contractDraft.sourceType)
                  ? contractDraft.sourceType
                  : draftSource;

          if (!text) return;

          this.geerInput = text;
          this.geerSource = sourceRaw === 'custom' ? 'custom' : 'greech';
          this.handoffMeta =
            contractHandoff && contractHandoff.text
              ? {
                sourceType: contractHandoff.sourceType || 'greech',
                language: contractHandoff.language || 'hy',
                selectedTextId: contractHandoff.selectedTextId || '',
                context: contractHandoff.context || {},
              }
              : null;
          this.persistInputDraft();
        },

        persistInputDraft() {
          if (window.HopContract && typeof window.HopContract.setTeeezerqDraft === 'function') {
            window.HopContract.setTeeezerqDraft({
              text: this.geerInput || '',
              sourceType: this.geerSource || 'custom',
              language: this.language || 'hy',
            });
          } else if (window.HopContract && typeof window.HopContract.setGeerDraft === 'function') {
            window.HopContract.setGeerDraft({
              text: this.geerInput || '',
              sourceType: this.geerSource || 'custom',
              language: this.language || 'hy',
            });
          }
          localStorage.setItem('hop.teeezerq.draftText', this.geerInput || '');
          localStorage.setItem('hop.teeezerq.draftSource', this.geerSource || 'custom');
        },

        generateCaptions() {
          const source = (this.geerInput || '').trim();
          this.generationError = '';
          this.copyNotice = '';
          if (!source) {
            this.captions = [];
            return;
          }

          this.generationLoading = true;

          try {
            const words = source.split(/\s+/).filter(Boolean);
            const shortBase = words.slice(0, 6).join(' ');
            const mediumBase = words.slice(0, 12).join(' ');
            const lastWord = (words[words.length - 1] || 'flow').replace(/[^a-z0-9ա-ֆ]/gi, '').toLowerCase();
            const variant = this.captionSeed % 3;

            if (this.captionPreset === 'short') {
              this.captions = [
                `${shortBase}...`,
                variant === 0 ? 'Stay real, stay loud.' : (variant === 1 ? 'Քուչեն խոսում է։' : 'Street mood on point.'),
                `#hayhiphop #${lastWord || 'rap'}`,
              ];
              return;
            }

            if (this.captionPreset === 'medium') {
              this.captions = [
                `Այսօրվա vibe-ը՝ ${mediumBase}...`,
                variant === 0 ? 'Տող առ տող, բակ առ բակ, հայկական հոսք։' : (variant === 1 ? 'From text to frame, բառը աշխատում է։' : 'Rhythm, context, and real talk in one take.'),
                'Drop your version in comments.',
              ];
              return;
            }

            this.captions = [
              `${shortBase} — punchline mode.`,
              variant === 0 ? 'No fake bars, only pressure.' : (variant === 1 ? 'Սթեյջը փոքր չի, միտքը մեծ է։' : 'Real bars. Real city. Real timing.'),
              `#punchline #${lastWord || 'bars'}`,
            ];
          } catch (error) {
            this.generationError = error && error.message ? error.message : 'Failed to generate captions.';
            this.captions = [];
          } finally {
            this.generationLoading = false;
          }
        },

        regenerateCaptions() {
          if (!this.geerInput.trim()) return;
          this.captionSeed += 1;
          this.generateCaptions();
        },

        async copyCaption(text) {
          const ok = await this.copyWithFallback(text);
          this.copyNotice = ok ? this.t('copySuccess') : this.t('copyFailed');
        },

        async copyAllCaptions() {
          if (!this.captions.length) return;
          const ok = await this.copyWithFallback(this.captions.join('\n'));
          this.copyNotice = ok ? this.t('copySuccess') : this.t('copyFailed');
        },

        async copyWithFallback(text) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (_error) {
            try {
              const area = document.createElement('textarea');
              area.value = text;
              area.setAttribute('readonly', '');
              area.style.position = 'fixed';
              area.style.opacity = '0';
              document.body.appendChild(area);
              area.select();
              const success = document.execCommand('copy');
              area.remove();
              return Boolean(success);
            } catch (_innerError) {
              return false;
            }
          }
        },

        resolvePageFromHash() {
          const allowedPages = new Set(this.navItems.map((item) => item.key));
          const hashPage = window.location.hash.replace('#', '').trim();
          this.currentPage = allowedPages.has(hashPage) ? hashPage : 'overview';
        },

        async loadOsTheme() {
          if (!this.client) return;
          try {
            const value = await this.client.getModuleValue('ui.theme');
            this.osTheme = typeof value === 'string' ? value : '';
            this.applyOsTheme(this.osTheme);
            if (!this.knowledgeState.uiState.activeTheme && this.osTheme) {
              this.knowledgeState.uiState.activeTheme = this.osTheme;
            }
          } catch (error) {
            console.warn('Failed to resolve OS theme:', error);
            this.osTheme = '';
          }
        },

        applyOsTheme(themeName) {
          if (!themeName || typeof themeName !== 'string') {
            return;
          }
          document.documentElement.setAttribute('data-theme', themeName);
        },

        async firestoreGet(collection, documentId) {
          if (!this.client) throw new Error('Client not initialized');
          return this.client.firestoreGet(collection, documentId);
        },

        async firestoreQuery(collection, queryParams) {
          if (!this.client) throw new Error('Client not initialized');
          return this.client.firestoreQuery(collection, queryParams);
        },

        async firestoreAdd(collection, data) {
          if (!this.client) throw new Error('Client not initialized');
          return this.client.firestoreAdd(collection, data);
        },

        async firestoreUpdate(collection, documentId, data) {
          if (!this.client) throw new Error('Client not initialized');
          return this.client.firestoreUpdate(collection, documentId, data);
        },

        async firestoreDelete(collection, documentId) {
          if (!this.client) throw new Error('Client not initialized');
          return this.client.firestoreDelete(collection, documentId);
        },
      };
    }
  </script>
