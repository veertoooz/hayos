<!doctype html>
<html lang="hy" data-theme="black" class="h-full">
<head>
  <script data-hayos-prepaint-settings>
    (function applyHayOSPrepaintSettings() {
      try {
        var root = document.documentElement;
        var params = new URLSearchParams(window.location.search);
        var fromQueryLang = (params.get('lang') || params.get('language') || '').trim().toLowerCase();
        var fromQueryTheme = (params.get('theme') || '').trim();
        var stored = null;
        try {
          var raw = window.localStorage.getItem('hayos.settings');
          stored = raw ? JSON.parse(raw) : null;
        } catch {
          stored = null;
        }
        var language = fromQueryLang === 'hy' || fromQueryLang === 'en'
          ? fromQueryLang
          : (stored && stored.language === 'hy' ? 'hy' : 'en');
        var theme = fromQueryTheme
          || (stored && typeof stored.theme === 'string' ? stored.theme.trim() : '')
          || 'black';
        root.lang = language;
        root.setAttribute('data-theme', theme);
      } catch {
        // ignore prepaint failures
      }
    })();
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Teeezerq</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    function loadHayOSClient() {
      const isLocalhost =
        window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1';
      const clientUrl = isLocalhost
        ? 'http://localhost:5173/hayos-client.js'
        : '/hayos-client.js';

      return new Promise((resolve, reject) => {
        if (window.HayOSClient) {
          resolve();
          return;
        }
        const script = document.createElement('script');
        script.src = clientUrl;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Failed to load HayOSClient from ${clientUrl}`));
        document.head.appendChild(script);
      });
    }
  </script>
  <style>
    :root {
      --ios-font: "SF Pro Text", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --surface-bg: hsl(220 34% 11% / 0.82);
      --surface-border: hsl(215 28% 72% / 0.14);
      --surface-shadow: 0 10px 30px hsl(228 50% 5% / 0.36);
      --surface-blur: 18px;
      --radius-xl: 1.15rem;
      --radius-lg: 0.9rem;
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-6: 1.5rem;
    }

    [x-cloak] {
      display: none !important;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      font-family: var(--ios-font);
      letter-spacing: 0.01em;
      background:
        radial-gradient(120% 80% at 15% -10%, hsl(213 95% 62% / 0.22), transparent 58%),
        radial-gradient(110% 70% at 85% 120%, hsl(253 85% 66% / 0.18), transparent 62%),
        linear-gradient(180deg, hsl(221 44% 10%), hsl(221 34% 8%));
    }

    .app-shell {
      height: 100dvh;
      width: min(100vw, 30rem);
      max-width: 30rem;
      margin: 0 auto;
      overflow: hidden;
      padding-top: calc(env(safe-area-inset-top) + 0.5rem);
      padding-bottom: calc(env(safe-area-inset-bottom) + 0.5rem);
      padding-left: calc(env(safe-area-inset-left) + 0.75rem);
      padding-right: calc(env(safe-area-inset-right) + 0.75rem);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .glass-surface {
      background: var(--surface-bg);
      border: 1px solid var(--surface-border);
      box-shadow: var(--surface-shadow);
      backdrop-filter: blur(var(--surface-blur)) saturate(145%);
      -webkit-backdrop-filter: blur(var(--surface-blur)) saturate(145%);
      border-radius: var(--radius-xl);
    }

    .app-shell .card {
      border-radius: var(--radius-xl);
      border-color: var(--surface-border);
      box-shadow: var(--surface-shadow);
      background: var(--surface-bg);
      backdrop-filter: blur(var(--surface-blur)) saturate(145%);
      -webkit-backdrop-filter: blur(var(--surface-blur)) saturate(145%);
    }

    .app-shell .btn {
      border-radius: var(--radius-lg);
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .app-shell .badge {
      border-radius: 999px;
      font-weight: 600;
    }

    .tree-list {
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: 0;
    }

    .tree-row {
      min-height: 2.8rem;
      border-radius: 0;
      border: 0;
      border-bottom: 1px solid hsl(214 24% 70% / 0.12);
      background: transparent;
      transition: background-color 140ms ease, border-color 140ms ease, transform 120ms ease;
    }

    .tree-row:active {
      transform: scale(0.996);
    }

    .tree-row:focus-visible {
      outline: 2px solid hsl(var(--p) / 0.35);
      outline-offset: -2px;
      background: hsl(var(--p) / 0.06);
    }

    .tree-indent {
      display: inline-flex;
      width: 0.7rem;
      height: 1.4rem;
      border-left: 1px solid hsl(214 28% 70% / 0.25);
      margin-right: 0.1rem;
    }

    .tree-title {
      font-size: 0.9rem;
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: 0.01em;
    }

    .status-chip {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      border: 1px solid hsl(214 28% 70% / 0.2);
      background: hsl(219 24% 19% / 0.6);
      color: hsl(210 40% 92%);
      white-space: nowrap;
      transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    .floating-dock {
      position: absolute;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 0.5rem);
      transform: translateX(-50%);
      width: calc(100% - 1.5rem);
      max-width: 28rem;
      z-index: 25;
      transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1), opacity 180ms ease;
      animation: dock-rise 260ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .inner-scroll {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      min-height: 0;
    }

    .main-views {
      position: relative;
      flex: 1;
      overflow: hidden;
    }

    .view-panel {
      position: absolute;
      inset: 0;
      transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1), opacity 220ms ease;
      will-change: transform;
    }

    .tap-btn {
      transition: transform 120ms ease;
    }

    .tap-btn:active {
      transform: scale(0.985);
    }

    .floating-dock .btn {
      transition: transform 120ms ease, background-color 160ms ease, border-color 160ms ease;
    }

    .floating-dock .btn:active {
      transform: scale(0.98);
    }

    .modal-box {
      animation: modal-pop 180ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes dock-rise {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(0.5rem);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    @keyframes modal-pop {
      from {
        opacity: 0;
        transform: scale(0.985) translateY(0.3rem);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .touch-target {
      min-height: 2.75rem;
    }

    .focus-ring:focus-visible {
      outline: 2px solid hsl(var(--p));
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .row-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      scrollbar-width: thin;
    }

    [data-view="planets"] .view-planets {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
    }

    [data-view="planets"] .view-records,
    [data-view="planets"] .view-editor {
      transform: translateX(16%);
      opacity: 0;
      pointer-events: none;
    }

    [data-view="records"] .view-planets {
      transform: translateX(-16%);
      opacity: 0;
      pointer-events: none;
    }

    [data-view="records"] .view-records {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
    }

    [data-view="records"] .view-editor {
      transform: translateX(16%);
      opacity: 0;
      pointer-events: none;
    }

    [data-view="editor"] .view-planets,
    [data-view="editor"] .view-records {
      transform: translateX(-16%);
      opacity: 0;
      pointer-events: none;
    }

    [data-view="editor"] .view-editor {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
    }

    .swipe-shadow {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0.75rem;
      opacity: 0;
      pointer-events: none;
      background: linear-gradient(90deg, hsl(var(--bc) / 0.18), transparent);
      transition: opacity 120ms ease;
    }

    .swipe-shadow.active {
      opacity: 1;
    }

    .editor-shell {
      border-radius: 1.2rem;
      border: 1px solid var(--surface-border);
      background: hsl(220 34% 10% / 0.9);
      box-shadow: var(--surface-shadow);
      backdrop-filter: blur(var(--surface-blur)) saturate(145%);
      -webkit-backdrop-filter: blur(var(--surface-blur)) saturate(145%);
    }

    .editor-topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      background: hsl(220 30% 11% / 0.86);
      border-bottom: 1px solid hsl(214 28% 70% / 0.14);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }

    @media (max-width: 390px) {
      .app-shell {
        padding-left: calc(env(safe-area-inset-left) + 0.5rem);
        padding-right: calc(env(safe-area-inset-right) + 0.5rem);
        gap: 0.5rem;
      }

      .tree-title {
        font-size: 0.82rem;
      }

      .floating-dock {
        width: calc(100% - 1rem);
      }
    }

    @media (min-width: 700px) {
      .app-shell {
        max-width: 34rem;
        width: min(100vw, 34rem);
      }

      .tree-row {
        min-height: 3.2rem;
      }
    }
  </style>
</head>
<body class="h-full bg-base-200 text-base-content">
  <div class="app-shell relative" x-data="teeezerqShell()" x-init="init()" x-cloak>
    <header class="glass-surface navbar min-h-0 px-3 py-2">
      <div class="flex-1">
        <h1 class="text-base font-semibold" x-text="t('appTitle')"></h1>
      </div>
      <div class="flex items-center gap-1">
        <span class="badge badge-outline badge-sm" aria-label="Current theme" x-text="`OS: ${osTheme || 'black'}`"></span>
        <span class="badge badge-outline badge-sm" aria-label="Current language" x-text="language === 'hy' ? 'HY' : 'EN'"></span>
      </div>
    </header>

    <main class="main-views" :data-view="view">
      <section x-show="status !== 'ready'" class="view-panel h-full">
        <div class="card h-full border border-base-300 bg-base-100 shadow-sm">
          <div class="card-body flex h-full items-center justify-center gap-3 p-4 text-center">
            <span x-show="loading" class="loading loading-spinner loading-md"></span>
            <p class="text-sm font-medium" x-text="statusTitle()"></p>
            <p class="text-xs opacity-70" x-text="statusDescription()"></p>
            <p class="text-xs text-error" x-show="error" x-text="error"></p>
            <button type="button" class="btn btn-sm btn-primary" x-show="status !== 'ready' && !loading" @click="init()">
              Retry
            </button>
          </div>
        </div>
      </section>

      <section x-show="status === 'ready'" class="view-panel view-planets h-full">
        <div class="card h-full border border-base-300 bg-base-100 shadow-sm">
          <div class="card-body h-full gap-2 p-2">
            <div class="flex items-center justify-between gap-2">
              <div class="min-w-0">
                <h2 class="text-xs font-semibold uppercase tracking-wide opacity-80" x-text="t('planetsTitle')"></h2>
                <p class="truncate text-[0.68rem] opacity-60" x-text="`${planetTreeRows().length} visible`"></p>
              </div>
              <button type="button" class="tap-btn focus-ring btn btn-xs btn-primary" @click="createPlanetQuick()" x-text="t('fabPlanet')"></button>
            </div>
            <div>
              <label class="input input-bordered input-sm flex items-center gap-2">
                <span class="text-xs opacity-60" x-text="t('searchLabel')"></span>
                <input type="search" class="grow" :placeholder="t('searchPlaceholder')" :aria-label="t('searchAria')" x-model.trim="planetSearch" />
              </label>
            </div>
            <div class="inner-scroll flex-1 rounded-box border border-base-300 bg-base-100">
              <template x-if="planetTreeRows().length === 0">
                <div class="grid min-h-52 place-items-center p-4 text-center">
                  <p class="text-sm opacity-75" x-text="planetEmptyLabel()"></p>
                </div>
              </template>
              <ul x-show="planetTreeRows().length > 0" class="tree-list">
                <template x-for="row in planetTreeRows()" :key="`planet-row-${row.node.id}`">
                  <li>
                    <div class="tree-row flex w-full items-center gap-1 px-2.5 py-2" :class="rowClass(row.node)">
                      <button
                        type="button"
                        class="tap-btn focus-ring min-w-0 flex flex-1 items-center text-left"
                        @click="tapPlanetRow(row.node)"
                        @pointerdown="startRowPress(row.node, 'planet', $event)"
                        @pointermove="updateRowPress($event)"
                        @pointerup="endRowPress()"
                        @pointerleave="endRowPress()"
                        @pointercancel="endRowPress()"
                        @contextmenu.prevent="openRowMenu(row.node, 'planet')"
                      >
                        <span class="min-w-0 flex flex-1 items-center truncate">
                          <template x-for="level in planetIndentLevels(row.depth)" :key="`indent-${row.node.id}-${level}`">
                            <span class="tree-indent"></span>
                          </template>
                          <span class="tree-title truncate" x-text="row.node.title"></span>
                        </span>
                      </button>
                      <button
                        type="button"
                        class="tap-btn focus-ring btn btn-ghost btn-xs h-7 min-h-0 w-7 p-0"
                        :class="row.hasChildren ? '' : 'invisible pointer-events-none'"
                        :aria-label="row.expanded ? 'Collapse node' : 'Expand node'"
                        @click.stop="togglePlanetExpand(row.node.id)"
                      >
                        <span class="text-[0.72rem] opacity-60" x-text="planetExpandGlyph(row.node.id)"></span>
                      </button>
                    </div>
                  </li>
                </template>
              </ul>
            </div>
          </div>
        </div>
      </section>

      <section x-show="status === 'ready'" class="view-panel view-records h-full" :style="listPanelStyle()">
        <div class="card h-full border border-base-300 bg-base-100 shadow-sm">
          <div class="card-body relative h-full gap-2 p-2">
            <div class="flex items-center justify-between gap-2">
              <div class="min-w-0 flex items-center gap-2">
                <button type="button" class="tap-btn focus-ring btn btn-ghost btn-xs" @click="goPlanets()" x-text="t('backLabel')"></button>
                <div class="min-w-0">
                  <h2 class="text-xs font-semibold uppercase tracking-wide opacity-80" x-text="t('recordsTitle')"></h2>
                  <p class="truncate text-[0.68rem] opacity-60" x-text="activePlanetLabel()"></p>
                </div>
              </div>
              <div class="min-w-0">
                <p class="truncate text-[0.68rem] opacity-60" x-text="`${activePlanetRecords().length} records`"></p>
              </div>
            </div>
            <div class="inner-scroll flex-1 rounded-box border border-base-300 bg-base-100">
              <template x-if="activePlanetRecords().length === 0">
                <div class="grid min-h-52 place-items-center p-4 text-center">
                  <p class="text-sm opacity-75" x-text="recordsEmptyLabel()"></p>
                </div>
              </template>
              <ul x-show="activePlanetRecords().length > 0" class="tree-list">
                <template x-for="record in activePlanetRecords()" :key="`record-${record.id}`">
                  <li>
                    <button
                      type="button"
                      class="tree-row tap-btn focus-ring w-full items-center justify-between px-2.5 py-2 text-left"
                      @click="openRecordFromRow(record)"
                      @pointerdown="startRowPress(record, 'record', $event)"
                      @pointermove="updateRowPress($event)"
                      @pointerup="endRowPress()"
                      @pointerleave="endRowPress()"
                      @pointercancel="endRowPress()"
                      @contextmenu.prevent="openRowMenu(record, 'record')"
                    >
                      <span class="min-w-0 flex flex-1 items-center truncate">
                        <span class="tree-title truncate" x-text="record.title"></span>
                      </span>
                      <span class="text-[0.68rem] opacity-45" x-text="record.permission"></span>
                    </button>
                  </li>
                </template>
              </ul>
            </div>
          </div>
        </div>
      </section>

      <section
        x-show="status === 'ready'"
        class="view-panel view-editor h-full"
        :style="editorPanelStyle()"
        @touchstart="onEditorTouchStart($event)"
        @touchmove="onEditorTouchMove($event)"
        @touchend="onEditorTouchEnd($event)"
        @touchcancel="onEditorTouchCancel()"
      >
        <div class="swipe-shadow" :class="swipe.active ? 'active' : ''"></div>
        <div class="editor-shell h-full">
          <div class="h-full gap-3 p-0 flex flex-col">
            <div class="editor-topbar flex items-center justify-between gap-2 px-3 py-2">
              <button type="button" class="tap-btn focus-ring btn btn-ghost btn-sm" @click="goRecords()">
                <span x-text="t('backLabel')"></span>
              </button>
              <div class="flex items-center gap-1">
                <button type="button" class="tap-btn focus-ring btn btn-primary btn-sm min-w-20" @click="saveEditor()">
                  <span x-text="t('saveLabel')"></span>
                </button>
                <button
                  type="button"
                  class="tap-btn focus-ring btn btn-ghost btn-sm"
                  @click="toggleEditorMore()"
                  :aria-expanded="editorMoreOpen ? 'true' : 'false'"
                >
                  ⋯
                </button>
              </div>
            </div>

            <div x-show="editorMoreOpen" class="grid gap-2 px-3 pt-2">
              <div class="join">
                <button
                  type="button"
                  class="tap-btn focus-ring btn btn-sm join-item"
                  :class="editorMode === 'write' ? 'btn-primary' : 'btn-ghost'"
                  @click="setEditorMode('write')"
                >
                  Write
                </button>
                <button
                  type="button"
                  class="tap-btn focus-ring btn btn-sm join-item"
                  :class="editorMode === 'preview' ? 'btn-primary' : 'btn-ghost'"
                  @click="setEditorMode('preview')"
                >
                  Preview
                </button>
              </div>
              <label class="input input-bordered flex items-center gap-2">
                <span class="text-xs opacity-70">Title</span>
                <input
                  type="text"
                  class="grow focus-ring"
                  placeholder="Record title"
                  aria-label="Record title"
                  x-model="editor.title"
                  @input="onEditorChanged()"
                />
              </label>
              <div class="text-xs opacity-70 truncate" x-text="currentFilePathLabel()"></div>
              <div class="row-scroll flex items-center gap-2">
                <span class="text-xs opacity-70 whitespace-nowrap">Permission</span>
                <template x-for="mode in permissionModes" :key="`editor-${mode}`">
                  <button
                    type="button"
                    class="tap-btn focus-ring btn btn-xs"
                    :class="editor.permission === mode ? 'btn-primary' : 'btn-ghost'"
                    @click="editor.permission = mode; onEditorChanged();"
                    x-text="permissionLabel(mode)"
                  ></button>
                </template>
              </div>
              <div class="row-scroll flex items-center gap-2">
                <span class="text-xs opacity-70 whitespace-nowrap">Format</span>
                <button type="button" class="btn btn-xs btn-ghost tap-btn focus-ring" @click="insertMarkdown('# ', '')">H1</button>
                <button type="button" class="btn btn-xs btn-ghost tap-btn focus-ring" @click="insertMarkdown('## ', '')">H2</button>
                <button type="button" class="btn btn-xs btn-ghost tap-btn focus-ring" @click="insertMarkdown('- ', '')">List</button>
                <button type="button" class="btn btn-xs btn-ghost tap-btn focus-ring" @click="insertMarkdown('**', '**')">Bold</button>
                <button type="button" class="btn btn-xs btn-ghost tap-btn focus-ring" @click="insertMarkdown('`', '`')">Code</button>
                <button type="button" class="btn btn-xs btn-ghost tap-btn focus-ring" @click="insertMarkdown('[', '](https://)')">Link</button>
              </div>
            </div>

            <div class="inner-scroll mx-3 flex-1 rounded-box border border-base-300 bg-base-100">
              <template x-if="editorMode === 'write'">
                <textarea
                  x-ref="editorArea"
                  class="textarea textarea-ghost focus-ring h-full min-h-[18rem] w-full resize-none rounded-box p-3 leading-relaxed"
                  placeholder="# Markdown..."
                  aria-label="Markdown editor"
                  x-model="editor.body"
                  @input="onEditorChanged()"
                ></textarea>
              </template>
              <template x-if="editorMode === 'preview'">
                <article class="prose prose-sm max-w-none p-3">
                  <h2 class="mb-2 text-base font-semibold" x-text="editor.title || 'Untitled'"></h2>
                  <div class="rounded-box bg-base-200 p-3 text-sm leading-relaxed break-words" x-html="renderMarkdown(editor.body)"></div>
                </article>
              </template>
            </div>

            <div class="row-scroll flex items-center gap-2 px-3 pb-3">
              <button type="button" class="tap-btn focus-ring btn btn-ghost btn-sm min-w-24" @click="resetEditor()">
                Reset
              </button>
              <span class="badge badge-outline badge-sm whitespace-nowrap" x-text="saveStateText"></span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div
      x-show="status === 'ready' && view !== 'editor'"
      x-transition.opacity.duration.120ms
      class="absolute bottom-[calc(env(safe-area-inset-bottom)+0.9rem)] right-4 z-40"
    >
      <button
        type="button"
        class="tap-btn focus-ring btn btn-primary btn-sm shadow-lg"
        @click="onPrimaryFab()"
        x-text="primaryFabLabel()"
      ></button>
    </div>

    <div
      x-show="rowMenu.open"
      x-transition.opacity.duration.120ms
      class="absolute inset-0 z-50 bg-base-content/35"

            fabPlanet: '+ Planet',

            selectPlanetFirst: 'Select a planet first.',
            openEditor: 'Open editor',

            cancelLabel: 'Cancel',
            statusInitializing: 'Initializing',

            statusAuthCheckDesc: 'Validating session from OS.',
            statusReadyDesc: 'App is ready.',

          },
          hy: {

            searchLabel: 'Որոնում',

            fabRecord: '+ Գրառում',
            noPlanets: 'Մոլորակներ դեռ չկան։',
            noPlanetMatches: 'Համընկնող մոլորակ չկա։',
            noRecordsInPlanet: 'Այս մոլորակում գրառումներ չկան։',
            selectPlanetFirst: 'Նախ ընտրիր մոլորակ։',
            openEditor: 'Բացել editor-ը',
            renameLabel: 'Վերանվանել',
            deleteLabel: 'Ջնջել',
            cancelLabel: 'Չեղարկել',
            statusInitializing: 'Սկսվում է',
            statusAuthCheck: 'Ստուգվում է մուտքը',
            statusReady: 'Պատրաստ է',
            statusAuthFailed: 'Պետք է մուտք գործել',
            statusInitializingDesc: 'Բեռնվում է HayOS client-ը և կարգավորումները։',
            statusAuthCheckDesc: 'Ստուգվում է OS session-ը։',
            statusReadyDesc: 'Հավելվածը պատրաստ է։',
            statusAuthFailedDesc: 'Շարունակելու համար մուտք գործեք HayOS-ից։',
          },
        },
        expanded: {
          root: true,
          art: true,
          films: true,
        },
        tree: defaultTree,
        hasFirestoreGateway() {
          return !!(
            this.client
            && typeof this.client.firestoreGet === 'function'
            && typeof this.client.firestoreUpdate === 'function'
          );
        },
        canManualSave() {
          return !!(this.user && this.hasFirestoreGateway() && this.hasUnsavedChanges);
        },
        invalidateDerivedCaches() {
          this.derivedVersion += 1;
          this.activePlanetRecordsCache.version = -1;
          this.activePlanetRecordsCache.rows = [];
          this.activePlanetRecordsCache.planetId = '';
        },
        markDirty() {
          this.hasUnsavedChanges = true;
          this.saveStateText = 'Not saved';
          this.invalidateDerivedCaches();
          if (this.user && this.hasFirestoreGateway() && !this.isHydratingRemote && this.syncState !== 'saving') {
            this.syncState = 'pending';
          }
        },
        loadLocalSnapshot() {
          try {
            const raw = window.localStorage.getItem(STORAGE_KEY);
            return raw ? JSON.parse(raw) : null;
          } catch {
            return null;
          }
        },
        applySnapshot(snapshot) {
          const parsed = snapshot && typeof snapshot === 'object' ? snapshot : null;
          this.tree = this.normalizeTree(parsed?.tree);
          this.invalidateDerivedCaches();
          const activeTree = this.tree.filter((item) => !item.deletedAt);
          this.expanded = this.normalizeExpandedMap(parsed?.expanded, activeTree);
          if (parsed && typeof parsed.selectedId === 'string') {
            this.selectedId = parsed.selectedId;
          }
          if (parsed && typeof parsed.reorderMode === 'boolean') {
            this.reorderMode = parsed.reorderMode;
          }
          if (parsed && typeof parsed.lastOpenedFileId === 'string') {
            this.lastOpenedFileId = parsed.lastOpenedFileId;
          }
          if (parsed && parsed.editorDraft && typeof parsed.editorDraft === 'object') {
            this.editor = {
              id: String(parsed.editorDraft.id || ''),
              title: String(parsed.editorDraft.title || ''),
              body: String(parsed.editorDraft.body || ''),
              permission: ['private', 'team', 'public'].includes(parsed.editorDraft.permission)
                ? parsed.editorDraft.permission
                : 'private',
            };
            this.editorMode = parsed.editorDraft.editorMode === 'preview' ? 'preview' : 'write';
          }
          if (parsed && typeof parsed.activePlanetId === 'string') {
            this.activePlanetId = parsed.activePlanetId;
          }
          if (parsed && parsed.view === 'editor' && this.editor.id) {
            const file = activeTree.find((item) => item.id === this.editor.id && item.kind === 'file');
            this.view = file ? 'editor' : 'records';
          } else if (parsed && (parsed.view === 'records' || parsed.view === 'list')) {
            this.view = 'records';
          } else {
            this.view = 'planets';
          }
          if (!activeTree.some((item) => item.id === this.selectedId)) {
            this.selectedId = activeTree.find((item) => item.parentId === null)?.id || 'root';
          }
          if (this.lastOpenedFileId && !activeTree.some((item) => item.id === this.lastOpenedFileId)) {
            this.lastOpenedFileId = '';
          }
          this.sanitizeNavigationState();
        },
        toBackendViewMode(view) {
          return view === 'editor' ? 'editor' : 'list';
        },
        toBackendStatePayload() {
          return {
            version: BACKEND_SCHEMA_VERSION,
            appId: this.appId || 'teeezerq',
            updatedAt: nowIso(),
            tree: this.tree,
            expanded: this.expanded,
            selectedId: this.selectedId,
            reorderMode: this.reorderMode,
            view: this.toBackendViewMode(this.view),
            activePlanetId: this.activePlanetId,
            lastOpenedFileId: this.lastOpenedFileId,
            editorDraft: {
              id: this.editor.id,
              title: this.editor.title,
              body: this.editor.body,
              permission: this.editor.permission,
              editorMode: this.editorMode,
            },
          };
        },
        toBridgeSafeValue(value) {
          if (
            value === null
            || typeof value === 'string'
            || typeof value === 'number'
            || typeof value === 'boolean'
          ) {
            return value;
          }
          if (value instanceof Date) {
            return value.toISOString();
          }
          if (Array.isArray(value)) {
            return value.map((item) => this.toBridgeSafeValue(item));
          }
          if (typeof value === 'object') {
            const out = {};
            Object.keys(value).forEach((key) => {
              const next = this.toBridgeSafeValue(value[key]);
              if (typeof next !== 'undefined') {
                out[key] = next;
              }
            });
            return out;
          }
          return undefined;
        },
        toBridgeSafePayload(payload) {
          const plain = this.toBridgeSafeValue(payload);
          if (plain && typeof plain === 'object') return plain;
          return {};
        },
        toTs(value) {
          if (typeof value !== 'string') return 0;
          const ts = Date.parse(value);
          return Number.isFinite(ts) ? ts : 0;
        },
        pickNewerNode(localNode, remoteNode) {
          const localDeletedTs = this.toTs(localNode?.deletedAt);
          const remoteDeletedTs = this.toTs(remoteNode?.deletedAt);
          if (localDeletedTs || remoteDeletedTs) {
            if (localDeletedTs === remoteDeletedTs) {
              const localUpdatedTs = this.toTs(localNode?.updatedAt);
              const remoteUpdatedTs = this.toTs(remoteNode?.updatedAt);
              return localUpdatedTs >= remoteUpdatedTs ? localNode : remoteNode;
            }
            return localDeletedTs >= remoteDeletedTs ? localNode : remoteNode;
          }
          const localTs = this.toTs(localNode?.updatedAt);
          const remoteTs = this.toTs(remoteNode?.updatedAt);
          if (localTs >= remoteTs) return localNode;
          return remoteNode;
        },
        mergeTree(localTree, remoteTree) {
          const local = this.normalizeTree(localTree);
          const remote = this.normalizeTree(remoteTree);
          const mergedById = new Map();
          remote.forEach((node) => {
            mergedById.set(node.id, { ...node });
          });
          local.forEach((node) => {
            const prev = mergedById.get(node.id);
            if (!prev) {
              mergedById.set(node.id, { ...node });
              return;
            }
            mergedById.set(node.id, { ...this.pickNewerNode(node, prev) });
          });
          return this.normalizeTree(Array.from(mergedById.values()));
        },
        normalizeExpandedMap(rawExpanded, tree) {
          const source = rawExpanded && typeof rawExpanded === 'object' ? rawExpanded : {};
          const nodes = Array.isArray(tree) ? tree : this.tree;
          const activePathIds = new Set(
            nodes
              .filter((item) => item && item.kind === 'path' && !item.deletedAt)
              .map((item) => item.id),
          );
          const expanded = {};
          Object.keys(source).forEach((key) => {
            if (!activePathIds.has(key)) return;
            expanded[key] = source[key] === true;
          });
          const root = nodes.find((item) => item && item.kind === 'path' && item.parentId === null && !item.deletedAt)
            || nodes.find((item) => item && item.kind === 'path' && !item.deletedAt)
            || null;
          if (root && typeof expanded[root.id] !== 'boolean') {
            expanded[root.id] = true;
          }
          return expanded;
        },
        pickExistingNodeId(candidates, tree, fallback = '') {
          const nodes = Array.isArray(tree) ? tree : [];
          const activeIds = new Set(
            nodes
              .filter((item) => item && !item.deletedAt)
              .map((item) => item.id),
          );
          for (let i = 0; i < candidates.length; i += 1) {
            const candidate = typeof candidates[i] === 'string' ? candidates[i].trim() : '';
            if (candidate && activeIds.has(candidate)) return candidate;
          }
          return fallback;
        },
        pickExistingPlanetId(candidates, tree, fallback = '') {
          const nodes = Array.isArray(tree) ? tree : [];
          const activePlanetIds = new Set(
            nodes
              .filter((item) => item && item.kind === 'path' && !item.deletedAt)
              .map((item) => item.id),
          );
          for (let i = 0; i < candidates.length; i += 1) {
            const candidate = typeof candidates[i] === 'string' ? candidates[i].trim() : '';
            if (candidate && activePlanetIds.has(candidate)) return candidate;
          }
          return fallback;
        },
        mergeSnapshots(localSnapshot, remoteSnapshot) {
          const local = localSnapshot && typeof localSnapshot === 'object' ? localSnapshot : null;
          const remote = remoteSnapshot && typeof remoteSnapshot === 'object' ? remoteSnapshot : null;
          if (!local && !remote) return null;
          if (!remote) return local;
          if (!local) return remote;
          const mergedTree = this.mergeTree(local.tree, remote.tree);
          const localTs = this.toTs(local.updatedAt);
          const remoteTs = this.toTs(remote.updatedAt);
          const newest = localTs >= remoteTs ? local : remote;
          const oldest = newest === local ? remote : local;
          const rootId = mergedTree.find((item) => item.parentId === null)?.id || 'root';
          const rootPlanetId = this.pickExistingPlanetId([rootId], mergedTree, '');
          const selectedId = this.pickExistingNodeId([
            typeof newest.selectedId === 'string' ? newest.selectedId : '',
            typeof oldest.selectedId === 'string' ? oldest.selectedId : '',
            rootId,
          ], mergedTree, rootId);
          const activePlanetId = this.pickExistingPlanetId([
            typeof newest.activePlanetId === 'string' ? newest.activePlanetId : '',
            typeof oldest.activePlanetId === 'string' ? oldest.activePlanetId : '',
            selectedId,
            rootPlanetId,
          ], mergedTree, rootPlanetId);
          const mergedExpanded = this.normalizeExpandedMap({
            ...(remote.expanded && typeof remote.expanded === 'object' ? remote.expanded : {}),
            ...(local.expanded && typeof local.expanded === 'object' ? local.expanded : {}),
          }, mergedTree);
          const reorderMode = typeof newest.reorderMode === 'boolean'
            ? newest.reorderMode
            : (typeof oldest.reorderMode === 'boolean' ? oldest.reorderMode : false);
          const lastOpenedFileId = this.pickExistingNodeId([
            typeof newest.lastOpenedFileId === 'string' ? newest.lastOpenedFileId : '',
            typeof oldest.lastOpenedFileId === 'string' ? oldest.lastOpenedFileId : '',
          ], mergedTree, '');
          const merged = {
            ...newest,
            version: BACKEND_SCHEMA_VERSION,
            appId: this.appId || 'teeezerq',
            updatedAt: nowIso(),
            tree: mergedTree,
            expanded: mergedExpanded,
            selectedId,
            activePlanetId,
            reorderMode,
            // Keep backend payload contract compatible with existing schema validator.
            view: this.toBackendViewMode(newest.view),
            lastOpenedFileId,
            editorDraft: localTs >= remoteTs
              ? (local.editorDraft || remote.editorDraft || {})
              : (remote.editorDraft || local.editorDraft || {}),
          };
          if (!merged.editorDraft || typeof merged.editorDraft !== 'object') {
            merged.editorDraft = { id: '', title: '', body: '', permission: 'private', editorMode: 'write' };
          }
          return merged;
        },
        async readRemoteSnapshot() {
          if (!this.hasFirestoreGateway()) return null;
          const row = await this.client.firestoreGet('appState', this.appId);
          if (!row || typeof row !== 'object') return null;
          if (!Array.isArray(row.tree)) return null;
          return row;
        },
        async writeRemoteSnapshot() {
          if (!this.hasFirestoreGateway()) return;
          this.sanitizeNavigationState();
          const localPayload = this.toBackendStatePayload();
          this.syncState = 'saving';
          this.syncError = '';
          const remoteSnapshot = await this.readRemoteSnapshot().catch(() => null);
          const mergedPayload = this.mergeSnapshots(localPayload, remoteSnapshot) || localPayload;
          mergedPayload.updatedAt = nowIso();
          await this.client.firestoreUpdate(
            'appState',
            this.appId,
            this.toBridgeSafePayload(mergedPayload),
          );
          this.applySnapshot(mergedPayload);
          this.syncState = 'saved';
          this.lastSyncedAt = mergedPayload.updatedAt;
          this.syncError = '';
          this.hasUnsavedChanges = false;
          this.saveStateText = 'Saved';
        },
        async retrySync() {
          if (!this.user || !this.hasFirestoreGateway()) return;
          try {
            await this.writeRemoteSnapshot();
          } catch (error) {
            this.syncState = 'error';
            this.syncError = error && error.message ? error.message : String(error);
          }
        },
        async saveRemoteNow() {
          if (!this.canManualSave()) return;
          await this.retrySync();
        },
        async hydrateFromRemote(localSnapshot) {
          if (!this.hasFirestoreGateway()) return;
          this.isHydratingRemote = true;
          try {
            const remote = await this.readRemoteSnapshot();
            if (remote && Array.isArray(remote.tree)) {
              this.sanitizeNavigationState();
              const localPayload = this.toBackendStatePayload();
              const mergedPayload = this.mergeSnapshots(localPayload, remote) || remote;
              this.applySnapshot(mergedPayload);
              this.lastSyncedAt = typeof remote.updatedAt === 'string' ? remote.updatedAt : '';
              if (this.toTs(mergedPayload.updatedAt) > this.toTs(remote.updatedAt)) {
                await this.client.firestoreUpdate(
                  'appState',
                  this.appId,
                  this.toBridgeSafePayload(mergedPayload),
                );
                this.lastSyncedAt = mergedPayload.updatedAt;
              }
              return;
            }
            if (localSnapshot && Array.isArray(localSnapshot.tree)) {
              await this.writeRemoteSnapshot();
            }
          } catch (error) {
            this.syncState = 'error';
            this.syncError = error && error.message ? error.message : String(error);
          } finally {
            this.isHydratingRemote = false;
          }
        },
        syncStatusLabel() {
          if (!this.hasFirestoreGateway()) return '📦 Local';
          if (this.syncState === 'saving') return '☁️ Saving…';
          if (this.syncState === 'pending') return '⏳ Pending';
          if (this.syncState === 'error') {
            const brief = this.syncError ? String(this.syncError).slice(0, 32) : '';
            return brief ? `⚠️ ${brief}` : '⚠️ Sync error';
          }
          if (this.syncState === 'saved') return '✅ Synced';
          return '🕓 Idle';
        },
        normalizeTree(rawTree) {
          const source = Array.isArray(rawTree) && rawTree.length > 0 ? rawTree : defaultTree;
          const seenIds = new Set();
          const normalized = source.map((item, index) => {
            const fallbackId = `node-${index + 1}`;
            const rawId = typeof item?.id === 'string' && item.id.trim() ? item.id.trim() : fallbackId;
            const id = seenIds.has(rawId) ? `${rawId}-${index + 1}` : rawId;
            seenIds.add(id);
            const kind = item?.kind === 'file' ? 'file' : 'path';
            const createdAt = typeof item?.createdAt === 'string' && item.createdAt.trim()
              ? item.createdAt
              : nowIso();
            const updatedAt = typeof item?.updatedAt === 'string' && item.updatedAt.trim()
              ? item.updatedAt
              : createdAt;
            return {
              id,
              parentId: typeof item?.parentId === 'string' && item.parentId.trim() ? item.parentId : null,
              title: typeof item?.title === 'string' && item.title.trim() ? item.title.trim() : 'Untitled',
              kind,
              permission: ['private', 'team', 'public'].includes(item?.permission) ? item.permission : 'private',
              body: kind === 'file' ? String(item?.body || '') : '',
              order: Number.isFinite(Number(item?.order)) ? Number(item.order) : ((index + 1) * 10),
              createdAt,
              updatedAt,
              deletedAt: typeof item?.deletedAt === 'string' && item.deletedAt.trim() ? item.deletedAt : '',
            };
          });

          const idSet = new Set(normalized.map((item) => item.id));
          let parentFixed = normalized.map((item) => {
            const parentId = item.parentId && idSet.has(item.parentId) ? item.parentId : null;
            return { ...item, parentId };
          });
          if (!parentFixed.some((item) => item.parentId === null) && parentFixed[0]) {
            parentFixed[0] = { ...parentFixed[0], parentId: null };
          }

          let root = parentFixed.find((item) => item.parentId === null && item.kind === 'path')
            || parentFixed.find((item) => item.kind === 'path')
            || parentFixed[0];
          if (!root) return [];
          if (root.kind !== 'path') {
            root = { ...root, kind: 'path', body: '' };
            parentFixed = parentFixed.map((item) => (item.id === root.id ? root : item));
          }
          const nodeById = new Map(parentFixed.map((item) => [item.id, item]));
          parentFixed = parentFixed.map((item) => {
            if (item.id === root.id) return { ...item, parentId: null, kind: 'path', body: '' };
            const rawParent = item.parentId && nodeById.get(item.parentId) ? nodeById.get(item.parentId) : null;
            const parentIsPath = rawParent && rawParent.kind === 'path';
            const fallbackParentId = root.id;
            const nextParentId = parentIsPath ? rawParent.id : fallbackParentId;
            if (item.kind === 'file' && !nextParentId) {

            return { ...item, parentId: nextParentId };

        resequenceOrders(nodes) {
          const bucket = new Map();
          nodes.forEach((item, idx) => {
            const key = item.parentId ?? '__root__';
            if (!bucket.has(key)) bucket.set(key, []);
            bucket.get(key).push({ idx, item });
          });
          bucket.forEach((entries) => {
            entries
              .sort((a, b) => (a.item.order - b.item.order) || (a.idx - b.idx))
              .forEach((entry, i) => {
                entry.item.order = (i + 1) * 10;
              });
          });
          return nodes;
        },
        async init() {

            await loadHayOSClient();
            const params = new URLSearchParams(window.location.search);
            this.appId = params.get('appId') || 'teeezerq';
            this.client = new HayOSClient(this.appId);
            this.status = 'auth_check';
            const auth = await this.client.ensureAuthenticated();
            this.user = auth.user || null;
            this.language = await this.client.getLanguage();
            document.documentElement.lang = this.language;
            this.client.onLanguageChanged((nextLanguage) => {
              this.language = nextLanguage === 'hy' ? 'hy' : 'en';

            });
            if (typeof this.client.onAuthStateChanged === 'function') {
              this.client.onAuthStateChanged((nextUser) => {
                if (!nextUser) {

                  this.status = 'auth_failed';
                  this.view = 'planets';
                  return;
                }
                this.user = nextUser;
                this.status = 'ready';

            }
            await this.loadOsTheme();
            this.status = 'ready';

            await this.hydrateFromRemote(parsed);
            this.applyRouteFromUrl();

        statusDescription() {

        resolvePlanetIdForNode(nodeId) {

        sanitizeNavigationState() {
          const root = this.tree.find((item) => item.parentId === null && this.isPlanetNode(item))
            || this.tree.find((item) => this.isPlanetNode(item))
            || null;
          const hasPlanet = (planetId) => !!this.tree.find((item) => item.id === planetId && this.isPlanetNode(item));
          const hasRecord = (recordId) => !!this.tree.find((item) => item.id === recordId && this.isRecordNode(item));

          if (!hasPlanet(this.activePlanetId)) {
            this.activePlanetId = root ? root.id : '';
          }

          if (!this.selectedId || !this.tree.some((item) => item.id === this.selectedId && !item.deletedAt)) {
            this.selectedId = this.activePlanetId || (root ? root.id : '');
          }
          const selectedPlanetId = this.resolvePlanetIdForNode(this.selectedId);
          if (!hasPlanet(this.activePlanetId) && selectedPlanetId) {
            this.activePlanetId = selectedPlanetId;
          }

            if (!hasRecord(this.editor.id || this.selectedId)) {
              this.view = this.activePlanetId ? 'records' : 'planets';

              this.editor.id = this.selectedId;

          } else {

          if (this.activePlanetId) {

              expanded: this.expanded,
              selectedId: this.selectedId,
              reorderMode: this.reorderMode,
              view: this.view,
              activePlanetId: this.activePlanetId,
              lastOpenedFileId: this.lastOpenedFileId,
              editorDraft: {
                id: this.editor.id,
                title: this.editor.title,
                body: this.editor.body,

        applyRouteFromUrl() {

            const params = new URLSearchParams(window.location.search);
            const view = (params.get('view') || '').trim().toLowerCase();
            const planetId = (params.get('planetId') || '').trim();
            const recordId = (params.get('recordId') || '').trim();

            if (planetId) {
              const planet = this.tree.find((item) => item.id === planetId && item.kind === 'path' && !item.deletedAt);
              if (planet) {
                this.activePlanetId = planet.id;
                this.selectedId = planet.id;
                this.ensureExpandedChainToNode(planet.id, false);
              }
            }

            if (recordId) {
              const record = this.tree.find((item) => item.id === recordId && item.kind === 'file' && !item.deletedAt);
              if (record) {
                this.selectedId = record.id;
                this.lastOpenedFileId = record.id;
                const parentPlanetId = this.resolvePlanetIdForNode(record.id);
                if (parentPlanetId) {
                  this.activePlanetId = parentPlanetId;
                }
                this.ensureExpandedChainToNode(record.id, false);
              }
            }

            if (view === 'editor' && recordId) {
              const record = this.tree.find((item) => item.id === recordId && item.kind === 'file' && !item.deletedAt);
              if (record) {
                this.openRecordFromList(record);
                return;

            else params.delete('planetId');
            if (this.view === 'editor' && this.editor.id) params.set('recordId', this.editor.id);
            else params.delete('recordId');
            const nextQuery = params.toString();
            const nextUrl = `${window.location.pathname}${nextQuery ? `?${nextQuery}` : ''}${window.location.hash || ''}`;

            let descendantMatch = false;
            for (let i = 0; i < children.length; i += 1) {

              if (!childResult.include) continue;
              descendantMatch = true;

              expanded: this.isExpanded(node.id),

            const showChildren = q.length > 0 || this.isExpanded(node.id);

            .filter((node) => this.isRecordNode(node) && node.parentId && descendantIds.has(node.parentId))

          const y = Number.isFinite(event?.clientY) ? event.clientY : this.rowPressStartY;

        planetSiblingNodes(node) {

        },
        canMovePlanetNode(nodeId, direction) {
          const node = this.getNodeById(nodeId);
          if (!this.isPlanetNode(node)) return false;
          const siblings = this.planetSiblingNodes(node);
          const currentIndex = siblings.findIndex((item) => item.id === node.id);
          const nextIndex = currentIndex + direction;
          return currentIndex >= 0 && nextIndex >= 0 && nextIndex < siblings.length;
        },
        movePlanetNode(nodeId, direction) {
          if (!this.canMovePlanetNode(nodeId, direction)) return false;
          const node = this.getNodeById(nodeId);
          if (!this.isPlanetNode(node)) return false;
          const siblings = this.planetSiblingNodes(node);
          const orderedIds = siblings.map((item) => item.id);
          const fromIndex = orderedIds.indexOf(node.id);
          const toIndex = fromIndex + direction;
          const movedId = orderedIds.splice(fromIndex, 1)[0];
          orderedIds.splice(toIndex, 0, movedId);
          const parentId = node.parentId || null;
          const siblingRank = new Map(orderedIds.map((id, index) => [id, index]));
          const movedAt = nowIso();
          this.tree = this.tree.map((item) => {
            if (!this.isPlanetNode(item)) return item;
            if ((item.parentId || null) !== parentId) return item;
            const rank = siblingRank.get(item.id);
            if (!Number.isFinite(rank)) return item;
            return {
              ...item,
              order: (rank + 1) * 10,
              updatedAt: item.id === node.id ? movedAt : item.updatedAt,
            };
          });
          this.markDirty();
          this.persistState();
          return true;
        },
        canIndentPlanetNode(nodeId) {
          const node = this.getNodeById(nodeId);
          if (!this.isPlanetNode(node)) return false;
          if (!node.parentId) return false;
          const siblings = this.planetSiblingNodes(node);
          const index = siblings.findIndex((item) => item.id === node.id);
          return index > 0;
        },
        indentPlanetNode(nodeId) {
          if (!this.canIndentPlanetNode(nodeId)) return false;
          const node = this.getNodeById(nodeId);
          if (!this.isPlanetNode(node)) return false;
          const siblings = this.planetSiblingNodes(node);
          const index = siblings.findIndex((item) => item.id === node.id);
          const newParent = index > 0 ? siblings[index - 1] : null;
          if (!this.isPlanetNode(newParent)) return false;
          const idx = this.tree.findIndex((item) => item.id === node.id);
          if (idx < 0) return false;
          this.tree[idx] = {
            ...this.tree[idx],
            parentId: newParent.id,
            order: this.nextOrderFor(newParent.id),
            updatedAt: nowIso(),
          };
          this.expanded[newParent.id] = true;
          this.tree = this.resequenceOrders(this.tree);
          this.markDirty();
          this.persistState();
          return true;
        },
        canOutdentPlanetNode(nodeId) {
          const node = this.getNodeById(nodeId);
          if (!this.isPlanetNode(node) || !node.parentId) return false;
          const parent = this.getNodeById(node.parentId);
          if (!this.isPlanetNode(parent)) return false;
          return typeof parent.parentId === 'string' && parent.parentId.trim().length > 0;
        },
        outdentPlanetNode(nodeId) {
          if (!this.canOutdentPlanetNode(nodeId)) return false;
          const node = this.getNodeById(nodeId);
          if (!this.isPlanetNode(node) || !node.parentId) return false;
          const parent = this.getNodeById(node.parentId);
          if (!this.isPlanetNode(parent) || !parent.parentId) return false;
          const idx = this.tree.findIndex((item) => item.id === node.id);
          if (idx < 0) return false;
          this.tree[idx] = {
            ...this.tree[idx],
            parentId: parent.parentId,
            order: this.nextOrderFor(parent.parentId),
            updatedAt: nowIso(),
          };
          this.tree = this.resequenceOrders(this.tree);
          this.markDirty();
          this.persistState();
          return true;
        },
        canMovePlanetFromMenu(direction) {
          return this.canMovePlanetNode(this.rowMenu.id, direction);
        },
        canIndentPlanetFromMenu() {
          return this.canIndentPlanetNode(this.rowMenu.id);
        },
        canOutdentPlanetFromMenu() {
          return this.canOutdentPlanetNode(this.rowMenu.id);
        },
        createPlanetChildFromMenu() {
          const node = this.rowMenuPlanetNode();
          if (!node) return;
          this.selectedId = node.id;
          this.activePlanetId = node.id;
          this.closeRowMenu();
          this.createPlanetQuick();
        },
        movePlanetFromMenu(direction) {
          const node = this.rowMenuPlanetNode();
          if (!node) return;
          this.selectedId = node.id;
          this.activePlanetId = node.id;
          const moved = this.movePlanetNode(node.id, direction);
          if (moved) this.closeRowMenu();
        },
        indentPlanetFromMenu() {
          const node = this.rowMenuPlanetNode();
          if (!node) return;
          this.selectedId = node.id;
          this.activePlanetId = node.id;
          const moved = this.indentPlanetNode(node.id);
          if (moved) this.closeRowMenu();
        },
        outdentPlanetFromMenu() {
          const node = this.rowMenuPlanetNode();
          if (!node) return;
          this.selectedId = node.id;
          this.activePlanetId = node.id;
          const moved = this.outdentPlanetNode(node.id);
          if (moved) this.closeRowMenu();
        },
        renameFromMenu() {
          if (!this.rowMenu.id) return;
          this.selectedId = this.rowMenu.id;
          const node = this.getNodeById(this.rowMenu.id);
          if (!node || node.deletedAt) {
            this.closeRowMenu();
            return;
          }
          this.rowMenu.title = node.title || '';
          this.rowMenu.renameDraft = node.title || '';
          this.rowMenu.mode = 'rename';
          this.$nextTick(() => {
            const input = this.$refs.rowMenuRenameInput;
            if (!input) return;
            input.focus();
            if (typeof input.select === 'function') input.select();
          });
        },
        deleteFromMenu() {
          if (!this.rowMenu.id) return;
          this.selectedId = this.rowMenu.id;
          const node = this.getNodeById(this.rowMenu.id);
          if (!node || node.deletedAt || node.parentId === null) {
            this.closeRowMenu();
            return;
          }
          this.rowMenu.title = node.title || '';
          this.rowMenu.mode = 'delete';
          this.$nextTick(() => {
            const button = this.$refs.rowMenuDeleteConfirm;
            if (button && typeof button.focus === 'function') button.focus();
          });
        },
        cancelRowMenuMode() {
          if (!this.rowMenu.open) return;
          const node = this.getNodeById(this.rowMenu.id);
          this.rowMenu.mode = '';
          this.rowMenu.renameDraft = node && !node.deletedAt ? (node.title || '') : '';
        },
        submitRenameFromMenu() {
          if (!this.rowMenu.id) return;
          const title = (this.rowMenu.renameDraft || '').trim();
          if (!title) return;
          const idx = this.tree.findIndex((item) => item.id === this.rowMenu.id && !item.deletedAt);
          if (idx < 0) {
            this.closeRowMenu();
            return;
          }
          const now = nowIso();
          this.tree[idx] = { ...this.tree[idx], title, updatedAt: now };
          this.rowMenu.title = title;
          if (this.editor.id === this.rowMenu.id) {
            this.editor.title = title;
          }
          this.markDirty();
          this.persistState();
          this.closeRowMenu();
        },
        confirmDeleteFromMenu() {
          if (!this.rowMenu.id) return;
          const start = this.getNodeById(this.rowMenu.id);
          if (!start || start.deletedAt || start.parentId === null) {
            this.closeRowMenu();
            return;
          }
          const toRemove = new Set([start.id]);
          const deletedAt = nowIso();
          let changed = true;
          while (changed) {
            changed = false;
            this.tree.forEach((item) => {
              if (item.parentId && toRemove.has(item.parentId) && !toRemove.has(item.id)) {
                toRemove.add(item.id);
                changed = true;
              }
            });
          }
          this.tree = this.tree.map((item) => (
            toRemove.has(item.id)
              ? { ...item, deletedAt, updatedAt: deletedAt }
              : item
          ));
          Object.keys(this.expanded).forEach((key) => {
            if (toRemove.has(key)) delete this.expanded[key];
          });
          if (toRemove.has(this.editor.id)) {
            this.editor.id = '';
            this.editor.title = '';
            this.editor.body = '';
            this.editor.permission = 'private';
            this.view = 'records';
          }
          const activeTree = this.tree.filter((item) => !item.deletedAt);
          const fallback = activeTree.find((item) => item.parentId === null)?.id || '';
          const currentSelected = this.tree.find((item) => item.id === this.selectedId);
          this.selectedId = currentSelected && !currentSelected.deletedAt ? this.selectedId : fallback;
          this.markDirty();
          this.persistState();
          this.closeRowMenu();
        },
        childrenOf(parentId) {
          return this.tree
            .filter((item) => item.parentId === parentId && !item.deletedAt)
            .sort((a, b) => (a.order - b.order) || a.title.localeCompare(b.title));
        },
        isExpanded(id) {
          return !!this.expanded[id];
        },
        editorPanelStyle() {
          if (!this.swipe.active || this.view !== 'editor') return '';
          return `transform: translateX(${Math.max(0, this.swipe.dx)}px);`;
        },
        listPanelStyle() {
          if (!this.swipe.active || this.view !== 'editor') return '';
          const partial = Math.min(1, Math.max(0, this.swipe.dx / 220));
          const shift = -16 + (16 * partial);
          return `transform: translateX(${shift}%); opacity: ${0.35 + (0.65 * partial)};`;
        },
        onEditorTouchStart(event) {
          if (this.view !== 'editor') return;
          const touch = event.touches && event.touches[0];
          if (!touch) return;
          if (touch.clientX > 24) {
            this.swipe.tracking = false;
            return;
          }
          this.swipe.active = true;
          this.swipe.tracking = true;
          this.swipe.startX = touch.clientX;
          this.swipe.startY = touch.clientY;
          this.swipe.startAt = performance.now();
          this.swipe.dx = 0;
        },
        onEditorTouchMove(event) {
          if (!this.swipe.tracking || this.view !== 'editor') return;
          const touch = event.touches && event.touches[0];
          if (!touch) return;
          const dx = touch.clientX - this.swipe.startX;
          const dy = Math.abs(touch.clientY - this.swipe.startY);
          if (dy > 24 && Math.abs(dx) < 20) {
            this.onEditorTouchCancel();
            return;
          }
          if (dx > 0) {
            this.swipe.dx = Math.min(dx, 320);
            if (Math.abs(dx) > dy) {
              event.preventDefault();
            }
          } else {
            this.swipe.dx = 0;
          }
        },
        onEditorTouchEnd() {
          if (!this.swipe.active || this.view !== 'editor') {
            this.onEditorTouchCancel();
            return;
          }
          const elapsed = Math.max(1, performance.now() - this.swipe.startAt);
          const velocity = this.swipe.dx / elapsed;
          const shouldGoBack = this.swipe.dx >= 88 || velocity >= 0.55;
          this.onEditorTouchCancel();
          if (shouldGoBack) {
            this.goList();
          }
        },
        onEditorTouchCancel() {
          this.swipe.active = false;
          this.swipe.tracking = false;
          this.swipe.startX = 0;
          this.swipe.startY = 0;
          this.swipe.startAt = 0;
          this.swipe.dx = 0;
        },
        selectedNodeLabel() {
          const item = this.tree.find((node) => node.id === this.selectedId && !node.deletedAt);
          return item ? item.title : 'None';
        },
        treeStatsLabel() {
          const activeTree = this.tree.filter((item) => !item.deletedAt);
          const total = activeTree.length;
          const paths = activeTree.filter((item) => item.kind === 'path').length;
          const files = activeTree.filter((item) => item.kind === 'file').length;
          return `${total} total · ${paths} paths · ${files} markdown`;
        },
        rowClass(node) {
          if (this.selectedId !== node.id) return '';
          if (this.reorderMode) return 'border-primary/40 bg-primary/10';
          return 'border-base-300 bg-base-200';
        },
        permissionBadge(mode) {
          if (mode === 'public') return 'badge-success badge-outline';
          if (mode === 'team') return 'badge-warning badge-outline';
          return 'badge-neutral badge-outline';
        },
        permissionLabel(mode) {
          if (mode === 'public') return '🌍 public';
          if (mode === 'team') return '👥 team';
          return '🔒 private';
        },
        selectedNode() {
          return this.tree.find((item) => item.id === this.selectedId && !item.deletedAt) || null;
        },
        nextOrderFor(parentId) {
          const siblings = this.childrenOf(parentId);
          if (!siblings.length) return 10;
          return siblings[siblings.length - 1].order + 10;
        },
        newId(prefix) {
          const base = `${prefix}-${Math.random().toString(36).slice(2, 8)}-${Date.now().toString(36)}`;
          if (!this.tree.some((item) => item.id === base)) return base;
          return `${base}-${Math.random().toString(36).slice(2, 5)}`;
        },
        currentFilePathLabel() {
          const node = this.tree.find((item) => item.id === this.editor.id);
          if (!node) return 'No file selected';
          const labels = [node.title];
          let cursor = node;
          while (cursor && cursor.parentId) {
            cursor = this.tree.find((item) => item.id === cursor.parentId);
            if (cursor) labels.unshift(cursor.title);
          }
          return labels.join(' / ');
        },
        escapeHtml(value) {
          return String(value || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        },
        safeHref(rawUrl) {
          const value = String(rawUrl || '').trim();
          if (/^(https?:\/\/|mailto:|tel:)/i.test(value)) {
            return this.escapeHtml(value);
          }
          return '#';
        },
        inlineMarkdown(text) {
          let html = this.escapeHtml(text);
          html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, url) => {
            return `<a href="${this.safeHref(url)}" target="_blank" rel="noopener noreferrer">${this.escapeHtml(label)}</a>`;
          });
          html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
          html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
          html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
          return html;
        },
        renderMarkdown(source) {
          const input = String(source || '').replace(/\r\n/g, '\n');
          if (!input.trim()) return '<p class="opacity-70">No content yet.</p>';
          const lines = input.split('\n');
          const chunks = [];
          let inList = false;
          let inCode = false;
          let codeBuffer = [];
          let paragraph = [];

          const flushParagraph = () => {
            if (!paragraph.length) return;
            chunks.push(`<p>${this.inlineMarkdown(paragraph.join(' '))}</p>`);
            paragraph = [];
          };
          const flushList = () => {
            if (inList) {
              chunks.push('</ul>');
              inList = false;
            }
          };
          const flushCode = () => {
            if (!inCode) return;
            chunks.push(`<pre><code>${this.escapeHtml(codeBuffer.join('\n'))}</code></pre>`);
            codeBuffer = [];
            inCode = false;
          };

          lines.forEach((line) => {
            if (line.trim().startsWith('```')) {
              flushParagraph();
              flushList();
              if (inCode) {
                flushCode();
              } else {
                inCode = true;
                codeBuffer = [];
              }
              return;
            }
            if (inCode) {
              codeBuffer.push(line);
              return;
            }
            if (!line.trim()) {
              flushParagraph();
              flushList();
              return;
            }
            const heading = line.match(/^(#{1,3})\s+(.*)$/);
            if (heading) {
              flushParagraph();
              flushList();
              const level = heading[1].length;
              chunks.push(`<h${level}>${this.inlineMarkdown(heading[2])}</h${level}>`);
              return;
            }
            const list = line.match(/^\s*-\s+(.*)$/);
            if (list) {
              flushParagraph();
              if (!inList) {
                chunks.push('<ul>');
                inList = true;
              }
              chunks.push(`<li>${this.inlineMarkdown(list[1])}</li>`);
              return;
            }
            flushList();
            paragraph.push(line.trim());
          });

          flushParagraph();
          flushList();
          flushCode();
          return chunks.join('');
        },
        insertMarkdown(prefix, suffix) {
          const area = this.$refs.editorArea;
          if (!area) {
            this.editor.body = `${this.editor.body || ''}${prefix}${suffix || ''}`;
            this.onEditorChanged();
            return;
          }
          const start = area.selectionStart ?? 0;
          const end = area.selectionEnd ?? 0;
          const text = this.editor.body || '';
          const selected = text.slice(start, end);
          const next = `${text.slice(0, start)}${prefix}${selected}${suffix || ''}${text.slice(end)}`;
          this.editor.body = next;
          this.onEditorChanged();
          this.$nextTick(() => {
            area.focus();
            const caret = start + prefix.length + selected.length + (suffix || '').length;
            area.setSelectionRange(caret, caret);
          });
        },
        saveEditor() {
          const idx = this.tree.findIndex((item) => item.id === this.editor.id);
          if (idx < 0) return;
          this.tree[idx] = {
            ...this.tree[idx],
            title: this.editor.title.trim() || this.tree[idx].title,
            body: this.editor.body,
            permission: this.editor.permission,
            updatedAt: nowIso(),
          };
          this.markDirty();
          this.persistState();
        },
        resetEditor() {
          const node = this.tree.find((item) => item.id === this.editor.id);
          if (!node) return;
          this.editor.title = node.title || '';
          this.editor.body = node.body || '';
          this.editor.permission = node.permission || 'private';
          this.saveStateText = 'Reset';
        },
        visibleNodes() {
          const activeTree = this.tree.filter((node) => !node.deletedAt);
          const root = activeTree.find((node) => node.parentId === null);
          if (!root) return [];
          const flat = [];
          const walk = (node, depth) => {
            flat.push({ ...node, depth });
            if (node.kind !== 'path' || !this.isExpanded(node.id)) return;
            this.childrenOf(node.id).forEach((child) => walk(child, depth + 1));
          };
          walk(root, 0);
          return flat;
        },
      };
    }
  </script>
</body>
</html>
