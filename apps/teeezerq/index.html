<head>
  <script data-hayos-prepaint-settings>
    (function applyHayOSPrepaintSettings() {
      try {
        var root = document.documentElement;
        var params = new URLSearchParams(window.location.search);
        var fromQueryLang = (params.get('lang') || params.get('language') || '').trim().toLowerCase();
        var fromQueryTheme = (params.get('theme') || '').trim();
        var stored = null;
        try {
          var raw = window.localStorage.getItem('hayos.settings');
          stored = raw ? JSON.parse(raw) : null;
        } catch {
          stored = null;
        }
        var language = fromQueryLang === 'hy' || fromQueryLang === 'en'
          ? fromQueryLang
          : (stored && stored.language === 'hy' ? 'hy' : 'en');
        var theme = fromQueryTheme
          || (stored && typeof stored.theme === 'string' ? stored.theme.trim() : '')
          || 'black';
        root.lang = language;
        root.setAttribute('data-theme', theme);
      } catch {
        // ignore prepaint bootstrap failures
      }
    })();
  </script>

  <script>
    function loadHayOSClient() {
      const isLocalhost =
        window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1';
      const clientUrl = isLocalhost
        ? 'http://localhost:5173/hayos-client.js'
        : '/hayos-client.js';

      return new Promise((resolve, reject) => {
        if (window.HayOSClient) {
          resolve();
          return;
        }
        const script = document.createElement('script');
        script.src = clientUrl;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Failed to load HayOSClient from ${clientUrl}`));
        document.head.appendChild(script);
      });
    }

    function applyRootStylesFromURL() {
      const urlParams = new URLSearchParams(window.location.search);
      const saryanUI = urlParams.get('saryanUI');
      if (!saryanUI) return;

      try {
        const decodedStyles = decodeURIComponent(saryanUI);
        const style = document.createElement('style');
        style.id = 'saryan-ui-dynamic-styles';
        style.textContent = `
          :root {
            ${decodedStyles.replace(/;/g, ';\n            ')}
          }
        `;
        document.head.appendChild(style);
      } catch (error) {
        console.warn('Failed to apply saryanUI styles from URL:', error);
      }
    }
  </script>

</head>

    )

      typeof window.matchMedia === 'function' && window.matchMedia('(pointer: coarse)').matches
    );
    const IS_LOW_END_DEVICE = (
      (DEVICE_MEMORY_GB !== null && DEVICE_MEMORY_GB <= 4)
      || (HARDWARE_THREADS !== null && HARDWARE_THREADS <= 4)
      || (IS_COARSE_POINTER_DEVICE && IS_NARROW_VIEWPORT)
      || DEVICE_PIXEL_RATIO >= 3
    );
    const IS_MEDIUM_END_DEVICE = (
      !IS_LOW_END_DEVICE
      && (
        (DEVICE_MEMORY_GB !== null && DEVICE_MEMORY_GB <= 6)
        || (HARDWARE_THREADS !== null && HARDWARE_THREADS <= 6)
        || (DEVICE_PIXEL_RATIO >= 2.5)
      )
    );
    const PERFORMANCE_TIER = IS_LOW_END_DEVICE
      ? 'low'
      : (IS_MEDIUM_END_DEVICE ? 'medium' : 'high');
    const POINT_COUNT_SCALE = PERFORMANCE_TIER === 'low'
      ? 0.6
      : (PERFORMANCE_TIER === 'medium' ? 0.95 : 1.45);
    const DENSITY_SCALE = PERFORMANCE_TIER === 'low'
      ? 0.72
      : (PERFORMANCE_TIER === 'medium' ? 1.05 : 1.35);
    const PARTICLE_SIZE_SCALE = PERFORMANCE_TIER === 'low'
      ? 0.78
      : (PERFORMANCE_TIER === 'medium' ? 0.68 : 0.58);

    function scaleCount(value, minFloor = 1) {
      const numeric = Number.isFinite(Number(value)) ? Number(value) : minFloor;
      return Math.max(minFloor, Math.round(numeric * POINT_COUNT_SCALE));
    }

    function scaleRange(minValue, maxValue, minFloor = 1) {
      const nextMin = scaleCount(minValue, minFloor);
      const nextMax = scaleCount(maxValue, nextMin);
      return [nextMin, Math.max(nextMin, nextMax)];
    }

    function scaleParticleSize(value, minFloor = 0.00001) {
      const numeric = Number.isFinite(Number(value)) ? Number(value) : minFloor;
      return Math.max(minFloor, numeric * PARTICLE_SIZE_SCALE);
    }

    function createRoundParticleTexture() {
      const size = 64;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      if (!ctx) return null;

      const center = size * 0.5;
      const rOuter = size * 0.5;
      const gradient = ctx.createRadialGradient(center, center, 0, center, center, rOuter);
      gradient.addColorStop(0, 'rgba(255,255,255,1)');
      gradient.addColorStop(0.62, 'rgba(255,255,255,0.92)');
      gradient.addColorStop(0.86, 'rgba(255,255,255,0.34)');
      gradient.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function normalizeLanguage(language) {
      if (typeof language !== 'string') return 'en';
      const lower = language.trim().toLowerCase();
      if (lower.startsWith('hy')) return 'hy';
      return 'en';
    }

    function t(key) {
      const pack = I18N[runtimeLanguage] || I18N.en;
      return pack[key] || I18N.en[key] || key;
    }

    function localizeStatusText(statusText) {
      const text = normalizeSidebarText(statusText, '-');
      if (runtimeLanguage !== 'hy') return text;

      if (text === 'bootstrapping') return 'մեկնարկ';
      if (text === 'starting renderer') return 'renderer-ի մեկնարկ';
      if (text === 'running') return 'աշխատում է';
      if (text === 'paused (hidden)') return 'դադար (ֆոնը)';
      if (text === 'ready') return 'պատրաստ';
      if (text === 'error') return 'սխալ';
      if (text === 'navigating') return 'նավարկում';
      if (text === 'planet scope unavailable') return 'planet scope-ը անհասանելի է';
      if (text === 'no planets found') return 'մոլորակ չի գտնվել';
      if (text === 'loading planets') return 'բեռնվում են մոլորակները';
      if (text === 'record load failed') return 'գրառումների բեռնումը ձախողվեց';

      const loadedPlanetsMatch = text.match(/^loaded (\d+) planets$/);
      if (loadedPlanetsMatch) {
        return `բեռնվել է ${loadedPlanetsMatch[1]} մոլորակ`;
      }
      const syncedPlanetsMatch = text.match(/^planet sync complete \((\d+)\)$/);
      if (syncedPlanetsMatch) {
        return `մոլորակները թարմացվել են (${syncedPlanetsMatch[1]})`;
      }
      const loadingRecordsMatch = text.match(/^loading records for (.+)$/);
      if (loadingRecordsMatch) {
        return `բեռնվում են գրառումները՝ ${loadingRecordsMatch[1]}`;
      }

      return text;
    }

    function buildPointCloudSphere({
      radius,
      count,
      jitter = 0.45,
      colors,
      pointSize = 0.06,
      opacity = 0.95,
      shellThickness = 1.8,
      sizeAttenuation = true,
      blending = THREE.AdditiveBlending,
      side = 'surface',
    }) {
      const positions = new Float32Array(count * 3);
      const vertexColors = new Float32Array(count * 3);

      const colorA = new THREE.Color(colors && colors[0] ? colors[0] : 0xffffff);
      const colorB = new THREE.Color(colors && colors[1] ? colors[1] : colors && colors[0] ? colors[0] : 0xffffff);
      const mixColor = new THREE.Color();

      for (let i = 0; i < count; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);

        let localRadius = radius;
        if (side === 'shell') {
          localRadius = radius + (Math.random() - 0.5) * shellThickness;
        } else if (side === 'volume') {
          const radialSample = Math.cbrt(Math.random());
          localRadius = radius * THREE.MathUtils.lerp(0.08, 1, radialSample);
        }

        let x = localRadius * Math.sin(phi) * Math.cos(theta);
        let y = localRadius * Math.cos(phi);
        let z = localRadius * Math.sin(phi) * Math.sin(theta);

        x += (Math.random() - 0.5) * jitter;
        y += (Math.random() - 0.5) * jitter;
        z += (Math.random() - 0.5) * jitter;

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        const mix = Math.random();
        mixColor.copy(colorA).lerp(colorB, mix);
        vertexColors[i * 3] = mixColor.r;
        vertexColors[i * 3 + 1] = mixColor.g;
        vertexColors[i * 3 + 2] = mixColor.b;
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(vertexColors, 3));

      const material = new THREE.PointsMaterial({
        size: scaleParticleSize(pointSize),
        sizeAttenuation,
        transparent: true,
        opacity,
        depthWrite: false,
        vertexColors: true,
        blending,
        map: ROUND_PARTICLE_TEXTURE || undefined,
        alphaTest: ROUND_PARTICLE_TEXTURE ? 0.12 : 0,
      });

      const points = new THREE.Points(geometry, material);
      return { points, geometry, material };
    }

    function countFromSphereArea(radius, density, minCount, maxCount) {
      const safeRadius = Math.max(0.01, Number.isFinite(radius) ? radius : 1);
      const area = 4 * Math.PI * safeRadius * safeRadius;
      const raw = Math.round(area * density * DENSITY_SCALE);
      return THREE.MathUtils.clamp(raw, Math.max(1, minCount), Math.max(minCount, maxCount));
    }

    function countFromAnnulusArea(innerRadius, outerRadius, density, minCount, maxCount) {
      const safeInner = Math.max(0.01, Number.isFinite(innerRadius) ? innerRadius : 1);
      const safeOuter = Math.max(safeInner + 0.01, Number.isFinite(outerRadius) ? outerRadius : safeInner + 1);
      const area = Math.PI * (safeOuter * safeOuter - safeInner * safeInner);
      const raw = Math.round(area * density * DENSITY_SCALE);
      return THREE.MathUtils.clamp(raw, Math.max(1, minCount), Math.max(minCount, maxCount));
    }

    const SPACE_COLOR_PAIRS = [
      [0xff6b35, 0xffc15e],
      [0x4ecdc4, 0x8ff7f0],
      [0xffe66d, 0xfff3ba],
      [0x6a0572, 0xbc6ff1],

    const BLACK_HOLE_COLOR_PAIRS = [

    function hashString(input) {
      const text = typeof input === 'string' ? input : String(input || '');
      let hash = 2166136261;
      for (let i = 0; i < text.length; i += 1) {
        hash ^= text.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      return hash >>> 0;
    }

    function axisFromHash(hash) {
      const x = ((hash & 255) / 255) - 0.5;
      const y = (((hash >> 8) & 255) / 255) - 0.5;
      const z = (((hash >> 16) & 255) / 255) - 0.5;
      const axis = new THREE.Vector3(x, y, z);
      if (axis.lengthSq() < 1e-6) {
        axis.set(0.43, 0.57, 0.71);
      }
      return axis.normalize();
    }

    function normalizeSpaceName(space) {
      if (space && typeof space.name === 'string' && space.name.trim().length > 0) {
        return space.name.trim();
      }
      if (space && typeof space.slug === 'string' && space.slug.trim().length > 0) {
        return space.slug.trim();
      }
      if (space && typeof space.id === 'string' && space.id.trim().length > 0) {
        return space.id.trim();
      }
      return 'Space';
    }

    function toRecordDisplayValue(value) {
      if (value === null || value === undefined) return '';
      if (typeof value === 'string') return value.trim();
      if (typeof value === 'number' || typeof value === 'boolean') return String(value);
      if (value instanceof Date) return value.toISOString();
      if (Array.isArray(value)) {
        const compact = value
          .slice(0, 4)
          .map((item) => toRecordDisplayValue(item))
          .filter((item) => item.length > 0);
        return compact.join(', ');
      }
      if (typeof value === 'object') {
        try {
          return JSON.stringify(value);
        } catch {
          return '';
        }
      }
      return '';
    }

    function truncateText(value, maxLength) {
      if (typeof value !== 'string') return '';
      const text = value.trim();
      if (text.length <= maxLength) return text;
      return `${text.slice(0, Math.max(0, maxLength - 1)).trim()}…`;
    }

    function firstRecordString(record, keys) {
      if (!record || typeof record !== 'object') return '';
      for (let i = 0; i < keys.length; i += 1) {
        const key = keys[i];
        const value = toRecordDisplayValue(record[key]);
        if (value) return value;
      }
      return '';
    }

    function normalizeRecordEntry(rawRecord, index, spaceId) {
      const record = rawRecord && typeof rawRecord === 'object' ? rawRecord : {};
      const idCandidate = typeof record.id === 'string' && record.id.trim().length > 0
        ? record.id.trim()
        : `${spaceId}-record-${index + 1}`;
      const title = truncateText(
        firstRecordString(record, ['title', 'name', 'label', 'movie', 'film', 'book', 'song']) || `Record ${index + 1}`,
        96,
      );

      const subtitleParts = [];
      const year = firstRecordString(record, ['year', 'releaseYear', 'publishedYear']);
      if (year) subtitleParts.push(year);
      const tag = firstRecordString(record, ['genre', 'category', 'type', 'author']);
      if (tag) subtitleParts.push(tag);
      const subtitle = truncateText(subtitleParts.join(' • '), 96);

      const body = truncateText(
        firstRecordString(record, ['description', 'summary', 'overview', 'synopsis', 'content', 'note']),
        360,
      );

      const hiddenFields = new Set([
        'id',
        'title',
        'name',
        'label',
        'movie',
        'film',
        'book',
        'song',
        'description',
        'summary',
        'overview',
        'synopsis',
        'content',
        'note',
      ]);
      const fields = [];
      Object.entries(record).forEach(([key, value]) => {
        if (hiddenFields.has(key)) return;
        const displayValue = truncateText(toRecordDisplayValue(value), 120);
        if (!displayValue) return;
        fields.push({
          key,
          value: displayValue,
        });
      });

      return {
        id: idCandidate,
        title,
        subtitle,
        body,
        fields: fields.slice(0, 8),
      };
    }

    function measureRecordPayloadSize(record) {
      if (!record || typeof record !== 'object') return 0;

      const titleSize = typeof record.title === 'string' ? record.title.trim().length : 0;
      const subtitleSize = typeof record.subtitle === 'string' ? record.subtitle.trim().length : 0;
      const bodySize = typeof record.body === 'string' ? record.body.trim().length : 0;
      const fields = Array.isArray(record.fields) ? record.fields : [];
      const fieldsPayloadSize = fields.reduce((sum, field) => (
        sum
        + (field && typeof field.key === 'string' ? field.key.trim().length : 0)
        + (field && typeof field.value === 'string' ? field.value.trim().length : 0)
      ), 0);

      return (
        (titleSize * 1.2)
        + (subtitleSize * 1.0)
        + (bodySize * 0.72)
        + (fieldsPayloadSize * 0.45)
        + (fields.length * 16)
      );
    }

    function mapPlanetScopeToPlanetData(planetEntries, isWallpaperMode) {
      if (!Array.isArray(planetEntries) || planetEntries.length === 0) return [];

      const byName = (a, b) => normalizeSpaceName(a).localeCompare(normalizeSpaceName(b), undefined, { sensitivity: 'base' });
      const sorted = [...planetEntries].sort((a, b) => {
        const ar = Number.isFinite(a && a.recordCount) ? a.recordCount : 0;
        const br = Number.isFinite(b && b.recordCount) ? b.recordCount : 0;
        if (br !== ar) return br - ar;
        return byName(a, b);
      });

      const baseDistance = isWallpaperMode ? 340 : 390;
      const distanceStep = isWallpaperMode ? 92 : 106;

      return sorted.map((planetEntry, index) => {
        const safePlanetId = typeof planetEntry.id === 'string' && planetEntry.id.trim().length > 0
          ? planetEntry.id.trim()
          : `planet-${index + 1}`;
        const portalKind = planetEntry && planetEntry.portalKind === 'black_hole' ? 'black_hole' : 'planet';
        const recordCount = Math.max(0, Number.isFinite(planetEntry.recordCount) ? planetEntry.recordCount : 0);
        const records = Array.isArray(planetEntry.records) ? planetEntry.records : [];
        const hash = hashString(safePlanetId);
        const colorPalette = portalKind === 'black_hole' ? BLACK_HOLE_COLOR_PAIRS : SPACE_COLOR_PAIRS;
        const colorPair = colorPalette[hash % colorPalette.length];
        const recordRadius = isWallpaperMode ? RECORD_NODE_BASE_RADIUS * 0.9 : RECORD_NODE_BASE_RADIUS;
        const effectiveCount = Math.max(1, recordCount);
        const radiusMultiplier = portalKind === 'black_hole' ? 0.86 : 1;
        const radius = 10 * recordRadius * effectiveCount * radiusMultiplier;
        const distanceJitter = (hash % 37) - 18;
        const distance = baseDistance + index * distanceStep + distanceJitter;
        const verticalNorm = (((hash >> 4) & 1023) / 1023) - 0.5;
        const verticalAngle = verticalNorm * Math.PI * 0.42;
        const angleOffset = (((hash >> 15) & 1023) / 1023) * Math.PI * 2;

        return {
          planetId: safePlanetId,
          // Backward-compatible aliases until the runtime field names are fully migrated.
          spaceId: safePlanetId,
          spaceName: normalizeSpaceName(planetEntry),
          spaceDescription: typeof planetEntry.description === 'string' ? planetEntry.description : '',
          portalKind,
          friendUid: typeof planetEntry.friendUid === 'string' ? planetEntry.friendUid : '',
          recordCount,
          records,
          radius,
          distance,
          verticalAngle,
          angleOffset,
          colors: colorPair,
          colorSpeed: 0.001 + ((hash & 127) / 127) * 0.028,
          rotationSpeed: 0.0001 + (((hash >> 7) & 127) / 127) * 0.0014,
          pulseSpeed: 0.0018 + (((hash >> 14) & 127) / 127) * 0.0065,
          pulseIntensity: 0.08 + (((hash >> 21) & 63) / 63) * 0.26,
          rotationAxis: axisFromHash(hash),
        };
      });
    }

    async function sendPlanetRequest(client, action) {
      if (!client || typeof client._sendRequest !== 'function') {
        throw new Error('HayOS planet bridge is unavailable.');
      }
      const response = await client._sendRequest(action);
      if (!response || !response.ok) {
        throw new Error((response && response.error) || 'Planet request failed.');
      }
      return response.data;
    }

    async function fetchPlanetScopeData(client, isWallpaperMode) {
      if (!client || typeof client._sendRequest !== 'function') return [];

      let planets = [];
      let blackHoles = [];
      try {
        const listed = await sendPlanetRequest(client, { kind: 'planet.list' });
        planets = Array.isArray(listed) ? listed : [];
      } catch (error) {
        console.warn('Failed to list planets for TeeezerQ:', error);
        return [];
      }
      try {
        const listedBlackHoles = await sendPlanetRequest(client, { kind: 'teeezerq.blackHole.list' });
        blackHoles = Array.isArray(listedBlackHoles) ? listedBlackHoles : [];
      } catch (error) {
        // Keep runtime backward-compatible when older bridge does not support black-hole action.
        blackHoles = [];
      }

      if (planets.length === 0) {
        return [];
      }
      const blackHoleByPlanetId = new Map();
      blackHoles.forEach((entry) => {
        const planetId = entry && typeof entry.planetId === 'string' ? entry.planetId.trim() : '';
        if (!planetId) return;
        blackHoleByPlanetId.set(planetId, {
          friendUid: typeof entry.friendUid === 'string' ? entry.friendUid : '',
        });
      });
      const normalized = planets
        .map((planetEntry) => {
          const planetId = planetEntry && typeof planetEntry.id === 'string' ? planetEntry.id.trim() : '';
          if (!planetId) return null;
          const rawCount = Number(planetEntry && planetEntry.recordCount);
          const recordCount = Number.isFinite(rawCount) && rawCount >= 0 ? Math.floor(rawCount) : 0;
          const blackHoleMeta = blackHoleByPlanetId.get(planetId);
          return {
            ...planetEntry,
            id: planetId,
            recordCount,
            records: [],
            portalKind: blackHoleMeta ? 'black_hole' : 'planet',
            friendUid: blackHoleMeta && typeof blackHoleMeta.friendUid === 'string' ? blackHoleMeta.friendUid : '',
          };
        })
        .filter(Boolean);

      return mapPlanetScopeToPlanetData(normalized, isWallpaperMode);
    }

    class SphericalWorldApp {
      constructor(options) {
        this.options = options;
        this.canvas = document.getElementById('c');
        this.scene = new THREE.Scene();

        this.PLANET_RADIUS = 100;

        this.lastTime = performance.now();

        this.lastLineTargetId = null;
        this.client = options && options.client ? options.client : null;
        this.seededSpacePlanets = Array.isArray(options && options.spacePlanets) ? options.spacePlanets : [];
        this.useGlobalSpacePlanets = Boolean(options && options.useGlobalSpacePlanets);
        this.globalSpacesListener = null;
        this.globalSpacesRefreshInFlight = false;
        this.globalSpacesRefreshPending = false;
        this.spaceRecordsCache = new Map();
        this.spaceRecordsInFlight = new Map();
        this.focusedRecordNode = null;
        this._recordNodeWorldPos = new THREE.Vector3();
        this.lastEnsuredPlanetId = 'main';
        this._motionGestureHandler = null;

        this.setupRenderer();
        this.setupCamera();
        this.setupLights();
        this.setupEventListeners();

        this.planet = new Planet(this.PLANET_RADIUS, this.options);
        this.scene.add(this.planet.mesh);

        this.car = new Car(this.PLANET_RADIUS, this.SURFACE_OFFSET, this.options);
        this.car.setActivePlanet(
          new THREE.Vector3(0, 0, 0),
          this.PLANET_RADIUS,
          'main',
          this.planet.mesh,
          this.PLANET_RADIUS,
        );
        this.scene.add(this.car.mesh);

        this.otherPlanets = new OtherPlanetsSystem(this.options, this.seededSpacePlanets, {
          allowRandomFallback: !this.useGlobalSpacePlanets,
        });
        this.scene.add(this.otherPlanets.group);

        this.stars = new StarField(this.options);
        this.scene.add(this.stars.mesh);

        this.input = new InputHandler(true, this.canvas, {
          isTravelMode: () => runtimeTravelMode,
          onDoubleTapTravel: () => { },
        });
        this.cameraController = new CameraController(this.camera, this.car, this.PLANET_RADIUS, {
          enableMouse: true,
          isTravelMode: Boolean(this.options.isTravelMode),
          isWallpaperMode: Boolean(this.options.isWallpaperMode),
        });

        this.navigationTarget = null;
        this.selectedNavigationTarget = {
          id: null,
          object: null,
          center: new THREE.Vector3(),
          radius: 0,
          baseRadius: 0,
          distance: 0,
          alignment: 0,
        };
        this.activeNavigationLineTarget = {
          id: null,
          object: null,
          center: new THREE.Vector3(),
          radius: 0,
          baseRadius: 0,
          distance: 0,
          alignment: 0,
        };

        this.navigation = this.createNavigationState();

        this.setupNearestPlanetLine();
        this.applyTheme(this.options.initialTheme);
        this.setupPlanetScopeListener();
        setSidebarCurrentPlanet(t('homePlanet'));
        setSidebarNearestPlanet('-');
        setSidebarRecord(null, '-');
      }

      setTravelMode(enabled) {
        const next = Boolean(enabled);
        this.options.isTravelMode = next;
        if (this.cameraController && typeof this.cameraController.setTravelMode === 'function') {
          this.cameraController.setTravelMode(next);
        }
      }

      createNavigationState() {
        return {
          active: false,
          elapsed: 0,
          duration: 0,
          start: new THREE.Vector3(),
          controlA: new THREE.Vector3(),
          controlB: new THREE.Vector3(),
          end: new THREE.Vector3(),
          startUp: new THREE.Vector3(),
          endUp: new THREE.Vector3(),
          startForward: new THREE.Vector3(),
          endForward: new THREE.Vector3(),
          currentPosition: new THREE.Vector3(),
          currentUp: new THREE.Vector3(),
          currentForward: new THREE.Vector3(),
          tangent: new THREE.Vector3(),
          targetId: null,
          targetObject: null,
          targetBaseRadius: 0,
          targetCenter: new THREE.Vector3(),
          targetRadius: 0,
          tmpA: new THREE.Vector3(),
          tmpB: new THREE.Vector3(),
          tmpC: new THREE.Vector3(),
          tmpD: new THREE.Vector3(),
          tmpE: new THREE.Vector3(),
          tmpF: new THREE.Vector3(),
          worldUp: new THREE.Vector3(0, 1, 0),
          worldRight: new THREE.Vector3(1, 0, 0),
        };
      }

      setupNearestPlanetLine() {
        this._nearestCarPos = new THREE.Vector3();
        this._nearestCameraPos = new THREE.Vector3();
        this._nearestCameraForward = new THREE.Vector3();
        this._nearestTargetStart = new THREE.Vector3();
        this._nearestPlanetPos = new THREE.Vector3();
        this._nearestDir = new THREE.Vector3();
        this._candidateToPlanetDir = new THREE.Vector3();
        this._nearestTargetEnd = new THREE.Vector3();
        this._nearestStartSmoothed = new THREE.Vector3();
        this._nearestEndSmoothed = new THREE.Vector3();
        this._nearestLineVector = new THREE.Vector3();
        this._nearestLineMidpoint = new THREE.Vector3();
        this._nearestLineYAxis = new THREE.Vector3(0, 1, 0);
        this._lineColorA = new THREE.Color();
        this._lineColorB = new THREE.Color(0xffffff);
        this._fallbackTargetCenter = new THREE.Vector3();
        this._directionTargetCenter = new THREE.Vector3();

        const geometry = new THREE.CylinderGeometry(1, 1, 1, this.options.isWallpaperMode ? 12 : 14, 1, true);

        const material = new THREE.MeshBasicMaterial({
          color: 0xb6ecff,
          transparent: true,
          opacity: this.options.isWallpaperMode ? 0.82 : 0.9,
          depthTest: false,
          depthWrite: false,
        });

        const line = new THREE.Mesh(geometry, material);
        line.frustumCulled = false;
        line.renderOrder = 20;
        line.visible = false;
        line.scale.set(1, 1, 1);

        this.nearestLine = line;
        this.nearestLineGeometry = geometry;
        this.nearestLineMaterial = material;

        this.scene.add(line);
      }

      setupRenderer() {
        this.renderer = new THREE.WebGLRenderer({
          canvas: this.canvas,
          antialias: !this.options.isWallpaperMode,
          alpha: true,
          powerPreference: 'high-performance',
        });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, this.options.quality.pixelRatioCap));
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.outputColorSpace = THREE.SRGBColorSpace;
        this.renderer.setClearColor(0x000000, this.options.isWallpaperMode ? 0 : 1);
      }

      setupCamera() {
        this.camera = new THREE.PerspectiveCamera(150, window.innerWidth / window.innerHeight, 0.5, 1000);
        this.camera.position.set(0, 35, 60);
      }

      setupLights() {
        const hemi = new THREE.HemisphereLight(0xbcdcff, 0x223344, 0.7);
        this.scene.add(hemi);

        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(50, 40, 20);
        sun.castShadow = false;
        this.scene.add(sun);
      }

      setupEventListeners() {
        window.addEventListener('resize', () => this.onResize());
        document.addEventListener('visibilitychange', () => {
          this.visible = document.visibilityState !== 'hidden';
          if (this.visible) {
            this.lastTime = performance.now();
            this.startAnimationLoop();
            setStatus('running');
            return;
          }
          this.stopAnimationLoop();
          setStatus('paused (hidden)');
        });

        if (this.canvas) {
          this._motionGestureHandler = () => {
            if (this.cameraController && typeof this.cameraController.enableMotionFromGesture === 'function') {
              void this.cameraController.enableMotionFromGesture();
            }
          };
          this.canvas.addEventListener('touchstart', this._motionGestureHandler, { passive: true });
          this.canvas.addEventListener('pointerdown', this._motionGestureHandler, { passive: true });
          this.canvas.addEventListener('click', this._motionGestureHandler, { passive: true });
        }
      }

      setupPlanetScopeListener() {
        if (!this.client) return;
        this.globalSpacesListener = (event) => {
          const payload = event && event.data ? event.data : null;
          if (!payload || (payload.type !== 'hayos:planetsChanged' && payload.type !== 'hayos:globalSpacesChanged')) return;
          this.globalSpacesRefreshPending = true;
        };
        window.addEventListener('message', this.globalSpacesListener);
      }

      replaceOtherPlanets(spacePlanets) {
        const nextSystem = new OtherPlanetsSystem(this.options, spacePlanets, {
          allowRandomFallback: !this.useGlobalSpacePlanets,
        });
        if (this.otherPlanets && this.otherPlanets.group) {
          this.scene.remove(this.otherPlanets.group);
        }
        this.otherPlanets = nextSystem;
        this.scene.add(this.otherPlanets.group);
        this.lastLineTargetId = null;
        this.setFocusedRecordNode(null, this.getActivePlanetObject());

        if (this.car.activePlanetId === 'main') return;
        const replacementPlanet = this.otherPlanets.planets.find((planet) => planet
          && planet.userData
          && planet.userData.navId === this.car.activePlanetId);
        if (replacementPlanet) {
          const replacementBaseRadius = Number.isFinite(replacementPlanet.userData.radius)
            ? replacementPlanet.userData.radius
            : 16;
          const replacementCenter = new THREE.Vector3();
          replacementPlanet.getWorldPosition(replacementCenter);
          this.car.setActivePlanet(
            replacementCenter,
            this.getEffectiveRadius(replacementPlanet, replacementBaseRadius),
            this.car.activePlanetId,
            replacementPlanet,
            replacementBaseRadius,
          );
          this.car.speed = 0;
          this.car.snapToActiveSurface();
          this.car.syncMeshTransform();
          this.syncRecordNodeVisibilityByActivePlanet(replacementPlanet);
          void this.ensurePlanetRecordsLoaded(replacementPlanet);
          return;
        }

        this.car.setActivePlanet(
          new THREE.Vector3(0, 0, 0),
          this.PLANET_RADIUS,
          'main',
          this.planet.mesh,
          this.PLANET_RADIUS,
        );
        this.car.speed = 0;
        this.car.snapToActiveSurface();
        this.car.syncMeshTransform();
      }

      async refreshPlanetScopePlanets() {
        if (!this.client || this.globalSpacesRefreshInFlight) return;
        if (this.navigation.active) {
          this.globalSpacesRefreshPending = true;
          return;
        }

        this.globalSpacesRefreshInFlight = true;
        try {
          this.spaceRecordsInFlight.clear();
          this.spaceRecordsCache.clear();
          this.syncRecordNodeVisibilityByActivePlanet(this.getActivePlanetObject());
          const nextSpacePlanets = await fetchPlanetScopeData(this.client, this.options.isWallpaperMode);
          this.seededSpacePlanets = nextSpacePlanets;
          this.replaceOtherPlanets(nextSpacePlanets);
          if (nextSpacePlanets.length > 0) {
            setStatus(`planet sync complete (${nextSpacePlanets.length})`);
          } else {
            setStatus('no planets found');
          }
        } catch (error) {
          console.warn('Failed to refresh planet scope:', error);
          setStatus('planet scope unavailable');
        } finally {
          this.globalSpacesRefreshInFlight = false;
        }
      }

      onResize() {
        this.camera.aspect = window.innerWidth / window.innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, this.options.quality.pixelRatioCap));
        this.renderer.setSize(window.innerWidth, window.innerHeight);
      }

      applyTheme(themeName) {
        applyOsTheme(themeName);

        if (this.options.isWallpaperMode) {
          this.scene.background = null;
          this.renderer.setClearColor(0x000000, 0);
          return;
        }

        this.scene.background = new THREE.Color(0x0b1020);
        this.renderer.setClearColor(0x0b1020, 1);
      }

      startAnimationLoop() {
        if (this.running) return;
        this.running = true;
        this.renderer.setAnimationLoop(() => this.update());
      }

      stopAnimationLoop() {
        if (!this.running) return;
        this.running = false;
        this.renderer.setAnimationLoop(null);
      }

      getControlKeys() {
        return this.input.keys;
      }

      getEffectiveRadius(object3D, baseRadius) {
        const scale = object3D && object3D.scale && Number.isFinite(object3D.scale.x) ? object3D.scale.x : 1;
        const safeBase = Number.isFinite(baseRadius) ? baseRadius : 1;
        return Math.max(1, safeBase * scale);
      }

      getNavigationTarget() {
        this._nearestCameraPos.copy(this.camera.position);
        this.camera.getWorldDirection(this._nearestCameraForward);
        if (this._nearestCameraForward.lengthSq() < 1e-9) {
          this._nearestCameraForward.copy(this.car.forward);
        }
        this._nearestCameraForward.normalize();

        let fallbackId = null;
        let fallbackObject = null;
        let fallbackBaseRadius = 0;
        let fallbackRadius = 0;
        let fallbackDistance = Number.POSITIVE_INFINITY;

        let directionId = null;
        let directionObject = null;
        let directionBaseRadius = 0;
        let directionRadius = 0;
        let directionDistance = Number.POSITIVE_INFINITY;
        let directionAlignment = 0;
        let directionScore = Number.NEGATIVE_INFINITY;

        const directionGate = this.options.isWallpaperMode ? 0.22 : 0.27;
        const distanceNorm = this.options.isWallpaperMode ? 220 : 180;

        const considerCandidate = (id, object3D, center, baseRadius) => {
          if (!id || !object3D || id === this.car.activePlanetId) {
            return;
          }

          const effectiveRadius = this.getEffectiveRadius(object3D, baseRadius);
          this._candidateToPlanetDir.copy(center).sub(this._nearestCameraPos);
          const centerDistance = this._candidateToPlanetDir.length();
          if (!Number.isFinite(centerDistance) || centerDistance < 1e-6) {
            return;
          }

          const surfaceDistance = Math.max(0, centerDistance - (effectiveRadius + this.SURFACE_OFFSET));
          if (surfaceDistance < fallbackDistance) {
            fallbackDistance = surfaceDistance;
            fallbackId = id;
            fallbackObject = object3D;
            fallbackBaseRadius = baseRadius;
            fallbackRadius = effectiveRadius;
            this._fallbackTargetCenter.copy(center);
          }

          this._candidateToPlanetDir.multiplyScalar(1 / centerDistance);
          const alignment = THREE.MathUtils.clamp(this._nearestCameraForward.dot(this._candidateToPlanetDir), -1, 1);
          if (alignment < directionGate) {
            return;
          }

          const directionalScore = Math.pow(Math.max(0, alignment), 2.35);
          const distanceScore = 1 / (1 + surfaceDistance / distanceNorm);
          const score = directionalScore * 0.84 + distanceScore * 0.16;
          if (score > directionScore) {
            directionScore = score;
            directionId = id;
            directionObject = object3D;
            directionBaseRadius = baseRadius;
            directionRadius = effectiveRadius;
            directionDistance = surfaceDistance;
            directionAlignment = alignment;
            this._directionTargetCenter.copy(center);
          }
        };

        this._nearestPlanetPos.set(0, 0, 0);
        considerCandidate('main', this.planet.mesh, this._nearestPlanetPos, this.PLANET_RADIUS);

        const planets = this.otherPlanets && Array.isArray(this.otherPlanets.planets) ? this.otherPlanets.planets : [];
        for (let i = 0; i < planets.length; i += 1) {
          const planet = planets[i];
          if (!planet) continue;
          const id = planet.userData && typeof planet.userData.navId === 'string' ? planet.userData.navId : `planet-${i}`;
          const baseRadius = Number.isFinite(planet.userData && planet.userData.radius) ? planet.userData.radius : 16;
          planet.getWorldPosition(this._nearestPlanetPos);
          considerCandidate(id, planet, this._nearestPlanetPos, baseRadius);
        }

        const hasDirectionTarget = Boolean(directionObject);
        const targetId = hasDirectionTarget ? directionId : fallbackId;
        const targetObject = hasDirectionTarget ? directionObject : fallbackObject;
        const targetBaseRadius = hasDirectionTarget ? directionBaseRadius : fallbackBaseRadius;
        const targetRadius = hasDirectionTarget ? directionRadius : fallbackRadius;
        const targetDistance = hasDirectionTarget ? directionDistance : fallbackDistance;

        if (!targetObject || !targetId || !Number.isFinite(targetDistance)) {
          this.navigationTarget = null;
          return null;
        }

        const target = this.selectedNavigationTarget;
        target.id = targetId;
        target.object = targetObject;
        target.baseRadius = targetBaseRadius;
        target.radius = targetRadius;
        target.distance = targetDistance;
        target.alignment = hasDirectionTarget ? directionAlignment : 0;
        target.center.copy(hasDirectionTarget ? this._directionTargetCenter : this._fallbackTargetCenter);

        this.navigationTarget = target;
        return target;
      }

      getLineTarget() {
        if (!this.navigation.active || !this.navigation.targetObject) {
          return this.getNavigationTarget();
        }

        const target = this.activeNavigationLineTarget;
        target.id = this.navigation.targetId;
        target.object = this.navigation.targetObject;
        target.baseRadius = this.navigation.targetBaseRadius;
        target.radius = this.getEffectiveRadius(this.navigation.targetObject, this.navigation.targetBaseRadius);
        this.navigation.targetObject.getWorldPosition(this.navigation.targetCenter);
        target.center.copy(this.navigation.targetCenter);
        this._nearestCameraPos.copy(this.camera.position);
        this.camera.getWorldDirection(this._nearestCameraForward);
        if (this._nearestCameraForward.lengthSq() < 1e-9) {
          this._nearestCameraForward.copy(this.car.forward);
        }
        this._nearestCameraForward.normalize();
        this._candidateToPlanetDir.copy(target.center).sub(this._nearestCameraPos);
        const targetCenterDistance = this._candidateToPlanetDir.length();
        if (targetCenterDistance > 1e-9) {
          this._candidateToPlanetDir.multiplyScalar(1 / targetCenterDistance);
        }
        target.distance = Math.max(
          0,
          this._nearestCameraPos.distanceTo(target.center) - target.radius - this.SURFACE_OFFSET,
        );
        target.alignment = targetCenterDistance > 1e-9
          ? THREE.MathUtils.clamp(this._nearestCameraForward.dot(this._candidateToPlanetDir), -1, 1)
          : 1;
        return target;
      }

      getPlanetDisplayName(planet) {
        if (planet === this.planet.mesh) return t('homePlanet');
        if (!planet || !planet.userData) return t('planet');
        if (planet.userData.navId === 'main') return t('homePlanet');
        const prefix = planet.userData.portalKind === 'black_hole' ? `${t('blackHole')} • ` : '';
        if (typeof planet.userData.spaceName === 'string' && planet.userData.spaceName.trim().length > 0) {
          return `${prefix}${planet.userData.spaceName.trim()}`;
        }
        if (typeof planet.userData.spaceId === 'string' && planet.userData.spaceId.trim().length > 0) {
          return `${prefix}${planet.userData.spaceId.trim()}`;
        }
        return prefix ? `${prefix}${t('planet')}` : 'Planet';
      }

      getPlanetSpaceName(planet) {
        if (!planet || !planet.userData) return '-';
        if (typeof planet.userData.spaceName === 'string' && planet.userData.spaceName.trim().length > 0) {
          return planet.userData.spaceName.trim();
        }
        if (planet === this.planet.mesh || planet.userData.navId === 'main') {
          return t('homePlanet');
        }
        return '-';
      }

      getActivePlanetObject() {
        if (this.car.activePlanetId === 'main') {
          return this.planet.mesh;
        }
        if (this.car.activePlanetObject) {
          return this.car.activePlanetObject;
        }
        const planets = this.otherPlanets && Array.isArray(this.otherPlanets.planets) ? this.otherPlanets.planets : [];
        for (let i = 0; i < planets.length; i += 1) {
          const planet = planets[i];
          if (!planet || !planet.userData) continue;
          if (planet.userData.navId === this.car.activePlanetId) {
            return planet;
          }
        }
        return null;
      }

      getSpaceIdFromPlanet(planet) {
        if (!planet || !planet.userData) return '';
        if (planet === this.planet.mesh || planet.userData.navId === 'main') return '';

        if (typeof planet.userData.spaceId === 'string' && planet.userData.spaceId.trim().length > 0) {
          return planet.userData.spaceId.trim();
        }

        if (typeof planet.userData.navId === 'string' && planet.userData.navId.startsWith('space:')) {
          const parsed = planet.userData.navId.slice('space:'.length).trim();
          return parsed || '';
        }

        return '';
      }

      async loadRecordsForSpace(spaceId) {
        if (!spaceId || !this.client) return [];
        const records = await sendPlanetRequest(this.client, { kind: 'planet.listRecords', planetId: spaceId });
        const safeRecords = Array.isArray(records) ? records : [];
        return safeRecords.map((record, index) => normalizeRecordEntry(record, index, spaceId));
      }

      async ensurePlanetRecordsLoaded(planet) {
        if (!planet || !planet.userData || !this.otherPlanets) return;
        if (planet === this.planet.mesh || planet.userData.navId === 'main') return;
        if (planet.userData.recordsLoaded) return;

        const seededRecords = Array.isArray(planet.userData.records) ? planet.userData.records : [];
        if (seededRecords.length > 0) {
          this.otherPlanets.attachRecordNodesToPlanet(planet, seededRecords);
          const seededSpaceId = this.getSpaceIdFromPlanet(planet);
          if (seededSpaceId && !this.spaceRecordsCache.has(seededSpaceId)) {
            this.spaceRecordsCache.set(seededSpaceId, seededRecords);
          }
          this.syncRecordNodeVisibilityByActivePlanet(this.getActivePlanetObject());
          if (this.getActivePlanetObject() === planet) {
            this.setFocusedRecordNode(null, planet);
          }
          return;
        }

        if (!this.client) return;
        const spaceId = this.getSpaceIdFromPlanet(planet);
        if (!spaceId) return;

        if (this.spaceRecordsCache.has(spaceId)) {
          const cachedRecords = this.spaceRecordsCache.get(spaceId) || [];
          this.otherPlanets.attachRecordNodesToPlanet(planet, cachedRecords);
          this.syncRecordNodeVisibilityByActivePlanet(this.getActivePlanetObject());
          if (this.getActivePlanetObject() === planet) {
            this.setFocusedRecordNode(null, planet);
          }
          return;
        }

        let inFlight = this.spaceRecordsInFlight.get(spaceId);
        if (!inFlight) {
          setStatus(`loading records for ${spaceId}`);
          inFlight = this.loadRecordsForSpace(spaceId)
            .then((records) => {
              this.spaceRecordsCache.set(spaceId, records);
              return records;
            })
            .finally(() => {
              this.spaceRecordsInFlight.delete(spaceId);
            });
          this.spaceRecordsInFlight.set(spaceId, inFlight);
        }

        try {
          const records = await inFlight;
          this.otherPlanets.attachRecordNodesToPlanet(planet, records);
          this.syncRecordNodeVisibilityByActivePlanet(this.getActivePlanetObject());
          if (this.getActivePlanetObject() === planet) {
            this.setFocusedRecordNode(null, planet);
          }
          setStatus('ready');
        } catch (error) {
          console.warn(`Failed to lazy-load records for space "${spaceId}":`, error);
          setStatus('record load failed');
        }
      }

      updateSidebarPlanetSummary(nearestTarget) {
        const activePlanet = this.getActivePlanetObject();
        setSidebarCurrentPlanet(this.getPlanetDisplayName(activePlanet));
        setSidebarSpaceName(this.getPlanetSpaceName(activePlanet));
        if (!nearestTarget || !nearestTarget.object) {
          setSidebarNearestPlanet('-');
          return;
        }
        setSidebarNearestPlanet(this.getPlanetDisplayName(nearestTarget.object));
      }

      getRecordAnchorId(recordNode) {
        if (!recordNode || !recordNode.userData) return '';
        if (typeof recordNode.userData.anchorId === 'string' && recordNode.userData.anchorId.trim().length > 0) {
          return recordNode.userData.anchorId.trim();
        }
        const record = recordNode.userData.record || {};
        const recordId = typeof record.id === 'string' && record.id.trim().length > 0
          ? record.id.trim()
          : 'record';
        const spaceId = typeof recordNode.userData.spaceId === 'string' && recordNode.userData.spaceId.trim().length > 0
          ? recordNode.userData.spaceId.trim()
          : 'space';
        return `${spaceId}:${recordId}`;
      }

      getRecordNodesFromPlanet(planet) {
        if (!planet || !planet.userData) return [];
        const nodes = Array.isArray(planet.userData.recordNodes) ? planet.userData.recordNodes : [];
        return nodes.filter((node) => node && node.userData && node.userData.type === 'recordAnchor');
      }

      syncRecordNodeVisibilityByActivePlanet(activePlanet) {
        const active = activePlanet || this.getActivePlanetObject();
        const allPlanets = this.otherPlanets && Array.isArray(this.otherPlanets.planets)
          ? this.otherPlanets.planets
          : [];
        for (let i = 0; i < allPlanets.length; i += 1) {
          const planet = allPlanets[i];
          const nodes = this.getRecordNodesFromPlanet(planet);
          const shouldShow = Boolean(planet && planet === active && active !== this.planet.mesh);
          for (let j = 0; j < nodes.length; j += 1) {
            const node = nodes[j];
            node.visible = shouldShow;
          }
        }
      }

      ensureActivePlanetRecordsLoaded() {
        const activeId = typeof this.car.activePlanetId === 'string' ? this.car.activePlanetId : 'main';
        const activePlanet = this.getActivePlanetObject();
        this.syncRecordNodeVisibilityByActivePlanet(activePlanet);
        if (activeId === this.lastEnsuredPlanetId) {
          return;
        }
        this.lastEnsuredPlanetId = activeId;
        if (!activePlanet || activeId === 'main') {
          return;
        }
        void this.ensurePlanetRecordsLoaded(activePlanet);
      }

      setFocusedRecordNode(recordNode, planet) {
        if (this.focusedRecordNode && this.focusedRecordNode.userData) {
          this.focusedRecordNode.userData.isFocused = false;
        }
        this.focusedRecordNode = recordNode || null;
        if (this.focusedRecordNode && this.focusedRecordNode.userData) {
          this.focusedRecordNode.userData.isFocused = true;
        }

        const recordPayload = recordNode && recordNode.userData ? recordNode.userData.record : null;
        const spaceName = this.getPlanetSpaceName(planet);
        setSidebarRecord(recordPayload, spaceName);
      }

      updateFocusedRecord() {
        const activePlanet = this.getActivePlanetObject();

        if (!activePlanet || activePlanet === this.planet.mesh || !activePlanet.userData) {
          if (this.focusedRecordNode) {
            this.setFocusedRecordNode(null, activePlanet);
          }
          return;
        }

        const recordNodes = Array.isArray(activePlanet.userData.recordNodes) ? activePlanet.userData.recordNodes : [];
        if (recordNodes.length === 0) {
          if (this.focusedRecordNode) {
            this.setFocusedRecordNode(null, activePlanet);
          }
          return;
        }

        const planetBaseRadius = Number.isFinite(activePlanet.userData.radius) ? activePlanet.userData.radius : 16;
        const activeRadius = this.getEffectiveRadius(activePlanet, planetBaseRadius);
        const proximityThreshold = THREE.MathUtils.clamp(
          activeRadius * (this.options.isWallpaperMode ? 0.54 : 0.62),
          this.options.isWallpaperMode ? 8.8 : 11.5,
          this.options.isWallpaperMode ? 34 : 46,
        );

        let nearestNode = null;
        let nearestDistance = Number.POSITIVE_INFINITY;
        for (let i = 0; i < recordNodes.length; i += 1) {
          const node = recordNodes[i];
          if (!node || !node.getWorldPosition || !node.userData) continue;
          node.getWorldPosition(this._recordNodeWorldPos);
          const nodeRadius = Number.isFinite(node.userData.radius) ? node.userData.radius : 1;
          const distance = Math.max(0, this.car.position.distanceTo(this._recordNodeWorldPos) - nodeRadius);
          if (distance < nearestDistance) {
            nearestDistance = distance;
            nearestNode = node;
          }
        }

        if (!nearestNode || nearestDistance > proximityThreshold) {
          if (this.focusedRecordNode) {
            this.setFocusedRecordNode(null, activePlanet);
          }
          return;
        }

        if (this.focusedRecordNode !== nearestNode) {
          this.setFocusedRecordNode(nearestNode, activePlanet);
        }
      }

      handleNavigationTrigger(keys) {
        const isRPressed = Boolean(keys && keys.r);
        if (isRPressed && !this.prevRPressed && !this.navigation.active) {
          this.tryStartNavigation();
        }
        this.prevRPressed = isRPressed;
      }

      tryStartNavigation() {
        const target = this.getNavigationTarget();
        if (!target || target.id === this.car.activePlanetId) {
          return;
        }

        const nav = this.navigation;
        nav.active = true;
        nav.elapsed = 0;
        nav.targetId = target.id;
        nav.targetObject = target.object;
        nav.targetBaseRadius = target.baseRadius;
        nav.targetCenter.copy(target.center);
        nav.targetRadius = target.radius;

        nav.start.copy(this.car.position);
        nav.startUp.copy(this.car.up).normalize();
        nav.startForward.copy(this.car.forward).normalize();

        nav.endUp.copy(nav.start).sub(nav.targetCenter);
        if (nav.endUp.lengthSq() < 1e-9) {
          nav.endUp.copy(nav.startForward);
        }
        nav.endUp.normalize();
        nav.end.copy(nav.targetCenter).addScaledVector(nav.endUp, nav.targetRadius + this.SURFACE_OFFSET);

        nav.tmpA.copy(nav.end).sub(nav.start);
        const distance = nav.tmpA.length();
        if (!Number.isFinite(distance) || distance < 0.01) {
          nav.active = false;
          return;
        }
        nav.tmpA.multiplyScalar(1 / distance);

        const arcHeight = THREE.MathUtils.clamp(
          distance * (this.options.isWallpaperMode ? 0.16 : 0.22),
          this.options.isWallpaperMode ? 14 : 18,
          this.options.isWallpaperMode ? 55 : 95,
        );

        nav.controlA
          .copy(nav.start)
          .addScaledVector(nav.startUp, arcHeight)
          .addScaledVector(nav.tmpA, distance * 0.2);
        nav.controlB
          .copy(nav.end)
          .addScaledVector(nav.endUp, arcHeight)
          .addScaledVector(nav.tmpA, -distance * 0.24);

        nav.endForward.copy(nav.startForward).lerp(nav.tmpA, 0.45);
        nav.endForward.addScaledVector(nav.endUp, -nav.endForward.dot(nav.endUp));
        if (nav.endForward.lengthSq() < 1e-9) {
          nav.endForward.copy(nav.tmpA).addScaledVector(nav.endUp, -nav.tmpA.dot(nav.endUp));
          if (nav.endForward.lengthSq() < 1e-9) {
            nav.endForward.crossVectors(nav.worldUp, nav.endUp);
            if (nav.endForward.lengthSq() < 1e-9) {
              nav.endForward.crossVectors(nav.worldRight, nav.endUp);
            }
          }
        }
        nav.endForward.normalize();

        nav.duration = THREE.MathUtils.clamp(
          1.2 + distance / (this.options.isWallpaperMode ? 180 : 155),
          this.options.isWallpaperMode ? 1.6 : 1.5,
          this.options.isWallpaperMode ? 3.6 : 4.4,
        );

        this.car.speed = 0;
        this.cameraController.setCinematicMode(true);
        setStatus('navigating');
      }

      evaluateCubicBezier(p0, p1, p2, p3, t, out) {
        const u = 1 - t;
        const uu = u * u;
        const tt = t * t;
        const uuu = uu * u;
        const ttt = tt * t;

        out.copy(p0).multiplyScalar(uuu);
        out.addScaledVector(p1, 3 * uu * t);
        out.addScaledVector(p2, 3 * u * tt);
        out.addScaledVector(p3, ttt);
        return out;
      }

      evaluateCubicBezierTangent(p0, p1, p2, p3, t, out) {
        const u = 1 - t;
        out
          .copy(p1)
          .sub(p0)
          .multiplyScalar(3 * u * u)
          .addScaledVector(this.navigation.tmpE.copy(p2).sub(p1), 6 * u * t)
          .addScaledVector(this.navigation.tmpF.copy(p3).sub(p2), 3 * t * t);
        return out;
      }

      easeInOutCubic(t) {
        return t < 0.5
          ? 4 * t * t * t
          : 1 - ((-2 * t + 2) ** 3) / 2;
      }

      updateNavigation(dt) {
        const nav = this.navigation;
        if (!nav.active) return;

        const safeDt = Number.isFinite(dt) && dt > 0 ? dt : 0.016;
        nav.elapsed += safeDt;
        const linearT = THREE.MathUtils.clamp(nav.elapsed / Math.max(nav.duration, 0.001), 0, 1);
        const t = this.easeInOutCubic(linearT);

        this.evaluateCubicBezier(nav.start, nav.controlA, nav.controlB, nav.end, t, nav.currentPosition);
        this.evaluateCubicBezierTangent(nav.start, nav.controlA, nav.controlB, nav.end, t, nav.tangent);
        if (nav.tangent.lengthSq() < 1e-9) {
          nav.tangent.copy(nav.endForward);
        }
        nav.tangent.normalize();

        nav.currentUp.copy(nav.startUp).lerp(nav.endUp, t);
        if (nav.currentUp.lengthSq() < 1e-9) {
          nav.currentUp.copy(nav.endUp);
        }
        nav.currentUp.normalize();

        nav.currentForward.copy(nav.tangent).addScaledVector(nav.currentUp, -nav.tangent.dot(nav.currentUp));
        if (nav.currentForward.lengthSq() < 1e-9) {
          nav.currentForward.copy(nav.startForward).lerp(nav.endForward, t);
          nav.currentForward.addScaledVector(nav.currentUp, -nav.currentForward.dot(nav.currentUp));
          if (nav.currentForward.lengthSq() < 1e-9) {
            nav.currentForward.crossVectors(nav.worldUp, nav.currentUp);
            if (nav.currentForward.lengthSq() < 1e-9) {
              nav.currentForward.crossVectors(nav.worldRight, nav.currentUp);
            }
          }
        }
        nav.currentForward.normalize();

        this.car.setPose(nav.currentPosition, nav.currentUp, nav.currentForward);
        this.car.speed = 0;

        if (linearT >= 1) {
          this.finishNavigation();
        }
      }

      finishNavigation() {
        const nav = this.navigation;
        if (!nav.active) return;

        if (nav.targetObject) {
          nav.targetObject.getWorldPosition(nav.targetCenter);
          nav.targetRadius = this.getEffectiveRadius(nav.targetObject, nav.targetBaseRadius);
        }

        nav.tmpA.copy(this.car.position).sub(nav.targetCenter);
        if (nav.tmpA.lengthSq() < 1e-9) {
          nav.tmpA.copy(nav.endUp);
        }
        nav.tmpA.normalize();

        nav.tmpB.copy(nav.targetCenter).addScaledVector(nav.tmpA, nav.targetRadius + this.SURFACE_OFFSET);
        nav.tmpC.copy(nav.endForward).addScaledVector(nav.tmpA, -nav.endForward.dot(nav.tmpA));
        if (nav.tmpC.lengthSq() < 1e-9) {
          nav.tmpC.crossVectors(nav.worldUp, nav.tmpA);
          if (nav.tmpC.lengthSq() < 1e-9) {
            nav.tmpC.crossVectors(nav.worldRight, nav.tmpA);
          }
        }
        nav.tmpC.normalize();

        this.car.setActivePlanet(
          nav.targetCenter,
          nav.targetRadius,
          nav.targetId,
          nav.targetObject,
          nav.targetBaseRadius,
        );
        this.car.setPose(nav.tmpB, nav.tmpA, nav.tmpC);
        this.car.speed = 0;

        nav.active = false;
        nav.elapsed = 0;
        this.cameraController.setCinematicMode(false);
        setStatus('ready');
      }

      updateNearestPlanetLine() {
        if (!this.nearestLine) {
          return;
        }

        const selectedTarget = this.getLineTarget();
        if (!selectedTarget) {
          this.nearestLine.visible = false;
          this.lastLineTargetId = null;
          setTargetLabel('-');
          this.updateSidebarPlanetSummary(null);
          return;
        }
        setTargetLabel(this.getPlanetDisplayName(selectedTarget.object));
        this.updateSidebarPlanetSummary(selectedTarget);

        this._nearestCameraPos.copy(this.camera.position);
        this._nearestPlanetPos.copy(selectedTarget.center);
        this.camera.getWorldDirection(this._nearestCameraForward);
        if (this._nearestCameraForward.lengthSq() < 1e-9) {
          this._nearestCameraForward.copy(this.car.forward);
        }
        this._nearestCameraForward.normalize();

        const cameraNear = Number.isFinite(this.camera.near) ? this.camera.near : 0.1;
        const cameraStartOffset = cameraNear + (this.options.isWallpaperMode ? 0.04 : 0.03);
        const targetStart = this._nearestTargetStart
          .copy(this._nearestCameraPos)
          .addScaledVector(this._nearestCameraForward, cameraStartOffset);

        this._nearestDir.copy(targetStart).sub(this._nearestPlanetPos);
        if (this._nearestDir.lengthSq() < 1e-9) {
          this._nearestDir.set(1, 0, 0);
        }
        this._nearestDir.normalize();

        const targetEnd = this._nearestTargetEnd.copy(this._nearestPlanetPos).addScaledVector(this._nearestDir, selectedTarget.radius);
        const smooth = this.options.isWallpaperMode ? 0.18 : 0.24;
        const isTargetChanged = selectedTarget.id !== this.lastLineTargetId;

        this._nearestStartSmoothed.copy(targetStart);
        if (!this.nearestLine.visible || isTargetChanged) {
          this._nearestEndSmoothed.copy(targetEnd);
        } else {
          this._nearestEndSmoothed.lerp(targetEnd, smooth);
        }

        this._nearestLineVector.copy(this._nearestEndSmoothed).sub(this._nearestStartSmoothed);
        const lineLength = this._nearestLineVector.length();
        if (!Number.isFinite(lineLength) || lineLength < 1e-4) {
          this.nearestLine.visible = false;
          this.lastLineTargetId = selectedTarget.id;
          return;
        }
        this._nearestLineVector.multiplyScalar(1 / lineLength);
        this._nearestLineMidpoint
          .copy(this._nearestStartSmoothed)
          .add(this._nearestEndSmoothed)
          .multiplyScalar(0.5);
        this.nearestLine.position.copy(this._nearestLineMidpoint);
        this.nearestLine.quaternion.setFromUnitVectors(this._nearestLineYAxis, this._nearestLineVector);
        const lineThickness = this.options.isWallpaperMode ? 0.56 : 0.48;
        this.nearestLine.scale.set(lineThickness, lineLength, lineThickness);

        const surfaceDistance = Math.max(
          0,
          targetStart.distanceTo(this._nearestPlanetPos) - selectedTarget.radius - this.SURFACE_OFFSET,
        );
        this._candidateToPlanetDir.copy(this._nearestPlanetPos).sub(targetStart).normalize();
        const selectedAlignment = THREE.MathUtils.clamp(this._nearestCameraForward.dot(this._candidateToPlanetDir), -1, 1);

        const baseOpacity = this.options.isWallpaperMode ? 0.52 : 0.66;
        const distanceAlpha = THREE.MathUtils.clamp(1 - (surfaceDistance - 40) / 360, 0.2, 1);
        const directionAlpha = THREE.MathUtils.clamp(0.35 + Math.max(0, selectedAlignment) * 0.65, 0.3, 1);
        this.nearestLineMaterial.opacity = baseOpacity * distanceAlpha * directionAlpha;

        const targetMaterial = selectedTarget.object
          && selectedTarget.object.userData
          && selectedTarget.object.userData.primaryMaterial
          && selectedTarget.object.userData.primaryMaterial.color
          ? selectedTarget.object.userData.primaryMaterial
          : null;

        if (targetMaterial && targetMaterial.color) {
          this._lineColorA.copy(targetMaterial.color).lerp(this._lineColorB, 0.25);
          this.nearestLineMaterial.color.copy(this._lineColorA);
        } else {
          this.nearestLineMaterial.color.setHex(0xb6ecff);
        }

        this.nearestLine.visible = true;
        this.lastLineTargetId = selectedTarget.id;
      }

      update() {
        const now = performance.now();
        const dt = Math.min(0.05, (now - this.lastTime) / 1000);
        this.lastTime = now;

        const keys = this.getControlKeys();
        if (!this.navigation.active && this.input && typeof this.input.consumeJumpRequest === 'function') {
          if (this.input.consumeJumpRequest()) {
            this.tryStartNavigation();
          }
        }
        this.handleNavigationTrigger(keys);
        if (this.globalSpacesRefreshPending && !this.globalSpacesRefreshInFlight && !this.navigation.active) {
          this.globalSpacesRefreshPending = false;
          void this.refreshPlanetScopePlanets();
        }

        if (this.navigation.active) {
          this.updateNavigation(dt);
        } else {
          this.car.update(dt, keys);
        }

        this.cameraController.setCinematicMode(this.navigation.active);
        this.cameraController.update(dt);
        this.planet.updateLod(this.camera.position);
        this.otherPlanets.update(dt, this.camera.position);
        this.updateNearestPlanetLine();
        this.ensureActivePlanetRecordsLoaded();
        this.updateFocusedRecord();

        this.renderer.render(this.scene, this.camera);
      }

      dispose() {
        this.stopAnimationLoop();
        this.syncRecordNodeVisibilityByActivePlanet(this.planet.mesh);
        if (this.canvas && this._motionGestureHandler) {
          this.canvas.removeEventListener('touchstart', this._motionGestureHandler);
          this.canvas.removeEventListener('pointerdown', this._motionGestureHandler);
          this.canvas.removeEventListener('click', this._motionGestureHandler);
          this._motionGestureHandler = null;
        }
        if (this.globalSpacesListener) {
          window.removeEventListener('message', this.globalSpacesListener);
          this.globalSpacesListener = null;
        }
        if (this.cameraController && typeof this.cameraController.dispose === 'function') {
          this.cameraController.dispose();
        }
      }
    }

    class Planet {
      constructor(radius, options) {
        this.radius = radius;
        this.options = options;
        this.lodEntries = [];
        this.sizeEntries = [];
        this.lodBlend = 1;
        this._lodCenter = new THREE.Vector3();
        this.mesh = this.createPlanet();
      }

      createPlanet() {
        const planet = new THREE.Group();

        const baseDensity = this.options.isWallpaperMode ? 0.24 : 0.19;
        const shellDensity = this.options.isWallpaperMode ? 0.079 : 0.056;
        const clutterDensity = this.options.isWallpaperMode ? 0.0058 : 0.016;

        const baseCount = countFromSphereArea(
          this.radius,
          baseDensity,
          this.options.isWallpaperMode ? 100000 : 14000,
          this.options.isWallpaperMode ? 200000 : 36000,
        );
        const shellCount = countFromSphereArea(
          this.radius + 0.9,
          shellDensity,
          this.options.isWallpaperMode ? 5000 : 3600,
          this.options.isWallpaperMode ? 16000 : 13000,
        );
        const orbitCount = this.options.isWallpaperMode ? 900 : 1700;

        const corePointSize = this.options.isWallpaperMode ? 0.065 : 0.06;
        const shellPointSize = this.options.isWallpaperMode ? 0.048 : 0.045;
        const clutterPointSize = this.options.isWallpaperMode ? 0.018 : 0.016;

        const core = buildPointCloudSphere({
          radius: this.radius,
          count: baseCount,
          jitter: this.options.isWallpaperMode ? 0.28 : 0.4,
          colors: [0x22a24f, 0x7ceb74],
          pointSize: corePointSize,
          opacity: 0.9,
          side: 'surface',
        });
        const shell = buildPointCloudSphere({
          radius: this.radius + 0.9,
          count: shellCount,
          jitter: 0.9,
          colors: [0x9fffd0, 0x53ffbe],
          pointSize: shellPointSize,
          opacity: 0.38,
          side: 'shell',
          shellThickness: 3.2,
        });

        const orbitLines = this.createLatitudeLines(orbitCount);
        const clutter = this.createClutter(clutterPointSize, clutterDensity);

        planet.add(core.points);
        planet.add(shell.points);
        planet.add(orbitLines);
        planet.add(clutter.points);

        planet.userData.coreMaterial = core.material;
        planet.userData.shellMaterial = shell.material;

        this.lodEntries = [
          this.createLodEntry(core.geometry, baseCount, this.options.isWallpaperMode ? 0.25 : 0.18),
          this.createLodEntry(shell.geometry, shellCount, this.options.isWallpaperMode ? 0.22 : 0.16),
          this.createLodEntry(clutter.geometry, clutter.count, this.options.isWallpaperMode ? 0.2 : 0.14),
        ];
        this.sizeEntries = [
          this.createSizeEntry(core.material, corePointSize),
          this.createSizeEntry(shell.material, shellPointSize),
          this.createSizeEntry(clutter.material, clutterPointSize),
        ];

        return planet;
      }

      createLodEntry(geometry, maxCount, minRatio) {
        const safeMax = Math.max(1, Math.floor(maxCount));
        const safeMin = Math.max(1, Math.floor(safeMax * minRatio));
        geometry.setDrawRange(0, safeMax);
        return {
          geometry,
          maxCount: safeMax,
          minCount: safeMin,
          currentCount: safeMax,
        };
      }

      createSizeEntry(material, baseSize) {
        return {
          material,
          baseSize,
          currentSize: baseSize,
        };
      }

      createLatitudeLines(totalPoints) {
        const lines = new THREE.Group();
        const lineCount = this.options.quality.latitudeLines;
        const pointsPerLine = Math.max(24, Math.floor(totalPoints / lineCount));

        for (let i = 0; i < lineCount; i++) {
          const lat = (i / lineCount) * Math.PI - Math.PI / 2;
          const r = this.radius * Math.cos(lat);
          const y = this.radius * Math.sin(lat);

          const positions = new Float32Array(pointsPerLine * 3);
          const colors = new Float32Array(pointsPerLine * 3);
          const lineColor = new THREE.Color(i % 4 === 0 ? 0x2ef48f : 0x1f8857);

          for (let p = 0; p < pointsPerLine; p++) {
            const t = (p / pointsPerLine) * Math.PI * 2;
            const jitter = this.options.isWallpaperMode ? 0.05 : 0.08;
            positions[p * 3] = Math.cos(t) * r + (Math.random() - 0.5) * jitter;
            positions[p * 3 + 1] = y + (Math.random() - 0.5) * jitter;
            positions[p * 3 + 2] = Math.sin(t) * r + (Math.random() - 0.5) * jitter;
            colors[p * 3] = lineColor.r;
            colors[p * 3 + 1] = lineColor.g;
            colors[p * 3 + 2] = lineColor.b;
          }

          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
          geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
          const material = new THREE.PointsMaterial({
            size: this.options.isWallpaperMode ? 0.022 : 0.018,
            transparent: true,
            opacity: i % 4 === 0 ? 0.62 : 0.26,
            depthWrite: false,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
          });

          lines.add(new THREE.Points(geometry, material));
        }

        return lines;
      }

      createClutter(pointSize, density) {
        const pointCount = countFromSphereArea(
          this.radius + 0.2,
          density,
          this.options.isWallpaperMode ? 420 : 1200,
          this.options.isWallpaperMode ? 2200 : 5200,
        );
        const clutter = buildPointCloudSphere({
          radius: this.radius + 0.2,
          count: pointCount,
          jitter: 1.2,
          colors: [0x8afcb1, 0x63b88a],
          pointSize,
          opacity: 0.28,
          side: 'shell',
          shellThickness: 3.5,
          blending: THREE.NormalBlending,
        });
        clutter.count = pointCount;
        return clutter;
      }

      updateLod(cameraPosition) {
        if (!cameraPosition || !Array.isArray(this.lodEntries) || this.lodEntries.length === 0) {
          return;
        }

        this.mesh.getWorldPosition(this._lodCenter);
        const surfaceDistance = Math.max(0, cameraPosition.distanceTo(this._lodCenter) - this.radius);
        const nearDist = this.options.isWallpaperMode ? this.radius * 0.45 : this.radius * 0.35;
        const farDist = this.options.isWallpaperMode ? this.radius * 3.8 : this.radius * 4.6;
        const range = Math.max(1, farDist - nearDist);
        const targetBlend = 1 - THREE.MathUtils.clamp((surfaceDistance - nearDist) / range, 0, 1);
        const lodSmooth = this.options.isWallpaperMode ? 0.12 : 0.16;
        this.lodBlend += (targetBlend - this.lodBlend) * lodSmooth;

        for (let i = 0; i < this.lodEntries.length; i += 1) {
          const entry = this.lodEntries[i];
          const targetCount = Math.round(THREE.MathUtils.lerp(entry.minCount, entry.maxCount, this.lodBlend));
          if (Math.abs(targetCount - entry.currentCount) >= 8) {
            entry.geometry.setDrawRange(0, targetCount);
            entry.currentCount = targetCount;
          }
        }

        if (Array.isArray(this.sizeEntries) && this.sizeEntries.length > 0) {
          const nearSizeFactor = this.options.isWallpaperMode ? 0.56 : 0.48;
          const farSizeFactor = this.options.isWallpaperMode ? 0.92 : 0.96;
          const sizeDistRange = this.options.isWallpaperMode ? this.radius * 2.2 : this.radius * 3.0;
          const sizeT = THREE.MathUtils.clamp(surfaceDistance / Math.max(1, sizeDistRange), 0, 1);
          const distanceSizeFactor = THREE.MathUtils.lerp(nearSizeFactor, farSizeFactor, sizeT);

          for (let i = 0; i < this.sizeEntries.length; i += 1) {
            const entry = this.sizeEntries[i];
            const targetSize = entry.baseSize * distanceSizeFactor;
            entry.currentSize += (targetSize - entry.currentSize) * (this.options.isWallpaperMode ? 0.12 : 0.16);
            if (entry.material) {
              entry.material.size = entry.currentSize;
            }
          }
        }
      }
    }

    class Car {
      constructor(planetRadius, surfaceOffset, options) {
        this.options = options;
        this.planetRadius = planetRadius;
        this.surfaceOffset = surfaceOffset;

        this.ACCEL = options.isWallpaperMode ? 72 : 100;
        this.BRAKE = options.isWallpaperMode ? 22 : 30;
        this.MAX_SPEED = options.isWallpaperMode ? 340 : 500;
        this.TURN_RATE = THREE.MathUtils.degToRad(options.isWallpaperMode ? 128 : 190);
        this.TURN_FACTOR_LOW_SPEED = options.isWallpaperMode ? 1.1 : 1.2;
        this.TURN_FACTOR_HIGH_SPEED = options.isWallpaperMode ? 1.7 : 2.0;
        this.DRAG = options.isWallpaperMode ? 0.992 : 0.98;
        this.HAND_BRAKE = 0.86;

        this.speed = 0;
        this.activePlanetId = 'main';
        this.activePlanetCenter = new THREE.Vector3(0, 0, 0);
        this.activePlanetRadius = planetRadius;
        this.activePlanetBaseRadius = planetRadius;
        this.activePlanetObject = null;

        this.position = new THREE.Vector3(planetRadius + surfaceOffset, 0, 0);
        this.up = new THREE.Vector3(1, 0, 0);
        this.forward = new THREE.Vector3(0, 0, 1);
        this.forward.addScaledVector(this.up, -this.forward.dot(this.up));
        if (this.forward.lengthSq() < 1e-9) {
          this.forward.set(0, 1, 0);
        }
        this.forward.normalize();

        this.mesh = new THREE.Group();
        this.mesh.castShadow = false;
        this.mesh.visible = false;
        this._moveDir = new THREE.Vector3();
        this._axis = new THREE.Vector3();
        this._relative = new THREE.Vector3();
        this._lookAtTarget = new THREE.Vector3();
        this._lookMatrix = new THREE.Matrix4();
        this._fallbackAxis = new THREE.Vector3(0, 1, 0);
        this._fallbackAxisX = new THREE.Vector3(1, 0, 0);
      }

      loadModel() {
        const loader = new GLTFLoader();
        const modelUrl = './_bmw.glb';

        loader.load(
          modelUrl,
          (gltf) => {
            try {
              const carModel = gltf.scene;
              carModel.scale.set(CAR_MODEL_UNIFORM_SCALE, CAR_MODEL_UNIFORM_SCALE, CAR_MODEL_UNIFORM_SCALE);
              carModel.rotation.set(0, Math.PI, 0);
              carModel.position.set(5.5, 2.5, 0);

              const pointCloudCar = this.createSurfacePointCar(carModel);
              if (pointCloudCar) {
                carModel.add(pointCloudCar);
              } else {
                console.warn('Could not build point-cloud car from model surface, falling back to mesh render.');
              }

              this.mesh.add(carModel);
              hideLoading();
              setStatus('ready');
            } catch (error) {
              showError('Model loaded but failed to process.', error);
            }
          },
          undefined,
          (error) => {
            showError('Failed to load car model (_bmw.glb).', error);
          },
        );
      }

      createSurfacePointCar(carModel) {
        if (!carModel || typeof carModel.traverse !== 'function') return null;

        const meshes = [];
        let totalWeight = 0;
        carModel.traverse((child) => {
          if (!child || !child.isMesh || !child.geometry) return;
          const positionAttr = child.geometry.getAttribute && child.geometry.getAttribute('position');
          const vertexCount = positionAttr && Number.isFinite(positionAttr.count) ? positionAttr.count : 0;
          if (vertexCount <= 0) return;
          const weight = Math.max(1, vertexCount);
          meshes.push({ mesh: child, weight });
          totalWeight += weight;
        });
        if (meshes.length === 0 || totalWeight <= 0) return null;

        const carPointProfile = this.options.isWallpaperMode
          ? CAR_POINT_CLOUD_PROFILE.wallpaper
          : CAR_POINT_CLOUD_PROFILE.app;
        const targetPointCount = carPointProfile.count;
        const samplesPerMesh = [];
        let assigned = 0;
        for (let i = 0; i < meshes.length; i += 1) {
          if (i === meshes.length - 1) break;
          const weightedCount = Math.round((meshes[i].weight / totalWeight) * targetPointCount);
          const safeCount = Math.max(1, weightedCount);
          samplesPerMesh.push(safeCount);
          assigned += safeCount;
        }
        samplesPerMesh.push(Math.max(1, targetPointCount - assigned));

        const actualCount = samplesPerMesh.reduce((sum, value) => sum + value, 0);
        const positions = new Float32Array(actualCount * 3);
        const colors = new Float32Array(actualCount * 3);

        carModel.updateMatrixWorld(true);
        const samplePos = new THREE.Vector3();
        const worldPos = new THREE.Vector3();
        const color = new THREE.Color();
        const baseColorA = new THREE.Color(0x53d2e8);
        const baseColorB = new THREE.Color(0xdbfbff);
        const baseColorC = new THREE.Color(0x8be9ff);
        let cursor = 0;

        const resolveMaterialColor = (meshMaterial) => {
          if (Array.isArray(meshMaterial)) {
            for (let m = 0; m < meshMaterial.length; m += 1) {
              const candidate = meshMaterial[m];
              if (candidate && candidate.color) return candidate.color;
            }
            return null;
          }
          if (meshMaterial && meshMaterial.color) return meshMaterial.color;
          return null;
        };

        for (let i = 0; i < meshes.length; i += 1) {
          const { mesh } = meshes[i];
          const sampleCount = samplesPerMesh[i];
          const sampler = new MeshSurfaceSampler(mesh).build();
          const materialColor = resolveMaterialColor(mesh.material);
          const luminance = materialColor
            ? ((0.2126 * materialColor.r) + (0.7152 * materialColor.g) + (0.0722 * materialColor.b))
            : 0.45;

          for (let s = 0; s < sampleCount; s += 1) {
            sampler.sample(samplePos);
            worldPos.copy(samplePos);
            mesh.localToWorld(worldPos);
            carModel.worldToLocal(worldPos);

            const luminanceMix = THREE.MathUtils.clamp(
              0.2 + (luminance * 0.5) + ((Math.random() - 0.5) * 0.14),
              0.12,
              0.86,
            );
            const accentMix = 0.08 + Math.random() * 0.18;
            color.copy(baseColorA).lerp(baseColorB, luminanceMix).lerp(baseColorC, accentMix);

            positions[cursor * 3] = worldPos.x;
            positions[cursor * 3 + 1] = worldPos.y;
            positions[cursor * 3 + 2] = worldPos.z;

            colors[cursor * 3] = color.r;
            colors[cursor * 3 + 1] = color.g;
            colors[cursor * 3 + 2] = color.b;
            cursor += 1;
          }

          mesh.visible = false;
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
          size: scaleParticleSize(carPointProfile.size),
          sizeAttenuation: true,
          transparent: true,
          opacity: CAR_POINT_CLOUD_PROFILE.opacity,
          depthWrite: false,
          vertexColors: true,
          map: ROUND_PARTICLE_TEXTURE || undefined,
          alphaTest: ROUND_PARTICLE_TEXTURE ? 0.12 : 0,
          blending: THREE.NormalBlending,
        });

        const points = new THREE.Points(geometry, material);
        points.name = 'car-surface-point-cloud';
        points.frustumCulled = false;
