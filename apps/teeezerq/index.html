        return points;
      }

      syncActivePlanetFromObject() {
        if (!this.activePlanetObject || !this.activePlanetObject.getWorldPosition) {
          return;
        }
        this.activePlanetObject.getWorldPosition(this.activePlanetCenter);
        const scale = this.activePlanetObject.scale && Number.isFinite(this.activePlanetObject.scale.x)
          ? this.activePlanetObject.scale.x
          : 1;
        this.activePlanetRadius = Math.max(1, this.activePlanetBaseRadius * scale);
      }

      setActivePlanet(center, radius, id, object3D, baseRadius) {
        this.activePlanetObject = object3D && object3D.getWorldPosition ? object3D : null;
        this.activePlanetBaseRadius = Math.max(
          1,
          Number.isFinite(baseRadius)
            ? baseRadius
            : (Number.isFinite(radius) ? radius : this.planetRadius),
        );

        if (this.activePlanetObject) {
          this.syncActivePlanetFromObject();
        } else {
          this.activePlanetCenter.copy(center);
          this.activePlanetRadius = Math.max(1, Number.isFinite(radius) ? radius : this.activePlanetBaseRadius);
        }

        if (typeof id === 'string' && id.length > 0) {
          this.activePlanetId = id;
        }
      }

      setPose(position, up, forward) {
        this.position.copy(position);
        this.up.copy(up);
        if (this.up.lengthSq() < 1e-9) {
          this.up.copy(this.position).sub(this.activePlanetCenter);
          if (this.up.lengthSq() < 1e-9) {
            this.up.set(1, 0, 0);
          }
        }
        this.up.normalize();

        this.forward.copy(forward);
        this.forward.addScaledVector(this.up, -this.forward.dot(this.up));
        if (this.forward.lengthSq() < 1e-9) {
          this.forward.crossVectors(this._fallbackAxis, this.up);
          if (this.forward.lengthSq() < 1e-9) {
            this.forward.crossVectors(this._fallbackAxisX, this.up);
          }
        }
        this.forward.normalize();
        this.syncMeshTransform();
      }

      snapToActiveSurface() {
        this._relative.copy(this.position).sub(this.activePlanetCenter);
        if (this._relative.lengthSq() < 1e-9) {
          this._relative.copy(this.up).multiplyScalar(this.activePlanetRadius + this.surfaceOffset);
        } else {
          this._relative.setLength(this.activePlanetRadius + this.surfaceOffset);
        }
        this.position.copy(this.activePlanetCenter).add(this._relative);
      }

      syncMeshTransform() {
        this.mesh.position.copy(this.position);
        this._lookAtTarget.copy(this.mesh.position).add(this.forward);
        this._lookMatrix.lookAt(this.mesh.position, this._lookAtTarget, this.up);
        this.mesh.quaternion.setFromRotationMatrix(this._lookMatrix);
      }

      update(dt, keys) {
        this.syncActivePlanetFromObject();
        this.up.copy(this.position).sub(this.activePlanetCenter).normalize();

        const steer = Number.isFinite(keys && keys.steer)
          ? THREE.MathUtils.clamp(keys.steer, -1, 1)
          : ((keys.a ? 1 : 0) + (keys.d ? -1 : 0));
        const throttle = Number.isFinite(keys && keys.throttle)
          ? THREE.MathUtils.clamp(keys.throttle, -1, 1)
          : ((keys.w ? 1 : 0) + (keys.s ? -1 : 0));
        const moveDir = this._moveDir.copy(this.forward).normalize();

        if (steer !== 0) {
          let steerAngle;
          if (keys.space && this.speed > 5) {
            steerAngle = steer * this.TURN_RATE * dt * 1.5;
            this.speed *= 0.95;
            this.forward.lerp(moveDir, 0.05);
          } else {
            const speedNorm = Math.min(1, Math.abs(this.speed) / this.MAX_SPEED);
            const turnFactor = THREE.MathUtils.lerp(this.TURN_FACTOR_LOW_SPEED, this.TURN_FACTOR_HIGH_SPEED, speedNorm);
            steerAngle = steer * this.TURN_RATE * dt * turnFactor;
          }
          this.rotateAroundAxis(this.forward, this.up, steerAngle).normalize();
        }

        this.forward.addScaledVector(this.up, -this.forward.dot(this.up)).normalize();

        if (throttle > 0) this.speed += this.ACCEL * throttle * dt;
        if (throttle < 0) this.speed += this.BRAKE * throttle * dt;
        this.speed = THREE.MathUtils.clamp(this.speed, -this.MAX_SPEED * 0.5, this.MAX_SPEED);
        this.speed *= keys.space ? this.HAND_BRAKE : this.DRAG;

        const axis = this._axis.crossVectors(this.up, moveDir);
        const axisLengthSq = axis.lengthSq();
        const arcLen = this.speed * dt;
        const angle = arcLen / (this.activePlanetRadius + this.surfaceOffset);

        if (Number.isFinite(angle) && axisLengthSq > 1e-10) {
          axis.multiplyScalar(1 / Math.sqrt(axisLengthSq));
          this.rotateAroundAxisAroundPoint(this.position, axis, angle, this.activePlanetCenter);
          this.rotateAroundAxis(this.forward, axis, angle);
        }

        this.snapToActiveSurface();
        this.syncMeshTransform();
      }

      rotateAroundAxis(vector, axis, angle) {
        vector.applyAxisAngle(axis, angle);
        return vector;
      }

      rotateAroundAxisAroundPoint(vector, axis, angle, point) {
        vector.sub(point).applyAxisAngle(axis, angle).add(point);
        return vector;
      }
    }

    class OtherPlanetsSystem {
      constructor(options, seededPlanetData, settings) {
        this.options = options;
        this.group = new THREE.Group();
        this.planets = [];
        this.seededPlanetData = Array.isArray(seededPlanetData) ? seededPlanetData : [];
        this.allowRandomFallback = !(settings && settings.allowRandomFallback === false);
        this.brightnessProfile = this.options.isWallpaperMode
          ? OTHER_PLANET_BRIGHTNESS_PROFILE.wallpaper
          : OTHER_PLANET_BRIGHTNESS_PROFILE.app;
        this._lodWorldPos = new THREE.Vector3();
        this._planetPrimaryColor = new THREE.Color();
        this._planetSecondaryColor = new THREE.Color();
        this._planetWhite = new THREE.Color(0xffffff);
        this._packDirection = new THREE.Vector3();
        this._packCandidate = new THREE.Vector3();
        this._packDelta = new THREE.Vector3();
        this._packBestCandidate = new THREE.Vector3();
        this.createPlanets();
      }

      createPlanets() {
        const seeded = Array.isArray(this.seededPlanetData) ? this.seededPlanetData.filter(Boolean) : [];
        let planetData = [];
        if (seeded.length > 0) {
          planetData = seeded.map((entry) => ({ ...entry }));
        } else if (this.allowRandomFallback) {
          planetData = this.createRandomPlanetData();
        }
        if (planetData.length === 0) {
          return;
        }

        planetData = this.computePackedPlanetData(planetData);

        planetData.forEach((data, index) => {
          const planet = this.createPlanet(data, index, planetData.length);
          if (typeof data.spaceId === 'string' && data.spaceId.trim().length > 0) {
            planet.userData.navId = `space:${data.spaceId.trim()}`;
          } else {
            planet.userData.navId = `planet-${index}`;
          }
          this.group.add(planet);
          this.planets.push(planet);
        });
      }

      getPlanetPackingConfig() {
        if (this.options.isWallpaperMode) {
          return {
            envelopeRadius: 1120,
            maxVisualRadius: 86,
            minRadius: 2.2,
            homeRadius: 100,
            homeGap: 40,
            planetGapBase: 18,
            planetGapRadiusRatio: 0.34,
            spacingMultiplier: 1.35,
            candidateCount: 380,
            maxAttempts: 18,
            shrinkFactor: 0.93,
          };
        }
        return {
          envelopeRadius: 1280,
          maxVisualRadius: 106,
          minRadius: 2.6,
          homeRadius: 100,
          homeGap: 46,
          planetGapBase: 22,
          planetGapRadiusRatio: 0.38,
          spacingMultiplier: 1.38,
          candidateCount: 520,
          maxAttempts: 20,
          shrinkFactor: 0.94,
        };
      }

      getInterPlanetGap(radiusA, radiusB, config) {
        const safeA = Math.max(0, Number.isFinite(radiusA) ? radiusA : 0);
        const safeB = Math.max(0, Number.isFinite(radiusB) ? radiusB : 0);
        const baseGap = Number.isFinite(config && config.planetGapBase) ? config.planetGapBase : 8;
        const ratio = Number.isFinite(config && config.planetGapRadiusRatio) ? config.planetGapRadiusRatio : 0;
        const multiplier = Number.isFinite(config && config.spacingMultiplier) ? config.spacingMultiplier : 1;
        const relatedGap = Math.min(safeA, safeB) * ratio;
        return (baseGap + relatedGap) * multiplier;
      }

      fract(value) {
        return value - Math.floor(value);
      }

      buildPackingDirection(seed, candidateIndex, totalCandidates, out) {
        const safeTotal = Math.max(1, Math.floor(totalCandidates));
        const seedNorm = this.fract((seed >>> 0) / 4294967296);
        const goldenAngle = Math.PI * (3 - Math.sqrt(5));
        const t = (candidateIndex + 0.5) / safeTotal;
        const y = 1 - (2 * t);
        const radial = Math.sqrt(Math.max(0, 1 - y * y));
        const theta = ((candidateIndex + (seedNorm * safeTotal)) * goldenAngle) + seedNorm * Math.PI * 2;
        out.set(
          Math.cos(theta) * radial,
          y,
          Math.sin(theta) * radial,
        );
        if (out.lengthSq() < 1e-9) {
          out.set(0.41, 0.63, 0.65);
        }
        return out.normalize();
      }

      tryPackPlanetsWithScale(entries, config, scale) {
        const safeScale = Number.isFinite(scale) && scale > 0 ? scale : 1;
        const candidateCount = Math.max(
          config.candidateCount,
          Math.floor(entries.length * (this.options.isWallpaperMode ? 16 : 20)),
        );

        const sorted = entries
          .map((entry) => ({
            ...entry,
            radius: Math.max(config.minRadius, entry.rawRadius * safeScale),
          }))
          .sort((a, b) => b.radius - a.radius);

        const placed = [];
        for (let i = 0; i < sorted.length; i += 1) {
          const entry = sorted[i];
          const radius = entry.radius;
          const minDistance = config.homeRadius + config.homeGap + radius;
          const maxDistance = config.envelopeRadius - radius;

          if (!(Number.isFinite(minDistance) && Number.isFinite(maxDistance)) || maxDistance <= minDistance) {
            return null;
          }

          let hasCandidate = false;
          let bestScore = Number.POSITIVE_INFINITY;

          for (let candidateIndex = 0; candidateIndex < candidateCount; candidateIndex += 1) {
            this.buildPackingDirection(entry.seed, candidateIndex, candidateCount, this._packDirection);

            const radialSample = this.fract(
              ((candidateIndex + 1) * 0.6180339887498949)
              + this.fract((entry.seed * 0.000000021458) + i * 0.137),
            );
            const radialBias = Math.pow(radialSample, 0.74);
            const distance = minDistance + (maxDistance - minDistance) * radialBias;
            this._packCandidate.copy(this._packDirection).multiplyScalar(distance);

            let isValid = true;
            let nearestClearance = Number.POSITIVE_INFINITY;
            for (let j = 0; j < placed.length; j += 1) {
              const other = placed[j];
              const minCenterDistance = radius + other.radius + this.getInterPlanetGap(radius, other.radius, config);
              const minCenterDistanceSq = minCenterDistance * minCenterDistance;
              const centerDistanceSq = this._packCandidate.distanceToSquared(other.position);
              if (centerDistanceSq < minCenterDistanceSq) {
                isValid = false;
                break;
              }
              const clearance = Math.sqrt(centerDistanceSq) - minCenterDistance;
              if (clearance < nearestClearance) nearestClearance = clearance;
            }
            if (!isValid) continue;

            const spacingBonus = Number.isFinite(nearestClearance) ? nearestClearance : 0;
            const score = distance - (spacingBonus * 0.2);
            if (score < bestScore) {
              bestScore = score;
              this._packBestCandidate.copy(this._packCandidate);
              hasCandidate = true;
            }
          }

          if (!hasCandidate) {
            return null;
          }

          placed.push({
            ...entry,
            radius,
            position: this._packBestCandidate.clone(),
            distance: this._packBestCandidate.length(),
          });
        }

        return placed;
      }

      validatePackedPlanetLayout(packed, config) {
        if (!Array.isArray(packed) || packed.length === 0) return;

        let hasViolation = false;
        const homeMin = config.homeRadius + config.homeGap;
        for (let i = 0; i < packed.length; i += 1) {
          const current = packed[i];
          const centerDistance = current.position.length();
          if (centerDistance + current.radius > config.envelopeRadius + 0.001) {
            hasViolation = true;
            break;
          }
          if (centerDistance < homeMin + current.radius - 0.001) {
            hasViolation = true;
            break;
          }
        }

        if (!hasViolation) {
          for (let i = 0; i < packed.length; i += 1) {
            const current = packed[i];
            for (let j = i + 1; j < packed.length; j += 1) {
              const other = packed[j];
              const minCenterDistance = current.radius + other.radius
                + this.getInterPlanetGap(current.radius, other.radius, config);
              this._packDelta.copy(current.position).sub(other.position);
              if (this._packDelta.lengthSq() < (minCenterDistance * minCenterDistance) - 0.001) {
                hasViolation = true;
                break;
              }
            }
            if (hasViolation) break;
          }
        }

        if (hasViolation) {
          console.warn('Planet packing validation detected an overlap or boundary violation.');
        }
      }

      computePackedPlanetData(planetData) {
        const source = Array.isArray(planetData) ? planetData.filter(Boolean) : [];
        if (source.length === 0) return [];

        const config = this.getPlanetPackingConfig();
        const entries = source.map((data, index) => {
          const baseRadius = Number.isFinite(data && data.radius) && data.radius > 0 ? data.radius : 28;
          const key = typeof data.spaceId === 'string' && data.spaceId.trim().length > 0
            ? data.spaceId.trim()
            : `planet-${index}`;
          return {
            data,
            index,
            rawRadius: baseRadius,
            seed: hashString(`${key}:${index}`),
          };
        });

        const maxRawRadius = entries.reduce((max, entry) => Math.max(max, entry.rawRadius), 0);
        let scale = maxRawRadius > 0 ? Math.min(1, config.maxVisualRadius / maxRawRadius) : 1;
        if (!Number.isFinite(scale) || scale <= 0) {
          scale = 1;
        }

        let packed = null;
        let usedScale = scale;
        for (let attempt = 0; attempt < config.maxAttempts; attempt += 1) {
          packed = this.tryPackPlanetsWithScale(entries, config, usedScale);
          if (packed) break;
          usedScale *= config.shrinkFactor;
        }

        if (!packed) {
          const emergencyConfig = {
            ...config,
            candidateCount: Math.max(config.candidateCount * 4, 2200),
          };
          packed = this.tryPackPlanetsWithScale(entries, emergencyConfig, 0.06);
          usedScale = 0.06;
        }
        if (!packed) {
          console.warn('Planet packing failed, falling back to linear safe layout.');
          const sortedFallback = entries
            .map((entry) => ({
              ...entry,
              radius: Math.max(config.minRadius, entry.rawRadius * 0.08),
            }))
            .sort((a, b) => b.radius - a.radius);
          let cursor = config.homeRadius + config.homeGap + 42;
          packed = sortedFallback.map((entry) => {
            cursor += entry.radius;
            const position = new THREE.Vector3(cursor, 0, 0);
            const packedEntry = {
              ...entry,
              position,
              distance: cursor,
            };
            cursor += entry.radius
              + ((config.planetGapBase + (entry.radius * config.planetGapRadiusRatio)) * (config.spacingMultiplier || 1))
              + 34;
            return packedEntry;
          });
        }

        this.validatePackedPlanetLayout(packed, config);

        return packed
          .sort((a, b) => a.distance - b.distance)
          .map((entry) => ({
            ...entry.data,
            radius: entry.radius,
            distance: entry.distance,
            position: entry.position.clone(),
            layoutScale: usedScale,
            layoutEnvelopeRadius: config.envelopeRadius,
          }));
      }

      createRandomPlanetData() {
        const planetColors = [
          0xff6b35, 0x4ecdc4, 0xffe66d, 0x6a0572, 0x06d6a0,
          0xff9a00, 0x5d5c61, 0x379392, 0xf25f5c, 0x247ba0,
          0x70c1b3, 0xb56576, 0xe6ccbe, 0x6a994e, 0xa44a3f,
        ];

        const min = this.options.quality.distantPlanetsMin;
        const max = this.options.quality.distantPlanetsMax;
        const numPlanets = Math.floor(Math.random() * (max - min + 1)) + min;

        const planetData = [];
        for (let i = 0; i < numPlanets; i++) {
          const color1 = planetColors[Math.floor(Math.random() * planetColors.length)];
          const color2 = planetColors[Math.floor(Math.random() * planetColors.length)];
          planetData.push({
            radius: Math.random() * 76 + 22,
            distance: Math.random() * 280 + 360,
            colors: [color1, color2],
            colorSpeed: Math.random() * 0.1 + 0.001,
            rotationSpeed: Math.random() * 0.001 + 0.0001,
            pulseSpeed: Math.random() * 0.005 + 0.002,
            pulseIntensity: Math.random() * 0.3 + 0.1,
            rotationAxis: new THREE.Vector3(
              Math.random() - 0.5,
              Math.random() - 0.5,
              Math.random() - 0.5,
            ).normalize(),
          });
        }
        return planetData;
      }

      createPlanet(data, index, total) {
        const planet = new THREE.Group();

        const packedPosition = data && data.position instanceof THREE.Vector3
          ? data.position
          : null;
        const angleOffset = Number.isFinite(data.angleOffset) ? data.angleOffset : 0;
        const angle = ((index / Math.max(total, 1)) * Math.PI * 2) + angleOffset;
        const verticalAngleRaw = Number.isFinite(data.verticalAngle)
          ? data.verticalAngle
          : (Math.random() - 0.5) * Math.PI * 0.5;
        const verticalAngle = THREE.MathUtils.clamp(verticalAngleRaw, -Math.PI * 0.45, Math.PI * 0.45);
        const baseDistance = Number.isFinite(data.distance)
          ? data.distance
          : (this.options.isWallpaperMode ? 300 : 330) + index * (this.options.isWallpaperMode ? 65 : 75);
        const baseRadius = Number.isFinite(data.radius) ? data.radius : 28;
        if (packedPosition) {
          planet.position.copy(packedPosition);
        } else {
          planet.position.x = Math.cos(angle) * Math.cos(verticalAngle) * baseDistance;
          planet.position.y = Math.sin(verticalAngle) * baseDistance;
          planet.position.z = Math.sin(angle) * Math.cos(verticalAngle) * baseDistance;
        }
        const effectiveDistance = planet.position.length();

        planet.userData = {
          ...data,
          radius: baseRadius,
          distance: effectiveDistance,
          colors: Array.isArray(data.colors) && data.colors.length >= 2
            ? [data.colors[0], data.colors[1]]
            : [0x4ecdc4, 0xffe66d],
          rotationAxis: data.rotationAxis instanceof THREE.Vector3
            ? data.rotationAxis.clone().normalize()
            : new THREE.Vector3(
              Math.random() - 0.5,
              Math.random() - 0.5,
              Math.random() - 0.5,
            ).normalize(),
        };
        planet.userData.colorProgress = 0;
        const baseRotationSpeed = Number.isFinite(data.rotationSpeed) ? Math.abs(data.rotationSpeed) : 0.00008;
        const sizeDamping = THREE.MathUtils.clamp(38 / (baseRadius + 18), 0.28, 0.9);
        planet.userData.rotationSpeed = THREE.MathUtils.clamp(baseRotationSpeed * 0.06 * sizeDamping, 0.00001, 0.00009);
        planet.userData.pulseProgress = 0;
        planet.userData.pulseSpeed = 0;
        planet.userData.pulseIntensity = 0;
        planet.userData.lodBlend = 0;
        planet.userData.recordsLoaded = false;
        planet.scale.setScalar(1);
        const brightness = this.brightnessProfile;
        planet.userData.brightnessProfile = brightness;

        const primaryDensity = this.options.isWallpaperMode ? 0.28 : 0.45;
        const secondaryDensity = this.options.isWallpaperMode ? 0.075 : 0.14;
        const primaryCount = countFromSphereArea(
          baseRadius,
          primaryDensity,
          this.options.isWallpaperMode ? 520 : 900,
          this.options.isWallpaperMode ? 9000 : 15000,
        );
        const secondaryCount = countFromSphereArea(
          baseRadius * 1.06,
          secondaryDensity,
          this.options.isWallpaperMode ? 160 : 260,
          this.options.isWallpaperMode ? 2600 : 5200,
        );
        const primaryPointSize = (this.options.isWallpaperMode ? 0.17 : 0.14) * brightness.primaryPointSizeScale;
        const secondaryPointSize = (this.options.isWallpaperMode ? 0.1 : 0.085) * brightness.secondaryPointSizeScale;

        const primaryCloud = buildPointCloudSphere({
          radius: baseRadius,
          count: primaryCount,
          jitter: 0.8,
          colors: planet.userData.colors,
          pointSize: primaryPointSize,
          opacity: brightness.primaryOpacity,
          side: 'surface',
        });
        const secondaryCloud = buildPointCloudSphere({
          radius: baseRadius * 1.06,
          count: secondaryCount,
          jitter: 1.6,
          colors: [planet.userData.colors[1], 0xffffff],
          pointSize: secondaryPointSize,
          opacity: brightness.secondaryOpacity,
          side: 'shell',
          shellThickness: baseRadius * 0.2,
          blending: THREE.AdditiveBlending,
        });

        planet.add(primaryCloud.points);
        planet.add(secondaryCloud.points);
        planet.userData.primaryMaterial = primaryCloud.material;
        planet.userData.secondaryMaterial = secondaryCloud.material;
        planet.userData.pointSizeEntries = [
          this.createPointSizeEntry(primaryCloud.material, primaryPointSize),
          this.createPointSizeEntry(secondaryCloud.material, secondaryPointSize),
        ];
        planet.userData.pointLodEntries = [
          this.createPointLodEntry(
            primaryCloud.geometry,
            primaryCount,
            brightness.primaryLodMinRatio,
          ),
          this.createPointLodEntry(
            secondaryCloud.geometry,
            secondaryCount,
            brightness.secondaryLodMinRatio,
          ),
        ];
        planet.userData.recordNodes = [];
        planet.userData.recordsLoaded = false;

        const moonChance = Number.isFinite(data.moonChance) ? data.moonChance : 0.22;
        const ringChance = Number.isFinite(data.ringChance) ? data.ringChance : 0.16;
        if (Math.random() < moonChance) this.addMoon(planet, planet.userData);
        if (Math.random() < ringChance) this.addRings(planet, planet.userData);

        return planet;
      }

      attachRecordNodesToPlanet(planet, records) {
        if (!planet || !planet.userData) return;
        if (planet.userData.recordsLoaded) return;

        const baseRadius = Number.isFinite(planet.userData.radius) ? planet.userData.radius : 28;
        const sourceRecords = Array.isArray(records) ? records : [];
        const nextData = {
          ...planet.userData,
          records: sourceRecords,
        };
        this.addRecordCloudNodes(planet, nextData, baseRadius);
        planet.userData.records = sourceRecords;
        planet.userData.recordsLoaded = true;
      }

      addMoon(planet, data) {
        const moonRadius = data.radius * (Math.random() * 0.4 + 0.1);
        const colorA = 0x9cb7ff;
        const colorB = 0x615f9b;
        const moonDensity = this.options.isWallpaperMode ? 0.38 : 0.65;
        const moonCount = countFromSphereArea(
          moonRadius,
          moonDensity,
          this.options.isWallpaperMode ? 90 : 140,
          this.options.isWallpaperMode ? 900 : 1600,
        );
        const moonCloud = buildPointCloudSphere({
          radius: moonRadius,
          count: moonCount,
          jitter: moonRadius * 0.12,
          colors: [colorA, colorB],
          pointSize: this.options.isWallpaperMode ? 0.09 : 0.075,
          opacity: 0.85,
          side: 'surface',
          blending: THREE.NormalBlending,
        });
        const moon = moonCloud.points;

        const moonDistance = data.radius * (Math.random() * 2 + 1.5);
        const moonAngle = Math.random() * Math.PI * 2;
        moon.position.x = Math.cos(moonAngle) * moonDistance;
        moon.position.z = Math.sin(moonAngle) * moonDistance;

        moon.userData = {
          rotationSpeed: data.rotationSpeed * (Math.random() * 3 + 1),
          orbitSpeed: data.rotationSpeed * (Math.random() * 2 + 0.5),
          orbitDistance: moonDistance,
          initialAngle: moonAngle,
          colors: [colorA, colorB],
          colorSpeed: data.colorSpeed * (Math.random() * 2 + 0.5),
          colorProgress: Math.random() * Math.PI * 2,
          material: moonCloud.material,
        };

        planet.add(moon);
      }

      addRings(planet, data) {
        const ringInnerRadius = data.radius * 1.2;
        const ringOuterRadius = data.radius * 2.5;
        const ringColor1 = 0xd6b35f;
        const ringColor2 = 0x8f7f4a;
        const ringDensity = this.options.isWallpaperMode ? 0.05 : 0.09;
        const ringCount = countFromAnnulusArea(
          ringInnerRadius,
          ringOuterRadius,
          ringDensity,
          this.options.isWallpaperMode ? 120 : 180,
          this.options.isWallpaperMode ? 1400 : 2600,
        );
        const positions = new Float32Array(ringCount * 3);
        const colors = new Float32Array(ringCount * 3);
        const cA = new THREE.Color(ringColor1);
        const cB = new THREE.Color(ringColor2);
        const cMix = new THREE.Color();

        for (let i = 0; i < ringCount; i++) {
          const t = (i / ringCount) * Math.PI * 2;
          const radius = THREE.MathUtils.lerp(ringInnerRadius, ringOuterRadius, Math.random());
          positions[i * 3] = Math.cos(t) * radius;
          positions[i * 3 + 1] = (Math.random() - 0.5) * 0.32;
          positions[i * 3 + 2] = Math.sin(t) * radius;
          cMix.copy(cA).lerp(cB, Math.random());
          colors[i * 3] = cMix.r;
          colors[i * 3 + 1] = cMix.g;
          colors[i * 3 + 2] = cMix.b;
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        const material = new THREE.PointsMaterial({
          size: scaleParticleSize(this.options.isWallpaperMode ? 0.08 : 0.065, 0.005),
          transparent: true,
          opacity: 0.7,
          depthWrite: false,
          vertexColors: true,
          blending: THREE.NormalBlending,
          map: ROUND_PARTICLE_TEXTURE || undefined,
          alphaTest: ROUND_PARTICLE_TEXTURE ? 0.12 : 0,
        });

        const ring = new THREE.Points(geometry, material);
        ring.rotation.x = Math.PI / 2;
        ring.rotation.z = Math.random() * Math.PI;

        ring.userData = {
          colors: [ringColor1, ringColor2],
          colorSpeed: data.colorSpeed * 0.7,
          colorProgress: Math.random() * Math.PI * 2,
          rotationSpeed: data.rotationSpeed * 0.5,
          material,
        };

        planet.add(ring);
      }

      addRecordCloudNodes(planet, data, baseRadius) {
        const sourceRecords = Array.isArray(data && data.records) ? data.records : [];
        if (sourceRecords.length === 0) {
          planet.userData.recordNodes = [];
          return;
        }

        const records = sourceRecords.filter((item) => item && typeof item === 'object');
        const recordNodes = [];
        const baseColorA = Array.isArray(data.colors) && data.colors[0] ? data.colors[0] : 0x8bd6ff;
        const baseColorB = Array.isArray(data.colors) && data.colors[1] ? data.colors[1] : 0xffffff;
        const colorA = new THREE.Color(baseColorA);
        const colorB = new THREE.Color(baseColorB);
        const totalRecords = Math.max(1, records.length);
        const goldenAngle = Math.PI * (3 - Math.sqrt(5));
        const patternSeedSource = data && typeof data.spaceId === 'string' && data.spaceId.trim().length > 0
          ? data.spaceId.trim()
          : (data && typeof data.spaceName === 'string' ? data.spaceName : 'space');
        const patternSeed = hashString(patternSeedSource);
        const patternPhase = ((patternSeed & 2047) / 2047) * Math.PI * 2;
        const patternTilt = (((patternSeed >> 11) & 255) / 255 - 0.5) * 0.24;
        const patternAxis = axisFromHash(patternSeed);

        for (let i = 0; i < records.length; i += 1) {
          const record = records[i];
          const recordId = record && typeof record.id === 'string' ? record.id : `record-${i + 1}`;
          const spaceId = data && typeof data.spaceId === 'string' && data.spaceId.trim().length > 0
            ? data.spaceId.trim()
            : (typeof data.spaceName === 'string' && data.spaceName.trim().length > 0 ? data.spaceName.trim() : 'space');
          const recordKey = `${spaceId}:${recordId}`;
          const hash = hashString(recordKey);

          const sizeFactor = 0.82 + (((hash >> 7) & 255) / 255) * 0.52;
          const payloadSize = measureRecordPayloadSize(record);
          const payloadFactor = THREE.MathUtils.clamp(
            0.9 + Math.log2(payloadSize + 2) * 0.09,
            0.95,
            1.42,
          );
          const derivedRadius = THREE.MathUtils.clamp(
            baseRadius * (this.options.isWallpaperMode ? 0.07 : 0.062) * sizeFactor * payloadFactor,
            this.options.isWallpaperMode ? 1.2 : 1.05,
            this.options.isWallpaperMode ? 5.2 : 6.6,
          );
          const minRadiusFromCar = this.options.isWallpaperMode
            ? RECORD_NODE_BASE_RADIUS * 0.62
            : RECORD_NODE_BASE_RADIUS * 0.7;
          const nodeRadius = THREE.MathUtils.clamp(
            Math.max(derivedRadius * 1.4, minRadiusFromCar),
            this.options.isWallpaperMode ? 4.2 : 5.2,
            this.options.isWallpaperMode ? 18 : 24,
          );

          // Spherical Fibonacci distribution across the whole sphere surface.
          const t = (i + 0.5) / totalRecords;
          const y = 1 - (2 * t);
          const radial = Math.sqrt(Math.max(0, 1 - y * y));
          const theta = patternPhase + i * goldenAngle;
          const normal = new THREE.Vector3(
            Math.cos(theta) * radial,
            y,
            Math.sin(theta) * radial,
          ).normalize();
          normal.applyAxisAngle(patternAxis, patternTilt);
          normal.normalize();
          const surfaceLift = this.options.isWallpaperMode
            ? THREE.MathUtils.clamp(baseRadius * 0.01, 0.55, 1.2)
            : THREE.MathUtils.clamp(baseRadius * 0.012, 0.7, 1.45);
          const altitude = baseRadius + nodeRadius + surfaceLift;
          const anchor = new THREE.Object3D();
          anchor.position.copy(normal).multiplyScalar(altitude);
          anchor.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);
          const recordProfile = this.options.isWallpaperMode ? RECORD_NODE_VISUAL_PROFILE.wallpaper : RECORD_NODE_VISUAL_PROFILE.app;
          const payloadDensityBoost = THREE.MathUtils.clamp(
            0.9 + Math.log2(payloadSize + 2) * 0.11,
            0.95,
            1.58,
          );
          const outerRadius = nodeRadius * recordProfile.outerRadiusRatio;
          const innerRadius = nodeRadius * recordProfile.innerRadiusRatio;
          const outerCount = countFromSphereArea(
            outerRadius,
            recordProfile.density * payloadDensityBoost,
            recordProfile.minCount,
            recordProfile.maxCount,
          );
          const innerCount = THREE.MathUtils.clamp(
            Math.round(outerCount * recordProfile.innerRatio),
            Math.max(680, Math.round(recordProfile.minCount * 0.38)),
            Math.max(1800, Math.round(recordProfile.maxCount * 0.62)),
          );
          const markerColorA = colorA.clone().lerp(
            colorB,
            0.24 + ((((hash >> 13) & 127) / 127) * 0.52),
          ).getHex();
          const markerColorB = colorB.clone().lerp(
            colorA,
            0.18 + ((((hash >> 20) & 127) / 127) * 0.46),
          ).getHex();
          const markerCloudOuter = buildPointCloudSphere({
            radius: outerRadius,
            count: outerCount,
            jitter: nodeRadius * recordProfile.outerJitterRatio,
            colors: [markerColorA, markerColorB],
            pointSize: recordProfile.outerPointSize,
            opacity: recordProfile.outerOpacity,
            side: 'volume',
            blending: THREE.NormalBlending,
          });
          const markerCloudInner = buildPointCloudSphere({
            radius: innerRadius,
            count: innerCount,
            jitter: nodeRadius * recordProfile.innerJitterRatio,
            colors: [markerColorA, markerColorB],
            pointSize: recordProfile.innerPointSize,
            opacity: recordProfile.innerOpacity,
            side: 'volume',
            blending: THREE.NormalBlending,
          });
          anchor.add(markerCloudOuter.points);
          anchor.add(markerCloudInner.points);
          anchor.visible = false;

          anchor.userData = {
            type: 'recordAnchor',
            record,
            spaceId,
            radius: nodeRadius,
            anchorId: recordKey,
            markerPoints: markerCloudOuter.points,
            markerMaterial: markerCloudOuter.material,
            markerBaseOpacity: markerCloudOuter.material.opacity,
            markerInnerPoints: markerCloudInner.points,
            markerInnerMaterial: markerCloudInner.material,
            markerInnerBaseOpacity: markerCloudInner.material.opacity,
            markerPulsePhase: (hash % 720) * (Math.PI / 360),
            markerPulseSpeed: 0.0026 + (((hash >> 17) & 255) / 255) * 0.0054,
            isFocused: false,
            focusStrength: 0,
          };

          planet.add(anchor);
          recordNodes.push(anchor);
        }

        planet.userData.recordNodes = recordNodes;
      }

      createPointLodEntry(geometry, maxCount, minRatio) {
        const safeMax = Math.max(1, Math.floor(maxCount));
        const safeMin = Math.max(1, Math.floor(safeMax * minRatio));
        geometry.setDrawRange(0, safeMax);
        return {
          geometry,
          maxCount: safeMax,
          minCount: safeMin,
          currentCount: safeMax,
        };
      }

      createPointSizeEntry(material, baseSize) {
        return {
          material,
          baseSize,
          currentSize: baseSize,
        };
      }

      updatePlanetLod(planet, cameraPosition) {
        if (!cameraPosition || !planet || !planet.userData || !Array.isArray(planet.userData.pointLodEntries)) {
          return;
        }

        planet.getWorldPosition(this._lodWorldPos);
        const scale = Number.isFinite(planet.scale.x) ? planet.scale.x : 1;
        const baseRadius = Number.isFinite(planet.userData.radius) ? planet.userData.radius : 16;
        const effectiveRadius = Math.max(1, baseRadius * scale);
        const surfaceDistance = Math.max(0, cameraPosition.distanceTo(this._lodWorldPos) - effectiveRadius);

        const nearDist = effectiveRadius * (this.options.isWallpaperMode ? 1.2 : 1.0) + 10;
        const farDist = effectiveRadius * (this.options.isWallpaperMode ? 6.1 : 7.4) + 220;
        const range = Math.max(1, farDist - nearDist);
        const targetBlend = 1 - THREE.MathUtils.clamp((surfaceDistance - nearDist) / range, 0, 1);
        const lodSmooth = this.options.isWallpaperMode ? 0.13 : 0.18;

        planet.userData.lodBlend += (targetBlend - planet.userData.lodBlend) * lodSmooth;

        const entries = planet.userData.pointLodEntries;
        for (let i = 0; i < entries.length; i += 1) {
          const entry = entries[i];
          const targetCount = Math.round(THREE.MathUtils.lerp(entry.minCount, entry.maxCount, planet.userData.lodBlend));
          if (Math.abs(targetCount - entry.currentCount) >= 8) {
            entry.geometry.setDrawRange(0, targetCount);
            entry.currentCount = targetCount;
          }
        }

        const sizeEntries = planet.userData.pointSizeEntries;
        if (Array.isArray(sizeEntries) && sizeEntries.length > 0) {
          const brightness = planet.userData.brightnessProfile || this.brightnessProfile;
          const radiusFactor = THREE.MathUtils.clamp(
            Math.sqrt(effectiveRadius / (this.options.isWallpaperMode ? 24 : 22)),
            brightness.lodRadiusMinFactor,
            brightness.lodRadiusMaxFactor,
          );
          const nearSizeFactor = brightness.lodNearSizeFactor;
          const farSizeFactor = brightness.lodFarSizeFactor;
          const sizeDistRange = effectiveRadius * (this.options.isWallpaperMode ? 4.8 : 6.0) + 170;
          const sizeT = THREE.MathUtils.clamp(surfaceDistance / Math.max(1, sizeDistRange), 0, 1);
          const distanceFactor = THREE.MathUtils.lerp(nearSizeFactor, farSizeFactor, sizeT);
          const sizeSmooth = this.options.isWallpaperMode ? 0.18 : 0.24;

          for (let i = 0; i < sizeEntries.length; i += 1) {
            const entry = sizeEntries[i];
            const targetSize = entry.baseSize * radiusFactor * distanceFactor;
            entry.currentSize += (targetSize - entry.currentSize) * sizeSmooth;
            if (entry.material) {
              entry.material.size = entry.currentSize;
            }
          }
        }
      }

      update(dt, cameraPosition) {
        this.planets.forEach((planet) => {
          const frameFactor = THREE.MathUtils.clamp((Number.isFinite(dt) ? dt : (1 / 60)) * 60, 0.35, 2.2);
          if (Number.isFinite(planet.userData.rotationSpeed) && planet.userData.rotationSpeed !== 0) {
            planet.rotateOnWorldAxis(planet.userData.rotationAxis, planet.userData.rotationSpeed * frameFactor);
          }

          planet.userData.colorProgress += planet.userData.colorSpeed;
          const colorMix = (Math.sin(planet.userData.colorProgress) + 1) * 0.5;
          const currentColor = new THREE.Color(planet.userData.colors[0]).lerp(
            new THREE.Color(planet.userData.colors[1]),
            colorMix,
          );
          const brightness = planet.userData.brightnessProfile || this.brightnessProfile;
          if (planet.userData.primaryMaterial && planet.userData.primaryMaterial.color) {
            this._planetPrimaryColor
              .copy(currentColor)
              .multiplyScalar(brightness.primaryColorBoost);
            planet.userData.primaryMaterial.color.copy(this._planetPrimaryColor);
          }
          if (planet.userData.secondaryMaterial && planet.userData.secondaryMaterial.color) {
            this._planetSecondaryColor
              .copy(currentColor)
              .lerp(this._planetWhite, brightness.secondaryWhiteMix)
              .multiplyScalar(brightness.secondaryColorBoost);
            planet.userData.secondaryMaterial.color.copy(this._planetSecondaryColor);
          }

          if (planet.scale.x !== 1 || planet.scale.y !== 1 || planet.scale.z !== 1) {
            planet.scale.setScalar(1);
          }
          this.updatePlanetLod(planet, cameraPosition);

          planet.children.forEach((child) => {
            if (child.userData.colors) {
              child.userData.colorProgress += child.userData.colorSpeed;
              const childColorMix = (Math.sin(child.userData.colorProgress) + 1) * 0.5;
              const childCurrentColor = new THREE.Color(child.userData.colors[0]).lerp(
                new THREE.Color(child.userData.colors[1]),
                childColorMix,
              );
              if (child.userData.material && child.userData.material.color) {
                child.userData.material.color.copy(childCurrentColor);
              }
            }

            if (child.userData.orbitSpeed) {
              child.userData.initialAngle += child.userData.orbitSpeed * frameFactor;
              child.position.x = Math.cos(child.userData.initialAngle) * child.userData.orbitDistance;
              child.position.z = Math.sin(child.userData.initialAngle) * child.userData.orbitDistance;
            }

            if (child.userData.type === 'recordAnchor') {
              if (!child.visible) {
                return;
              }
              const frameFactor = THREE.MathUtils.clamp((Number.isFinite(dt) ? dt : (1 / 60)) * 60, 0.35, 2.2);
              const focusTarget = child.userData.isFocused ? 1 : 0;
              child.userData.focusStrength += (focusTarget - child.userData.focusStrength) * 0.22;
              const focus = THREE.MathUtils.clamp(child.userData.focusStrength, 0, 1);
              if (Number.isFinite(child.userData.markerPulsePhase) && Number.isFinite(child.userData.markerPulseSpeed)) {
                child.userData.markerPulsePhase += child.userData.markerPulseSpeed * frameFactor;
              }
              const pulse = (Math.sin(Number.isFinite(child.userData.markerPulsePhase) ? child.userData.markerPulsePhase : 0) + 1) * 0.5;
              if (child.userData.markerMaterial) {
                const baseOpacity = Number.isFinite(child.userData.markerBaseOpacity) ? child.userData.markerBaseOpacity : 0.86;
                child.userData.markerMaterial.opacity = THREE.MathUtils.clamp(
                  baseOpacity * (0.72 + pulse * 0.42 + focus * 0.24),
                  0.18,
                  1,
                );
              }
              if (child.userData.markerPoints) {
                child.userData.markerPoints.scale.setScalar(1 + pulse * 0.1 + focus * 0.24);
              }
              if (child.userData.markerInnerMaterial) {
                const innerBaseOpacity = Number.isFinite(child.userData.markerInnerBaseOpacity) ? child.userData.markerInnerBaseOpacity : 0.52;
                child.userData.markerInnerMaterial.opacity = THREE.MathUtils.clamp(
                  innerBaseOpacity * (0.7 + pulse * 0.32 + focus * 0.2),
                  0.12,
                  1,
                );
              }
              if (child.userData.markerInnerPoints) {
                child.userData.markerInnerPoints.scale.setScalar(1 + pulse * 0.06 + focus * 0.18);
              }
            } else if (child.userData.type === 'recordNode') {
              const frameFactor = THREE.MathUtils.clamp((Number.isFinite(dt) ? dt : (1 / 60)) * 60, 0.35, 2.2);
              if (child.userData.rotationAxis instanceof THREE.Vector3 && Number.isFinite(child.userData.rotationSpeed)) {
                child.rotateOnAxis(child.userData.rotationAxis, child.userData.rotationSpeed * frameFactor);
              } else if (Number.isFinite(child.userData.rotationSpeed)) {
                child.rotation.y += child.userData.rotationSpeed * frameFactor;
              }

              const focusTarget = child.userData.isFocused ? 1 : 0;
              child.userData.focusStrength += (focusTarget - child.userData.focusStrength) * 0.22;
              const focus = THREE.MathUtils.clamp(child.userData.focusStrength, 0, 1);
              if (child.userData.material) {
                const baseOpacity = Number.isFinite(child.userData.baseOpacity) ? child.userData.baseOpacity : 0.82;
                child.userData.material.opacity = baseOpacity + focus * 0.35;
              }
              if (child.userData.innerMaterial) {
                const innerBaseOpacity = Number.isFinite(child.userData.innerBaseOpacity) ? child.userData.innerBaseOpacity : 0.5;
                child.userData.innerMaterial.opacity = innerBaseOpacity + focus * 0.25;
              }
              child.scale.setScalar(1 + focus * 0.45);
            } else if (Number.isFinite(child.userData.rotationSpeed)) {
              child.rotation.y += child.userData.rotationSpeed;
            }
          });
        });
      }
    }

    class StarField {
      constructor(options) {
        this.options = options;
        this.mesh = this.createStarField();
      }

      createStarField() {
        const geometry = new THREE.BufferGeometry();
        const vertices = [];
        const count = this.options.quality.starCount;

        for (let i = 0; i < count; i++) {
          const vertex = new THREE.Vector3(
            THREE.MathUtils.randFloatSpread(1),
            THREE.MathUtils.randFloatSpread(1),
            THREE.MathUtils.randFloatSpread(1),
          ).normalize().multiplyScalar(400 + Math.random() * 200);

          vertices.push(vertex.x, vertex.y, vertex.z);
        }

        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        const material = new THREE.PointsMaterial({
          size: scaleParticleSize(0.8, 0.05),
          sizeAttenuation: true,
          transparent: true,
          depthWrite: false,
          map: ROUND_PARTICLE_TEXTURE || undefined,
          alphaTest: ROUND_PARTICLE_TEXTURE ? 0.12 : 0,
        });
        return new THREE.Points(geometry, material);
      }
    }

    class MotionLookController {
      constructor(options = {}) {
        this.maxYaw = THREE.MathUtils.degToRad(Number.isFinite(options.maxYawDeg) ? options.maxYawDeg : 6);
        this.maxPitch = THREE.MathUtils.degToRad(Number.isFinite(options.maxPitchDeg) ? options.maxPitchDeg : 5);
        this.yawGain = Number.isFinite(options.yawGain) ? options.yawGain : 0.34;

        this.enabled = false;
        this.enableRequestInFlight = null;

        this.baselinePitchDeg = 0;
        this.baselineRollDeg = 0;
        this.lastOrientationTimestamp = 0;

        this.rawYaw = 0;
        this.rawPitch = 0;
        this.filteredYaw = 0;
        this.filteredPitch = 0;
        this.sampleCountLocal = 0;
        this.sampleCountTop = 0;
        this.sampleCountBridge = 0;
        this.lastSampleAt = 0;
        this.lastSampleSource = 'none';

      resolveTopWindow() {

      startListeners() {

          return false;
        }

        this.startListeners();
        this.enabled = true;

      requestParentMotionProxy() {

      async enableFromGesture() {

        } finally {

        }

      getScreenAngle() {
        if (typeof screen !== 'undefined' && screen.orientation && Number.isFinite(screen.orientation.angle)) {

        }
        if (typeof window !== 'undefined' && Number.isFinite(window.orientation)) {
          return Number(window.orientation);
        }
        return 0;

      normalizeAngleDeltaDeg(value) {
        let delta = value;
        while (delta > 180) delta -= 360;
        while (delta < -180) delta += 360;
        return delta;
      }

      normalizeTiltForScreen(pitchDeg, rollDeg) {
        const angle = this.getScreenAngle();
        if (angle === 90) {
          return { pitchDeg: -rollDeg, rollDeg: pitchDeg };
        }
        if (angle === -90 || angle === 270) {
          return { pitchDeg: rollDeg, rollDeg: -pitchDeg };
        }
        if (Math.abs(angle) === 180) {
          return { pitchDeg: -pitchDeg, rollDeg: -rollDeg };
        }
        return { pitchDeg, rollDeg };
      }

      markSample(source) {
        this.lastSampleAt = performance.now();
        this.lastSampleSource = source;
        if (source === 'top') {

        } else if (source === 'bridge') {

        } else {

        }

      calibrate() {
        this.baselineSet = false;
        this.rawYaw = 0;
        this.rawPitch = 0;
      }

      applyTiltSample(pitchDeg, rollDeg) {
        if (!Number.isFinite(pitchDeg) || !Number.isFinite(rollDeg)) return;
        const normalized = this.normalizeTiltForScreen(pitchDeg, rollDeg);

        if (!this.baselineSet) {
          this.baselinePitchDeg = normalized.pitchDeg;
          this.baselineRollDeg = normalized.rollDeg;
          this.baselineSet = true;
        }

        const pitchDelta = this.normalizeAngleDeltaDeg(normalized.pitchDeg - this.baselinePitchDeg);
        const rollDelta = this.normalizeAngleDeltaDeg(normalized.rollDeg - this.baselineRollDeg);

        const yawTarget = THREE.MathUtils.degToRad(-rollDelta * this.yawGain);
        const pitchTarget = THREE.MathUtils.degToRad(-pitchDelta * this.pitchGain);
        this.rawYaw = THREE.MathUtils.clamp(yawTarget, -this.maxYaw, this.maxYaw);
        this.rawPitch = THREE.MathUtils.clamp(pitchTarget, -this.maxPitch, this.maxPitch);

      handleOrientationEvent(event, source = 'local') {
        if (!this.enabled || !event) return;
        if (!Number.isFinite(event.beta) || !Number.isFinite(event.gamma)) return;
        this.lastOrientationTimestamp = performance.now();
        this.applyTiltSample(event.beta, event.gamma);
        this.markSample(source);

      handleMotionEvent(event, source = 'local') {
        if (!this.enabled || !event) return;
        if (source !== 'bridge' && this.lastOrientationTimestamp > 0 && (performance.now() - this.lastOrientationTimestamp) < 260) {
          return;

        if (!acc) return;
        let x = Number(acc.x);
        let y = Number(acc.y);
        const z = Number(acc.z);
        if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(z)) return;

        const angle = this.getScreenAngle();
        if (angle === 90) {
          const prevX = x;
          x = -y;
          y = prevX;
        } else if (angle === -90 || angle === 270) {
          const prevX = x;
          x = y;
          y = -prevX;
        } else if (Math.abs(angle) === 180) {
          x = -x;
          y = -y;
        }

        const rollDeg = THREE.MathUtils.radToDeg(Math.atan2(x, Math.hypot(y, z)));
        const pitchDeg = THREE.MathUtils.radToDeg(Math.atan2(y, Math.hypot(x, z)));
        this.applyTiltSample(pitchDeg, rollDeg);
        this.markSample(source);
      }

      handleParentMessage(event) {
        if (!event || !event.data || typeof event.data !== 'object') return;
        const data = event.data;
        const type = typeof data.type === 'string' ? data.type : '';

        if (!this.enabled) return;

        if (type === 'ereboonee:motion:orientation' || type === 'hayos:motionOrientation') {
          const beta = Number(data.beta);
          const gamma = Number(data.gamma);
          if (!Number.isFinite(beta) || !Number.isFinite(gamma)) return;
          this.lastOrientationTimestamp = performance.now();
          this.applyTiltSample(beta, gamma);
          this.markSample('bridge');
          return;
        }

        if (type === 'ereboonee:motion:sample' || type === 'hayos:motionSample') {
          const beta = Number(data.beta);
          const gamma = Number(data.gamma);
          if (Number.isFinite(beta) && Number.isFinite(gamma)) {
            this.lastOrientationTimestamp = performance.now();
            this.applyTiltSample(beta, gamma);
            this.markSample('bridge');
            return;
          }
          const x = Number(data.x);
          const y = Number(data.y);
          const z = Number(data.z);
          if (Number.isFinite(x) && Number.isFinite(y) && Number.isFinite(z)) {

      getDebugInfo() {

        return {

          inIframe: this.inIframe,
          hasTopWindowAccess: Boolean(this.topWindow),
          permissionState: this.permissionState,

          started: this.started,
          samples: {

            bridge: this.sampleCountBridge,
            lastSource: this.lastSampleSource,

      scheduleNoDataProbe() {

      dispose() {

          document.removeEventListener('visibilitychange', this._onVisibilityChange);

    class InputHandler {

        this.touchStartY = 0;

        this.lastTapX = 0;
        this.lastTapY = 0;

      getControlZoneBounds() {

          && mobileControlsPadEl
          && !mobileControlsEl.classList.contains('hidden')

          if (
            Number.isFinite(rect.left)
            && Number.isFinite(rect.right)
            && Number.isFinite(rect.top)
            && Number.isFinite(rect.bottom)
            && rect.width > 0
            && rect.height > 0

              right: rect.right,
              top: rect.top,
              bottom: rect.bottom,

          left: 0,
          right: width,
          top: height * this.CONTROL_ZONE_TOP_RATIO,

        const clampedX = THREE.MathUtils.clamp(clientX, bounds.left, bounds.right);
        const clampedY = THREE.MathUtils.clamp(clientY, bounds.top, bounds.bottom);
        const halfWidth = Math.max(1, (bounds.right - bounds.left) * 0.5);
        const halfHeight = Math.max(1, (bounds.bottom - bounds.top) * 0.5);
        const centerX = bounds.left + halfWidth;
        const centerY = bounds.top + halfHeight;
        const normX = THREE.MathUtils.clamp((clampedX - centerX) / halfWidth, -1, 1);
        const normY = THREE.MathUtils.clamp((centerY - clampedY) / halfHeight, -1, 1);

          if (this.isTravelMode()) {
            this.requestJump();
          } else if (this.onDoubleTapTravel) {

          }
          return;
        }

        this.lastTapTime = now;
        this.lastTapX = clientX;
        this.lastTapY = clientY;
      }

      syncKeys() {

        this.keys.throttle = THREE.MathUtils.clamp(keyboardThrottle + this.touchThrottle, -1, 1);

        this.keys.w = this.keyboardKeys.w;
        this.keys.s = this.keyboardKeys.s;
        this.keys.a = this.keyboardKeys.a;
        this.keys.d = this.keyboardKeys.d;
        this.keys.space = this.keyboardKeys.space;
        this.keys.r = this.keyboardKeys.r;

      resetAllInputs() {

        this.keyboardKeys.s = false;
        this.keyboardKeys.a = false;
        this.keyboardKeys.d = false;
        this.keyboardKeys.space = false;
        this.keyboardKeys.r = false;
        this.activeTouchId = null;
        this.touchStartX = 0;
        this.touchStartY = 0;
        this.touchMaxMoveSq = 0;

      onTouchPointerDown(event) {

        this.touchStartY = event.clientY;

            if (event.code === 'ArrowLeft') event.preventDefault();
            break;
          case 'KeyD':
          case 'ArrowRight':
            this.keyboardKeys.d = true;
            if (event.code === 'ArrowRight') event.preventDefault();
            break;
          case 'Space':
            this.keyboardKeys.space = true;
            event.preventDefault();
            break;
          case 'KeyR':
            this.keyboardKeys.r = true;
            break;
          default: break;
        }
        this.syncKeys();
      }

      onKeyUp(event) {
        switch (event.code) {
          case 'KeyW':
          case 'ArrowUp':
            this.keyboardKeys.w = false;
            if (event.code === 'ArrowUp') event.preventDefault();
            break;
          case 'KeyS':
          case 'ArrowDown':
            this.keyboardKeys.s = false;
            if (event.code === 'ArrowDown') event.preventDefault();
            break;
          case 'KeyA':
          case 'ArrowLeft':
            this.keyboardKeys.a = false;
            if (event.code === 'ArrowLeft') event.preventDefault();
            break;
          case 'KeyD':
          case 'ArrowRight':
            this.keyboardKeys.d = false;
            if (event.code === 'ArrowRight') event.preventDefault();
            break;
          case 'Space':
            this.keyboardKeys.space = false;
            event.preventDefault();
            break;
          case 'KeyR':
            this.keyboardKeys.r = false;
            break;
          default: break;
        }
        this.syncKeys();
      }
    }

    class CameraController {

        this.mouseY = 0;

        this.dragStartY = 0;

        this.lastTouchTapX = 0;

        this._tempOffset = new THREE.Vector3();
        this._desiredPosition = new THREE.Vector3();
        this._followDesiredPosition = new THREE.Vector3();
        this._topDesiredPosition = new THREE.Vector3();
        this._toCamera = new THREE.Vector3();
        this._lookTarget = new THREE.Vector3();
        this._followLookTarget = new THREE.Vector3();
        this._topLookTarget = new THREE.Vector3();
        this._blendedLookTarget = new THREE.Vector3();

      getMobileCameraZoneBottomY() {
        if (
          mobileControlsEl
          && mobileControlsPadEl
          && !mobileControlsEl.classList.contains('hidden')
        ) {
          const rect = mobileControlsPadEl.getBoundingClientRect();
          if (Number.isFinite(rect.top) && Number.isFinite(rect.height) && rect.height > 0) {
            return rect.top;
          }
        }
        return window.innerHeight * this.MOBILE_TOUCH_CAMERA_ZONE_RATIO;

      isTouchInCameraZone(clientY) {
        return clientY < this.getMobileCameraZoneBottomY();
      }

      isTouchInPitchLookZone(clientX, clientY) {
        if (!this.isTouchInCameraZone(clientY)) return false;
        const width = Math.max(1, window.innerWidth || 1);
        const sideWidth = width * this.MOBILE_TOUCH_LOOK_SIDE_RATIO;
        return clientX <= sideWidth || clientX >= (width - sideWidth);

      registerTouchTap(clientX, clientY) {

        const dx = clientX - this.lastTouchTapX;
        const dy = clientY - this.lastTouchTapY;
        const distanceSq = (dx * dx) + (dy * dy);
        const withinDelay = (now - this.lastTouchTapTime) <= this.DOUBLE_TAP_MAX_DELAY_MS;
        const withinDistance = distanceSq <= this.DOUBLE_TAP_MAX_DISTANCE_SQ;

        if (withinDelay && withinDistance) {
          this.lastTouchTapTime = 0;
          if (this.isTravelMode) {
            if (this.onDoubleTapJump) {

            }

            this.onDoubleTapTravel();
          }
          return;

        this.lastTouchTapTime = now;
        this.lastTouchTapX = clientX;
        this.lastTouchTapY = clientY;

      async enableMotionFromGesture() {

      setupMouseControls() {
        this.canvas = document.getElementById('c');

        if (!canvas) return;

        const stopDrag = (event) => {
          if (event.pointerId !== this.dragPointerId) return;
          this.isDragging = false;
          this.dragPointerId = null;
          this.dragPointerType = '';
          this.dragAllowsPitch = true;
          if (typeof canvas.releasePointerCapture === 'function') {

            } catch {

            }

            this.dragPointerId = event.pointerId;
            this.dragPointerType = 'touch';
            this.dragAllowsPitch = true;
            this.lastPointerX = event.clientX;
            this.lastPointerY = event.clientY;
            this.dragStartX = event.clientX;
            this.dragStartY = event.clientY;

              } catch {

              }

            return;
          }
          if (!this.isTravelMode) return;
          if (event.button !== 0) return;
          if (this.isDragging) return;

          this.isDragging = true;
          this.dragPointerId = event.pointerId;
          this.dragPointerType = isTouch ? 'touch' : 'mouse';
          this.dragAllowsPitch = !isTouch;
          this.lastPointerX = event.clientX;
          this.lastPointerY = event.clientY;
          this.dragStartX = event.clientX;
          this.dragStartY = event.clientY;
          this.dragMaxDistanceSq = 0;

          const dy = event.clientY - this.lastPointerY;

          this.lastPointerY = event.clientY;

          if (!isTouchDrag) {

          if (this.dragAllowsPitch) {

        canvas.addEventListener('pointercancel', handlePointerCancel);

        canvas.addEventListener('mousemove', (event) => {

      setTravelMode(enabled) {

        this.MIN_VERTICAL_ANGLE = -this.MAX_VERTICAL_ANGLE;
        this.DRAG_YAW_SENSITIVITY = this.isTravelMode ? 0.0055 : 0.004;
        this.DRAG_PITCH_SENSITIVITY = this.isTravelMode ? 0.0042 : 0.003;

        this.lookLiftTarget = THREE.MathUtils.clamp(this.lookLiftTarget, -this.MAX_LOOK_LIFT, this.MAX_LOOK_LIFT);

      update(dt) {
        const safeDt = Number.isFinite(dt) && dt > 0 ? dt : 0.016;
        let motionYaw = 0;
        let motionPitch = 0;
        let motionLookLift = 0;
        if (this.isTravelMode && this.motionLookController) {
          const motionOffsets = this.motionLookController.getOffsets();
          motionYaw = Number.isFinite(motionOffsets.yaw) ? motionOffsets.yaw : 0;
          motionPitch = Number.isFinite(motionOffsets.pitch) ? motionOffsets.pitch : 0;
          if (this.isDragging && this.dragPointerType === 'touch') {
            motionYaw *= this.MOTION_WHILE_TOUCH_LOOK_BLEND;
            motionPitch *= this.MOTION_WHILE_TOUCH_LOOK_BLEND;
          }
          motionLookLift = motionPitch * this.MOTION_PITCH_TO_LOOK_LIFT;
        }

        if (!this.isDragging && this.isTravelMode) {
          const pitchRecenterStep = THREE.MathUtils.clamp(safeDt * this.PITCH_RECENTER_RATE, 0, 1);
          this.targetAngleY += (0 - this.targetAngleY) * pitchRecenterStep;
          const lookLiftRecenterStep = THREE.MathUtils.clamp(safeDt * this.LOOK_LIFT_RECENTER_RATE, 0, 1);
          this.lookLiftTarget += (0 - this.lookLiftTarget) * lookLiftRecenterStep;
        }

        const targetAngleX = this.targetAngleX + motionYaw;
        const targetAngleY = THREE.MathUtils.clamp(this.targetAngleY, this.MIN_VERTICAL_ANGLE, this.MAX_VERTICAL_ANGLE);
        const targetLookLift = THREE.MathUtils.clamp(
          this.lookLiftTarget + motionLookLift,
          -this.MAX_LOOK_LIFT,
          this.MAX_LOOK_LIFT,
        );

        const rotationSmoothing = (this.isDragging && this.dragPointerType === 'touch')
          ? Math.max(this.ROTATION_SMOOTHNESS, this.TOUCH_LOOK_ROTATION_SMOOTHNESS)
          : this.ROTATION_SMOOTHNESS;
        this.currentAngleX += (targetAngleX - this.currentAngleX) * rotationSmoothing;
        this.currentAngleY += (targetAngleY - this.currentAngleY) * rotationSmoothing;
        this.lookLiftCurrent += (targetLookLift - this.lookLiftCurrent) * this.LOOK_LIFT_SMOOTHNESS;

        const carUp = this.car.up;
        const carForward = this.car.forward;
        const absSpeed = Math.abs(this.car.speed);
        const speedNorm = THREE.MathUtils.clamp(absSpeed / Math.max(this.car.MAX_SPEED, 1), 0, 1);

        const cinematicTarget = this.cinematicMode ? 1 : 0;
        const cinematicRate = this.cinematicMode ? this.CINEMATIC_BLEND_IN_SPEED : this.CINEMATIC_BLEND_OUT_SPEED;
        const cinematicStep = safeDt * cinematicRate;
        if (cinematicTarget > this.cinematicBlend) {
          this.cinematicBlend = Math.min(cinematicTarget, this.cinematicBlend + cinematicStep);
        } else {
          this.cinematicBlend = Math.max(cinematicTarget, this.cinematicBlend - cinematicStep);
        }

        const followDistance = THREE.MathUtils.lerp(
          this.DISTANCE,
          this.DISTANCE * this.CINEMATIC_DISTANCE_MULT,
          this.cinematicBlend,
        );
        const followHeight = THREE.MathUtils.lerp(
          this.HEIGHT,
          this.HEIGHT * this.CINEMATIC_HEIGHT_MULT,
          this.cinematicBlend,
        );
        const followLookAhead = THREE.MathUtils.lerp(
          this.LOOK_AHEAD,
          this.LOOK_AHEAD * this.CINEMATIC_LOOK_AHEAD_MULT,
          this.cinematicBlend,
        );

        const baseSmoothing = THREE.MathUtils.lerp(this.SMOOTHNESS_BASE, this.SMOOTHNESS_FAST, speedNorm);
        const smoothing = THREE.MathUtils.lerp(baseSmoothing, Math.max(this.SMOOTHNESS_FAST, 0.46), this.cinematicBlend);

        const minCamDistance = THREE.MathUtils.lerp(this.MIN_CAM_DISTANCE, this.MIN_CAM_DISTANCE * 1.2, this.cinematicBlend);
        const maxCamDistance = THREE.MathUtils.lerp(this.MAX_CAM_DISTANCE, this.MAX_CAM_DISTANCE * 1.95, this.cinematicBlend);
        const emergencyDistance = THREE.MathUtils.lerp(this.EMERGENCY_DISTANCE, this.EMERGENCY_DISTANCE * 2.3, this.cinematicBlend);

        if (absSpeed < this.STOP_SPEED_THRESHOLD && this.cinematicBlend < 0.08) {
          this.idleTimer += safeDt;
        } else if (absSpeed > this.EXIT_SPEED_THRESHOLD || this.cinematicBlend > 0.12) {
          this.idleTimer = 0;
        }
        const wantsTopView = !this.isTravelMode && this.idleTimer >= this.IDLE_DELAY && this.cinematicBlend < 0.08;
        const blendRate = wantsTopView ? this.TOP_BLEND_IN_SPEED : this.TOP_BLEND_OUT_SPEED;
        const blendStep = safeDt * blendRate;
        if (wantsTopView) {
          this.topViewBlend = Math.min(1, this.topViewBlend + blendStep);
        } else {
          this.topViewBlend = Math.max(0, this.topViewBlend - blendStep);
        }

        this._right.crossVectors(carUp, carForward).normalize();
        this._cameraOffset
          .copy(carForward)
          .multiplyScalar(-followDistance)
          .addScaledVector(carUp, followHeight);

        let cameraOffset = this._cameraOffset;
        if (this.enableMouse) {
          this._tempOffset.copy(cameraOffset);
          this._tempOffset.applyAxisAngle(carUp, this.currentAngleX);
          this._tempOffset.applyAxisAngle(this._right, this.currentAngleY);
          cameraOffset = this._tempOffset;
        }

        this._followDesiredPosition.copy(this.car.position).add(cameraOffset);
        this._topBackDir.copy(carForward).multiplyScalar(-this.TOP_BACK);
        this._topOffset.copy(carUp).multiplyScalar(this.TOP_HEIGHT).add(this._topBackDir);
        this._topDesiredPosition.copy(this.car.position).add(this._topOffset);
        this._desiredPosition
          .copy(this._followDesiredPosition)
          .lerp(this._topDesiredPosition, this.topViewBlend);

        this.camera.position.lerp(this._desiredPosition, smoothing);

        this._toCamera.copy(this.camera.position).sub(this.car.position);
        let camDistance = this._toCamera.length();
        if (!Number.isFinite(camDistance) || camDistance < 1e-5) {
          this._toCamera.copy(cameraOffset);
          camDistance = this._toCamera.length();
        }
        if (camDistance > maxCamDistance || camDistance < minCamDistance) {
          this._toCamera.normalize().multiplyScalar(
            THREE.MathUtils.clamp(camDistance, minCamDistance, maxCamDistance),
          );
          this.camera.position.copy(this.car.position).add(this._toCamera);
        }

        this._toCamera.copy(this.camera.position).sub(this.car.position);
        const postClampDistance = this._toCamera.length();
        if (postClampDistance > emergencyDistance) {
          this._safePosition.copy(this.car.position).add(cameraOffset);
          this.camera.position.lerp(this._safePosition, this.EMERGENCY_BLEND);
        }

        this._followLookTarget.copy(this.car.position).addScaledVector(carForward, followLookAhead);
        this._topLookTarget.copy(this.car.position).addScaledVector(carForward, this.TOP_LOOK_AHEAD);
        this._blendedLookTarget
          .copy(this._followLookTarget)
          .lerp(this._topLookTarget, this.topViewBlend);
        this._lookTarget
          .copy(this._blendedLookTarget)
          .addScaledVector(carUp, this.lookLiftCurrent);
        this.camera.up.copy(carUp);
        this.camera.lookAt(this._lookTarget);
      }

      dispose() {
        if (this.motionLookController && typeof this.motionLookController.dispose === 'function') {
          this.motionLookController.dispose();
        }
      }
    }

    async function init() {
      try {
        applyRootStylesFromURL();
        setStatus('bootstrapping');

        let hayosClient = null;
        let themeName = document.documentElement.getAttribute('data-theme') || DEFAULT_THEME;
        let spacePlanets = [];

        try {
          await loadHayOSClient();
          if (window.HayOSClient) {
            const client = new window.HayOSClient(APP_ID);
            await client.ensureAuthenticated();
            hayosClient = client;

            const language = await hayosClient.getLanguage();
            setLanguage(language);

            hayosClient.onLanguageChanged((nextLanguage) => {
              setLanguage(nextLanguage);
            });

            const osTheme = await loadOsTheme(hayosClient);
            if (osTheme) {
              themeName = osTheme;
            }
          } else {
            setLanguage('en');
          }
        } catch (error) {
          console.warn('HayOS bootstrap failed, starting in standalone mode:', error);
          hayosClient = null;
          setLanguage('en');
        }

        if (hayosClient) {
          try {
            setStatus('loading planets');
            spacePlanets = await fetchPlanetScopeData(hayosClient, IS_WALLPAPER_MODE);
            if (spacePlanets.length > 0) {
              setStatus(`loaded ${spacePlanets.length} planets`);
            } else {
              setStatus('no planets found');
            }
          } catch (error) {
            console.warn('Failed to bootstrap planet scope:', error);
            setStatus('planet scope unavailable');
          }
        }

        setStatus('starting renderer');

        const app = new SphericalWorldApp({
          appId: APP_ID,
          isWallpaperMode: IS_WALLPAPER_MODE,
          isTravelMode: runtimeTravelMode,
          quality: QUALITY,
          initialTheme: themeName,
          client: hayosClient,
          spacePlanets,
          useGlobalSpacePlanets: Boolean(hayosClient),
        });
        runtimeAppInstance = app;
        app.setTravelMode(runtimeTravelMode);

        app.startAnimationLoop();
        hideLoading();
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'hayos:wallpaperReady',
            appId: APP_ID,
          }, '*');
        }
        setStatus('running');
      } catch (error) {
        showError('Failed to initialize TeezerQ.', error);
      }
    }

    init();
  </script>
</body>

</html>
