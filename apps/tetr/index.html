<!DOCTYPE html>
<html lang="en" class="h-full" data-theme="coffee">
<head>
  <script data-hayos-prepaint-settings>
    (function applyHayOSPrepaintSettings() {
      try {
        var root = document.documentElement;
        var params = new URLSearchParams(window.location.search);
        var fromQueryLang = (params.get('lang') || params.get('language') || '').trim().toLowerCase();
        var fromQueryTheme = (params.get('theme') || '').trim();
        var stored = null;
        try {
          var raw = window.localStorage.getItem('hayos.settings');
          stored = raw ? JSON.parse(raw) : null;
        } catch {
          stored = null;
        }
        var language = fromQueryLang === 'hy' || fromQueryLang === 'en'
          ? fromQueryLang
          : (stored && stored.language === 'hy' ? 'hy' : 'en');
        var theme = fromQueryTheme
          || (stored && typeof stored.theme === 'string' ? stored.theme.trim() : '')
          || 'black';
        root.lang = language;
        root.setAttribute('data-theme', theme);
      } catch {
        // ignore prepaint bootstrap failures
      }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Տետր</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] {
      display: none !important;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    :root {
      --tetr-bg: oklch(var(--b2));
      --tetr-surface: oklch(var(--b1));
      --tetr-surface-soft: oklch(var(--b2));
      --tetr-text: oklch(var(--bc));
      --tetr-muted: color-mix(in oklch, oklch(var(--bc)) 58%, transparent);
      --tetr-ink-soft: color-mix(in oklch, var(--tetr-text) 84%, transparent);
      --tetr-ink-subtle: color-mix(in oklch, var(--tetr-text) 62%, transparent);
      --tetr-border: oklch(var(--b3));
      --tetr-primary: oklch(var(--p));
      --tetr-neutral: oklch(var(--n));
      --tetr-neutral-content: oklch(var(--nc));
      --tetr-warning: oklch(var(--wa));
      --tetr-press-bg: color-mix(in oklch, var(--tetr-surface) 82%, var(--tetr-bg));
      --tetr-row-active: color-mix(in oklch, var(--tetr-surface) 70%, var(--tetr-bg));
      --tetr-focus-ring: color-mix(in oklch, var(--tetr-primary) 42%, transparent);
      --tetr-shadow-float: color-mix(in oklch, var(--tetr-neutral) 30%, transparent);
      --tetr-shadow-float-soft: color-mix(in oklch, var(--tetr-neutral) 22%, transparent);
    }

    body {
      margin: 0;
      background: var(--tetr-bg);
      color: var(--tetr-text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
    }

    button,
    input,
    textarea {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .tetr-phone-shell {
      max-width: 430px;
      margin: 0 auto;
      height: 100dvh;
      min-height: 100dvh;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
      box-sizing: border-box;
      overflow: hidden;
      background: var(--tetr-surface-soft);
    }

    .tetr-stage {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      overflow-x: hidden;
      background: var(--tetr-surface-soft);
    }

    .tetr-view {
      position: absolute;
      inset: 0;
      min-height: 0;
    }

    .tetr-card {
      background: var(--tetr-surface);
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    .tetr-meta {
      font-size: 12px;
      color: var(--tetr-muted);
    }

    .tetr-screen {
      background: var(--tetr-surface-soft);
      border: 0;
      border-radius: 0;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      overflow-x: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
      box-shadow: none;
    }

    .tetr-nav {
      padding: calc(8px + env(safe-area-inset-top)) 16px 8px;
      border-bottom: 1px solid var(--tetr-border);
      background: color-mix(in oklch, var(--tetr-surface) 92%, var(--tetr-bg));
    }

    .tetr-nav-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 15px;
      font-weight: 600;
      color: var(--tetr-primary);
    }

    .tetr-nav-title {
      font-size: 32px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .tetr-soft-action {
      height: 30px;
      min-height: 30px;
      padding: 0 11px;
      border: 1px solid var(--tetr-border);
      border-radius: 10px;
      background: var(--tetr-surface);
      color: var(--tetr-ink-soft);
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      transition: transform 120ms ease, background-color 120ms ease;
    }

    .tetr-soft-action:active {
      transform: scale(0.97);
      background: var(--tetr-press-bg);
    }

    .tetr-search {
      position: relative;
    }

    .tetr-search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      color: var(--tetr-muted);
      pointer-events: none;
    }

    .tetr-search-input {
      width: 100%;
      border: 1px solid var(--tetr-border);
      background: var(--tetr-bg);
      border-radius: 11px;
      height: 34px;
      padding: 0 12px 0 30px;
      font-size: 14px;
      color: var(--tetr-text);
      outline: none;
    }

    .tetr-search-input::placeholder {
      color: var(--tetr-muted);
    }

    .tetr-chip-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 1px;
    }

    .tetr-chip-row::-webkit-scrollbar {
      display: none;
    }

    .tetr-chip {
      height: 28px;
      min-height: 28px;
      flex: 0 0 auto;
      white-space: nowrap;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--tetr-border);
      font-size: 13px;
      font-weight: 600;
      color: var(--tetr-ink-soft);
      background: var(--tetr-surface);
      transition: transform 120ms ease, background-color 120ms ease;
    }

    .tetr-chip-active {
      background: var(--tetr-neutral);
      color: var(--tetr-neutral-content);
      border-color: var(--tetr-neutral);
    }

    .tetr-chip:active {
      transform: scale(0.97);
      background: var(--tetr-press-bg);
    }

    .tetr-group-title {
      font-size: 12px;
      line-height: 1;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--tetr-muted);
      margin-bottom: 8px;
      padding-left: 2px;
    }

    .tetr-muted-copy {
      color: var(--tetr-muted);
    }

    .tetr-preview-copy {
      color: var(--tetr-ink-subtle);
    }

    .tetr-list-surface {
      background: var(--tetr-surface);
      border-top: 1px solid var(--tetr-border);
      border-bottom: 1px solid var(--tetr-border);
      margin: 0 10px;
      border-left: 1px solid var(--tetr-border);
      border-right: 1px solid var(--tetr-border);
      border-radius: 14px;
      overflow: hidden;
    }

    .tetr-note-row {
      padding: 13px 14px;
      background: var(--tetr-surface);
    }

    .tetr-note-row + .tetr-note-row {
      border-top: 1px solid var(--tetr-border);
    }

    .tetr-note-row-active {
      background: var(--tetr-row-active);
    }

    .tetr-note-title {
      font-size: 16px;
      line-height: 1.25;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .tetr-compose {
      position: absolute;
      right: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom));
      width: 46px;
      height: 46px;
      min-height: 46px;
      min-width: 46px;
      border-radius: 14px;
      border: 0;
      background: var(--tetr-neutral);
      color: var(--tetr-neutral-content);
      display: grid;
      place-items: center;
      font-size: 20px;
      line-height: 1;
      box-shadow: 0 10px 26px var(--tetr-shadow-float);
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .tetr-compose:active {
      transform: scale(0.94);
      box-shadow: 0 6px 18px var(--tetr-shadow-float-soft);
    }

    .tetr-editor-shell {
      margin: 0;
      border: 0;
      border-radius: 0;
      background: var(--tetr-surface);
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      min-height: 100%;
      box-shadow: none;
    }

    .tetr-editor-meta {
      padding: 10px 16px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--tetr-muted);
      font-size: 12px;
    }

    .tetr-editor-title {
      border: 0;
      border-bottom: 1px solid var(--tetr-border);
      background: transparent;
      padding: 11px 16px 9px;
      font-size: 23px;
      font-weight: 700;
      letter-spacing: -0.02em;
      outline: none;
    }

    .tetr-editor-body {
      border: 0;
      resize: none;
      background: transparent;
      padding: 12px 16px 14px;
      font-size: 16px;
      line-height: 1.58;
      color: var(--tetr-text);
      outline: none;
    }

    .tetr-editor-actions {
      border-top: 1px solid var(--tetr-border);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--tetr-surface);
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }

    .tetr-editor-actions .flex {
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .tetr-editor-btn {
      height: 30px;
      min-height: 30px;
      padding: 0 12px;
      border: 1px solid var(--tetr-border);
      border-radius: 999px;
      background: var(--tetr-surface);
      font-size: 13px;
      font-weight: 600;
      color: var(--tetr-ink-soft);
      transition: transform 120ms ease, background-color 120ms ease;
    }

    .tetr-editor-btn-primary {
      background: var(--tetr-neutral);
      border-color: var(--tetr-neutral);
      color: var(--tetr-neutral-content);
    }

    .tetr-editor-btn[disabled] {
      opacity: 0.45;
      cursor: not-allowed;
      pointer-events: none;
      filter: saturate(0.75);
    }

    .tetr-editor-btn:active {
      transform: scale(0.97);
      background: var(--tetr-press-bg);
    }

    .tetr-toast {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      min-width: 180px;
      max-width: calc(100vw - 40px);
      background: var(--tetr-neutral);
      color: var(--tetr-neutral-content);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      line-height: 1;
      text-align: center;
      box-shadow: 0 10px 28px var(--tetr-shadow-float);
    }

    .tetr-status-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--tetr-warning);
      display: inline-block;
      vertical-align: middle;
      margin-right: 6px;
    }

    .tetr-focusable:focus-visible {
      outline: 0;
      box-shadow: 0 0 0 3px var(--tetr-focus-ring);
    }

    .tetr-scroll-area {
      overflow: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(14px + env(safe-area-inset-bottom));
      overflow-x: hidden;
      scrollbar-width: none;
    }

    .tetr-scroll-area::-webkit-scrollbar {
      display: none;
    }

    @media (max-width: 390px) {
      .tetr-nav {
        padding-left: 14px;
        padding-right: 14px;
      }

      .tetr-nav-title {
        font-size: 30px;
      }

      .tetr-list-surface {
        margin: 0 8px;
      }

      .tetr-editor-meta,
      .tetr-editor-title,
      .tetr-editor-body {
        padding-left: 14px;
        padding-right: 14px;
      }

      .tetr-editor-actions {
        flex-wrap: wrap;
      }

      .tetr-editor-actions .tetr-meta {
        width: 100%;
      }

      .tetr-editor-actions .flex {
        width: 100%;
        justify-content: flex-end;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .tetr-soft-action,
      .tetr-chip,
      .tetr-compose,
      .tetr-editor-btn {
        transition: none;
      }
    }

    @media (max-height: 860px) {
      .tetr-screen {
        min-height: 0;
      }

      .tetr-editor-body {
        min-height: 220px;
      }
    }
  </style>
</head>
<body x-data="tetrApp()" x-init="init()">
  <div class="tetr-phone-shell" x-cloak>
    <main class="tetr-stage">
      <section
        class="tetr-card tetr-view"
        x-show="view === 'list'"
        x-transition:enter="transition ease-out duration-220"
        x-transition:enter-start="opacity-90 -translate-x-10"
        x-transition:enter-end="opacity-100 translate-x-0"
        x-transition:leave="transition ease-in duration-180"
        x-transition:leave-start="opacity-100 translate-x-0"
        x-transition:leave-end="opacity-90 -translate-x-12"
      >
        <div class="tetr-screen">
          <div class="tetr-nav">
            <div class="flex items-start justify-between">
              <div>
                <h2 class="tetr-nav-title">Notes</h2>
                <p class="text-[12px] tetr-muted-copy mt-2" x-text="listMetaLine()"></p>
              </div>
              <button class="btn btn-sm btn-outline tetr-soft-action tetr-focusable" type="button" aria-label="Edit">Edit</button>
            </div>
            <div class="mt-3 tetr-search">
              <span class="tetr-search-icon">⌕</span>
              <input type="search" class="input input-sm tetr-search-input tetr-focusable" placeholder="Search" x-model="search" />
            </div>
            <div class="tetr-chip-row">
              <button
                class="btn btn-sm btn-outline tetr-chip tetr-focusable"
                :class="filter === 'all' ? 'tetr-chip-active' : ''"
                type="button"
                @click="setFilter('all')"
              >All <span x-text="notes.length"></span></button>
              <button
                class="btn btn-sm btn-outline tetr-chip tetr-focusable"
                :class="filter === 'pinned' ? 'tetr-chip-active' : ''"
                type="button"
                @click="setFilter('pinned')"
              >Pinned <span x-text="pinnedCount()"></span></button>
              <button
                class="btn btn-sm btn-outline tetr-chip tetr-focusable"
                :class="filter === 'shared' ? 'tetr-chip-active' : ''"
                type="button"
                @click="setFilter('shared')"
              >Shared <span x-text="sharedCount()"></span></button>
            </div>
          </div>

          <div class="tetr-scroll-area bg-base-200 relative">
            <div class="p-3 pb-2" x-show="notesBySection('today').length">
              <div class="tetr-group-title">Today</div>
            </div>
            <div class="tetr-list-surface" x-show="notesBySection('today').length">
              <template x-for="note in notesBySection('today')" :key="note.id">
                <article
                  class="tetr-note-row cursor-pointer"
                  :class="activeNoteId === note.id ? 'tetr-note-row-active' : ''"
                  @click="openNote(note.id)"
                >
                  <div class="flex items-start justify-between gap-2">
                    <h3 class="tetr-note-title" x-text="note.title"></h3>
                    <span class="tetr-meta" x-text="displayUpdatedAt(note.updatedAt)"></span>
                  </div>
                  <p class="text-[13px] tetr-preview-copy mt-1 line-clamp-2" x-text="note.preview || 'No content'"></p>
                </article>
              </template>
            </div>
            <div class="p-3 pb-2 pt-4" x-show="notesBySection('yesterday').length">
              <div class="tetr-group-title">Yesterday</div>
            </div>
            <div class="tetr-list-surface" x-show="notesBySection('yesterday').length">
              <template x-for="note in notesBySection('yesterday')" :key="note.id">
                <article
                  class="tetr-note-row cursor-pointer"
                  :class="activeNoteId === note.id ? 'tetr-note-row-active' : ''"
                  @click="openNote(note.id)"
                >
                  <div class="flex items-start justify-between gap-2">
                    <h3 class="tetr-note-title" x-text="note.title"></h3>
                    <span class="tetr-meta" x-text="displayUpdatedAt(note.updatedAt)"></span>
                  </div>
                  <p class="text-[13px] tetr-preview-copy mt-1 line-clamp-2" x-text="note.preview || 'No content'"></p>
                </article>
              </template>
            </div>
            <div class="px-3 py-8 text-center tetr-muted-copy text-sm" x-show="filteredNotes.length === 0">
              No matching notes.
            </div>
            <button class="btn btn-neutral btn-square tetr-compose tetr-focusable" type="button" aria-label="Compose" @click="composeNew()">＋</button>
          </div>
        </div>
      </section>

      <section
        class="tetr-card tetr-view"
        x-show="view === 'editor'"
        x-transition:enter="transition ease-out duration-260"
        x-transition:enter-start="opacity-95 translate-x-full"
        x-transition:enter-end="opacity-100 translate-x-0"
        x-transition:leave="transition ease-in duration-180"
        x-transition:leave-start="opacity-100 translate-x-0"
        x-transition:leave-end="opacity-95 translate-x-full"
      >
        <div class="tetr-screen">
          <div class="tetr-nav">
            <div class="flex items-center justify-between">
              <button class="tetr-nav-link" type="button" aria-label="Back" @click="goBackToList()">
                <span>‹</span>
                <span>Notes</span>
              </button>
              <div class="text-center px-2">
                <p class="text-[13px] font-semibold leading-none" x-text="activeNoteTitle()"></p>
                <p class="text-[11px] tetr-muted-copy mt-1" x-text="activeNote ? `Last edited ${displayUpdatedAt(activeNote.updatedAt)}` : ''"></p>
              </div>
              <div class="flex items-center gap-2">
                <button class="btn btn-sm btn-outline tetr-soft-action tetr-focusable" type="button" aria-label="Done" @click="goBackToList()">Done</button>
              </div>
            </div>
          </div>
          <div class="bg-base-100 tetr-scroll-area">
            <div class="tetr-editor-shell" x-show="activeNote">
              <div class="tetr-editor-meta">
                <span x-text="activeNote && activeNote.pinned ? 'Pinned' : 'Not pinned'"></span>
                <span><span class="tetr-status-dot" x-show="isDirty"></span><span x-text="isDirty ? 'Unsaved changes' : 'Saved locally'"></span></span>
              </div>
              <input class="tetr-editor-title tetr-focusable" type="text" x-model="activeNote.title" @input="syncActivePreview(); markDirty()" />
              <textarea class="tetr-editor-body tetr-focusable" x-model="activeNote.content" @input="syncActivePreview(); markDirty()"></textarea>
              <div class="tetr-editor-actions">
                <span class="tetr-meta" x-text="activeNote ? `Updated ${displayUpdatedAt(activeNote.updatedAt)}` : ''"></span>
                <div class="flex items-center gap-2">
                  <button class="btn btn-sm btn-outline tetr-editor-btn tetr-focusable" type="button" @click="togglePinned()"
                    x-text="activeNote && activeNote.pinned ? 'Unpin' : 'Pin'"></button>
                  <button class="btn btn-sm btn-outline tetr-editor-btn tetr-focusable" type="button" @click="toggleShared()"
                    x-text="activeNote && activeNote.shared ? 'Unshare' : 'Share'"></button>
                  <button class="btn btn-sm btn-neutral tetr-editor-btn tetr-editor-btn-primary tetr-focusable" type="button" :disabled="!isDirty" @click="saveDraft()">Save</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="tetr-toast" x-show="toastOpen" x-transition.opacity.duration.150ms x-text="toastMessage"></div>

  <script>
    function tetrApp() {
      return {
        view: 'list',
        search: '',
        filter: 'all',
        activeNoteId: 'n1',
        draftCounter: 4,
        isDirty: false,
        toastOpen: false,
        toastMessage: '',
        toastTimer: null,
        theme: 'coffee',
        storageKey: 'hayos:tetr:ui:v1',
        notes: [
          {
            id: 'n1',
            title: 'UI direction',
            preview: 'Focus on DaisyUI components with minimal custom CSS.',
            content: 'Focus on DaisyUI components with minimal custom CSS.',
            updatedAt: '09:24',
            pinned: true,
            shared: false,
            section: 'today',
          },
          {
            id: 'n2',
            title: 'Color tone',
            preview: 'Keep it close to iOS Notes, clean and quiet.',
            content: 'Keep it close to iOS Notes, clean and quiet.',
            updatedAt: '08:03',
            pinned: false,
            shared: true,
            section: 'today',
          },
          {
            id: 'n3',
            title: 'Untitled',
            preview: 'No content',
            content: '',
            updatedAt: 'Feb 21',
            pinned: false,
            shared: false,
            section: 'yesterday',
          },
        ],
        get activeNote() {
          return this.notes.find((note) => note.id === this.activeNoteId) || this.notes[0] || null;
        },
        get filteredNotes() {
          const q = this.search.trim().toLowerCase();
          let list = this.notes.slice();
          if (this.filter === 'pinned') {
            list = list.filter((note) => note.pinned);
          } else if (this.filter === 'shared') {
            list = list.filter((note) => note.shared);
          }
          if (!q) return list;
          return list.filter((note) => {
            const hay = `${note.title} ${note.preview} ${note.content}`.toLowerCase();
            return hay.includes(q);
          });
        },
        notesBySection(section) {
          return this.filteredNotes.filter((note) => note.section === section);
        },
        listMetaLine() {
          const total = this.filteredNotes.length;
          const pinned = this.filteredNotes.filter((note) => note.pinned).length;
          const shared = this.filteredNotes.filter((note) => note.shared).length;
          return `${total} notes • ${pinned} pinned • ${shared} shared`;
        },
        pinnedCount() {
          return this.notes.filter((note) => note.pinned).length;
        },
        sharedCount() {
          return this.notes.filter((note) => note.shared).length;
        },
        displayUpdatedAt(value) {
          if (value === 'Now') return 'Just now';
          return value;
        },
        activeNoteTitle() {
          if (!this.activeNote) return 'Note';
          const title = String(this.activeNote.title || '').trim();
          return title || 'Untitled';
        },
        openNote(noteId) {
          this.activeNoteId = noteId;
          this.view = 'editor';
          this.isDirty = false;
          this.persistState();
        },
        goBackToList() {
          this.view = 'list';
          this.persistState();
        },
        composeNew() {
          const noteId = `n${this.draftCounter++}`;
          const draft = {
            id: noteId,
            title: 'New Note',
            preview: '',
            content: '',
            updatedAt: 'Now',
            pinned: false,
            shared: false,
            section: 'today',
          };
          this.notes.unshift(draft);
          this.openNote(noteId);
          this.showToast('New note');
          this.persistState();
        },
        setFilter(next) {
          this.filter = next;
          this.persistState();
        },
        markDirty() {
          this.isDirty = true;
        },
        syncActivePreview() {
          if (!this.activeNote) return;
          const compact = String(this.activeNote.content || '').replace(/\s+/g, ' ').trim();
          this.activeNote.preview = compact.slice(0, 96);
        },
        togglePinned() {
          if (!this.activeNote) return;
          this.activeNote.pinned = !this.activeNote.pinned;
          this.activeNote.updatedAt = 'Now';
          this.activeNote.section = 'today';
          this.isDirty = true;
          this.showToast(this.activeNote.pinned ? 'Pinned' : 'Unpinned');
          this.persistState();
        },
        toggleShared() {
          if (!this.activeNote) return;
          this.activeNote.shared = !this.activeNote.shared;
          this.activeNote.updatedAt = 'Now';
          this.activeNote.section = 'today';
          this.isDirty = true;
          this.showToast(this.activeNote.shared ? 'Shared' : 'Unshared');
          this.persistState();
        },
        saveDraft() {
          if (!this.activeNote) return;
          this.syncActivePreview();
          this.activeNote.updatedAt = 'Now';
          this.activeNote.section = 'today';
          this.isDirty = false;
          this.showToast('Saved');
          this.persistState();
        },
        persistState() {
          try {
            const payload = {
              notes: this.notes,
              activeNoteId: this.activeNoteId,
              filter: this.filter,
              theme: this.theme,
            };
            localStorage.setItem(this.storageKey, JSON.stringify(payload));
          } catch {
            // Ignore storage failures in UI-only mock mode.
          }
        },
        applyTheme(nextTheme) {
          if (typeof nextTheme !== 'string') return;
          const normalized = nextTheme.trim().toLowerCase();
          if (!/^[a-z0-9-]{2,24}$/.test(normalized)) return;
          this.theme = normalized;
          document.documentElement.setAttribute('data-theme', normalized);
        },
        showToast(message) {
          this.toastMessage = message;
          this.toastOpen = true;
          if (this.toastTimer) {
            clearTimeout(this.toastTimer);
          }
          this.toastTimer = setTimeout(() => {
            this.toastOpen = false;
          }, 1300);
        },
        init() {
          let parsed = null;
          try {
            const raw = localStorage.getItem(this.storageKey);
            if (raw) {
              parsed = JSON.parse(raw);
              if (parsed && Array.isArray(parsed.notes) && parsed.notes.length > 0) {
                this.notes = parsed.notes;
                this.activeNoteId = typeof parsed.activeNoteId === 'string' ? parsed.activeNoteId : this.notes[0].id;
                this.filter = parsed.filter === 'pinned' || parsed.filter === 'shared' ? parsed.filter : 'all';
                const maxId = this.notes
                  .map((note) => Number(String(note.id || '').replace(/^n/, '')))
                  .filter((num) => Number.isFinite(num))
                  .reduce((acc, curr) => Math.max(acc, curr), 0);
                this.draftCounter = Math.max(this.draftCounter, maxId + 1);
              }
            }
          } catch {
            // Ignore restore failures in UI-only mock mode.
          }
          const urlTheme = new URLSearchParams(window.location.search).get('theme');
          if (urlTheme) {
            this.applyTheme(urlTheme);
          } else if (parsed && typeof parsed.theme === 'string') {
            this.applyTheme(parsed.theme);
          } else {
            this.applyTheme(document.documentElement.getAttribute('data-theme') || this.theme);
          }
          this.notes.forEach((note) => {
            if (!note.preview && note.content) {
              const compact = String(note.content).replace(/\s+/g, ' ').trim();
              note.preview = compact.slice(0, 96);
            }
          });
          this.persistState();
        },
      };
    }
  </script>
</body>
</html>
