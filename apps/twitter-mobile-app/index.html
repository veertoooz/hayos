<!DOCTYPE html>
<html lang="en" class="h-full" data-theme="black" x-data="twitterMobileApp()" x-init="init()">

<head>
  <script data-hayos-prepaint-settings>
    (function applyHayOSPrepaintSettings() {
      try {
        var root = document.documentElement;
        var params = new URLSearchParams(window.location.search);
        var fromQueryLang = (params.get('lang') || params.get('language') || '').trim().toLowerCase();
        var fromQueryTheme = (params.get('theme') || '').trim();
        var stored = null;
        try {
          var raw = window.localStorage.getItem('hayos.settings');
          stored = raw ? JSON.parse(raw) : null;
        } catch {
          stored = null;
        }
        var language = fromQueryLang === 'hy' || fromQueryLang === 'en'
          ? fromQueryLang
          : (stored && stored.language === 'hy' ? 'hy' : 'en');
        var theme = fromQueryTheme
          || (stored && typeof stored.theme === 'string' ? stored.theme.trim() : '')
          || 'black';
        root.lang = language;
        root.setAttribute('data-theme', theme);
      } catch {
        // ignore prepaint bootstrap failures
      }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Twitter Mobile</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

  <style>
    [x-cloak] {
      display: none !important;
    }
  </style>

  <script>
    function loadHayOSClient() {
      const isLocalhost =
        window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1';
      const clientUrl = isLocalhost
        ? 'http://localhost:5173/hayos-client.js'
        : '/hayos-client.js';

      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = clientUrl;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Failed to load HayOSClient from ${clientUrl}`));
        document.head.appendChild(script);
      });
    }
  </script>
</head>

<body class="h-full min-h-dvh bg-base-200">
  <main class="min-h-dvh p-3" style="padding-bottom: calc(env(safe-area-inset-bottom) + 5.5rem);" x-cloak>
    <div class="mx-auto w-full max-w-md space-y-3">
      <header class="navbar bg-base-100 rounded-box border border-base-300 shadow-sm px-3 min-h-0 sticky top-3 z-20">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-feather-pointed text-primary"></i>
          <h1 class="text-base font-semibold">Twitter Mobile</h1>
        </div>
        <div class="ml-auto avatar">
          <div class="w-8 rounded-full ring ring-base-300 ring-offset-base-100 ring-offset-1">
            <img :src="avatarUrl" alt="User avatar" loading="lazy" />
          </div>
        </div>
      </header>

      <section class="card bg-base-100 border border-base-300 shadow-sm">
        <div class="card-body p-3 gap-2">
          <textarea
            class="textarea textarea-bordered w-full"
            rows="3"
            maxlength="280"
            placeholder="What is happening?"
            x-model="draft"
            :disabled="bootState !== 'ready'"></textarea>
          <div class="flex items-center justify-between">
            <span class="text-xs opacity-70" x-text="`${draft.length}/280`"></span>
            <button class="btn btn-primary btn-sm" :disabled="bootState !== 'ready' || !canPost" @click="publishPost()">Post</button>
          </div>
        </div>
      </section>

      <section class="space-y-2">
        <div class="alert alert-info py-2" x-show="bootState === 'loading'" x-cloak>
          <span class="loading loading-spinner loading-xs"></span>
          <span class="text-sm">Initializing...</span>
        </div>

        <div class="alert alert-error py-2" x-show="bootState === 'error'" x-cloak>
          <span class="text-sm" x-text="errorMessage"></span>
        </div>

        <template x-for="item in posts" :key="item.id">
          <article class="card bg-base-100 border border-base-300 shadow-sm">
            <div class="card-body p-3 gap-2">
              <div class="flex items-center gap-2">
                <div class="avatar">
                  <div class="w-8 rounded-full">
                    <img :src="item.authorAvatar" alt="Author avatar" loading="lazy" />
                  </div>
                </div>
                <div class="min-w-0">
                  <p class="text-sm font-semibold truncate" x-text="item.authorName"></p>
                  <p class="text-xs opacity-70 truncate" x-text="item.handle"></p>
                </div>
                <span class="ml-auto text-xs opacity-60" x-text="item.createdAtLabel"></span>
              </div>
              <p class="text-sm leading-6 whitespace-pre-wrap break-words" x-text="item.text"></p>
              <div class="card-actions">
                <button class="btn btn-ghost btn-sm">
                  <i class="fa-regular fa-heart"></i>
                  <span x-text="item.likes"></span>
                </button>
                <button class="btn btn-ghost btn-sm">
                  <i class="fa-regular fa-comment"></i>
                  <span>Reply</span>
                </button>
              </div>
            </div>
          </article>
        </template>

        <div class="card bg-base-100 border border-base-300 shadow-sm" x-show="bootState === 'ready' && posts.length === 0" x-cloak>
          <div class="card-body p-4">
            <p class="text-sm opacity-70">No posts yet. Write the first post.</p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <nav class="btm-nav btm-nav-sm z-30">
    <button class="active">
      <i class="fa-solid fa-house text-base"></i>
      <span class="btm-nav-label">Home</span>
    </button>
    <button>
      <i class="fa-solid fa-user text-base"></i>
      <span class="btm-nav-label">Profile</span>
    </button>
  </nav>

  <script>
    function twitterMobileApp() {
      return {
        appId: 'twitter-mobile',
        client: null,
        user: null,
        profile: null,
        draft: '',
        posts: [],
        bootState: 'loading',
        errorMessage: '',

        get canPost() {
          return this.draft.trim().length > 0 && this.draft.trim().length <= 280;
        },

        get avatarUrl() {
          const socialAvatar = typeof this.profile?.avatarUrl === 'string' ? this.profile.avatarUrl.trim() : '';
          const authAvatar = typeof this.user?.photoURL === 'string' ? this.user.photoURL.trim() : '';
          if (socialAvatar) return socialAvatar;
          if (authAvatar) return authAvatar;
          return 'https://placehold.co/96x96?text=U';
        },

        get authorName() {
          const displayName = typeof this.profile?.displayName === 'string' ? this.profile.displayName.trim() : '';
          if (displayName) return displayName;
          const authName = typeof this.user?.displayName === 'string' ? this.user.displayName.trim() : '';
          if (authName) return authName;
          return 'User';
        },

        get handle() {
          const socialUsername = typeof this.profile?.username === 'string' ? this.profile.username.trim() : '';
          if (socialUsername) return `@${socialUsername.replace(/^@+/, '')}`;
          if (typeof this.user?.uid === 'string' && this.user.uid) return `@${this.user.uid.slice(0, 8)}`;
          return '@user';
        },

        mapError(error) {
          const text = error && error.message ? error.message : String(error);
          if (text.includes('Not authenticated')) return 'Authentication failed. Please sign in again.';
          if (text.includes('PERMISSION_DENIED')) return 'Permission denied for this app.';
          return text;
        },

        async loadProfile() {
          try {
            this.profile = await this.client.socialProfileGet();
          } catch (error) {
            const text = String(error?.message || error || '');
            if (text.includes('Profile not found')) {
              this.profile = null;
              return;
            }
            throw error;
          }
        },

        buildPostItem(text) {
          return {
            id: `draft-${Date.now()}-${Math.random().toString(16).slice(2)}`,
            authorName: this.authorName,
            authorAvatar: this.avatarUrl,
            handle: this.handle,
            text,
            likes: 0,
            createdAtLabel: 'now',
          };
        },

        publishPost() {
          if (!this.canPost || this.bootState !== 'ready') return;
          this.posts.unshift(this.buildPostItem(this.draft.trim()));
          this.draft = '';
        },

        async init() {
          this.bootState = 'loading';
          this.errorMessage = '';
          try {
            await loadHayOSClient();
            if (typeof HayOSClient !== 'function') {
              throw new Error('HayOSClient unavailable');
            }

            this.client = new HayOSClient(this.appId);
            const auth = await this.client.ensureAuthenticated();
            this.user = auth?.user || null;
            if (!this.user) {
              throw new Error('Not authenticated');
            }

            await this.loadProfile();
            this.bootState = 'ready';
          } catch (error) {
            this.bootState = 'error';
            this.errorMessage = this.mapError(error);
          }
        },
      };
    }
  </script>
</body>

</html>
