<!DOCTYPE html>
<html lang="en" class="h-full bg-transparent" data-theme="black">
<head>
  <script data-hayos-prepaint-settings>
    (function applyHayOSPrepaintSettings() {
      try {
        var root = document.documentElement;
        var params = new URLSearchParams(window.location.search);
        var fromQueryLang = (params.get('lang') || params.get('language') || '').trim().toLowerCase();
        var fromQueryTheme = (params.get('theme') || '').trim();
        var stored = null;
        try {
          var raw = window.localStorage.getItem('hayos.settings');
          stored = raw ? JSON.parse(raw) : null;
        } catch {
          stored = null;
        }
        var language = fromQueryLang === 'hy' || fromQueryLang === 'en'
          ? fromQueryLang
          : (stored && stored.language === 'hy' ? 'hy' : 'en');
        var theme = fromQueryTheme
          || (stored && typeof stored.theme === 'string' ? stored.theme.trim() : '')
          || 'black';
        root.lang = language;
        root.setAttribute('data-theme', theme);
      } catch {
        // ignore prepaint bootstrap failures
      }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File Manager</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    body {
      overscroll-behavior: contain;
    }
  </style>
</head>
<body class="h-full bg-base-100">
  <div id="app" class="h-full"></div>

  <script>
    function loadHayOSClient() {
      const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      const clientUrl = isLocalhost ? 'http://localhost:5173/hayos-client.js' : '/hayos-client.js';
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = clientUrl;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Failed to load HayOSClient from ${clientUrl}`));
        document.head.appendChild(script);
      });
    }
  </script>

  <script type="module">
    import React from 'https://esm.sh/react@19.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@19.2.0/client';
    import { getApp, getApps, initializeApp } from 'https://esm.sh/firebase@12.8.0/app';
    import { getStorage, ref as storageRef, uploadBytesResumable } from 'https://esm.sh/firebase@12.8.0/storage';

    const h = React.createElement;

    const i18n = {
      en: {
        title: 'File Manager',
        subtitle: 'Mobile-first Local + Global explorer',
        local: 'Local',
        global: 'Global',
        searchPlaceholder: 'Search files and folders',
        empty: 'No items found.',
        refresh: 'Refresh',
        upload: 'Upload',
        folder: 'Folder',
        details: 'Details',
        close: 'Close',
        open: 'Open',
        rename: 'Rename',
        moveRoot: 'Move to Root',
        delete: 'Delete',
        actionSheet: 'Actions',
        save: 'Save',
        cancel: 'Cancel',
        confirm: 'Confirm',
        createFolderPrompt: 'Folder name',
        uploadPromptName: 'File name (e.g. image.jpg)',
        uploadPromptMime: 'MIME type (e.g. image/jpeg)',
        uploadPromptSize: 'File size bytes',
        uploadSectionTitle: 'Upload Section',
        chooseFile: 'Choose file',
        visibility: 'Visibility',
        completeUpload: 'Complete Upload',
        uploadInitDone: 'Upload session initialized',
        uploadCompleteDone: 'Upload completed',
        folderCreated: 'Folder created',
        renamed: 'Renamed',
        moved: 'Moved',
        deleted: 'Deleted',
        statusReady: 'Ready',
        statusLoading: 'Loading...',
        statusRefreshing: 'Refreshing...',
      },
      hy: {
        title: 'Ֆայլերի Կառավարիչ',
        subtitle: 'Mobile-first Local + Global դիտարկիչ',
        local: 'Local',
        global: 'Global',
        searchPlaceholder: 'Փնտրել ֆայլեր և թղթապանակներ',
        empty: 'Տվյալներ չեն գտնվել։',
        refresh: 'Թարմացնել',
        upload: 'Վերբեռնել',
        folder: 'Թղթապանակ',
        details: 'Մանրամասներ',
        close: 'Փակել',
        open: 'Բացել',
        rename: 'Վերանվանել',
        moveRoot: 'Տեղափոխել արմատ',
        delete: 'Ջնջել',
        actionSheet: 'Գործողություններ',
        save: 'Պահպանել',
        cancel: 'Չեղարկել',
        confirm: 'Հաստատել',
        createFolderPrompt: 'Թղթապանակի անուն',
        uploadPromptName: 'Ֆայլի անուն (օր. image.jpg)',
        uploadPromptMime: 'MIME type (օր. image/jpeg)',
        uploadPromptSize: 'Ֆայլի չափը byte-երով',
        uploadSectionTitle: 'Վերբեռնման Բաժին',
        chooseFile: 'Ընտրել ֆայլ',
        visibility: 'Տեսանելիություն',
        completeUpload: 'Ավարտել Վերբեռնումը',
        uploadInitDone: 'Upload session-ը սկսված է',
        uploadCompleteDone: 'Upload-ը ավարտված է',
        folderCreated: 'Թղթապանակը ստեղծված է',
        renamed: 'Վերանվանված է',
        moved: 'Տեղափոխված է',
        deleted: 'Ջնջված է',
        statusReady: 'Պատրաստ է',
        statusLoading: 'Բեռնվում է...',
        statusRefreshing: 'Թարմացվում է...',
      },
    };

    function formatBytes(value) {
      const bytes = typeof value === 'number' ? value : 0;
      if (!Number.isFinite(bytes) || bytes <= 0) return '-';
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function FileManagerApp() {
      const [loading, setLoading] = React.useState(true);
      const [status, setStatus] = React.useState('Loading...');
      const [error, setError] = React.useState('');
      const [language, setLanguage] = React.useState('en');
      const [space, setSpace] = React.useState('local');
      const [query, setQuery] = React.useState('');
      const [user, setUser] = React.useState(null);
      const [osTheme, setOsTheme] = React.useState(null);
      const [client, setClient] = React.useState(null);
      const [items, setItems] = React.useState([]);
      const [selectedItem, setSelectedItem] = React.useState(null);
      const [actionItem, setActionItem] = React.useState(null);
      const [activeUploadSession, setActiveUploadSession] = React.useState(null);
      const [inputModal, setInputModal] = React.useState(null);
      const [confirmModal, setConfirmModal] = React.useState(null);
      const [uploadDraft, setUploadDraft] = React.useState({
        fileName: '',
        mimeType: 'image/jpeg',
        sizeBytes: '0',
        visibility: 'private',
        file: null,
      });
      const [firebaseStorage, setFirebaseStorage] = React.useState(null);
      const [globalSpaceId] = React.useState('shared-files');

      const t = (key) => {
        const dict = i18n[language] || i18n.en;
        return dict[key] || i18n.en[key] || key;
      };

      React.useEffect(() => {
        let mounted = true;
        let unsubscribeLanguage = null;

        async function init() {
          try {
            await loadHayOSClient();
            const appId = new URLSearchParams(window.location.search).get('appId') || 'file-manager';
            const nextClient = new window.HayOSClient(appId);
            if (!mounted) return;
            setClient(nextClient);

            const auth = await nextClient.ensureAuthenticated();
            if (!mounted) return;
            setUser(auth.user || null);

            const nextLanguage = await nextClient.getLanguage();
            if (!mounted) return;
            const resolvedLang = nextLanguage === 'hy' ? 'hy' : 'en';
            setLanguage(resolvedLang);
            document.documentElement.lang = resolvedLang;

            unsubscribeLanguage = nextClient.onLanguageChanged((next) => {
              const lang = next === 'hy' ? 'hy' : 'en';
              setLanguage(lang);
              document.documentElement.lang = lang;
            });

            const theme = typeof nextClient.getTheme === 'function'
              ? await nextClient.getTheme()
              : await nextClient.requestTheme();
            if (!mounted) return;
            setOsTheme(theme || null);
            const firebaseConfig = await nextClient.firebaseConfigGet();
            const appForStorage = getApps().length > 0
              ? getApp()
              : initializeApp({
                apiKey: firebaseConfig.apiKey,
                authDomain: firebaseConfig.authDomain,
                projectId: firebaseConfig.projectId,
                appId: firebaseConfig.appId,
                measurementId: firebaseConfig.measurementId || undefined,
                storageBucket: firebaseConfig.storageBucket,
              });
            setFirebaseStorage(getStorage(appForStorage));
            setStatus('Ready');
            await loadItems(nextClient, space, '');
          } catch (err) {
            if (!mounted) return;
            setError(err && err.message ? err.message : String(err));
            setStatus('Init failed');
          } finally {
            if (mounted) {
              setLoading(false);
            }
          }
        }

        init();

        return () => {
          mounted = false;
          if (typeof unsubscribeLanguage === 'function') {
            unsubscribeLanguage();
          }
        };
      }, []);

      const loadItems = React.useCallback(async (apiClient, targetSpace, searchText) => {
        if (!apiClient) return;
        try {
          setError('');
          const baseParams = {
            space: targetSpace,
            limit: 80,
            spaceId: targetSpace === 'global' ? globalSpaceId : undefined,
          };
          const rows = searchText.trim()
            ? await apiClient.filesSearch({ ...baseParams, query: searchText.trim() })
            : await apiClient.filesList(baseParams);
          setItems(Array.isArray(rows) ? rows : []);
          setStatus('Ready');
        } catch (err) {
          const message = err && err.message ? err.message : String(err);
          setError(message);
          setStatus(message.includes('PERMISSION_DENIED') ? 'Permission denied' : message);
        }
      }, [globalSpaceId]);

      React.useEffect(() => {
        if (!client || loading) return;
        const timer = window.setTimeout(() => {
          loadItems(client, space, query);
        }, 200);
        return () => window.clearTimeout(timer);
      }, [client, loading, space, query, loadItems]);

      const onRefresh = async () => {
        if (!client) return;
        setStatus(t('statusRefreshing'));
        await loadItems(client, space, query);
      };

      const openItem = async (item) => {
        if (!client || !item) return;
        try {
          const data = await client.filesGet(item.id, {
            space,
            spaceId: space === 'global' ? globalSpaceId : undefined,
          });
          setSelectedItem(data || item);
        } catch (err) {
          setError(err && err.message ? err.message : String(err));
        }
      };

      const submitCreateFolder = async (name) => {
        if (!client || !name || !name.trim()) return;
        try {
          await client.filesCreateFolder(name.trim(), {
            space,
            spaceId: space === 'global' ? globalSpaceId : undefined,
            parentId: null,
          });
          setInputModal(null);
          setStatus(t('folderCreated'));
          await loadItems(client, space, query);
        } catch (err) {
          setError(err && err.message ? err.message : String(err));
        }
      };

      const submitUpload = async (payload) => {
        if (!client || !firebaseStorage || space !== 'local') return;
        const fileName = typeof payload?.fileName === 'string' ? payload.fileName.trim() : '';
        const mimeType = typeof payload?.mimeType === 'string' ? payload.mimeType.trim() : '';
        const sizeBytes = Number(payload?.sizeBytes);
        const visibility = typeof payload?.visibility === 'string' ? payload.visibility : 'private';
        const file = payload?.file instanceof File ? payload.file : null;
        if (!fileName || !mimeType || !Number.isFinite(sizeBytes) || sizeBytes <= 0) return;
        try {
          const initData = await client.filesUploadInit(
            { fileName: fileName.trim(), mimeType: mimeType.trim(), sizeBytes, visibility },
            { space: 'local' },
          );
          if (!file || !initData?.targetPath || !initData?.sessionId) {
            throw new Error('Upload file or target path missing');
          }
          await new Promise((resolve, reject) => {
            const task = uploadBytesResumable(
              storageRef(firebaseStorage, initData.targetPath),
              file,
              { contentType: mimeType.trim() },
            );
            task.on('state_changed', undefined, reject, resolve);
          });
          setInputModal(null);
          setActiveUploadSession(initData);
          setStatus(t('uploadInitDone'));
        } catch (err) {
          setError(err && err.message ? err.message : String(err));
        }
      };

      const completeUpload = async () => {
        if (!client || !activeUploadSession || !activeUploadSession.sessionId) return;
        try {
          await client.filesUploadComplete(activeUploadSession.sessionId, { space: 'local' });
          setActiveUploadSession(null);
          setStatus(t('uploadCompleteDone'));
          await loadItems(client, space, query);
        } catch (err) {
          setError(err && err.message ? err.message : String(err));
        }
      };

      const submitRenameItem = async (item, name) => {
        if (!client || !item || item.readonly || !name || !name.trim()) return;
        try {
          await client.filesRename(item.id, name.trim(), {
            space,
            spaceId: space === 'global' ? globalSpaceId : undefined,
          });
          setInputModal(null);
          setActionItem(null);
          setStatus(t('renamed'));
          await loadItems(client, space, query);
        } catch (err) {
          setError(err && err.message ? err.message : String(err));
        }
      };

      const moveItemToRoot = async (item) => {
        if (!client || !item || item.readonly) return;
        try {
          await client.filesMove(item.id, null, {
            space,
            spaceId: space === 'global' ? globalSpaceId : undefined,
          });
          setActionItem(null);
          setStatus(t('moved'));
          await loadItems(client, space, query);
        } catch (err) {
          setError(err && err.message ? err.message : String(err));
        }
      };

      const deleteItem = async (item) => {
        if (!client || !item || item.readonly) return;
        try {
          await client.filesDelete(item.id, {
            space,
            spaceId: space === 'global' ? globalSpaceId : undefined,
          });
          setConfirmModal(null);
          setActionItem(null);
          setSelectedItem(null);
          setStatus(t('deleted'));
          await loadItems(client, space, query);
        } catch (err) {
          setError(err && err.message ? err.message : String(err));
        }
      };

      const openCreateFolderModal = () => {
        setInputModal({
          kind: 'createFolder',
          title: t('folder'),
          value: '',
        });
      };

      const openUploadModal = () => {
        if (space !== 'local') return;
        setInputModal({
          kind: 'upload',
          title: t('upload'),
          fileName: '',
          mimeType: 'image/jpeg',
          sizeBytes: '2048',
        });
      };

      const openRenameModal = (item) => {
        if (!item || item.readonly) return;
        setInputModal({
          kind: 'rename',
          title: t('rename'),
          item,
          value: item.name || '',
        });
      };

      const openDeleteConfirm = (item) => {
        if (!item || item.readonly) return;
        setConfirmModal({
          title: t('delete'),
          item,
          message: `${t('delete')} "${item.name || item.id}"?`,
        });
      };

      const onFilePicked = (event) => {
        const file = event && event.target && event.target.files && event.target.files[0]
          ? event.target.files[0]
          : null;
        if (!file) return;
        setUploadDraft((prev) => ({
          ...prev,
          fileName: typeof file.name === 'string' ? file.name : prev.fileName,
          mimeType: typeof file.type === 'string' && file.type ? file.type : prev.mimeType,
          sizeBytes: String(typeof file.size === 'number' ? file.size : prev.sizeBytes),
          file,
        }));
      };

      return h(
        'main',
        { className: 'h-full max-w-md mx-auto flex flex-col bg-base-100' },
        h(
          'header',
          { className: 'sticky top-0 z-10 bg-base-100/95 backdrop-blur border-b border-base-300 p-3 space-y-2' },
          h(
            'div',
            { className: 'flex items-start justify-between gap-3' },
            h('div', null,
              h('h1', { className: 'text-lg font-semibold leading-tight' }, t('title')),
              h('p', { className: 'text-xs opacity-70' }, t('subtitle'))
            ),
            h('div', { className: 'text-right' },
              h('div', { className: 'badge badge-outline text-[10px]' }, space),
              h('div', { className: 'text-[10px] opacity-70 mt-1' }, user && user.uid ? user.uid.slice(0, 10) : '-')
            )
          ),
          h(
            'div',
            { className: 'flex gap-2' },
            h(
              'button',
              {
                className: `btn btn-sm flex-1 ${space === 'local' ? 'btn-primary' : 'btn-outline'}`,
                onClick: () => { setSpace('local'); setSelectedItem(null); setActionItem(null); },
                disabled: loading,
              },
              h('i', { className: 'fa-solid fa-mobile-screen mr-2' }),
              t('local')
            ),
            h(
              'button',
              {
                className: `btn btn-sm flex-1 ${space === 'global' ? 'btn-primary' : 'btn-outline'}`,
                onClick: () => { setSpace('global'); setSelectedItem(null); setActionItem(null); },
                disabled: loading,
              },
              h('i', { className: 'fa-solid fa-globe mr-2' }),
              t('global')
            )
          ),
          h(
            'label',
            { className: 'input input-bordered input-sm flex items-center gap-2' },
            h('i', { className: 'fa-solid fa-magnifying-glass opacity-60' }),
            h('input', {
              className: 'grow',
              value: query,
              onChange: (event) => setQuery(event.target.value),
              placeholder: t('searchPlaceholder'),
            })
          )
        ),
        h(
          'section',
          { className: 'flex-1 overflow-auto p-3 pb-28 space-y-2' },
          error ? h('div', { className: 'alert alert-error text-sm' }, error) : null,
          h('div', { className: 'text-xs opacity-70 px-1' }, `Status: ${status}`),
          activeUploadSession && activeUploadSession.sessionId
            ? h('div', { className: 'alert alert-info text-xs' }, `Upload session: ${activeUploadSession.sessionId}`)
            : null,
          space === 'local'
            ? h(
              'section',
              { className: 'card bg-base-200 border border-base-300 p-3 space-y-2' },
              h('h3', { className: 'text-sm font-semibold' }, t('uploadSectionTitle')),
              h('input', {
                type: 'file',
                className: 'file-input file-input-bordered file-input-sm w-full',
                onChange: onFilePicked,
              }),
              h(
                'div',
                { className: 'grid grid-cols-1 gap-2' },
                h('input', {
                  className: 'input input-bordered input-sm w-full',
                  placeholder: t('uploadPromptName'),
                  value: uploadDraft.fileName,
                  onChange: (event) => setUploadDraft((prev) => ({ ...prev, fileName: event.target.value })),
                }),
                h('input', {
                  className: 'input input-bordered input-sm w-full',
                  placeholder: t('uploadPromptMime'),
                  value: uploadDraft.mimeType,
                  onChange: (event) => setUploadDraft((prev) => ({ ...prev, mimeType: event.target.value })),
                }),
                h('input', {
                  className: 'input input-bordered input-sm w-full',
                  placeholder: t('uploadPromptSize'),
                  value: uploadDraft.sizeBytes,
                  onChange: (event) => setUploadDraft((prev) => ({ ...prev, sizeBytes: event.target.value })),
                }),
                h(
                  'select',
                  {
                    className: 'select select-bordered select-sm w-full',
                    value: uploadDraft.visibility,
                    onChange: (event) => setUploadDraft((prev) => ({ ...prev, visibility: event.target.value })),
                  },
                  h('option', { value: 'private' }, 'private'),
                  h('option', { value: 'followers' }, 'followers'),
                  h('option', { value: 'public' }, 'public')
                )
              ),
              h(
                'div',
                { className: 'grid grid-cols-2 gap-2' },
                h(
                  'button',
                  {
                    className: 'btn btn-sm btn-primary',
                    disabled: !client || !firebaseStorage || !uploadDraft.file,
                    onClick: () => submitUpload(uploadDraft),
                  },
                  t('upload')
                ),
                h(
                  'button',
                  {
                    className: 'btn btn-sm btn-outline',
                    disabled: !activeUploadSession || !activeUploadSession.sessionId || !client,
                    onClick: completeUpload,
                  },
                  t('completeUpload')
                )
              )
            )
            : null,
          osTheme && osTheme.mode
            ? h('div', { className: 'text-[11px] opacity-60 px-1' }, `Theme mode: ${osTheme.mode}`)
            : null,
          loading
            ? h('div', { className: 'space-y-2' },
                h('div', { className: 'skeleton h-16 w-full' }),
                h('div', { className: 'skeleton h-16 w-full' }),
                h('div', { className: 'skeleton h-16 w-full' })
              )
            : null,
          !loading && items.length === 0
            ? h('div', { className: 'card bg-base-200 p-4 text-sm opacity-70' }, t('empty'))
            : null,
          !loading && items.map((item) =>
            h(
              'article',
              { key: item.id, className: 'card bg-base-200 border border-base-300 p-3' },
              h(
                'div',
                { className: 'flex items-center justify-between gap-3' },
                h(
                  'div',
                  { className: 'flex items-center gap-3 min-w-0 flex-1 cursor-pointer', onClick: () => openItem(item) },
                  h('i', { className: item.kind === 'folder' ? 'fa-solid fa-folder text-warning' : 'fa-solid fa-file text-info' }),
                  h(
                    'div',
                    { className: 'min-w-0' },
                    h('p', { className: 'text-sm font-medium truncate' }, item.name),
                    h('p', { className: 'text-[11px] opacity-70' }, item.kind === 'folder' ? t('folder') : formatBytes(item.sizeBytes))
                  )
                ),
                h(
                  'button',
                  { className: 'text-right' },
                  h('span', { className: `badge badge-xs ${item.readonly ? 'badge-ghost' : 'badge-primary'}` }, item.readonly ? 'ro' : 'rw'),
                  h('p', { className: 'text-[10px] opacity-60 mt-1' }, item.visibility || '-'),
                  !item.readonly
                    ? h('i', { className: 'fa-solid fa-ellipsis-vertical text-xs opacity-70 ml-2', onClick: () => setActionItem(item) })
                    : null
                )
              )
            )
          )
        ),
        h(
          'footer',
          { className: 'fixed bottom-0 left-0 right-0 mx-auto max-w-md border-t border-base-300 bg-base-100/95 backdrop-blur p-3' },
          h(
            'div',
            { className: 'grid grid-cols-3 gap-2' },
            h(
              'button',
              { className: 'btn btn-sm btn-outline', onClick: onRefresh, disabled: loading || !client },
              h('i', { className: 'fa-solid fa-rotate mr-2' }),
              t('refresh')
            ),
            h(
              'button',
              { className: 'btn btn-sm btn-primary', disabled: loading || !client || space !== 'local', onClick: openUploadModal },
              h('i', { className: 'fa-solid fa-upload mr-2' }),
              t('upload')
            ),
            h(
              'button',
              { className: 'btn btn-sm btn-secondary', disabled: loading || !client, onClick: openCreateFolderModal },
              h('i', { className: 'fa-solid fa-folder-plus mr-2' }),
              t('folder')
            )
          )
        ),
        selectedItem
          ? h(
            'div',
            { className: 'fixed inset-0 bg-black/40 z-40 flex items-end', onClick: () => setSelectedItem(null) },
            h(
              'section',
              { className: 'w-full bg-base-100 rounded-t-2xl p-4 space-y-3', onClick: (event) => event.stopPropagation() },
              h('div', { className: 'flex items-center justify-between' },
                h('h3', { className: 'font-semibold' }, t('details')),
                h('button', { className: 'btn btn-xs btn-outline', onClick: () => setSelectedItem(null) }, t('close'))
              ),
              h('p', { className: 'text-sm font-medium break-all' }, selectedItem.name || selectedItem.id),
              h('p', { className: 'text-xs opacity-70' }, `id: ${selectedItem.id}`),
              h('p', { className: 'text-xs opacity-70' }, `kind: ${selectedItem.kind || 'file'}`),
              h('p', { className: 'text-xs opacity-70' }, `size: ${formatBytes(selectedItem.sizeBytes)}`),
              h('p', { className: 'text-xs opacity-70' }, `visibility: ${selectedItem.visibility || '-'}`)
            )
          )
          : null,
        actionItem
          ? h(
            'div',
            { className: 'fixed inset-0 bg-black/40 z-50 flex items-end', onClick: () => setActionItem(null) },
            h(
              'section',
              { className: 'w-full bg-base-100 rounded-t-2xl p-4 space-y-2', onClick: (event) => event.stopPropagation() },
              h('h3', { className: 'font-semibold mb-2' }, t('actionSheet')),
              h('button', { className: 'btn btn-block btn-outline', onClick: () => openItem(actionItem) }, t('open')),
              h('button', { className: 'btn btn-block btn-outline', onClick: () => openRenameModal(actionItem) }, t('rename')),
              h('button', { className: 'btn btn-block btn-outline', onClick: () => moveItemToRoot(actionItem) }, t('moveRoot')),
              h('button', { className: 'btn btn-block btn-error btn-outline', onClick: () => openDeleteConfirm(actionItem) }, t('delete')),
              h('button', { className: 'btn btn-block', onClick: () => setActionItem(null) }, t('close'))
            )
          )
          : null,
        activeUploadSession && activeUploadSession.sessionId
          ? h(
            'button',
            {
              className: 'fixed right-4 bottom-24 z-40 btn btn-primary btn-sm shadow-lg',
              onClick: completeUpload,
            },
            h('i', { className: 'fa-solid fa-check mr-2' }),
            t('upload')
          )
          : null,
        inputModal
          ? h(
            'div',
            { className: 'fixed inset-0 bg-black/40 z-[60] flex items-end', onClick: () => setInputModal(null) },
            h(
              'section',
              { className: 'w-full bg-base-100 rounded-t-2xl p-4 space-y-3', onClick: (event) => event.stopPropagation() },
              h('div', { className: 'flex items-center justify-between' },
                h('h3', { className: 'font-semibold' }, inputModal.title || ''),
                h('button', { className: 'btn btn-xs btn-outline', onClick: () => setInputModal(null) }, t('close'))
              ),
              inputModal.kind === 'upload'
                ? h(
                  'div',
                  { className: 'space-y-2' },
                  h('input', {
                    className: 'input input-bordered w-full',
                    placeholder: t('uploadPromptName'),
                    value: inputModal.fileName || '',
                    onChange: (event) => setInputModal((prev) => ({ ...prev, fileName: event.target.value })),
                  }),
                  h('input', {
                    className: 'input input-bordered w-full',
                    placeholder: t('uploadPromptMime'),
                    value: inputModal.mimeType || '',
                    onChange: (event) => setInputModal((prev) => ({ ...prev, mimeType: event.target.value })),
                  }),
                  h('input', {
                    className: 'input input-bordered w-full',
                    placeholder: t('uploadPromptSize'),
                    value: inputModal.sizeBytes || '',
                    onChange: (event) => setInputModal((prev) => ({ ...prev, sizeBytes: event.target.value })),
                  }),
                )
                : h('input', {
                  className: 'input input-bordered w-full',
                  placeholder: inputModal.kind === 'rename' ? t('rename') : t('createFolderPrompt'),
                  value: inputModal.value || '',
                  onChange: (event) => setInputModal((prev) => ({ ...prev, value: event.target.value })),
                }),
              h(
                'div',
                { className: 'grid grid-cols-2 gap-2 pt-2' },
                h('button', { className: 'btn btn-outline', onClick: () => setInputModal(null) }, t('cancel')),
                h(
                  'button',
                  {
                    className: 'btn btn-primary',
                    onClick: () => {
                      if (inputModal.kind === 'createFolder') {
                        submitCreateFolder(inputModal.value || '');
                        return;
                      }
                      if (inputModal.kind === 'rename') {
                        submitRenameItem(inputModal.item, inputModal.value || '');
                        return;
                      }
                      if (inputModal.kind === 'upload') {
                        submitUpload({
                          fileName: inputModal.fileName || '',
                          mimeType: inputModal.mimeType || '',
                          sizeBytes: inputModal.sizeBytes || '',
                          file: inputModal.file || null,
                        });
                      }
                    },
                  },
                  t('save')
                )
              )
            )
          )
          : null,
        confirmModal
          ? h(
            'div',
            { className: 'fixed inset-0 bg-black/40 z-[70] flex items-end', onClick: () => setConfirmModal(null) },
            h(
              'section',
              { className: 'w-full bg-base-100 rounded-t-2xl p-4 space-y-3', onClick: (event) => event.stopPropagation() },
              h('h3', { className: 'font-semibold' }, confirmModal.title || t('confirm')),
              h('p', { className: 'text-sm opacity-80' }, confirmModal.message || ''),
              h(
                'div',
                { className: 'grid grid-cols-2 gap-2 pt-2' },
                h('button', { className: 'btn btn-outline', onClick: () => setConfirmModal(null) }, t('cancel')),
                h(
                  'button',
                  {
                    className: 'btn btn-error',
                    onClick: () => deleteItem(confirmModal.item),
                  },
                  t('confirm')
                )
              )
            )
          )
          : null
      );
    }

    const root = createRoot(document.getElementById('app'));
    root.render(h(FileManagerApp));
  </script>
</body>
</html>
