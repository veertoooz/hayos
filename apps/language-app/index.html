<!DOCTYPE html>
<html lang="en" class="h-full bg-transparent" data-theme="black" x-data="languageApp()" x-init="init()">
<head>
  <script data-hayos-prepaint-settings>
    (function applyHayOSPrepaintSettings() {
      try {
        var root = document.documentElement;
        var params = new URLSearchParams(window.location.search);
        var fromQueryLang = (params.get('lang') || params.get('language') || '').trim().toLowerCase();
        var fromQueryTheme = (params.get('theme') || '').trim();
        var stored = null;
        try {
          var raw = window.localStorage.getItem('hayos.settings');
          stored = raw ? JSON.parse(raw) : null;
        } catch {
          stored = null;
        }
        var language = fromQueryLang === 'hy' || fromQueryLang === 'en'
          ? fromQueryLang
          : (stored && stored.language === 'hy' ? 'hy' : 'en');
        var theme = fromQueryTheme
          || (stored && typeof stored.theme === 'string' ? stored.theme.trim() : '')
          || 'black';
        root.lang = language;
        root.setAttribute('data-theme', theme);
      } catch {
        // ignore prepaint bootstrap failures
      }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title x-text="t('pageTitle')">Language</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <script>
    function loadHayOSClient() {
      const debugMode = new URLSearchParams(window.location.search).get('debug') === '1';
      const isLocalhost =
        window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1';
      const clientUrl = isLocalhost
        ? 'http://localhost:5173/hayos-client.js'
        : `/hayos-client.js${debugMode ? `?v=${Date.now()}` : ''}`;

      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = clientUrl;
        script.onload = () => resolve(script.src || clientUrl);
        script.onerror = () =>
          reject(new Error(`Failed to load HayOSClient from ${clientUrl}`));
        document.head.appendChild(script);
      });
    }
  </script>

  <script>
    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        plugins: [require('daisyui')],
        daisyui: { themes: true },
      };
    }
  </script>
</head>
<body class="h-full">
  <div class="max-w-3xl mx-auto px-4 py-6 h-full" x-cloak>
    <div class="card bg-base-200 shadow p-5">
      <h1 class="text-xl font-semibold" x-text="t('title')"></h1>
      <p class="text-sm opacity-75 mt-1" x-text="t('description')"></p>
    </div>

    <div class="mt-4 card bg-base-200 shadow p-5">
      <div class="text-sm">
        <span class="font-semibold" x-text="`${t('currentLabel')}:`"></span>
        <span x-text="savedLanguage === 'hy' ? t('armenian') : t('english')"></span>
      </div>

      <div class="mt-4 flex gap-2 flex-wrap">
        <button
          class="btn btn-sm"
          :class="savedLanguage === 'hy' ? 'btn-primary' : 'btn-ghost'"
          :disabled="saving"
          @click="changeLanguage('hy')"
          x-text="t('armenian')"
        ></button>
        <button
          class="btn btn-sm"
          :class="savedLanguage === 'en' ? 'btn-primary' : 'btn-ghost'"
          :disabled="saving"
          @click="changeLanguage('en')"
          x-text="t('english')"
        ></button>
      </div>

      <div class="mt-3 text-sm opacity-80">
        <span class="font-semibold" x-text="`${t('statusLabel')}:`"></span>
        <span x-text="status"></span>
      </div>
      <div class="mt-2 text-error text-sm" x-show="error" x-text="error"></div>
    </div>
    <div class="mt-3 card bg-base-200 shadow p-4" x-show="debugMode">
      <h2 class="text-sm font-semibold">Debug trace</h2>
      <div class="mt-1 text-xs font-mono opacity-70" x-text="`client: ${clientBuildStamp || 'unknown'}`"></div>
      <div class="mt-2 max-h-40 overflow-auto text-xs font-mono opacity-80">
        <template x-for="item in debugEntries" :key="item.id">
          <div x-text="item.text"></div>
        </template>
      </div>
    </div>
  </div>

  <script>
    function languageApp() {
      return {
        appId: 'language-app',
        client: null,
        uiLanguage: 'en',
        savedLanguage: 'en',
        hasHydratedSavedLanguage: false,
        saving: false,
        status: '',
        error: '',
        debugMode: false,
        debugEntries: [],
        unbindDebugEvents: null,
        clientBuildStamp: '',
        i18n: {
          en: {
            pageTitle: 'Language',
            title: 'Language',
            description: 'Choose the system language for HayOS apps.',
            currentLabel: 'Current language',
            armenian: 'Armenian',
            english: 'English',
            statusLabel: 'Status',
            statusInitializing: 'Initializing...',
            statusReady: 'Ready',
            statusSaving: 'Saving...',
            statusSaved: 'Saved',
            statusFailed: 'Failed',
            errorNotAuthenticated: 'Not authenticated.',
            errorPermissionDenied: 'Permission denied.',
            errorGeneric: 'Something went wrong.',
          },
          hy: {
            pageTitle: 'Լեզու',
            title: 'Լեզու',
            description: 'Ընտրիր HayOS հավելվածների համակարգային լեզուն։',
            currentLabel: 'Ընթացիկ լեզու',
            armenian: 'Հայերեն',
            english: 'Անգլերեն',
            statusLabel: 'Կարգավիճակ',
            statusInitializing: 'Սկսվում է...',
            statusReady: 'Պատրաստ է',
            statusSaving: 'Պահվում է...',
            statusSaved: 'Պահվեց',
            statusFailed: 'Սխալ',
            errorNotAuthenticated: 'Մուտք գործած չես։',
            errorPermissionDenied: 'Թույլտվություն չկա։',
            errorGeneric: 'Տեղի ունեցավ սխալ։',
          },
        },
        t(key) {
          const dict = this.i18n[this.uiLanguage] || this.i18n.en;
          return dict[key] || this.i18n.en[key] || key;
        },
        normalizeLanguage(value) {
          return value === 'hy' ? 'hy' : 'en';
        },
        applyUiLanguage(language) {
          const nextLanguage = this.normalizeLanguage(language);
          this.uiLanguage = nextLanguage;
          document.documentElement.lang = nextLanguage;
          document.title = this.t('pageTitle');
        },
        pushDebug(text) {
          if (!this.debugMode) return;
          const stamp = new Date().toISOString().slice(11, 23);
          this.debugEntries.push({
            id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
            text: `${stamp} ${text}`,
          });
          if (this.debugEntries.length > 120) {
            this.debugEntries.splice(0, this.debugEntries.length - 120);
          }
        },
        setupDebugEvents() {
          if (!this.debugMode || this.unbindDebugEvents) return;
          const clientHandler = (event) => {
            const detail = event && event.detail ? event.detail : null;
            if (!detail || detail.appId !== this.appId) return;
            const req = typeof detail.traceId === 'string'
              ? detail.traceId
              : (typeof detail.requestId === 'string' ? detail.requestId : '-');
            const stage = typeof detail.stage === 'string' ? detail.stage : 'unknown';
            const action = typeof detail.action === 'string' && detail.action ? ` ${detail.action}` : '';
            const ok = typeof detail.ok === 'boolean' ? ` ok=${detail.ok}` : '';
            const error = typeof detail.error === 'string' && detail.error ? ` err=${detail.error}` : '';
            const hop = typeof detail.hop === 'string' ? ` ${detail.hop}` : '';
            this.pushDebug(`${stage}${hop} ${req}${action}${ok}${error}`);
          };
          const bridgeHandler = (event) => {
            const data = event && event.data ? event.data : null;
            if (!data || data.type !== 'hayos:systemEvent' || data.event !== 'debug.trace') return;
            const payload = data.payload && typeof data.payload === 'object' ? data.payload : {};
            const req = typeof payload.traceId === 'string' ? payload.traceId : '-';
            const stage = typeof payload.stage === 'string' ? payload.stage : 'unknown';
            const action = typeof payload.action === 'string' && payload.action ? ` ${payload.action}` : '';
            this.pushDebug(`${stage} bridge ${req}${action}`);
          };
          window.addEventListener('hayos:client-debug', clientHandler);
          window.addEventListener('message', bridgeHandler);
          this.unbindDebugEvents = () => {
            window.removeEventListener('hayos:client-debug', clientHandler);
            window.removeEventListener('message', bridgeHandler);
            this.unbindDebugEvents = null;
          };
        },
        parseBuildStamp(clientUrl) {
          if (typeof clientUrl !== 'string' || clientUrl.trim().length === 0) return 'unknown';
          try {
            const parsed = new URL(clientUrl, window.location.href);
            const stamp = parsed.searchParams.get('v');
            if (stamp && stamp.trim().length > 0) return `v=${stamp.trim()}`;
            return parsed.pathname.split('/').pop() || 'unknown';
          } catch {
            return 'unknown';
          }
        },
        localizeErrorMessage(message) {
          const text = typeof message === 'string' ? message.trim() : '';
          if (!text) return '';
          const normalized = text.toLowerCase();
          if (normalized.includes('not authenticated')) return this.t('errorNotAuthenticated');
          if (normalized.includes('permission denied')) return this.t('errorPermissionDenied');
          return text;
        },
        async hydrateSavedLanguage() {
          if (!this.client) return;
          try {
            await this.client.ensureAuthenticated();
            const persistedLanguage = this.normalizeLanguage(await this.client.getLanguage());
            this.savedLanguage = persistedLanguage;
            this.applyUiLanguage(persistedLanguage);
            this.status = this.t('statusReady');
          } catch (error) {
            const message = error && error.message ? error.message : String(error);
            this.error = this.localizeErrorMessage(message) || this.t('errorGeneric');
            this.status = this.t('statusFailed');
          } finally {
            this.hasHydratedSavedLanguage = true;
          }
        },
        async init() {
          try {
            const loadedClientUrl = await loadHayOSClient();
            const urlParams = new URLSearchParams(window.location.search);
            this.debugMode = urlParams.get('debug') === '1';
            this.clientBuildStamp = this.parseBuildStamp(loadedClientUrl);
            const fromQuery = urlParams.get('lang') || urlParams.get('language') || '';
            if (fromQuery) {
              const initialLanguage = this.normalizeLanguage(fromQuery);
              this.applyUiLanguage(initialLanguage);
              this.savedLanguage = initialLanguage;
            }
            this.status = this.t('statusInitializing');
            this.appId = urlParams.get('appId') || 'language-app';
            this.client = new HayOSClient(this.appId);
            this.setupDebugEvents();
            this.status = this.t('statusReady');

            this.client.onLanguageChanged((language) => {
              const nextLanguage = this.normalizeLanguage(language);
              this.savedLanguage = nextLanguage;
              this.applyUiLanguage(nextLanguage);
              this.status = this.t('statusReady');
            });

            this.hydrateSavedLanguage();
          } catch (error) {
            const message = error && error.message ? error.message : String(error);
            this.error = this.localizeErrorMessage(message) || this.t('errorGeneric');
            this.status = this.t('statusFailed');
          }
        },

        async changeLanguage(language) {
          const nextLanguage = language === 'hy' ? 'hy' : 'en';
          if (!this.client || this.savedLanguage === nextLanguage || this.saving) {
            return;
          }
          this.error = '';
          this.saving = true;
          this.status = this.t('statusSaving');
          this.pushDebug(`changeLanguage start -> ${nextLanguage}`);
          const previousSavedLanguage = this.savedLanguage;
          this.savedLanguage = nextLanguage;
          this.applyUiLanguage(nextLanguage);
          try {
            const persistedLanguage = await this.client.setLanguage(nextLanguage);
            this.pushDebug(`changeLanguage success <- ${persistedLanguage}`);
            this.savedLanguage = this.normalizeLanguage(persistedLanguage);
            this.applyUiLanguage(this.savedLanguage);
            this.status = this.t('statusSaved');
          } catch (error) {
            this.savedLanguage = previousSavedLanguage;
            this.applyUiLanguage(previousSavedLanguage);
            const message = error && error.message ? error.message : String(error);
            this.pushDebug(`changeLanguage failed ${message}`);
            this.error = this.localizeErrorMessage(message) || this.t('errorGeneric');
            this.status = this.t('statusFailed');
          } finally {
            this.saving = false;
          }
        },
      };
    }
  </script>
</body>
</html>
