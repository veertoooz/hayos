<!DOCTYPE html>
<html lang="en" class="h-full" data-theme="black" style="overflow: hidden;">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Snake Game</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <script>
    function loadHayOSClient() {
      const isLocalhost =
        window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1';
      const clientUrl = isLocalhost
        ? 'http://localhost:5173/hayos-client.js'
        : '/hayos-client.js';

      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = clientUrl;
        script.onload = resolve;
        script.onerror = () =>
          reject(new Error(`Failed to load HayOSClient from ${clientUrl}`));
        document.head.appendChild(script);
      });
    }
  </script>

  <style>
    * {
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden !important;
      height: 100%;
      width: 100%;
      position: fixed;
    }

    #gameCanvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    [x-cloak] {
      display: none !important;
    }
  </style>
</head>

<body class="h-full bg-base-300" x-data="snakeGame()" x-init="init()" style="overflow: hidden;">

  <!-- Loading State -->
  <div x-show="state === 'loading'" x-cloak class="h-full flex items-center justify-center">
    <div class="text-center">
      <div class="loading loading-spinner loading-lg text-primary"></div>
      <p class="mt-4 text-lg" x-text="t('loading')"></p>
    </div>
  </div>

  <!-- Error State -->
  <div x-show="state === 'error'" x-cloak class="h-full flex items-center justify-center p-4">
    <div class="card bg-error text-error-content max-w-md w-full">
      <div class="card-body">
        <h2 class="card-title" x-text="t('errorTitle')"></h2>
        <p x-text="errorMessage"></p>
        <div class="card-actions justify-end">
          <button class="btn btn-sm" @click="init()" x-text="t('retry')"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Offline State -->
  <div x-show="state === 'offline'" x-cloak class="h-full flex items-center justify-center p-4">
    <div class="card bg-warning text-warning-content max-w-md w-full">
      <div class="card-body">
        <h2 class="card-title" x-text="t('offlineTitle')"></h2>
        <p x-text="t('offlineMessage')"></p>
      </div>
    </div>
  </div>

  <!-- Game Container -->
  <div x-show="state === 'ready' || state === 'playing'" x-cloak class="h-full flex flex-col"
    style="overflow: hidden;">

    <!-- Header -->
    <div class="navbar bg-base-100 shadow-lg flex-none min-h-[3rem] px-2 sm:px-4">
      <div class="flex-1 gap-2">
        <h1 class="text-lg sm:text-xl font-bold" x-text="t('title')"></h1>
        <div class="badge badge-primary badge-sm sm:badge-md" x-text="`${t('score')}: ${score}`"></div>
        <div class="badge badge-secondary badge-sm sm:badge-md" x-text="`${t('high')}: ${highScore}`"></div>
      </div>
      <div class="flex-none gap-1 sm:gap-2">
        <button class="btn btn-sm btn-circle btn-ghost" @click="togglePause()" :disabled="!gameStarted">
          <span x-show="!paused" class="text-lg">⏸</span>
          <span x-show="paused" class="text-lg">▶</span>
        </button>
        <button class="btn btn-sm btn-circle btn-ghost" @click="resetGame()">
          <span class="text-lg">🔄</span>
        </button>
      </div>
    </div>

    <!-- Game Canvas Container -->
    <div class="flex-1 flex items-center justify-center bg-base-300 p-2 sm:p-4" style="overflow: hidden;">
      <div class="relative" style="max-width: 100%; max-height: 100%;">
        <canvas id="gameCanvas" class="rounded-lg shadow-2xl bg-base-100"></canvas>

        <!-- Start/Game Over Overlay -->
        <div x-show="!gameStarted || gameOver"
          class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-75 rounded-lg">
          <div class="text-center p-4 sm:p-8">
            <h2 class="text-2xl sm:text-4xl font-bold mb-2 sm:mb-4" x-show="!gameStarted && !gameOver"
              x-text="t('startTitle')"></h2>
            <h2 class="text-2xl sm:text-4xl font-bold mb-2 sm:mb-4 text-error" x-show="gameOver"
              x-text="t('gameOver')"></h2>
            <p class="text-base sm:text-xl mb-2" x-show="gameOver" x-text="`${t('finalScore')}: ${score}`"></p>
            <p class="text-sm sm:text-lg mb-4 sm:mb-6 opacity-80" x-text="t('instructions')"></p>
            <button class="btn btn-primary btn-sm sm:btn-md" @click="startGame()" x-text="t('startButton')"></button>
          </div>
        </div>

        <!-- Pause Overlay -->
        <div x-show="paused && gameStarted && !gameOver"
          class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-75 rounded-lg">
          <div class="text-center p-4 sm:p-8">
            <h2 class="text-2xl sm:text-4xl font-bold mb-4" x-text="t('paused')"></h2>
            <button class="btn btn-primary btn-sm sm:btn-md" @click="togglePause()" x-text="t('resume')"></button>
          </div>
        </div>
      </div>
    </div>

    <!-- Mobile Controls Info -->
    <div class="flex-none p-2 text-center text-xs sm:text-sm opacity-70 bg-base-100">
      <p x-text="t('controls')"></p>
    </div>
  </div>

  <script>
    function snakeGame() {
      return {
        state: 'loading',
        errorMessage: '',
        client: null,
        user: null,
        language: 'en',
        appId: 'snake-game',

        // Game state
        canvas: null,
        ctx: null,
        gridSize: 20,
        tileCount: 20,
        snake: [],
        direction: { x: 1, y: 0 },
        nextDirection: { x: 1, y: 0 },
        food: { x: 10, y: 10 },
        score: 0,
        highScore: 0,
        gameStarted: false,
        gameOver: false,
        paused: false,
        gameLoop: null,
        speed: 100,

        // Touch controls
        touchStartX: 0,
        touchStartY: 0,
        swipeThreshold: 30,

        i18n: {
          en: {
            title: 'Snake Game',
            score: 'Score',
            high: 'High',
            startTitle: 'Classic Snake',
            startButton: 'Start Game',
            gameOver: 'Game Over!',
            finalScore: 'Final Score',
            instructions: 'Use arrow keys or swipe to move',
            controls: '← ↑ → ↓ or Swipe',
            paused: 'Paused',
            resume: 'Resume',
            loading: 'Loading...',
            errorTitle: 'Error',
            retry: 'Retry',
            offlineTitle: 'Offline',
            offlineMessage: 'You are currently offline',
          },
          hy: {
            title: 'Օձի Խաղ',
            score: 'Միավոր',
            high: 'Ռեկորդ',
            startTitle: 'Կլասիկ Օձ',
            startButton: 'Սկսել Խաղը',
            gameOver: 'Խաղը Ավարտված Է!',
            finalScore: 'Վերջնական Միավոր',
            instructions: 'Օգտագործեք սլաքներ կամ սահեցում',
            controls: '← ↑ → ↓ կամ Սահեցրեք',
            paused: 'Դադար',
            resume: 'Շարունակել',
            loading: 'Բեռնում...',
            errorTitle: 'Սխալ',
            retry: 'Կրկին',
            offlineTitle: 'Օֆլայն',
            offlineMessage: 'Դուք ներկայումս օֆլայն եք',
          },
        },

        t(key) {
          const dict = this.i18n[this.language] || this.i18n.en;
          return dict[key] || this.i18n.en[key] || key;
        },

        async init() {
          this.state = 'loading';
          this.errorMessage = '';

          try {
            // Initialize HayOS Client
            await loadHayOSClient();
            const urlParams = new URLSearchParams(window.location.search);
            this.appId = urlParams.get('appId') || 'snake-game';

            this.client = new HayOSClient(this.appId);

            // Check for offline state
            if (!navigator.onLine) {
              this.state = 'offline';
              window.addEventListener('online', () => this.init());
              return;
            }

            // Authenticate
            const auth = await this.client.ensureAuthenticated();
            this.user = auth.user || null;

            // Get language
            this.language = await this.client.getLanguage();
            document.documentElement.lang = this.language;
            this.client.onLanguageChanged((language) => {
              this.language = language === 'hy' ? 'hy' : 'en';
              document.documentElement.lang = this.language;
            });

            // Load high score from app state
            await this.loadHighScore();

            // Initialize game
            this.initCanvas();
            this.setupControls();
            this.resetGame();

            this.state = 'ready';
          } catch (error) {
            console.error('Initialization error:', error);
            this.errorMessage = error && error.message ? error.message : String(error);
            this.state = 'error';
          }
        },

        initCanvas() {
          this.canvas = document.getElementById('gameCanvas');
          this.ctx = this.canvas.getContext('2d');

          // Set canvas size based on viewport
          this.resizeCanvas();
          window.addEventListener('resize', () => this.resizeCanvas());
        },

        resizeCanvas() {
          const container = this.canvas.parentElement;
          const maxWidth = container.clientWidth;
          const maxHeight = container.clientHeight;

          // Calculate optimal tile size
          const maxTilesW = Math.floor(maxWidth / this.gridSize);
          const maxTilesH = Math.floor(maxHeight / this.gridSize);

          // Use 20x20 grid or smaller if needed
          this.tileCount = Math.min(20, Math.min(maxTilesW, maxTilesH));

          const canvasSize = this.tileCount * this.gridSize;
          this.canvas.width = canvasSize;
          this.canvas.height = canvasSize;

          if (this.gameStarted && !this.gameOver) {
            this.draw();
          }
        },

        setupControls() {
          // Keyboard controls
          document.addEventListener('keydown', (e) => {
            if (!this.gameStarted || this.gameOver || this.paused) return;

            switch (e.key) {
              case 'ArrowUp':
              case 'w':
              case 'W':
                if (this.direction.y === 0) this.nextDirection = { x: 0, y: -1 };
                e.preventDefault();
                break;
              case 'ArrowDown':
              case 's':
              case 'S':
                if (this.direction.y === 0) this.nextDirection = { x: 0, y: 1 };
                e.preventDefault();
                break;
              case 'ArrowLeft':
              case 'a':
              case 'A':
                if (this.direction.x === 0) this.nextDirection = { x: -1, y: 0 };
                e.preventDefault();
                break;
              case 'ArrowRight':
              case 'd':
              case 'D':
                if (this.direction.x === 0) this.nextDirection = { x: 1, y: 0 };
                e.preventDefault();
                break;
              case ' ':
                this.togglePause();
                e.preventDefault();
                break;
            }
          });

          // Touch controls for mobile
          this.canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            this.touchStartX = touch.clientX;
            this.touchStartY = touch.clientY;
          }, { passive: false });

          this.canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (!this.gameStarted || this.gameOver || this.paused) return;

            const touch = e.changedTouches[0];
            const deltaX = touch.clientX - this.touchStartX;
            const deltaY = touch.clientY - this.touchStartY;

            if (Math.abs(deltaX) > this.swipeThreshold || Math.abs(deltaY) > this.swipeThreshold) {
              if (Math.abs(deltaX) > Math.abs(deltaY)) {
                // Horizontal swipe
                if (deltaX > 0 && this.direction.x === 0) {
                  this.nextDirection = { x: 1, y: 0 };
                } else if (deltaX < 0 && this.direction.x === 0) {
                  this.nextDirection = { x: -1, y: 0 };
                }
              } else {
                // Vertical swipe
                if (deltaY > 0 && this.direction.y === 0) {
                  this.nextDirection = { x: 0, y: 1 };
                } else if (deltaY < 0 && this.direction.y === 0) {
                  this.nextDirection = { x: 0, y: -1 };
                }
              }
            }
          }, { passive: false });
        },

        resetGame() {
          this.snake = [
            { x: Math.floor(this.tileCount / 2), y: Math.floor(this.tileCount / 2) }
          ];
          this.direction = { x: 1, y: 0 };
          this.nextDirection = { x: 1, y: 0 };
          this.score = 0;
          this.gameStarted = false;
          this.gameOver = false;
          this.paused = false;
          this.speed = 100;
          this.placeFood();
          this.draw();

          if (this.gameLoop) {
            clearInterval(this.gameLoop);
            this.gameLoop = null;
          }
        },

        startGame() {
          this.resetGame();
          this.gameStarted = true;
          this.gameLoop = setInterval(() => this.update(), this.speed);
        },

        togglePause() {
          if (!this.gameStarted || this.gameOver) return;

          this.paused = !this.paused;

          if (this.paused) {
            clearInterval(this.gameLoop);
          } else {
            this.gameLoop = setInterval(() => this.update(), this.speed);
          }
        },

        update() {
          if (!this.gameStarted || this.gameOver || this.paused) return;

          // Update direction
          this.direction = this.nextDirection;

          // Calculate new head position
          const head = { ...this.snake[0] };
          head.x += this.direction.x;
          head.y += this.direction.y;

          // Check wall collision
          if (head.x < 0 || head.x >= this.tileCount || head.y < 0 || head.y >= this.tileCount) {
            this.endGame();
            return;
          }

          // Check self collision
          for (let segment of this.snake) {
            if (head.x === segment.x && head.y === segment.y) {
              this.endGame();
              return;
            }
          }

          // Add new head
          this.snake.unshift(head);

          // Check food collision
          if (head.x === this.food.x && head.y === this.food.y) {
            this.score += 10;
            this.placeFood();

            // Increase speed slightly
            if (this.score % 50 === 0 && this.speed > 50) {
              this.speed -= 5;
              clearInterval(this.gameLoop);
              this.gameLoop = setInterval(() => this.update(), this.speed);
            }
          } else {
            // Remove tail
            this.snake.pop();
          }

          this.draw();
        },

        placeFood() {
          let validPosition = false;
          while (!validPosition) {
            this.food = {
              x: Math.floor(Math.random() * this.tileCount),
              y: Math.floor(Math.random() * this.tileCount)
            };

            validPosition = !this.snake.some(
              segment => segment.x === this.food.x && segment.y === this.food.y
            );
          }
        },

        draw() {
          if (!this.ctx) return;

          // Clear canvas
          this.ctx.fillStyle = 'oklch(var(--b1))';
          this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

          // Draw grid
          this.ctx.strokeStyle = 'oklch(var(--bc) / 0.1)';
          this.ctx.lineWidth = 0.5;
          for (let i = 0; i <= this.tileCount; i++) {
            this.ctx.beginPath();
            this.ctx.moveTo(i * this.gridSize, 0);
            this.ctx.lineTo(i * this.gridSize, this.canvas.height);
            this.ctx.stroke();

            this.ctx.beginPath();
            this.ctx.moveTo(0, i * this.gridSize);
            this.ctx.lineTo(this.canvas.width, i * this.gridSize);
            this.ctx.stroke();
          }

          // Draw food
          this.ctx.fillStyle = '#ef4444';
          this.ctx.beginPath();
          this.ctx.arc(
            this.food.x * this.gridSize + this.gridSize / 2,
            this.food.y * this.gridSize + this.gridSize / 2,
            this.gridSize / 2 - 2,
            0,
            Math.PI * 2
          );
          this.ctx.fill();

          // Draw snake
          this.snake.forEach((segment, index) => {
            const isHead = index === 0;
            this.ctx.fillStyle = isHead ? '#10b981' : '#22c55e';
            this.ctx.fillRect(
              segment.x * this.gridSize + 1,
              segment.y * this.gridSize + 1,
              this.gridSize - 2,
              this.gridSize - 2
            );

            // Draw eyes on head
            if (isHead) {
              this.ctx.fillStyle = '#000000';
              const eyeSize = 2;
              const eyeOffset = this.gridSize / 3;

              if (this.direction.x === 1) {
                this.ctx.fillRect(segment.x * this.gridSize + this.gridSize - eyeOffset, segment.y * this.gridSize + eyeOffset, eyeSize, eyeSize);
                this.ctx.fillRect(segment.x * this.gridSize + this.gridSize - eyeOffset, segment.y * this.gridSize + this.gridSize - eyeOffset, eyeSize, eyeSize);
              } else if (this.direction.x === -1) {
                this.ctx.fillRect(segment.x * this.gridSize + eyeOffset - eyeSize, segment.y * this.gridSize + eyeOffset, eyeSize, eyeSize);
                this.ctx.fillRect(segment.x * this.gridSize + eyeOffset - eyeSize, segment.y * this.gridSize + this.gridSize - eyeOffset, eyeSize, eyeSize);
              } else if (this.direction.y === 1) {
                this.ctx.fillRect(segment.x * this.gridSize + eyeOffset, segment.y * this.gridSize + this.gridSize - eyeOffset, eyeSize, eyeSize);
                this.ctx.fillRect(segment.x * this.gridSize + this.gridSize - eyeOffset, segment.y * this.gridSize + this.gridSize - eyeOffset, eyeSize, eyeSize);
              } else {
                this.ctx.fillRect(segment.x * this.gridSize + eyeOffset, segment.y * this.gridSize + eyeOffset - eyeSize, eyeSize, eyeSize);
                this.ctx.fillRect(segment.x * this.gridSize + this.gridSize - eyeOffset, segment.y * this.gridSize + eyeOffset - eyeSize, eyeSize, eyeSize);
              }
            }
          });
        },

        async endGame() {
          this.gameOver = true;
          clearInterval(this.gameLoop);

          if (this.score > this.highScore) {
            this.highScore = this.score;
            await this.saveHighScore();
          }
        },

        async loadHighScore() {
          try {
            if (this.client) {
              const state = await this.client.getAppState('highScore');
              this.highScore = state || 0;
            }
          } catch (error) {
            console.warn('Failed to load high score:', error);
            this.highScore = 0;
          }
        },

        async saveHighScore() {
          try {
            if (this.client) {
              await this.client.setAppState('highScore', this.highScore);
            }
          } catch (error) {
            console.warn('Failed to save high score:', error);
          }
        },
      };
    }
  </script>
</body>

</html>
