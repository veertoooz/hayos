<!DOCTYPE html>
<html lang="en" class="h-full bg-transparent" data-theme="black" x-data="snakeApp()" x-init="init()">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    .snake-canvas {
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1 / 1;
      image-rendering: pixelated;
      border-radius: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #0a0f14;
      touch-action: none;
    }
  </style>

  <script>
    function loadHayOSClient() {
      const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      const clientUrl = isLocalhost ? 'http://localhost:5173/hayos-client.js' : '/hayos-client.js';
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = clientUrl;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Failed to load HayOSClient from ${clientUrl}`));
        document.head.appendChild(script);
      });
    }
  </script>
</head>
<body class="h-full">
  <div class="max-w-5xl mx-auto px-4 py-6 h-full" x-cloak>
    <div class="card bg-base-200 shadow p-5">
      <div class="flex items-center justify-between gap-4 flex-wrap">
        <div>
          <h1 class="text-xl font-semibold">Snake</h1>
          <p class="text-sm opacity-70">Սլաքներով կամ կոճակներով խաղա։ Ռեկորդը պահվում է քո account-ում։</p>
        </div>
        <button class="btn btn-primary" @click="restart()">Restart</button>
      </div>
      <p class="text-sm mt-2"><span class="font-semibold">Status:</span> <span x-text="status"></span></p>
      <p class="text-error text-sm mt-2" x-show="error" x-text="error"></p>
    </div>

    <div class="mt-4 grid grid-cols-1 lg:grid-cols-[440px,1fr] gap-4 items-start">
      <div class="card bg-base-200 shadow p-4">
        <canvas id="snake-board" width="420" height="420" class="snake-canvas"></canvas>

        <div class="grid grid-cols-3 gap-2 max-w-[260px] mx-auto mt-4">
          <div></div>
          <button class="btn btn-sm" @click="queueDirection('up')">↑</button>
          <div></div>
          <button class="btn btn-sm" @click="queueDirection('left')">←</button>
          <button class="btn btn-sm btn-warning" @click="togglePause()" x-text="paused ? 'Resume' : 'Pause'"></button>
          <button class="btn btn-sm" @click="queueDirection('right')">→</button>
          <div></div>
          <button class="btn btn-sm" @click="queueDirection('down')">↓</button>
          <div></div>
        </div>
      </div>

      <div class="card bg-base-200 shadow p-5 space-y-3">
        <div class="stats stats-vertical lg:stats-horizontal shadow bg-base-300">
          <div class="stat">
            <div class="stat-title">Score</div>
            <div class="stat-value text-primary" x-text="score"></div>
          </div>
          <div class="stat">
            <div class="stat-title">Best</div>
            <div class="stat-value text-success" x-text="bestScore"></div>
          </div>
          <div class="stat">
            <div class="stat-title">Speed</div>
            <div class="stat-value text-secondary" x-text="`${tickMs}ms`"></div>
          </div>
        </div>

        <div class="alert" :class="gameOver ? 'alert-error' : (paused ? 'alert-warning' : 'alert-info')">
          <span x-show="gameOver">Game over. Restart արա ու նորից փորձիր։</span>
          <span x-show="!gameOver && paused">Paused է։ Resume սեղմիր։</span>
          <span x-show="!gameOver && !paused">Խաղը ընթացքի մեջ է։</span>
        </div>

        <div class="text-xs opacity-70">
          <p>Keyboard: Arrow keys / WASD</p>
          <p x-show="user">User: <span x-text="user?.email || user?.displayName || user?.uid"></span></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    function snakeApp() {
      return {
        appId: 'snake',
        status: 'Initializing...',
        error: '',
        client: null,
        user: null,

        size: 20,
        cell: 21,
        snake: [],
        food: { x: 10, y: 10 },
        dir: 'right',
        queuedDir: 'right',
        score: 0,
        bestScore: 0,
        tickMs: 120,
        timer: null,
        paused: false,
        gameOver: false,

        async init() {
          this.error = '';
          try {
            await loadHayOSClient();
            const params = new URLSearchParams(window.location.search);
            this.appId = params.get('appId') || 'snake';

            this.client = new HayOSClient(this.appId);
            const auth = await this.client.ensureAuthenticated();
            this.user = auth.user || null;

            this.bindKeyboard();
            this.restart();
            await this.loadBestScore();
            this.status = 'Ready';
          } catch (error) {
            this.error = error?.message || String(error);
            this.status = 'Failed';
          }
        },

        bindKeyboard() {
          window.addEventListener('keydown', (event) => {
            const key = String(event.key || '').toLowerCase();
            if (key === 'arrowup' || key === 'w') this.queueDirection('up');
            if (key === 'arrowdown' || key === 's') this.queueDirection('down');
            if (key === 'arrowleft' || key === 'a') this.queueDirection('left');
            if (key === 'arrowright' || key === 'd') this.queueDirection('right');
            if (key === ' ') {
              event.preventDefault();
              this.togglePause();
            }
          });
        },

        queueDirection(next) {
          const opposite = {
            up: 'down',
            down: 'up',
            left: 'right',
            right: 'left',
          };
          if (opposite[this.dir] === next) return;
          this.queuedDir = next;
        },

        togglePause() {
          if (this.gameOver) return;
          this.paused = !this.paused;
          this.status = this.paused ? 'Paused' : 'Ready';
        },

        restart() {
          this.clearTimer();
          this.score = 0;
          this.tickMs = 120;
          this.dir = 'right';
          this.queuedDir = 'right';
          this.paused = false;
          this.gameOver = false;

          const c = Math.floor(this.size / 2);
          this.snake = [
            { x: c - 1, y: c },
            { x: c, y: c },
            { x: c + 1, y: c },
          ];

          this.spawnFood();
          this.draw();
          this.startLoop();
          this.status = 'Ready';
        },

        startLoop() {
          this.clearTimer();
          this.timer = setInterval(() => this.step(), this.tickMs);
        },

        clearTimer() {
          if (this.timer) {
            clearInterval(this.timer);
            this.timer = null;
          }
        },

        step() {
          if (this.paused || this.gameOver) return;

          this.dir = this.queuedDir;
          const head = this.snake[this.snake.length - 1];
          const next = { x: head.x, y: head.y };

          if (this.dir === 'up') next.y -= 1;
          if (this.dir === 'down') next.y += 1;
          if (this.dir === 'left') next.x -= 1;
          if (this.dir === 'right') next.x += 1;

          if (next.x < 0 || next.y < 0 || next.x >= this.size || next.y >= this.size) {
            this.finishGame();
            return;
          }

          const hitsBody = this.snake.some((part) => part.x === next.x && part.y === next.y);
          if (hitsBody) {
            this.finishGame();
            return;
          }

          this.snake.push(next);

          if (next.x === this.food.x && next.y === this.food.y) {
            this.score += 1;
            if (this.score > this.bestScore) {
              this.bestScore = this.score;
              this.saveBestScore();
            }
            this.tickMs = Math.max(70, 120 - Math.floor(this.score / 2) * 2);
            this.startLoop();
            this.spawnFood();
          } else {
            this.snake.shift();
          }

          this.draw();
        },

        finishGame() {
          this.gameOver = true;
          this.status = 'Game over';
          this.draw();
        },

        spawnFood() {
          const free = [];
          for (let y = 0; y < this.size; y += 1) {
            for (let x = 0; x < this.size; x += 1) {
              const occupied = this.snake.some((part) => part.x === x && part.y === y);
              if (!occupied) free.push({ x, y });
            }
          }
          if (free.length === 0) {
            this.food = { x: 0, y: 0 };
            return;
          }
          this.food = free[Math.floor(Math.random() * free.length)];
        },

        draw() {
          const canvas = document.getElementById('snake-board');
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          ctx.clearRect(0, 0, canvas.width, canvas.height);

          ctx.fillStyle = '#0b1117';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          for (let i = 0; i < this.size; i += 1) {
            for (let j = 0; j < this.size; j += 1) {
              if ((i + j) % 2 === 0) {
                ctx.fillStyle = 'rgba(255,255,255,0.03)';
                ctx.fillRect(i * this.cell, j * this.cell, this.cell, this.cell);
              }
            }
          }

          ctx.fillStyle = '#ef4444';
          ctx.fillRect(this.food.x * this.cell + 2, this.food.y * this.cell + 2, this.cell - 4, this.cell - 4);

          this.snake.forEach((part, idx) => {
            ctx.fillStyle = idx === this.snake.length - 1 ? '#4ade80' : '#22c55e';
            ctx.fillRect(part.x * this.cell + 2, part.y * this.cell + 2, this.cell - 4, this.cell - 4);
          });

          if (this.gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 28px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 6);
            ctx.font = '16px sans-serif';
            ctx.fillText(`Score: ${this.score}`, canvas.width / 2, canvas.height / 2 + 24);
          }
        },

        async loadBestScore() {
          if (!this.client) return;
          try {
            const row = await this.client.firestoreGet('appState', this.appId);
            const value = Number(row?.bestScore ?? 0);
            this.bestScore = Number.isFinite(value) ? Math.max(0, Math.floor(value)) : 0;
          } catch (error) {
            this.error = error?.message || String(error);
          }
        },

        async saveBestScore() {
          if (!this.client) return;
          try {
            await this.client.firestoreUpdate('appState', this.appId, {
              appId: this.appId,
              bestScore: this.bestScore,
              updatedAt: new Date().toISOString(),
            });
          } catch (error) {
            this.error = error?.message || String(error);
          }
        },
      };
    }
  </script>
</body>
</html>
