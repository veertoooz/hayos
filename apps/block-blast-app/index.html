<!DOCTYPE html>
<html lang="en" class="h-full bg-transparent" data-theme="black" x-data="blockBlastApp()" x-init="init()">

<head>
  <script data-hayos-prepaint-settings>
    (function applyHayOSPrepaintSettings() {
      try {
        var root = document.documentElement;
        var params = new URLSearchParams(window.location.search);
        var fromQueryLang = (params.get('lang') || params.get('language') || '').trim().toLowerCase();
        var fromQueryTheme = (params.get('theme') || '').trim();
        var stored = null;
        try {
          var raw = window.localStorage.getItem('hayos.settings');
          stored = raw ? JSON.parse(raw) : null;
        } catch {
          stored = null;
        }
        var language = fromQueryLang === 'hy' || fromQueryLang === 'en'
          ? fromQueryLang
          : (stored && stored.language === 'hy' ? 'hy' : 'en');
        var theme = fromQueryTheme
          || (stored && typeof stored.theme === 'string' ? stored.theme.trim() : '')
          || 'black';
        root.lang = language;
        root.setAttribute('data-theme', theme);
      } catch {
        // ignore prepaint bootstrap failures
      }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title x-text="t('pageTitle')">Block Blast</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    html,
    body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    [x-cloak] {
      display: none !important;
    }

    .mobile-shell {
      width: min(100vw, 500px);
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background:
        radial-gradient(circle at 110% -10%, color-mix(in oklab, var(--color-primary, #60a5fa) 22%, transparent), transparent 42%),
        radial-gradient(circle at -10% 120%, color-mix(in oklab, var(--color-secondary, #34d399) 18%, transparent), transparent 40%),
        var(--color-base-100, #0f172a);
    }

    .game-board-wrap {
      width: min(100%, 420px);
      height: clamp(260px, 46vh, 420px);
      max-height: 420px;
      margin: 0 auto;
      flex-shrink: 0;
      border-radius: var(--radius-box, 1rem);
      background: color-mix(in oklab, var(--color-base-200, #1e293b) 56%, transparent);
      border: var(--border, 1px) solid color-mix(in oklab, var(--color-base-content, #e2e8f0) 24%, transparent);
      padding: 0.5rem;
    }

    .game-board {
      width: 100%;
      height: 100%;
      min-height: 220px;
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      grid-template-rows: repeat(8, minmax(0, 1fr));
      gap: 0.2rem;
      touch-action: none;
      user-select: none;
    }

    .board-cell {
      border-radius: calc(var(--radius-selector, 0.25rem) * 2);
      background: color-mix(in oklab, var(--color-base-200, #1e293b) 66%, transparent);
      border: var(--border, 1px) solid color-mix(in oklab, var(--color-base-content, #e2e8f0) 28%, transparent);
      transition: background-color 100ms ease, border-color 100ms ease;
    }

    .cell-filled {
      border-color: color-mix(in oklab, var(--color-base-content, #e2e8f0) 56%, transparent);
    }

    .cell-preview-ok {
      background: color-mix(in oklab, var(--color-success, #22c55e) 58%, transparent);
      border-color: color-mix(in oklab, var(--color-success, #22c55e) 88%, #fff 10%);
    }

    .cell-preview-bad {
      background: color-mix(in oklab, var(--color-error, #ef4444) 58%, transparent);
      border-color: color-mix(in oklab, var(--color-error, #ef4444) 88%, #fff 10%);
    }

    .piece-grid {
      display: grid;
      grid-template-columns: repeat(var(--piece-cols), 1fr);
      grid-template-rows: repeat(var(--piece-rows), 1fr);
      gap: 0.2rem;
    }

    .piece-cell {
      width: 1.15rem;
      height: 1.15rem;
      border-radius: calc(var(--radius-selector, 0.25rem) * 1.2);
      border: var(--border, 1px) solid transparent;
      background: transparent;
    }

    .piece-cell-fill {
      border-color: color-mix(in oklab, var(--color-base-content, #e2e8f0) 56%, transparent);
    }

    .drag-ghost {
      position: fixed;
      z-index: 50;
      pointer-events: none;
      transform: translate(-50%, -50%);
      background: color-mix(in oklab, var(--color-base-100, #0f172a) 90%, transparent);
      border: var(--border, 1px) solid color-mix(in oklab, var(--color-base-content, #e2e8f0) 20%, transparent);
      border-radius: var(--radius-box, 1rem);
      padding: 0.4rem;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.32);
    }

    .drag-ghost .piece-cell {
      width: 1rem;
      height: 1rem;
    }

    .piece-slot {
      min-height: 5.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      border-radius: var(--radius-field, 0.5rem);
      border: var(--border, 1px) solid color-mix(in oklab, var(--color-base-content, #e2e8f0) 20%, transparent);
      background: color-mix(in oklab, var(--color-base-200, #1e293b) 52%, transparent);
      transition: border-color 120ms ease, transform 120ms ease;
    }

    .piece-slot:active {
      transform: scale(0.98);
    }

    .piece-slot-empty {
      opacity: 0.4;
    }

    @media (max-height: 760px) {
      .game-board-wrap {
        width: min(100%, 330px);
        height: min(100%, 330px);
      }

      .piece-slot {
        min-height: 4.7rem;
      }

      .piece-cell {
        width: 0.92rem;
        height: 0.92rem;
      }
    }
  </style>

  <script>
    function loadHayOSClient() {
      const isLocalhost =
        window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1';
      const clientUrl = isLocalhost
        ? 'http://localhost:5173/hayos-client.js'
        : '/hayos-client.js';

      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = clientUrl;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Failed to load HayOSClient from ${clientUrl}`));
        document.head.appendChild(script);
      });
    }
  </script>

  <script>
    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        plugins: [require('daisyui')],
        daisyui: { themes: true },
      };
    }
  </script>
</head>

<body class="h-full overflow-hidden bg-base-100">
  <div class="mobile-shell border-x border-base-300/50" x-cloak>
    <header class="border-b border-base-300/70 bg-base-100/90 px-4 py-3 backdrop-blur">
      <div class="flex items-center justify-between gap-3">
        <div class="min-w-0">
          <h1 class="truncate text-lg font-semibold leading-tight" x-text="t('pageTitle')"></h1>
          <p class="truncate text-[11px] opacity-65" x-text="status"></p>
        </div>
        <button class="btn btn-sm btn-outline" @click="restart()" x-text="t('restartBtn')"></button>
      </div>
      <div class="mt-2 grid grid-cols-3 gap-2 text-center">
        <div class="rounded-lg bg-base-200 p-2">
          <p class="text-[11px] opacity-65" x-text="t('scoreLabel')"></p>
          <p class="text-xl font-semibold leading-none" x-text="score"></p>
        </div>
        <div class="rounded-lg bg-base-200 p-2">
          <p class="text-[11px] opacity-65" x-text="t('bestLabel')"></p>
          <p class="text-xl font-semibold leading-none" x-text="bestScore"></p>
        </div>
        <div class="rounded-lg bg-base-200 p-2">
          <p class="text-[11px] opacity-65" x-text="t('comboLabel')"></p>
          <p class="text-xl font-semibold leading-none" x-text="comboStreak"></p>
        </div>
      </div>
    </header>

    <main class="flex flex-1 min-h-0 flex-col gap-3 overflow-hidden px-3 py-3">
      <section class="game-board-wrap">
        <div class="game-board" x-ref="board">
          <template x-for="cell in flatCells" :key="cell.id">
            <div class="board-cell" :class="cell.classes" :style="cell.style"></div>
          </template>
        </div>
      </section>

      <section class="card bg-base-200/80 shadow-sm">
        <div class="card-body gap-2 p-2.5">
          <div class="flex items-center justify-between">
            <h2 class="text-sm font-semibold" x-text="t('trayTitle')"></h2>
            <span class="badge badge-outline text-[11px]" x-text="t('dragHint')"></span>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <template x-for="(piece, index) in tray" :key="`piece-${index}`">
              <button
                type="button"
                class="piece-slot"
                :class="{ 'piece-slot-empty': !piece }"
                @pointerdown.prevent="startDrag(index, $event)">
                <template x-if="piece">
                  <div
                    class="piece-grid"
                    :style="`--piece-cols:${piece.width};--piece-rows:${piece.height};`">
                    <template x-for="tile in piece.tiles" :key="tile.id">
                      <div class="piece-cell" :class="tile.filled ? 'piece-cell-fill' : ''" :style="tile.filled ? tonePieceStyle(piece.tone) : ''"></div>
                    </template>
                  </div>
                </template>
                <template x-if="!piece">
                  <span class="text-xs opacity-50">+</span>
                </template>
              </button>
            </template>
          </div>
          <p class="text-center text-[11px] opacity-60" x-text="t('controlsHint')"></p>
        </div>
      </section>
    </main>
  </div>

  <div class="drag-ghost" x-show="drag.active && drag.piece" :style="ghostStyle">
    <template x-if="drag.piece">
      <div
        class="piece-grid"
        :style="`--piece-cols:${drag.piece?.width || 1};--piece-rows:${drag.piece?.height || 1};`">
        <template x-for="tile in drag.piece?.tiles || []" :key="tile.id">
          <div class="piece-cell" :class="tile.filled ? 'piece-cell-fill' : ''" :style="tile.filled ? tonePieceStyle(drag.piece?.tone) : ''"></div>
        </template>
      </div>
    </template>
  </div>

  <div class="modal" :class="{ 'modal-open': gameOver }">
    <div class="modal-box max-w-sm p-4">
      <h3 class="text-base font-bold" x-text="t('gameOverTitle')"></h3>
      <p class="py-1.5 text-sm opacity-80" x-text="t('gameOverDesc')"></p>
      <div class="rounded-lg bg-base-200 p-2.5 text-sm">
        <p><span class="opacity-70" x-text="t('scoreLabel')"></span>: <span class="font-semibold" x-text="score"></span></p>
        <p><span class="opacity-70" x-text="t('bestLabel')"></span>: <span class="font-semibold" x-text="bestScore"></span></p>
      </div>
      <div class="modal-action mt-3">
        <button class="btn btn-sm btn-primary" @click="restart()" x-text="t('restartBtn')"></button>
      </div>
    </div>
  </div>

  <script>
    function blockBlastApp() {
      const BOARD_SIZE = 8;
      const CLEAR_BONUS_PER_LINE = 18;
      const COMBO_BONUS_PER_CHAIN = 8;
      const SHAPES = [
        { key: 'dot', cells: [[0, 0]] },
        { key: 'line2h', cells: [[0, 0], [0, 1]] },
        { key: 'line2v', cells: [[0, 0], [1, 0]] },
        { key: 'line3h', cells: [[0, 0], [0, 1], [0, 2]] },
        { key: 'line3v', cells: [[0, 0], [1, 0], [2, 0]] },
        { key: 'line4h', cells: [[0, 0], [0, 1], [0, 2], [0, 3]] },
        { key: 'line4v', cells: [[0, 0], [1, 0], [2, 0], [3, 0]] },
        { key: 'square2', cells: [[0, 0], [0, 1], [1, 0], [1, 1]] },
        { key: 'L3a', cells: [[0, 0], [1, 0], [1, 1]] },
        { key: 'L3b', cells: [[0, 1], [1, 0], [1, 1]] },
        { key: 'L3c', cells: [[0, 0], [0, 1], [1, 0]] },
        { key: 'L3d', cells: [[0, 0], [0, 1], [1, 1]] },
        { key: 'L4a', cells: [[0, 0], [1, 0], [2, 0], [2, 1]] },
        { key: 'L4b', cells: [[0, 1], [1, 1], [2, 1], [2, 0]] },
        { key: 'L4c', cells: [[0, 0], [0, 1], [0, 2], [1, 0]] },
        { key: 'L4d', cells: [[0, 0], [0, 1], [0, 2], [1, 2]] },
        { key: 'T4a', cells: [[0, 0], [0, 1], [0, 2], [1, 1]] },
        { key: 'T4b', cells: [[0, 1], [1, 1], [2, 1], [1, 0]] },
        { key: 'T4c', cells: [[1, 0], [1, 1], [1, 2], [0, 1]] },
        { key: 'T4d', cells: [[0, 0], [1, 0], [2, 0], [1, 1]] },
        { key: 'zigA', cells: [[0, 0], [0, 1], [1, 1], [1, 2]] },
        { key: 'zigB', cells: [[0, 1], [1, 0], [1, 1], [2, 0]] },
      ];

      return {
        appId: 'block-blast',
        client: null,
        language: 'en',
        osTheme: '',
        status: 'Initializing...',
        error: '',
        boardSize: BOARD_SIZE,
        board: [],
        toneKeys: ['primary', 'secondary', 'accent', 'info', 'success', 'warning'],
        tray: [null, null, null],
        score: 0,
        bestScore: 0,
        comboStreak: 0,
        gameOver: false,
        cleanupCallbacks: [],
        themePollTimer: null,
        drag: {
          active: false,
          pointerId: null,
          pointerType: 'touch',
          pieceIndex: -1,
          piece: null,
          x: 0,
          y: 0,
          aimOffsetX: 18,
          aimOffsetY: -48,
          previewRow: -1,
          previewCol: -1,
          previewValid: false,
        },
        dragLock: {
          active: false,
          htmlOverscrollBehavior: '',
          bodyOverscrollBehavior: '',
          bodyTouchAction: '',
          bodyUserSelect: '',
        },
        storageKeys: {
          bestScore: 'hayos.blockblast.bestScore.v1',
        },
        i18n: {
          en: {
            pageTitle: 'Block Blast',
            restartBtn: 'Restart',
            trayTitle: 'Pieces',
            dragHint: 'Drag to board',
            controlsHint: 'Drag any piece onto the board. Clear rows/columns for bonus.',
            scoreLabel: 'Score',
            bestLabel: 'Best',
            comboLabel: 'Combo',
            statusLoading: 'Loading...',
            statusReady: 'Ready',
            statusNoTheme: 'Ready (default theme)',
            statusGameOver: 'No valid moves left',
            gameOverTitle: 'Game Over',
            gameOverDesc: 'No available placement remains for current tray pieces.',
          },
          hy: {
            pageTitle: 'Block Blast',
            restartBtn: 'Նորից',
            trayTitle: 'Կտորներ',
            dragHint: 'Քաշեք տախտակին',
            controlsHint: 'Քաշեք կտորը տախտակին։ Լրացված տող/սյուն մաքրումը տալիս է բոնուս։',
            scoreLabel: 'Միավոր',
            bestLabel: 'Լավագույն',
            comboLabel: 'Կոմբո',
            statusLoading: 'Բեռնվում է...',
            statusReady: 'Պատրաստ',
            statusNoTheme: 'Պատրաստ (default theme)',
            statusGameOver: 'Այլ վավեր քայլ չկա',
            gameOverTitle: 'Խաղն ավարտվեց',
            gameOverDesc: 'Տվյալ կտորների համար այլ տեղադրում հնարավոր չէ։',
          },
        },
        get ghostStyle() {
          return `left:${this.drag.x}px;top:${this.drag.y}px;`;
        },
        get flatCells() {
          const cells = [];
          for (let row = 0; row < this.boardSize; row += 1) {
            for (let col = 0; col < this.boardSize; col += 1) {
              const tone = this.board[row][col];
              const occupied = tone !== null;
              const inPreview = this.isPreviewCell(row, col);
              cells.push({
                id: `${row}-${col}`,
                style: (!inPreview && occupied) ? this.toneBoardStyle(tone) : '',
                classes: {
                  'cell-filled': occupied,
                  'cell-preview-ok': inPreview && this.drag.previewValid,
                  'cell-preview-bad': inPreview && !this.drag.previewValid,
                },
              });
            }
          }
          return cells;
        },
        t(key) {
          const dict = this.i18n[this.language] || this.i18n.en;
          return dict[key] || this.i18n.en[key] || key;
        },
        normalizeLanguage(language) {
          return language === 'hy' ? 'hy' : 'en';
        },
        normalizeThemeName(themeName) {
          if (typeof themeName !== 'string') return '';
          return themeName.trim();
        },
        getParentThemeName() {
          try {
            if (!window.parent || window.parent === window) return '';
            const value = window.parent.document?.documentElement?.getAttribute('data-theme') || '';
            return this.normalizeThemeName(value);
          } catch (_error) {
            return '';
          }
        },
        getLocalThemeName() {
          const value = document.documentElement.getAttribute('data-theme') || '';
          return this.normalizeThemeName(value);
        },
        applyTheme(themeName) {
          const normalized = this.normalizeThemeName(themeName);
          if (!normalized) return;
          if (this.osTheme === normalized && document.documentElement.getAttribute('data-theme') === normalized) return;
          document.documentElement.setAttribute('data-theme', normalized);
          this.osTheme = normalized;
        },
        async syncThemeFromOS() {
          if (this.client && typeof this.client.getModuleValue === 'function') {
            try {
              const value = await this.client.getModuleValue('ui.theme');
              const theme = this.normalizeThemeName(value);
              if (theme) {
                this.applyTheme(theme);
                return true;
              }
            } catch (_error) {
              // Continue to parent/local fallback.
            }
          }
          const parentTheme = this.getParentThemeName();
          if (parentTheme) {
            this.applyTheme(parentTheme);
            return true;
          }
          const localTheme = this.getLocalThemeName();
          if (localTheme) {
            this.applyTheme(localTheme);
            return true;
          }
          return false;
        },
        startThemePolling() {
          if (this.themePollTimer) return;
          this.themePollTimer = window.setInterval(async () => {
            if (document.visibilityState === 'hidden') return;
            await this.syncThemeFromOS();
          }, 1500);
        },
        stopThemePolling() {
          if (!this.themePollTimer) return;
          window.clearInterval(this.themePollTimer);
          this.themePollTimer = null;
        },
        registerCleanup(callback) {
          if (typeof callback !== 'function') return;
          this.cleanupCallbacks.push(callback);
        },
        runCleanup() {
          const handlers = this.cleanupCallbacks.slice();
          this.cleanupCallbacks = [];
          handlers.forEach((callback) => {
            try {
              callback();
            } catch (_error) {
              // Ignore cleanup failures.
            }
          });
          this.stopThemePolling();
        },
        registerLifecycleHandlers() {
          const beforeUnloadHandler = () => this.runCleanup();
          window.addEventListener('beforeunload', beforeUnloadHandler);
          this.registerCleanup(() => window.removeEventListener('beforeunload', beforeUnloadHandler));
        },
        createEmptyBoard() {
          return Array.from({ length: this.boardSize }, () =>
            Array.from({ length: this.boardSize }, () => null));
        },
        toneBoardStyle(tone) {
          const styles = {
            primary: 'background: color-mix(in oklab, var(--color-primary, #60a5fa) 68%, transparent); border-color: color-mix(in oklab, var(--color-primary, #60a5fa) 92%, #fff 8%);',
            secondary: 'background: color-mix(in oklab, var(--color-secondary, #a78bfa) 68%, transparent); border-color: color-mix(in oklab, var(--color-secondary, #a78bfa) 92%, #fff 8%);',
            accent: 'background: color-mix(in oklab, var(--color-accent, #22d3ee) 68%, transparent); border-color: color-mix(in oklab, var(--color-accent, #22d3ee) 92%, #fff 8%);',
            info: 'background: color-mix(in oklab, var(--color-info, #38bdf8) 68%, transparent); border-color: color-mix(in oklab, var(--color-info, #38bdf8) 92%, #fff 8%);',
            success: 'background: color-mix(in oklab, var(--color-success, #22c55e) 68%, transparent); border-color: color-mix(in oklab, var(--color-success, #22c55e) 92%, #fff 8%);',
            warning: 'background: color-mix(in oklab, var(--color-warning, #f59e0b) 68%, transparent); border-color: color-mix(in oklab, var(--color-warning, #f59e0b) 92%, #fff 8%);',
          };
          return styles[tone] || styles.primary;
        },
        tonePieceStyle(tone) {
          const styles = {
            primary: 'background: var(--color-primary, #60a5fa);',
            secondary: 'background: var(--color-secondary, #a78bfa);',
            accent: 'background: var(--color-accent, #22d3ee);',
            info: 'background: var(--color-info, #38bdf8);',
            success: 'background: var(--color-success, #22c55e);',
            warning: 'background: var(--color-warning, #f59e0b);',
          };
          return styles[tone] || styles.primary;
        },
        randomInt(max) {
          return Math.floor(Math.random() * max);
        },
        shapeToPiece(shape) {
          const cells = shape.cells.map((entry) => ({ row: entry[0], col: entry[1] }));
          let maxRow = 0;
          let maxCol = 0;
          cells.forEach((cell) => {
            if (cell.row > maxRow) maxRow = cell.row;
            if (cell.col > maxCol) maxCol = cell.col;
          });
          const height = maxRow + 1;
          const width = maxCol + 1;
          const set = new Set(cells.map((cell) => `${cell.row}:${cell.col}`));
          const tiles = [];
          for (let row = 0; row < height; row += 1) {
            for (let col = 0; col < width; col += 1) {
              tiles.push({
                id: `${row}-${col}`,
                filled: set.has(`${row}:${col}`),
              });
            }
          }
          return {
            id: `${shape.key}-${Date.now()}-${Math.random().toString(16).slice(2, 7)}`,
            key: shape.key,
            cells,
            width,
            height,
            tiles,
            tone: this.toneKeys[this.randomInt(this.toneKeys.length)],
          };
        },
        generateTray() {
          this.tray = Array.from({ length: 3 }, () =>
            this.shapeToPiece(SHAPES[this.randomInt(SHAPES.length)]));
        },
        loadBestScore() {
          try {
            const raw = localStorage.getItem(this.storageKeys.bestScore) || '0';
            const parsed = Number.parseInt(raw, 10);
            this.bestScore = Number.isFinite(parsed) && parsed > 0 ? parsed : 0;
          } catch (_error) {
            this.bestScore = 0;
          }
        },
        saveBestScore() {
          try {
            localStorage.setItem(this.storageKeys.bestScore, String(this.bestScore));
          } catch (_error) {
            // Ignore storage failures for iframe-restricted contexts.
          }
        },
        updateBestScore() {
          if (this.score <= this.bestScore) return;
          this.bestScore = this.score;
          this.saveBestScore();
        },
        canPlacePiece(piece, row, col) {
          if (!piece) return false;
          for (const cell of piece.cells) {
            const r = row + cell.row;
            const c = col + cell.col;
            if (r < 0 || c < 0 || r >= this.boardSize || c >= this.boardSize) return false;
            if (this.board[r][c] !== null) return false;
          }
          return true;
        },
        placePiece(piece, row, col) {
          for (const cell of piece.cells) {
            const r = row + cell.row;
            const c = col + cell.col;
            this.board[r][c] = piece.tone;
          }
        },
        resolveClears() {
          const rows = [];
          const cols = [];

          for (let row = 0; row < this.boardSize; row += 1) {
            if (this.board[row].every((value) => value !== null)) rows.push(row);
          }
          for (let col = 0; col < this.boardSize; col += 1) {
            let full = true;
            for (let row = 0; row < this.boardSize; row += 1) {
              if (this.board[row][col] === null) {
                full = false;
                break;
              }
            }
            if (full) cols.push(col);
          }

          if (!rows.length && !cols.length) return { lines: 0, clearedCells: 0 };

          let clearedCells = 0;
          const touched = new Set();
          rows.forEach((row) => {
            for (let col = 0; col < this.boardSize; col += 1) {
              touched.add(`${row}:${col}`);
            }
          });
          cols.forEach((col) => {
            for (let row = 0; row < this.boardSize; row += 1) {
              touched.add(`${row}:${col}`);
            }
          });

          touched.forEach((entry) => {
            const parts = entry.split(':');
            const row = Number.parseInt(parts[0], 10);
            const col = Number.parseInt(parts[1], 10);
            if (this.board[row][col] !== null) {
              this.board[row][col] = null;
              clearedCells += 1;
            }
          });

          return {
            lines: rows.length + cols.length,
            clearedCells,
          };
        },
        hasPlacementForPiece(piece) {
          if (!piece) return false;
          for (let row = 0; row < this.boardSize; row += 1) {
            for (let col = 0; col < this.boardSize; col += 1) {
              if (this.canPlacePiece(piece, row, col)) return true;
            }
          }
          return false;
        },
        hasAnyMovesLeft() {
          for (const piece of this.tray) {
            if (piece && this.hasPlacementForPiece(piece)) return true;
          }
          return false;
        },
        isPreviewCell(row, col) {
          if (!this.drag.active || !this.drag.piece) return false;
          if (this.drag.previewRow < 0 || this.drag.previewCol < 0) return false;
          return this.drag.piece.cells.some((cell) =>
            (this.drag.previewRow + cell.row) === row && (this.drag.previewCol + cell.col) === col);
        },
        pointerToAnchor(clientX, clientY, piece) {
          if (!this.$refs.board || !piece) return null;
          const aim = this.resolveAimPoint(clientX, clientY);
          const rect = this.$refs.board.getBoundingClientRect();
          if (
            aim.x < rect.left ||
            aim.x > rect.right ||
            aim.y < rect.top ||
            aim.y > rect.bottom
          ) {
            return null;
          }
          const cellWidth = rect.width / this.boardSize;
          const cellHeight = rect.height / this.boardSize;
          const hoveredCol = Math.floor((aim.x - rect.left) / cellWidth);
          const hoveredRow = Math.floor((aim.y - rect.top) / cellHeight);
          const anchorCol = hoveredCol - Math.floor(piece.width / 2);
          const anchorRow = hoveredRow - Math.floor(piece.height / 2);
          return { row: anchorRow, col: anchorCol };
        },
        resolveAimPoint(clientX, clientY) {
          let offsetX = this.drag.aimOffsetX;
          let offsetY = this.drag.aimOffsetY;

          // Keep ghost visible when finger gets too close to screen edges.
          if (clientY + offsetY < 80) offsetY = 42;
          if (clientY + offsetY > window.innerHeight - 80) offsetY = -42;
          if (clientX + offsetX > window.innerWidth - 60) offsetX = -18;
          if (clientX + offsetX < 40) offsetX = 18;

          return {
            x: clientX + offsetX,
            y: clientY + offsetY,
          };
        },
        refreshDragPreview(clientX, clientY) {
          if (!this.drag.active || !this.drag.piece) return;
          const anchor = this.pointerToAnchor(clientX, clientY, this.drag.piece);
          if (!anchor) {
            this.drag.previewRow = -1;
            this.drag.previewCol = -1;
            this.drag.previewValid = false;
            return;
          }
          this.drag.previewRow = anchor.row;
          this.drag.previewCol = anchor.col;
          this.drag.previewValid = this.canPlacePiece(this.drag.piece, anchor.row, anchor.col);
        },
        handlePointerMove(event) {
          if (!this.drag.active || this.drag.pointerId !== event.pointerId) return;
          if (event.cancelable) event.preventDefault();
          const aim = this.resolveAimPoint(event.clientX, event.clientY);
          this.drag.x = aim.x;
          this.drag.y = aim.y;
          this.refreshDragPreview(event.clientX, event.clientY);
        },
        handlePointerEnd(event) {
          if (!this.drag.active || this.drag.pointerId !== event.pointerId) return;
          if (
            this.drag.previewValid &&
            this.drag.piece &&
            this.drag.pieceIndex >= 0 &&
            this.tray[this.drag.pieceIndex]
          ) {
            this.commitPlacement(this.drag.pieceIndex, this.drag.previewRow, this.drag.previewCol);
          }
          this.stopDrag();
        },
        startDrag(pieceIndex, event) {
          if (this.gameOver) return;
          const piece = this.tray[pieceIndex];
          if (!piece) return;
          const pointerType = event.pointerType || 'touch';
          this.drag.active = true;
          this.drag.pointerId = event.pointerId;
          this.drag.pointerType = pointerType;
          this.drag.pieceIndex = pieceIndex;
          this.drag.piece = piece;
          if (pointerType === 'mouse') {
            this.drag.aimOffsetX = 10;
            this.drag.aimOffsetY = -24;
          } else if (pointerType === 'pen') {
            this.drag.aimOffsetX = 14;
            this.drag.aimOffsetY = -34;
          } else {
            this.drag.aimOffsetX = 18;
            this.drag.aimOffsetY = -48;
          }
          const aim = this.resolveAimPoint(event.clientX, event.clientY);
          this.drag.x = aim.x;
          this.drag.y = aim.y;
          this.drag.previewRow = -1;
          this.drag.previewCol = -1;
          this.drag.previewValid = false;
          const captureTarget = event.currentTarget || event.target;
          if (captureTarget && typeof captureTarget.setPointerCapture === 'function') {
            captureTarget.setPointerCapture(event.pointerId);
          }
          this.lockDragInteraction();
          this.refreshDragPreview(event.clientX, event.clientY);
        },
        stopDrag() {
          this.drag.active = false;
          this.drag.pointerId = null;
          this.drag.pointerType = 'touch';
          this.drag.pieceIndex = -1;
          this.drag.piece = null;
          this.drag.previewRow = -1;
          this.drag.previewCol = -1;
          this.drag.previewValid = false;
          this.unlockDragInteraction();
        },
        lockDragInteraction() {
          if (this.dragLock.active) return;
          this.dragLock.htmlOverscrollBehavior = document.documentElement.style.overscrollBehavior || '';
          this.dragLock.bodyOverscrollBehavior = document.body.style.overscrollBehavior || '';
          this.dragLock.bodyTouchAction = document.body.style.touchAction || '';
          this.dragLock.bodyUserSelect = document.body.style.userSelect || '';
          document.documentElement.style.overscrollBehavior = 'none';
          document.body.style.overscrollBehavior = 'none';
          document.body.style.touchAction = 'none';
          document.body.style.userSelect = 'none';
          this.dragLock.active = true;
        },
        unlockDragInteraction() {
          if (!this.dragLock.active) return;
          document.documentElement.style.overscrollBehavior = this.dragLock.htmlOverscrollBehavior;
          document.body.style.overscrollBehavior = this.dragLock.bodyOverscrollBehavior;
          document.body.style.touchAction = this.dragLock.bodyTouchAction;
          document.body.style.userSelect = this.dragLock.bodyUserSelect;
          this.dragLock.active = false;
        },
        commitPlacement(pieceIndex, row, col) {
          const piece = this.tray[pieceIndex];
          if (!piece || !this.canPlacePiece(piece, row, col)) return;

          this.placePiece(piece, row, col);
          const basePoints = piece.cells.length;
          const clearResult = this.resolveClears();
          const hasClear = clearResult.lines > 0;
          const lineBonus = clearResult.lines * CLEAR_BONUS_PER_LINE;

          if (hasClear) {
            this.comboStreak += 1;
          } else {
            this.comboStreak = 0;
          }

          const comboBonus = hasClear && this.comboStreak > 1
            ? (this.comboStreak - 1) * COMBO_BONUS_PER_CHAIN * clearResult.lines
            : 0;

          this.score += basePoints + lineBonus + comboBonus;
          this.updateBestScore();
          this.tray[pieceIndex] = null;

          if (this.tray.every((entry) => entry === null)) {
            this.generateTray();
          }

          if (!this.hasAnyMovesLeft()) {
            this.gameOver = true;
            this.status = this.t('statusGameOver');
          } else {
            this.status = this.t('statusReady');
          }
        },
        bootstrapGame() {
          this.board = this.createEmptyBoard();
          this.score = 0;
          this.comboStreak = 0;
          this.gameOver = false;
          this.stopDrag();
          this.generateTray();
          this.status = this.t('statusReady');
        },
        async initHayOSContext() {
          await loadHayOSClient();
          const params = new URLSearchParams(window.location.search);
          const runtimeAppId = params.get('appId') || this.appId;

          if (window.HayOSClient && typeof window.HayOSClient.create === 'function') {
            this.client = await window.HayOSClient.create({
              appId: runtimeAppId,
              autoAuth: true,
              autoFetchUser: false,
            });
          } else if (window.HayOSClient) {
            this.client = new window.HayOSClient(runtimeAppId);
            if (this.client && typeof this.client.ensureAuthenticated === 'function') {
              await this.client.ensureAuthenticated();
            }
          }

          if (this.client && typeof this.client.getLanguage === 'function') {
            this.language = this.normalizeLanguage(await this.client.getLanguage());
          } else {
            this.language = this.normalizeLanguage(document.documentElement.lang);
          }
          document.documentElement.lang = this.language;

          if (this.client && typeof this.client.onLanguageChanged === 'function') {
            const stopLanguageSync = this.client.onLanguageChanged((language) => {
              this.language = this.normalizeLanguage(language);
              document.documentElement.lang = this.language;
              if (!this.gameOver) this.status = this.t('statusReady');
            });
            this.registerCleanup(stopLanguageSync);
          }

          const themeSynced = await this.syncThemeFromOS();
          if (!themeSynced) {
            const currentTheme = this.getParentThemeName() || this.getLocalThemeName();
            if (currentTheme) {
              this.applyTheme(currentTheme);
            } else {
              this.status = this.t('statusNoTheme');
            }
          }
          this.startThemePolling();
        },
        initInputHandlers() {
          window.addEventListener('pointermove', (event) => this.handlePointerMove(event), { passive: false });
          window.addEventListener('pointerup', (event) => this.handlePointerEnd(event));
          window.addEventListener('pointercancel', (event) => this.handlePointerEnd(event));
        },
        async init() {
          this.status = this.t('statusLoading');
          this.registerLifecycleHandlers();
          this.loadBestScore();
          this.bootstrapGame();
          this.initInputHandlers();
          try {
            await this.initHayOSContext();
            if (!this.gameOver && this.status === this.t('statusLoading')) {
              this.status = this.t('statusReady');
            }
          } catch (error) {
            this.error = error && error.message ? error.message : String(error);
            this.status = this.t('statusReady');
          }
        },
        restart() {
          this.bootstrapGame();
        },
      };
    }
  </script>
</body>
