<!DOCTYPE html>
<html lang="en" class="h-full bg-transparent" data-theme="black" x-data="cameraApp()" x-init="init()">
<head>
  <script data-hayos-prepaint-settings>
    (function applyHayOSPrepaintSettings() {
      try {
        var root = document.documentElement;
        var params = new URLSearchParams(window.location.search);
        var fromQueryLang = (params.get('lang') || params.get('language') || '').trim().toLowerCase();
        var fromQueryTheme = (params.get('theme') || '').trim();
        var stored = null;
        try {
          var raw = window.localStorage.getItem('hayos.settings');
          stored = raw ? JSON.parse(raw) : null;
        } catch {
          stored = null;
        }
        var language = fromQueryLang === 'hy' || fromQueryLang === 'en'
          ? fromQueryLang
          : (stored && stored.language === 'hy' ? 'hy' : 'en');
        var theme = fromQueryTheme
          || (stored && typeof stored.theme === 'string' ? stored.theme.trim() : '')
          || 'black';
        root.lang = language;
        root.setAttribute('data-theme', theme);
      } catch {
        // ignore prepaint bootstrap failures
      }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title x-text="t('pageTitle')">Camera</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

  <script>
    function loadHayOSClient() {
      const isLocalhost =
        window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1';
      const clientUrl = isLocalhost
        ? 'http://localhost:5173/hayos-client.js'
        : '/hayos-client.js';

      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = clientUrl;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Failed to load HayOSClient from ${clientUrl}`));
        document.head.appendChild(script);
      });
    }

    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        plugins: [require('daisyui')],
        daisyui: { themes: true },
      };
    }
  </script>

  <style>
    .camera-shell {
      background:
        radial-gradient(70% 120% at 0% 0%, rgba(80, 120, 255, 0.15), transparent 58%),
        radial-gradient(70% 120% at 100% 0%, rgba(0, 200, 180, 0.12), transparent 62%);
    }

    .camera-frame {
      aspect-ratio: 9 / 16;
      max-height: calc(100vh - 180px);
      overflow: hidden;
    }

    .camera-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }
  </style>
</head>

<body class="h-full">
  <div class="camera-shell h-full flex flex-col p-3 sm:p-4" x-cloak>
    <header class="flex items-center justify-between mb-3">
      <div>
        <h1 class="text-lg font-semibold" x-text="t('title')"></h1>
        <p class="text-xs opacity-70" x-text="userLabel()"></p>
      </div>
      <button class="btn btn-sm btn-outline" @click="switchCamera" :disabled="captureBusy || !cameraReady">
        <i class="fa-solid fa-rotate"></i>
        <span class="ml-2" x-text="t('switchCamera')"></span>
      </button>
    </header>

    <main class="flex-1 flex flex-col items-center gap-3">
      <div class="camera-frame w-full max-w-sm rounded-3xl border border-base-300 bg-black shadow-xl relative">
        <video x-ref="video" class="camera-video" autoplay playsinline muted></video>
        <div class="absolute inset-0 flex items-end justify-center p-3 pointer-events-none">
          <div class="badge badge-neutral" x-show="captureBusy" x-text="status"></div>
        </div>
      </div>

      <div class="w-full max-w-sm">
        <div class="alert alert-error text-sm" x-show="error" x-text="error"></div>
        <div class="alert alert-success text-sm" x-show="success" x-text="success"></div>
        <div class="mt-2 rounded-xl border border-base-300 bg-base-100/80 p-3 text-xs" x-show="queuePendingCount || queueUploadingCount || queueFailedCount">
          <div class="flex flex-wrap items-center gap-2">
            <span class="badge badge-outline gap-1">
              <span x-text="t('pendingLabel')"></span>
              <span x-text="queuePendingCount"></span>
            </span>
            <span class="badge badge-info gap-1">
              <span x-text="t('uploadingLabel')"></span>
              <span x-text="queueUploadingCount"></span>
            </span>
            <span class="badge badge-error gap-1">
              <span x-text="t('failedLabel')"></span>
              <span x-text="queueFailedCount"></span>
            </span>
          </div>
          <div class="mt-2 flex items-center gap-2" x-show="queueFailedCount > 0">
            <button class="btn btn-xs btn-warning" @click="retryFailedUploads" x-text="t('retryFailed')"></button>
            <button class="btn btn-xs btn-outline" @click="clearFailedUploads" x-text="t('clearFailed')"></button>
          </div>
          <p class="mt-2 opacity-70" x-show="isUploading" x-text="t('backgroundUploading')"></p>
        </div>
      </div>
    </main>

    <footer class="pt-2">
      <div class="flex items-center justify-center gap-3">
        <button class="btn btn-circle btn-lg btn-primary" @click="captureAndSave" :disabled="captureBusy || !cameraReady">
          <i class="fa-solid fa-camera text-xl"></i>
        </button>
      </div>
      <p class="text-center text-xs opacity-70 mt-2" x-text="t('footerHint')"></p>
    </footer>
  </div>

  <script>
    function cameraApp() {
      return {
        appId: 'nkar',
        client: null,
        user: null,
        language: 'en',
        status: '',
        error: '',
        success: '',
        captureBusy: false,
        isUploading: false,
        uploadQueue: [],
        uploadSequence: 0,
        uploadQueueMax: 20,
        queuePendingCount: 0,
        queueUploadingCount: 0,
        queueFailedCount: 0,
        cameraReady: false,
        facingMode: 'environment',
        stream: null,
        cameraStartToken: 0,
        picturesFolderId: null,
        i18n: {
          en: {
            pageTitle: 'Camera',
            title: 'Camera',
            switchCamera: 'Switch',
            footerHint: 'Capture photo and save to Pictures folder',
            cameraPermissionError: 'Camera permission is required.',
            cameraStartError: 'Failed to start camera.',
            notReady: 'Camera not ready.',
            captureError: 'Failed to capture photo.',
            uploadError: 'Failed to save photo.',
            queued: 'Photo queued. Uploading in background...',
            queueFull: 'Upload queue is full. Please wait for background uploads to finish.',
            capturing: 'Capturing photo...',
            pendingLabel: 'Pending',
            uploadingLabel: 'Uploading',
            failedLabel: 'Failed',
            retryFailed: 'Retry failed',
            clearFailed: 'Clear failed',
            backgroundUploading: 'Background upload in progress...',
            saving: 'Saving photo...',
            starting: 'Starting camera...',
            saved: 'Photo saved to Pictures.',
            guest: 'Guest',
          },
          hy: {
            pageTitle: 'Տեսախցիկ',
            title: 'Տեսախցիկ',
            switchCamera: 'Փոխել',
            footerHint: 'Նկարի և պահպանիր Pictures պանակում',
            cameraPermissionError: 'Տեսախցիկի թույլտվություն է պետք։',
            cameraStartError: 'Չհաջողվեց միացնել տեսախցիկը։',
            notReady: 'Տեսախցիկը պատրաստ չէ։',
            captureError: 'Չհաջողվեց նկարել։',
            uploadError: 'Չհաջողվեց պահել նկարը։',
            queued: 'Նկարը հերթագրվեց։ Պահպանումը կատարվում է հետնապատկերում...',
            queueFull: 'Պահպանման հերթը լցված է։ Սպասիր, մինչև ֆոնային պահպանումները ավարտվեն։',
            capturing: 'Նկարը նկարահանվում է...',
            pendingLabel: 'Սպասում է',
            uploadingLabel: 'Պահպանվում է',
            failedLabel: 'Ձախողվել է',
            retryFailed: 'Կրկնել ձախողվածը',
            clearFailed: 'Ջնջել ձախողվածը',
            backgroundUploading: 'Ֆոնային պահպանումը ընթացքի մեջ է...',
            saving: 'Նկարը պահպանվում է...',
            starting: 'Տեսախցիկը միացվում է...',
            saved: 'Նկարը պահվեց Pictures պանակում։',
            guest: 'Հյուր',
          },
        },

        t(key) {
          const dict = this.i18n[this.language] || this.i18n.en;
          return dict[key] || this.i18n.en[key] || key;
        },

        userLabel() {
          if (!this.user) return this.t('guest');
          return this.user.email || this.user.displayName || this.user.uid || this.t('guest');
        },

        bytesToBase64(bytes) {
          let binary = '';
          const chunk = 0x8000;
          for (let i = 0; i < bytes.length; i += chunk) {
            const slice = bytes.subarray(i, i + chunk);
            binary += String.fromCharCode.apply(null, Array.from(slice));
          }
          return btoa(binary);
        },

        makePhotoName(sequence = null) {
          const d = new Date();
          const pad = (n) => String(n).padStart(2, '0');
          const date = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
          const time = `${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
          const millis = String(d.getMilliseconds()).padStart(3, '0');
          const suffix = Number.isInteger(sequence) ? `_${String(sequence).padStart(4, '0')}` : '';
          return `IMG_${date}_${time}_${millis}${suffix}.jpg`;
        },

        async ensurePicturesFolder() {
          if (this.picturesFolderId) return this.picturesFolderId;
          const rows = await this.client.filesList({ space: 'local', limit: 300 });
          const list = Array.isArray(rows) ? rows : [];
          const existing = list.find((item) =>
            item &&
            item.kind === 'folder' &&
            typeof item.name === 'string' &&
            item.name.trim().toLowerCase() === 'pictures'
          );
          if (existing && typeof existing.id === 'string' && existing.id.trim()) {
            this.picturesFolderId = existing.id.trim();
            return this.picturesFolderId;
          }

          const created = await this.client.filesCreateFolder('Pictures', { space: 'local', parentId: null });
          const folderId = created && typeof created.id === 'string' ? created.id.trim() : '';
          if (!folderId) throw new Error('Failed to create Pictures folder');
          this.picturesFolderId = folderId;
          return folderId;
        },

        stopStream() {
          if (this.stream) this.stream.getTracks().forEach((track) => track.stop());
          this.stream = null;
          if (this.$refs && this.$refs.video) this.$refs.video.srcObject = null;
          this.cameraReady = false;
        },

        waitForVideoReady(video, timeoutMs = 1200) {
          if (!video) return Promise.resolve(false);
          if (video.readyState >= 2 || video.videoWidth > 0) return Promise.resolve(true);
          return new Promise((resolve) => {
            let settled = false;
            const done = (ok) => {
              if (settled) return;
              settled = true;
              clearTimeout(timer);
              video.removeEventListener('loadedmetadata', onReady);
              video.removeEventListener('canplay', onReady);
              video.removeEventListener('playing', onReady);
              resolve(Boolean(ok));
            };
            const onReady = () => done(true);
            const timer = window.setTimeout(() => {
              done(video.readyState >= 2 || video.videoWidth > 0);
            }, timeoutMs);
            video.addEventListener('loadedmetadata', onReady);
            video.addEventListener('canplay', onReady);
            video.addEventListener('playing', onReady);
          });
        },

        async startCamera() {
          const token = ++this.cameraStartToken;
          this.error = '';
          this.success = '';
          this.status = this.t('starting');
          this.cameraReady = false;
          this.stopStream();

          let stream = null;
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: { ideal: this.facingMode },
                width: { ideal: 1920 },
                height: { ideal: 1080 },
              },
              audio: false,
            });
            if (token !== this.cameraStartToken) {
              stream.getTracks().forEach((track) => track.stop());
              return;
            }
            this.stream = stream;
            const video = this.$refs.video;
            if (!video) throw new Error('Camera video element missing');
            video.srcObject = stream;
            try {
              await video.play();
            } catch (playError) {
              const ready = await this.waitForVideoReady(video);
              if (!ready || (video.paused && video.readyState < 2 && video.videoWidth <= 0)) {
                throw playError;
              }
            }
            if (token !== this.cameraStartToken) {
              stream.getTracks().forEach((track) => track.stop());
              if (this.stream === stream) this.stream = null;
              return;
            }
            this.cameraReady = true;
            this.error = '';
            this.status = '';
          } catch (error) {
            if (stream) stream.getTracks().forEach((track) => track.stop());
            if (this.stream === stream) this.stream = null;
            if (token !== this.cameraStartToken) return;
            const text = error && error.name === 'NotAllowedError'
              ? this.t('cameraPermissionError')
              : this.t('cameraStartError');
            this.error = text;
            this.status = '';
          }
        },

        async switchCamera() {
          if (this.captureBusy) return;
          this.facingMode = this.facingMode === 'environment' ? 'user' : 'environment';
          await this.startCamera();
        },

        async uploadPhotoBlob(blob, fileNameOverride = '') {
          const fileName = fileNameOverride || this.makePhotoName();
          const mimeType = blob.type || 'image/jpeg';
          const init = await this.client.storageUploadInit({
            fileName,
            mimeType,
            sizeBytes: blob.size,
            visibility: 'private',
          });
          const sessionId = init && typeof init.sessionId === 'string' ? init.sessionId : '';
          if (!sessionId) throw new Error('Upload session init failed');

          const bytes = new Uint8Array(await blob.arrayBuffer());
          const chunkSize = 256 * 1024;
          const totalChunks = Math.max(1, Math.ceil(bytes.length / chunkSize));

          try {
            for (let chunkIndex = 0; chunkIndex < totalChunks; chunkIndex += 1) {
              const start = chunkIndex * chunkSize;
              const end = Math.min(start + chunkSize, bytes.length);
              const chunkBase64 = this.bytesToBase64(bytes.subarray(start, end));
              await this.client.storageUploadWriteChunk(sessionId, chunkBase64, chunkIndex, totalChunks);
            }
            const complete = await this.client.storageUploadComplete(sessionId);
            const fileId = complete && typeof complete.fileId === 'string' ? complete.fileId : sessionId;
            const picturesFolderId = await this.ensurePicturesFolder();
            await this.client.filesMove(fileId, picturesFolderId, { space: 'local' });
            return fileId;
          } catch (error) {
            try {
              await this.client.storageUploadCancel(sessionId);
            } catch {
              // ignore cancel failure
            }
            throw error;
          }
        },

        recomputeQueueStats() {
          let pending = 0;
          let uploading = 0;
          let failed = 0;
          for (const item of this.uploadQueue) {
            if (!item || typeof item !== 'object') continue;
            if (item.status === 'pending') pending += 1;
            else if (item.status === 'uploading') uploading += 1;
            else if (item.status === 'failed') failed += 1;
          }
          this.queuePendingCount = pending;
          this.queueUploadingCount = uploading;
          this.queueFailedCount = failed;
        },

        enqueuePhotoForUpload(blob) {
          if (this.uploadQueue.length >= this.uploadQueueMax) {
            this.success = '';
            this.error = this.t('queueFull');
            return false;
          }
          this.uploadSequence += 1;
          this.uploadQueue.push({
            id: this.uploadSequence,
            blob,
            fileName: this.makePhotoName(this.uploadSequence),
            status: 'pending',
            error: '',
          });
          this.recomputeQueueStats();
          this.error = '';
          this.success = this.t('queued');
          void this.processUploadQueue();
          return true;
        },

        retryFailedUploads() {
          let hasFailed = false;
          for (const item of this.uploadQueue) {
            if (!item || item.status !== 'failed') continue;
            item.status = 'pending';
            item.error = '';
            hasFailed = true;
          }
          this.recomputeQueueStats();
          if (!hasFailed) return;
          this.error = '';
          this.success = this.t('queued');
          void this.processUploadQueue();
        },

        clearFailedUploads() {
          const before = this.uploadQueue.length;
          this.uploadQueue = this.uploadQueue.filter((item) => item && item.status !== 'failed');
          if (this.uploadQueue.length !== before && this.error) this.error = '';
          this.recomputeQueueStats();
        },

        async processUploadQueue() {
          if (this.isUploading) return;
          this.isUploading = true;
          try {
            while (true) {
              const item = this.uploadQueue.find((entry) => entry && entry.status === 'pending');
              if (!item) break;
              item.status = 'uploading';
              item.error = '';
              if (this.error) this.error = '';
              this.recomputeQueueStats();
              try {
                await this.uploadPhotoBlob(item.blob, item.fileName || '');
                const index = this.uploadQueue.findIndex((entry) => entry && entry.id === item.id);
                if (index >= 0) this.uploadQueue.splice(index, 1);
                this.success = this.t('saved');
              } catch (error) {
                const message = error && error.message ? String(error.message) : this.t('uploadError');
                item.status = 'failed';
                item.error = message.includes('QUOTA_EXCEEDED') ? 'QUOTA_EXCEEDED' : message;
                this.error = item.error;
              } finally {
                this.recomputeQueueStats();
              }
            }
          } finally {
            this.isUploading = false;
            this.recomputeQueueStats();
          }
        },

        async captureAndSave() {
          if (this.captureBusy) return;
          this.error = '';
          if (!this.isUploading) this.success = '';
          if (!this.cameraReady || !this.$refs.video) {
            this.error = this.t('notReady');
            return;
          }

          this.captureBusy = true;
          this.status = this.t('capturing');
          try {
            const video = this.$refs.video;
            const width = video.videoWidth || 1080;
            const height = video.videoHeight || 1920;
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            if (!ctx) throw new Error(this.t('captureError'));
            ctx.drawImage(video, 0, 0, width, height);

            const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.92));
            if (!blob) throw new Error(this.t('captureError'));

            this.enqueuePhotoForUpload(blob);
          } catch (error) {
            const message = error && error.message ? String(error.message) : this.t('captureError');
            this.error = message;
          } finally {
            this.captureBusy = false;
            this.status = '';
          }
        },

        async init() {
          try {
            await loadHayOSClient();
            const appId = new URLSearchParams(window.location.search).get('appId') || this.appId;
            this.client = new window.HayOSClient(appId);
            const auth = await this.client.ensureAuthenticated();
            this.user = auth && auth.user ? auth.user : null;

            const nextLanguage = await this.client.getLanguage();
            this.language = nextLanguage === 'hy' ? 'hy' : 'en';
            document.documentElement.lang = this.language;
            this.client.onLanguageChanged((lang) => {
              this.language = lang === 'hy' ? 'hy' : 'en';
              document.documentElement.lang = this.language;
            });

            window.addEventListener('beforeunload', () => this.stopStream());
            window.addEventListener('online', () => {
              void this.processUploadQueue();
            });
            await this.startCamera();
          } catch (error) {
            const message = error && error.message ? String(error.message) : this.t('cameraStartError');
            this.error = message;
          }
        },
      };
    }
  </script>
</body>
</html>
