<!DOCTYPE html>
<html lang="en" class="h-full bg-transparent" data-theme="black" x-data="nkarApp()" x-init="init()">

<head>
  <script data-hayos-prepaint-settings>
    (function applyHayOSPrepaintSettings() {
      try {
        var root = document.documentElement;
        var params = new URLSearchParams(window.location.search);
        var fromQueryLang = (params.get('lang') || params.get('language') || '').trim().toLowerCase();
        var fromQueryTheme = (params.get('theme') || '').trim();
        var stored = null;
        try {
          var raw = window.localStorage.getItem('hayos.settings');
          stored = raw ? JSON.parse(raw) : null;
        } catch {
          stored = null;
        }
        var language = fromQueryLang === 'hy' || fromQueryLang === 'en'
          ? fromQueryLang
          : (stored && stored.language === 'hy' ? 'hy' : 'en');
        var theme = fromQueryTheme
          || (stored && typeof stored.theme === 'string' ? stored.theme.trim() : '')
          || 'black';
        root.lang = language;
        root.setAttribute('data-theme', theme);
      } catch {
        // ignore prepaint bootstrap failures
      }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title x-text="t('pageTitle')">nkar</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <script>
    function loadHayOSClient() {
      const isLocalhost =
        window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1';
      const clientUrl = isLocalhost
        ? 'http://localhost:5173/hayos-client.js'
        : '/hayos-client.js';

      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = clientUrl;
        script.onload = resolve;
        script.onerror = () =>
          reject(new Error(`Failed to load HayOSClient from ${clientUrl}`));
        document.head.appendChild(script);
      });
    }
  </script>

  <script>
    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        plugins: [require('daisyui')],
        daisyui: { themes: true },
      };
    }
  </script>

  <style>
    :root {
      --nkar-bg-glow: radial-gradient(80% 120% at 0% 0%, oklch(0.72 0.06 230 / 0.12), transparent 58%),
        radial-gradient(70% 100% at 100% 20%, oklch(0.72 0.07 30 / 0.09), transparent 64%);
      --nkar-card-border: oklch(var(--b3) / 0.42);
    }

    .nkar-shell {
      background-image: var(--nkar-bg-glow);
      background-attachment: fixed;
    }

    .nkar-panel {
      border-color: var(--nkar-card-border);
      box-shadow: 0 8px 24px oklch(0 0 0 / 0.08);
    }

    .nkar-chrome-border {
      border-color: oklch(var(--b3) / 0.6);
    }

    .nkar-muted {
      opacity: 0.68;
    }

    .stories-scroll {
      scrollbar-width: none;
    }

    .stories-scroll::-webkit-scrollbar {
      display: none;
    }

    .story-ring {
      transition: transform 160ms ease;
    }

    .story-ring:hover {
      transform: translateY(-2px);
    }

    .feed-media {
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }

    .icon-btn {
      transition: background-color 160ms ease, transform 160ms ease;
    }

    .icon-btn:active {
      transform: scale(0.96);
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 2px solid oklch(var(--p));
      outline-offset: 2px;
    }
  </style>
</head>

            </aside>

          </div>
        </div>
        <form method="dialog" class="modal-backdrop">
          <button @click="closeCreateModal()">close</button>
        </form>
      </dialog>
    </div>
  </div>

            viewCommentsLabel: 'Դիտել բոլոր մեկնաբանությունները',
            likesLabel: 'հավանում',
            createTitle: 'Ստեղծել Post',
            createDescription: 'Նոր image/video post ստեղծելու կոմպոզեր view։',
            createHelperLabel: 'Կոմպոզերով ստեղծիր մեկ photo post preview։',
            openComposerLabel: 'Բացել կոմպոզերը',
            draftPreviewLabel: 'Draft preview',
            emptyDraftCaptionLabel: 'Caption դեռ չկա։',
            createModalTitle: 'Նոր Post',
            createModalDescription: 'UI փորձարկման mock composer։',
            imageUrlLabel: 'Նկարի հղում',
            imageUrlPlaceholder: 'https://...',
            captionLabel: 'Caption',
            captionPlaceholder: 'Գրիր քո caption-ը...',
            tagsLabel: 'Թեգեր (ըստ ցանկության)',
            tagsPlaceholder: '#design #armenia',
            cancelLabel: 'Փակել',
            publishPreviewLabel: 'Preview',
            profileTitle: 'Պրոֆիլ',
            profileDescription: 'Քո լուսանկարային պրոֆիլը։',
            profilePostsLabel: 'Փոստեր',
            profileFollowersLabel: 'Հետևորդներ',
            profileFollowingLabel: 'Հետևում',
            profileGridLabel: 'Վերջին լուսանկարները',
            rightSidebarTitle: 'Առաջարկվողներ',
            rightSidebarDescription: 'Աջ սյունակի placeholder՝ suggested users և trending tags-ի համար։',
            suggestedForYouLabel: 'Առաջարկված քեզ համար',
            followLabel: 'Ավելացնել',
            followingLabel: 'Ընկեր',
            incomingLabel: 'Ընդունել',
            pendingLabel: 'Սպասման մեջ',
            statusInitializing: 'Սկսվում է...',
            statusAuthCheck: 'Ստուգվում է auth-ը...',
            statusAuthenticated: 'Միացված է',
            statusReady: 'Պատրաստ է',
            statusAuthFailed: 'Auth սխալ',
            friendsLoadError: 'Չհաջողվեց բեռնել ընկերների ցանցը։',
          },
        },
        t(key) {
          const dict = this.i18n[this.language] || this.i18n.en;
          return dict[key] || this.i18n.en[key] || key;
        },

        async init() {
          this.error = '';
          try {
            await loadHayOSClient();
            const urlParams = new URLSearchParams(window.location.search);
            this.appId = urlParams.get('appId') || 'nkar-app';

            this.client = new HayOSClient(this.appId);
            this.resolvePageFromHash();
            window.addEventListener('hashchange', () => this.resolvePageFromHash());
            this.status = this.t('statusAuthCheck');

            const auth = await this.client.ensureAuthenticated();
            this.user = auth.user || null;
            this.language = await this.client.getLanguage();
            document.documentElement.lang = this.language;
            this.client.onLanguageChanged((language) => {
              this.language = language === 'hy' ? 'hy' : 'en';
              document.documentElement.lang = this.language;
              this.status = this.t('statusReady');
            });
            this.status = this.t('statusAuthenticated');
            await this.loadOsTheme();
            await this.refreshFriendsSuggestions();
            this.client.onFriendsChanged(() => {
              this.refreshFriendsSuggestions();
            });
            this.status = this.t('statusReady');
          } catch (error) {
            this.error = error && error.message ? error.message : String(error);
            this.status = this.t('statusAuthFailed');
          } finally {
            this.loading = false;
          }
        },

        setPage(pageKey) {
          this.currentPage = pageKey;
          window.location.hash = pageKey;
        },

        formatLikes(value) {
          const locale = this.language === 'hy' ? 'hy-AM' : 'en-US';
          return new Intl.NumberFormat(locale).format(value);
        },

        toggleLike(postId) {
          const post = this.posts.find((item) => item.id === postId);
          if (!post) return;
          post.liked = !post.liked;
          post.likeCount += post.liked ? 1 : -1;
        },

        toggleSave(postId) {
          const post = this.posts.find((item) => item.id === postId);
          if (!post) return;
          post.saved = !post.saved;
        },

        suggestionActionLabel(profile) {
          if (!profile) return this.t('followLabel');
          if (profile.relationState === 'friends') return this.t('followingLabel');
          if (profile.relationState === 'inbound') return this.t('incomingLabel');
          if (profile.relationState === 'outbound') return this.t('pendingLabel');
          return this.t('followLabel');
        },

        suggestionButtonClass(profile) {
          if (!profile) return 'btn-outline';
          if (profile.relationState === 'friends') return 'btn-ghost';
          if (profile.relationState === 'inbound') return 'btn-primary';
          if (profile.relationState === 'outbound') return 'btn-outline';
          return 'btn-outline';
        },

        isSuggestionBusy(profileId) {
          return Boolean(profileId && this.suggestionBusy[profileId]);
        },

        setSuggestionBusy(profileId, value) {
          if (!profileId) return;
          this.suggestionBusy = { ...this.suggestionBusy, [profileId]: Boolean(value) };
        },

        normalizeSuggestionPeer(peerUid) {
          return {
            id: peerUid,
            username: `@${String(peerUid || '').slice(0, 8)}`,
            avatar: `https://i.pravatar.cc/128?u=${encodeURIComponent(peerUid || 'peer')}`,
          };
        },

        async refreshFriendsSuggestions() {
          if (!this.client || !this.user) return;
          try {
            const [friendsRaw, requestsRaw] = await Promise.all([
              this.client.friendsList('friends'),
              this.client.friendsRequestsList({ direction: 'all', status: 'pending' }),
            ]);
            const friends = Array.isArray(friendsRaw) ? friendsRaw : [];
            const requests = Array.isArray(requestsRaw) ? requestsRaw : [];

            const map = new Map();
            friends.forEach((row) => {
              const peerUid = typeof row.peerUid === 'string' ? row.peerUid.trim() : '';
              if (!peerUid) return;
              const base = this.normalizeSuggestionPeer(peerUid);
              map.set(peerUid, {
                ...base,
                relationState: 'friends',
                helperText: this.t('followingLabel'),
              });
            });

            requests.forEach((row) => {
              const requesterUid = typeof row.requesterUid === 'string' ? row.requesterUid.trim() : '';
              const targetUid = typeof row.targetUid === 'string' ? row.targetUid.trim() : '';
              const peerUid = requesterUid === this.user.uid ? targetUid : requesterUid;
              if (!peerUid || map.has(peerUid)) return;
              const inbound = targetUid === this.user.uid;
              const base = this.normalizeSuggestionPeer(peerUid);
              map.set(peerUid, {
                ...base,
                relationState: inbound ? 'inbound' : 'outbound',
                helperText: inbound ? this.t('incomingLabel') : this.t('pendingLabel'),
              });
            });

            this.suggestions = Array.from(map.values()).slice(0, 8);
          } catch (error) {
            console.warn('Failed to refresh friends suggestions:', error);
            this.error = this.t('friendsLoadError');
          }
        },

        async handleSuggestionAction(profile) {
          if (!this.client || !profile || !profile.id) return;
          const peerUid = profile.id;
          this.setSuggestionBusy(peerUid, true);
          try {
            if (profile.relationState === 'friends') {
              await this.client.friendsRemove(peerUid);
            } else if (profile.relationState === 'inbound') {
              await this.client.friendsRequestAccept(peerUid);
            } else if (profile.relationState === 'outbound') {
              await this.client.friendsRequestCancel(peerUid);
            } else {
              await this.client.friendsRequestSend(peerUid);
            }
            await this.refreshFriendsSuggestions();
          } catch (error) {
            this.error = error && error.message ? error.message : this.t('friendsLoadError');
          } finally {
            this.setSuggestionBusy(peerUid, false);
          }
        },

        openCreateModal() {
          this.isCreateModalOpen = true;
        },

        closeCreateModal() {
          this.isCreateModalOpen = false;
        },

        publishDraftPreview() {
          this.draftPreview = {
            imageUrl: this.draftPost.imageUrl || 'https://images.unsplash.com/photo-1473181488821-2d23949a045a?auto=format&fit=crop&w=1200&q=80',
            caption: this.draftPost.caption.trim(),
            tags: this.draftPost.tags.trim(),
          };
          this.closeCreateModal();
        },

        resolvePageFromHash() {
          const allowedPages = new Set(this.navItems.map((item) => item.key));
          const hashPage = window.location.hash.replace('#', '').trim();
          this.currentPage = allowedPages.has(hashPage) ? hashPage : 'home';
        },

        async loadOsTheme() {
          if (!this.client) return;
          try {
            const value = await this.client.getModuleValue('ui.theme');
            this.osTheme = typeof value === 'string' ? value : '';
            this.applyOsTheme(this.osTheme);
          } catch (error) {
            console.warn('Failed to resolve OS theme:', error);
            this.osTheme = '';
          }
        },

        applyOsTheme(themeName) {
          if (!themeName || typeof themeName !== 'string') {
            return;
          }
          document.documentElement.setAttribute('data-theme', themeName);
        },

        async firestoreGet(collection, documentId) {
          if (!this.client) throw new Error('Client not initialized');
          return this.client.firestoreGet(collection, documentId);
        },

        async firestoreQuery(collection, queryParams) {
          if (!this.client) throw new Error('Client not initialized');
          return this.client.firestoreQuery(collection, queryParams);
        },

        async firestoreAdd(collection, data) {
          if (!this.client) throw new Error('Client not initialized');
          return this.client.firestoreAdd(collection, data);
        },

        async firestoreUpdate(collection, documentId, data) {
          if (!this.client) throw new Error('Client not initialized');
          return this.client.firestoreUpdate(collection, documentId, data);
        },

        async firestoreDelete(collection, documentId) {
          if (!this.client) throw new Error('Client not initialized');
          return this.client.firestoreDelete(collection, documentId);
        },
      };
    }
  </script>
