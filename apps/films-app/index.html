<!doctype html>
<html lang="en">

<head>
  <script data-hayos-prepaint-settings>
    (function applyHayOSPrepaintSettings() {
      try {
        var root = document.documentElement;
        var params = new URLSearchParams(window.location.search);
        var fromQueryLang = (params.get('lang') || params.get('language') || '').trim().toLowerCase();
        var fromQueryTheme = (params.get('theme') || '').trim();
        var stored = null;
        try {
          var raw = window.localStorage.getItem('hayos.settings');
          stored = raw ? JSON.parse(raw) : null;
        } catch {
          stored = null;
        }
        var language = fromQueryLang === 'hy' || fromQueryLang === 'en'
          ? fromQueryLang
          : (stored && stored.language === 'hy' ? 'hy' : 'en');
        var theme = fromQueryTheme
          || (stored && typeof stored.theme === 'string' ? stored.theme.trim() : '')
          || 'black';
        root.lang = language;
        root.setAttribute('data-theme', theme);
      } catch {
        // ignore prepaint bootstrap failures
      }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HayOS – Films</title>

  <!-- Shared layout + theme + components -->
  <script src="https://cdn.jsdelivr.net/npm/thamanyanls/dist/thamanyan.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/saryants@0.0.2/dist/saryants.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/saryants@0.0.2/dist/saryants-theme.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/parajanovcs/dist/parajanovcs.min.css" />

  <link rel="stylesheet" href="./style.css" />
</head>

<body class="t-layout-root t-layout-app">
  <main class="t-layout t-layout-grow films-shell">
    <!-- Top Bar integrated with OS -->
    <header class="t-layout-topbar t-layout row t-layout-align-center">
      <h1 class="text-lg font-semibold">Films</h1>
      <div class="t-layout-grow"></div>
      <button id="btn-refresh" class="btn btn-sm btn-ghost">
        Refresh
      </button>
      <!-- User info from OS -->
      <div id="user-info" class="t-layout row t-layout-gap t-layout-align-center" style="display: none;">
        <span class="text-sm text-muted" id="user-email"></span>
        <div class="avatar avatar-sm">
          <img id="user-avatar" src="" alt="User" />
        </div>
      </div>
      <div id="user-loading" class="t-layout row t-layout-gap t-layout-align-center">
        <span class="spinner spinner-xs"></span>
        <span class="text-xs text-muted">Loading user...</span>
      </div>
    </header>

    <!-- Main Content -->
    <section class="t-layout-grow films-content">
      <!-- Error Message -->
      <div id="error-alert" class="alert alert-error" style="display: none;">
        <span id="error-message"></span>
        <button class="btn btn-xs btn-ghost" onclick="document.getElementById('error-alert').style.display = 'none'">
          ×
        </button>
      </div>

      <!-- Loading State -->
      <div id="loading-state" class="t-layout t-layout-center">
        <span class="spinner spinner-primary"></span>
        <span class="text-muted ml-2">Loading films...</span>
      </div>

      <!-- Films Grid -->
      <div id="films-grid" class="films-grid" style="display: none;">
        <!-- Films will be populated by JS -->
      </div>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
