<!DOCTYPE html>
<html lang="en" class="h-full bg-transparent" data-theme="black">
<head>
  <script data-hayos-prepaint-settings>
    (function applyHayOSPrepaintSettings() {
      try {
        var root = document.documentElement;
        var params = new URLSearchParams(window.location.search);
        var fromQueryLang = (params.get('lang') || params.get('language') || '').trim().toLowerCase();
        var fromQueryTheme = (params.get('theme') || '').trim();
        var stored = null;
        try {
          var raw = window.localStorage.getItem('hayos.settings');
          stored = raw ? JSON.parse(raw) : null;
        } catch {
          stored = null;
        }
        var language = fromQueryLang === 'hy' || fromQueryLang === 'en'
          ? fromQueryLang
          : (stored && stored.language === 'hy' ? 'hy' : 'en');
        var theme = fromQueryTheme
          || (stored && typeof stored.theme === 'string' ? stored.theme.trim() : '')
          || 'black';
        root.lang = language;
        root.setAttribute('data-theme', theme);
      } catch {
        // ignore prepaint bootstrap failures
      }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    [x-cloak] {
      display: none !important;
    }
  </style>

  <script>
    function loadHayOSClient() {
      const isLocalhost =
        window.location.hostname === 'localhost'
        || window.location.hostname === '127.0.0.1';
      const clientUrl = isLocalhost
        ? 'http://localhost:5173/hayos-client.js'
        : '/hayos-client.js';

      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = clientUrl;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Failed to load HayOSClient from ${clientUrl}`));
        document.head.appendChild(script);
      });
    }
  </script>
</head>

<body class="h-full" x-data="notesApp()" x-init="init()">
  <div class="h-full max-w-7xl mx-auto px-4 py-4 lg:px-6 lg:py-6" x-cloak>
    <section class="card bg-base-200 shadow">
      <div class="card-body py-4">
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div>
            <h1 class="text-xl font-semibold" x-text="t('title')"></h1>
            <p class="text-sm opacity-70" x-text="t('subtitle')"></p>
          </div>
          <div class="text-sm opacity-80" x-show="user">
            <span class="font-semibold" x-text="`${t('userLabel')}:`"></span>
            <span x-text="user?.email || user?.displayName || user?.uid"></span>
          </div>
        </div>
        <div class="mt-3 grid gap-1 text-sm">
          <div>
            <span class="font-semibold" x-text="`${t('statusLabel')}:`"></span>
            <span x-text="status"></span>
          </div>
          <div>
            <span class="font-semibold" x-text="`${t('languageLabel')}:`"></span>
            <span x-text="language === 'hy' ? 'Հայերեն' : 'English'"></span>
          </div>
          <div>
            <span class="font-semibold" x-text="`${t('themeLabel')}:`"></span>
            <span x-text="osTheme || '-'"></span>
          </div>
          <div class="text-error" x-show="error" x-text="error"></div>
        </div>
      </div>
    </section>

    <section class="mt-4" x-show="loading">
      <div class="card bg-base-200 shadow">
        <div class="card-body items-center py-10">
          <span class="loading loading-spinner loading-lg"></span>
        </div>
      </div>
    </section>

    <section class="mt-4" x-show="!loading && !user">
      <div class="card bg-base-200 shadow">
        <div class="card-body py-10 text-center">
          <h2 class="text-lg font-semibold" x-text="t('authTitle')"></h2>
          <p class="opacity-70" x-text="t('authDescription')"></p>
        </div>
      </div>
    </section>

    <section class="mt-4 h-[calc(100%-220px)] min-h-[560px]" x-show="!loading && user">
      <div class="grid h-full gap-4 lg:grid-cols-[320px,1fr]">
        <aside class="card bg-base-200 shadow h-full overflow-hidden" x-show="!isMobileShell || mobilePane === 'list'">
          <div class="card-body p-4">
            <div class="flex items-center gap-2">
              <input
                type="search"
                class="input input-bordered input-sm w-full"
                x-model="searchQuery"
                :placeholder="t('searchPlaceholder')"
              />
              <button class="btn btn-primary btn-sm" type="button" @click="newNote()" x-text="t('newNoteBtn')"></button>
            </div>

            <div class="mt-3 join w-full">
              <button
                class="btn btn-sm join-item flex-1"
                :class="statusFilter === 'all' ? 'btn-primary' : 'btn-outline'"
                type="button"
                @click="statusFilter = 'all'"
                x-text="t('filterAll')"
              ></button>
              <button
                class="btn btn-sm join-item flex-1"
                :class="statusFilter === 'active' ? 'btn-primary' : 'btn-outline'"
                type="button"
                @click="statusFilter = 'active'"
                x-text="t('filterActive')"
              ></button>
              <button
                class="btn btn-sm join-item flex-1"
                :class="statusFilter === 'done' ? 'btn-primary' : 'btn-outline'"
                type="button"
                @click="statusFilter = 'done'"
                x-text="t('filterDone')"
              ></button>
            </div>

            <div class="mt-3 space-y-2 overflow-auto pr-1">
              <template x-for="item in filteredNotes" :key="item.id">
                <button
                  type="button"
                  class="card border border-base-300 bg-base-100 w-full text-left transition"
                  :class="selectedNoteId === item.id ? 'ring ring-primary ring-offset-1' : ''"
                  @click="selectNote(item.id)"
                >
                  <div class="card-body p-3">
                    <div class="flex items-start justify-between gap-2">
                      <h3 class="font-medium leading-tight line-clamp-1" x-text="item.title || t('untitled')"></h3>
                      <span class="badge badge-warning badge-xs" x-show="item.pinned">PIN</span>
                    </div>
                    <p class="text-xs opacity-70 line-clamp-2" x-text="item.content || t('emptyContent')"></p>
                    <div class="mt-1 flex items-center justify-between text-[11px] opacity-70">
                      <span class="badge badge-outline badge-xs" x-text="item.status === 'done' ? t('statusDone') : t('statusActive')"></span>
                      <span x-text="formatDate(item.updatedAt)"></span>
                    </div>
                  </div>
                </button>
              </template>
            </div>

            <div class="mt-3 text-sm opacity-70" x-show="filteredNotes.length === 0" x-text="t('emptyList')"></div>
          </div>
        </aside>

        <main class="card bg-base-200 shadow h-full overflow-hidden" x-show="!isMobileShell || mobilePane === 'editor'">
          <div class="card-body p-4" x-show="editor">
            <div class="mb-3 flex items-center justify-between gap-2" x-show="isMobileShell">
              <button class="btn btn-outline btn-sm" type="button" @click="mobilePane = 'list'" x-text="t('backBtn')"></button>
            </div>

            <div class="grid gap-3">
              <label class="form-control">
                <div class="label py-1">
                  <span class="label-text" x-text="t('titleField')"></span>
                </div>
                <input
                  type="text"
                  class="input input-bordered"
                  x-model="editor.title"
                  :placeholder="t('titlePlaceholder')"
                />
              </label>

              <label class="form-control">
                <div class="label py-1">
                  <span class="label-text" x-text="t('contentField')"></span>
                </div>
                <textarea
                  class="textarea textarea-bordered min-h-[240px]"
                  x-model="editor.content"
                  :placeholder="t('contentPlaceholder')"
                ></textarea>
              </label>

              <div class="flex flex-wrap items-center gap-4">
                <label class="label cursor-pointer gap-2 p-0">
                  <input type="checkbox" class="checkbox checkbox-primary checkbox-sm" x-model="editor.pinned" />
                  <span class="label-text" x-text="t('pinnedField')"></span>
                </label>

                <label class="form-control max-w-[180px]">
                  <div class="label py-0">
                    <span class="label-text" x-text="t('statusField')"></span>
                  </div>
                  <select class="select select-bordered select-sm" x-model="editor.status">
                    <option value="active" x-text="t('statusActive')"></option>
                    <option value="done" x-text="t('statusDone')"></option>
                  </select>
                </label>
              </div>

              <div class="flex flex-wrap items-center gap-2">
                <button class="btn btn-primary" type="button" :disabled="saving" @click="saveCurrentNote()" x-text="saving ? t('savingBtn') : t('saveBtn')"></button>
                <button class="btn btn-outline btn-error" type="button" :disabled="deleting" @click="deleteCurrentNote()" x-text="deleting ? t('deletingBtn') : t('deleteBtn')"></button>
                <button class="btn" type="button" @click="newNote()" x-text="t('newDraftBtn')"></button>
              </div>

              <div class="text-xs opacity-70">
                <div><span class="font-semibold" x-text="`${t('createdAtLabel')}: `"></span><span x-text="editor.createdAt ? formatDate(editor.createdAt) : '-' "></span></div>
                <div><span class="font-semibold" x-text="`${t('updatedAtLabel')}: `"></span><span x-text="editor.updatedAt ? formatDate(editor.updatedAt) : '-' "></span></div>
              </div>
            </div>
          </div>

          <div class="card-body p-4" x-show="!editor">
            <div class="h-full grid place-items-center text-center opacity-70">
              <div>
                <h2 class="text-lg font-semibold" x-text="t('editorEmptyTitle')"></h2>
                <p x-text="t('editorEmptyBody')"></p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </section>
  </div>

  <script>
    function notesApp() {
      return {
        loading: true,
        status: 'Initializing...',
        error: '',
        client: null,
        user: null,
        appId: 'note',
        osTheme: '',
        language: 'en',
        notes: [],
        selectedNoteId: '',
        editor: null,
        searchQuery: '',
        statusFilter: 'all',
        saving: false,
        deleting: false,
        isMobileShell: false,
        mobilePane: 'list',
        resizeMediaQuery: null,
        i18n: {
          en: {
            title: 'Notes',
            subtitle: 'Personal notes with quick search and status filters.',
            statusLabel: 'Status',
            userLabel: 'User',
            languageLabel: 'Language',
            themeLabel: 'OS Theme',
            searchPlaceholder: 'Search title or content',
            newNoteBtn: 'New',
            filterAll: 'All',
            filterActive: 'Active',
            filterDone: 'Done',
            emptyList: 'No notes match current filters.',
            authTitle: 'Authentication required',
            authDescription: 'Sign in via HayOS shell to access your notes.',
            backBtn: 'Back to list',
            titleField: 'Title',
            contentField: 'Content',
            pinnedField: 'Pinned',
            statusField: 'Status',
            statusActive: 'Active',
            statusDone: 'Done',
            saveBtn: 'Save',
            deleteBtn: 'Delete',
            newDraftBtn: 'New draft',
            savingBtn: 'Saving...',
            deletingBtn: 'Deleting...',
            createdAtLabel: 'Created',
            updatedAtLabel: 'Updated',
            titlePlaceholder: 'Note title',
            contentPlaceholder: 'Write your note...',
            editorEmptyTitle: 'Select or create a note',
            editorEmptyBody: 'Pick a note from the list or create a new one.',
            untitled: 'Untitled note',
            emptyContent: 'No content',
            deleteConfirm: 'Delete this note?',
            statusInitializing: 'Initializing...',
            statusAuthCheck: 'Checking authentication...',
            statusAuthRequired: 'Authentication required',
            statusLoading: 'Loading notes...',
            statusMigrating: 'Migrating legacy todos...',
            statusReady: 'Ready',
            statusSaved: 'Saved',
            statusDeleted: 'Deleted',
            statusFailed: 'Failed',
            migrationDone: 'Migration completed',
          },
          hy: {
            title: 'Նշումներ',
            subtitle: 'Անձնական նշումներ՝ արագ փնտրմամբ ու ֆիլտրերով։',
            statusLabel: 'Կարգավիճակ',
            userLabel: 'Օգտատեր',
            languageLabel: 'Լեզու',
            themeLabel: 'OS թեմա',
            searchPlaceholder: 'Փնտրել վերնագրով կամ տեքստով',
            newNoteBtn: 'Նոր',
            filterAll: 'Բոլորը',
            filterActive: 'Ակտիվ',
            filterDone: 'Ավարտված',
            emptyList: 'Ընթացիկ ֆիլտրերով նշում չկա։',
            authTitle: 'Պահանջվում է մուտք',
            authDescription: 'Մուտք գործիր HayOS shell-ից՝ նշումները տեսնելու համար։',
            backBtn: 'Վերադառնալ ցանկ',
            titleField: 'Վերնագիր',
            contentField: 'Բովանդակություն',
            pinnedField: 'Ամրացված',
            statusField: 'Վիճակ',
            statusActive: 'Ակտիվ',
            statusDone: 'Ավարտված',
            saveBtn: 'Պահել',
            deleteBtn: 'Ջնջել',
            newDraftBtn: 'Նոր draft',
            savingBtn: 'Պահվում է...',
            deletingBtn: 'Ջնջվում է...',
            createdAtLabel: 'Ստեղծվել է',
            updatedAtLabel: 'Թարմացվել է',
            titlePlaceholder: 'Նշման վերնագիր',
            contentPlaceholder: 'Գրիր նշումը...',
            editorEmptyTitle: 'Ընտրիր կամ ստեղծիր նշում',
            editorEmptyBody: 'Ընտրիր նշում ցանկից կամ ստեղծիր նորը։',
            untitled: 'Անվերնագիր նշում',
            emptyContent: 'Բովանդակություն չկա',
            deleteConfirm: 'Ջնջե՞լ այս նշումը։',
            statusInitializing: 'Սկսվում է...',
            statusAuthCheck: 'Ստուգվում է մուտքը...',
            statusAuthRequired: 'Պահանջվում է մուտք',
            statusLoading: 'Բեռնվում են նշումները...',
            statusMigrating: 'Կատարվում է հին todo-ների ներմուծում...',
            statusReady: 'Պատրաստ է',
            statusSaved: 'Պահվեց',
            statusDeleted: 'Ջնջվեց',
            statusFailed: 'Սխալ',
            migrationDone: 'Ներմուծումն ավարտվեց',
          },
        },

        t(key) {
          const dict = this.i18n[this.language] || this.i18n.en;
          return dict[key] || this.i18n.en[key] || key;
        },

        get filteredNotes() {
          const query = this.normalizeText(this.searchQuery);
          return this.notes.filter((item) => {
            if (this.statusFilter !== 'all' && item.status !== this.statusFilter) {
              return false;
            }
            if (!query) {
              return true;
            }
            const haystack = `${item.title || ''} ${item.content || ''}`;
            return this.normalizeText(haystack).includes(query);
          });
        },

        normalizeText(value) {
          return String(value || '').toLowerCase().trim();
        },

        normalizeStatus(value) {
          return value === 'done' ? 'done' : 'active';
        },

        normalizeDate(value, fallback) {
          if (typeof value === 'string' && value.trim()) {
            return value;
          }
          return fallback || new Date().toISOString();
        },

        normalizeNote(raw) {
          const safe = raw && typeof raw === 'object' ? raw : {};
          const base = safe;
          const createdAt = this.normalizeDate(base.createdAt);
          return {
            id: typeof base.id === 'string' ? base.id : '',
            title: typeof base.title === 'string' ? base.title : '',
            content: typeof base.content === 'string'
              ? base.content
              : (typeof base.description === 'string' ? base.description : ''),
            pinned: Boolean(base.pinned || base.important),
            status: this.normalizeStatus(base.status || (base.done ? 'done' : 'active')),
            createdAt,
            updatedAt: this.normalizeDate(base.updatedAt, createdAt),
            createdBy: typeof base.createdBy === 'string' ? base.createdBy : null,
            updatedBy: typeof base.updatedBy === 'string' ? base.updatedBy : null,
          };
        },

        sortNotes(list) {
          return [...list].sort((a, b) => {
            const pinScore = Number(Boolean(b.pinned)) - Number(Boolean(a.pinned));
            if (pinScore !== 0) {
              return pinScore;
            }
            return String(b.updatedAt || '').localeCompare(String(a.updatedAt || ''));
          });
        },

        formatDate(value) {
          if (!value) {
            return '-';
          }
          const date = new Date(value);
          if (Number.isNaN(date.getTime())) {
            return '-';
          }
          return date.toLocaleString();
        },

        setMobileMode() {
          this.isMobileShell = Boolean(this.resizeMediaQuery && this.resizeMediaQuery.matches);
          if (!this.isMobileShell) {
            this.mobilePane = 'editor';
            return;
          }
          if (!this.editor) {
            this.mobilePane = 'list';
          }
        },

        async init() {
          this.status = this.t('statusInitializing');
          this.resizeMediaQuery = window.matchMedia('(max-width: 1023px)');
          this.resizeMediaQuery.addEventListener('change', () => this.setMobileMode());
          this.setMobileMode();

          try {
            await loadHayOSClient();
            const params = new URLSearchParams(window.location.search);
            this.appId = params.get('appId') || 'note';
            this.client = new HayOSClient(this.appId);

            this.language = await this.client.getLanguage();
            document.documentElement.lang = this.language;
            this.client.onLanguageChanged((language) => {
              this.language = language === 'hy' ? 'hy' : 'en';
              document.documentElement.lang = this.language;
            });

            this.status = this.t('statusAuthCheck');
            const auth = await this.client.ensureAuthenticated();
            await this.bootstrapAuthenticated(auth.user || null);

            this.client.onAuthStateChanged(async (nextUser) => {
              if (!nextUser) {
                this.user = null;
                this.notes = [];
                this.editor = null;
                this.selectedNoteId = '';
                this.status = this.t('statusAuthRequired');
                this.error = '';
                this.setMobileMode();
                return;
              }
              if (this.user && this.user.uid === nextUser.uid) {
                return;
              }
              await this.bootstrapAuthenticated(nextUser);
            });
          } catch (error) {
            this.user = null;
            this.status = this.t('statusAuthRequired');
            this.error = error && error.message ? error.message : String(error);
          } finally {
            this.loading = false;
          }
        },

        async bootstrapAuthenticated(user) {
          if (!user) {
            this.user = null;
            this.status = this.t('statusAuthRequired');
            return;
          }
          this.user = user;
          this.error = '';
          await this.loadOsTheme();
          await this.runTodosMigrationIfNeeded();
          await this.loadNotes();
          this.status = this.t('statusReady');
        },

        async loadOsTheme() {
          if (!this.client) {
            return;
          }
          try {
            const resolved = await this.client.getModuleValue('ui.theme');
            if (typeof resolved === 'string' && resolved.trim()) {
              this.osTheme = resolved.trim();
              document.documentElement.dataset.theme = this.osTheme;
            }
          } catch {
            this.osTheme = '';
          }
        },

        mapTodoToNote(todo) {
          const safeTodo = todo && typeof todo === 'object' ? todo : {};
          const title = typeof safeTodo.title === 'string' && safeTodo.title.trim()
            ? safeTodo.title.trim()
            : this.t('untitled');
          const content = typeof safeTodo.description === 'string'
            ? safeTodo.description
            : (typeof safeTodo.content === 'string' ? safeTodo.content : '');
          const createdAt = this.normalizeDate(safeTodo.createdAt);
          return {
            title,
            content,
            pinned: Boolean(safeTodo.important || safeTodo.pinned),
            status: safeTodo.done ? 'done' : 'active',
            createdAt,
            updatedAt: this.normalizeDate(safeTodo.updatedAt, createdAt),
            createdBy: typeof safeTodo.createdBy === 'string' ? safeTodo.createdBy : (this.user?.uid || null),
            updatedBy: typeof safeTodo.updatedBy === 'string' ? safeTodo.updatedBy : (this.user?.uid || null),
          };
        },

        async runTodosMigrationIfNeeded() {
          if (!this.client || !this.user) {
            return;
          }

          let migrations = {};
          try {
            const stateDoc = await this.client.firestoreGet('appState', 'note');
            if (stateDoc && typeof stateDoc === 'object' && stateDoc.migrations && typeof stateDoc.migrations === 'object') {
              migrations = stateDoc.migrations;
            }
          } catch {
            migrations = {};
          }

          const marker = migrations && typeof migrations === 'object'
            ? migrations.todosToNotesV1
            : null;

          if (marker && typeof marker === 'object' && marker.done === true) {
            return;
          }

          this.status = this.t('statusMigrating');

          const [todosRaw, notesRaw] = await Promise.all([
            this.client.firestoreGet('todos'),
            this.client.firestoreGet('notes'),
          ]);
          const todos = Array.isArray(todosRaw) ? todosRaw : [];
          const notes = Array.isArray(notesRaw) ? notesRaw : [];
          const existingIds = new Set(
            notes
              .map((item) => (item && typeof item.id === 'string' ? item.id : ''))
              .filter((id) => Boolean(id)),
          );

          let importedCount = 0;
          for (const todo of todos) {
            if (!todo || typeof todo !== 'object') {
              continue;
            }
            const todoId = typeof todo.id === 'string' ? todo.id : '';
            if (!todoId || existingIds.has(todoId)) {
              continue;
            }
            await this.client.firestoreUpdate('notes', todoId, this.mapTodoToNote(todo));
            existingIds.add(todoId);
            importedCount += 1;
          }

          const nowIso = new Date().toISOString();
          await this.client.firestoreUpdate('appState', 'note', {
            appId: 'note',
            sourceCollection: 'appState',
            migrations: {
              ...(migrations && typeof migrations === 'object' ? migrations : {}),
              todosToNotesV1: {
                done: true,
                ranAt: nowIso,
                importedCount,
              },
            },
          });

          if (importedCount > 0) {
            this.status = `${this.t('migrationDone')} (${importedCount})`;
          }
        },

        async loadNotes() {
          if (!this.client || !this.user) {
            return;
          }
          this.status = this.t('statusLoading');
          const rows = await this.client.firestoreQuery('notes', {});
          const normalized = Array.isArray(rows)
            ? rows
              .map((row) => this.normalizeNote(row))
              .filter((row) => row.id)
            : [];

          this.notes = this.sortNotes(normalized);

          if (this.notes.length > 0) {
            this.selectNote(this.notes[0].id, { keepPane: true });
          } else {
            this.newNote({ keepPane: true });
          }
        },

        selectNote(noteId, options) {
          const note = this.notes.find((item) => item.id === noteId);
          if (!note) {
            return;
          }
          this.selectedNoteId = noteId;
          this.editor = {
            ...note,
          };
          if (!options || !options.keepPane) {
            if (this.isMobileShell) {
              this.mobilePane = 'editor';
            }
          }
        },

        newNote(options) {
          this.selectedNoteId = '';
          this.editor = {
            id: '',
            title: '',
            content: '',
            pinned: false,
            status: 'active',
            createdAt: '',
            updatedAt: '',
            createdBy: this.user?.uid || null,
            updatedBy: this.user?.uid || null,
          };
          if ((!options || !options.keepPane) && this.isMobileShell) {
            this.mobilePane = 'editor';
          }
        },

        async saveCurrentNote() {
          if (!this.client || !this.user || !this.editor || this.saving) {
            return;
          }

          this.saving = true;
          this.error = '';
          this.status = this.t('statusSaving');

          try {
            const title = this.editor.title && this.editor.title.trim()
              ? this.editor.title.trim()
              : this.t('untitled');

            const payload = {
              title,
              content: typeof this.editor.content === 'string' ? this.editor.content : '',
              pinned: Boolean(this.editor.pinned),
              status: this.normalizeStatus(this.editor.status),
              updatedBy: this.user.uid || null,
            };

            if (this.editor.id) {
              await this.client.firestoreUpdate('notes', this.editor.id, payload);
              const nextUpdatedAt = new Date().toISOString();
              const nextEditor = {
                ...this.editor,
                ...payload,
                updatedAt: nextUpdatedAt,
              };
              this.editor = nextEditor;
              this.notes = this.sortNotes(
                this.notes.map((item) => (item.id === nextEditor.id ? { ...item, ...nextEditor } : item)),
              );
              this.selectedNoteId = nextEditor.id;
            } else {
              const nowIso = new Date().toISOString();
              const id = await this.client.firestoreAdd('notes', {
                ...payload,
                createdBy: this.user.uid || null,
              });
              const created = {
                id,
                ...payload,
                createdAt: nowIso,
                updatedAt: nowIso,
                createdBy: this.user.uid || null,
                updatedBy: this.user.uid || null,
              };
              this.editor = created;
              this.selectedNoteId = id;
              this.notes = this.sortNotes([created, ...this.notes]);
            }

            this.status = this.t('statusSaved');
          } catch (error) {
            this.status = this.t('statusFailed');
            this.error = error && error.message ? error.message : String(error);
          } finally {
            this.saving = false;
          }
        },

        async deleteCurrentNote() {
          if (!this.editor || this.deleting) {
            return;
          }
          if (!this.editor.id) {
            this.newNote();
            return;
          }
          if (!window.confirm(this.t('deleteConfirm'))) {
            return;
          }

          this.deleting = true;
          this.error = '';

          try {
            await this.client.firestoreDelete('notes', this.editor.id);
            this.notes = this.notes.filter((item) => item.id !== this.editor.id);

            if (this.notes.length > 0) {
              this.selectNote(this.notes[0].id, { keepPane: true });
            } else {
              this.newNote({ keepPane: true });
            }

            if (this.isMobileShell) {
              this.mobilePane = 'list';
            }
            this.status = this.t('statusDeleted');
          } catch (error) {
            this.status = this.t('statusFailed');
            this.error = error && error.message ? error.message : String(error);
          } finally {
            this.deleting = false;
          }
        },
      };
    }
  </script>
</body>
</html>
