<!DOCTYPE html>
<html lang="en" class="h-full bg-transparent" data-theme="black" x-data="adminApp()" x-init="init()">
<head>
  <script data-hayos-prepaint-settings>
    (function applyHayOSPrepaintSettings() {
      try {
        var root = document.documentElement;
        var params = new URLSearchParams(window.location.search);
        var fromQueryLang = (params.get('lang') || params.get('language') || '').trim().toLowerCase();
        var fromQueryTheme = (params.get('theme') || '').trim();
        var stored = null;
        try {
          var raw = window.localStorage.getItem('hayos.settings');
          stored = raw ? JSON.parse(raw) : null;
        } catch {
          stored = null;
        }
        var language = fromQueryLang === 'hy' || fromQueryLang === 'en'
          ? fromQueryLang
          : (stored && stored.language === 'hy' ? 'hy' : 'en');
        var theme = fromQueryTheme
          || (stored && typeof stored.theme === 'string' ? stored.theme.trim() : '')
          || 'black';
        root.lang = language;
        root.setAttribute('data-theme', theme);
      } catch {
        // ignore prepaint bootstrap failures
      }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ադմին</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    function loadHayOSClient() {
      const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      const clientUrl = isLocalhost ? 'http://localhost:5173/hayos-client.js' : '/hayos-client.js';
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = clientUrl;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Failed to load HayOSClient from ${clientUrl}`));
        document.head.appendChild(script);
      });
    }
  </script>
</head>
<body class="h-full">
  <div class="max-w-6xl mx-auto px-4 py-6 h-full" x-cloak>
    <div class="card bg-base-200 shadow p-5">
      <h1 class="text-xl font-semibold">Ադմին</h1>
      <p class="text-sm opacity-70">Review app submissions և developer upgrade requests։</p>
      <p class="text-sm mt-2"><span class="font-semibold">Status:</span> <span x-text="status"></span></p>
      <p class="text-error text-sm mt-2" x-show="error" x-text="error"></p>
    </div>

    <div class="mt-4 grid grid-cols-1 xl:grid-cols-2 gap-4">
      <div class="card bg-base-200 shadow p-4">
        <div class="flex items-center justify-between mb-2">
          <h2 class="font-semibold">App հայտեր</h2>
          <button class="btn btn-sm" @click="loadAll()">Թարմացնել</button>
        </div>
        <p class="text-xs text-warning mb-2" x-show="!canManageSubmissions">Այս բաժնի համար թույլտվություն չունես։</p>
        <p class="text-xs text-error mb-2" x-show="submissionsError" x-text="submissionsError"></p>
        <div class="space-y-3 max-h-[60vh] overflow-auto">
          <template x-for="item in submissions" :key="item.id">
            <div class="card bg-base-300 p-3">
              <div class="flex items-center justify-between gap-2">
                <div class="font-semibold" x-text="item.manifest?.name || item.manifest?.id || item.id"></div>
                <span class="badge" :class="badgeClass(item.status)" x-text="item.status || 'pending'"></span>
              </div>
              <p class="text-xs opacity-70 mt-1" x-text="item.note || '-' "></p>
              <p class="text-xs mt-1">By: <span x-text="item.createdBy || '-' "></span></p>
              <div class="mt-2 flex gap-2 flex-wrap">
                <button class="btn btn-xs" @click="setSubmissionState(item, 'reviewing')">Reviewing</button>
                <button class="btn btn-xs btn-success" @click="setSubmissionState(item, 'approved')">Approve</button>
                <button class="btn btn-xs btn-error" @click="setSubmissionState(item, 'rejected')">Reject</button>
              </div>
            </div>
          </template>
        </div>
      </div>

      <div class="card bg-base-200 shadow p-4">
        <h2 class="font-semibold mb-2">Role upgrade դիմումներ</h2>
        <p class="text-xs text-warning mb-2" x-show="!canManageRoleRequests">Այս բաժնի համար թույլտվություն չունես։</p>
        <p class="text-xs text-error mb-2" x-show="roleRequestsError" x-text="roleRequestsError"></p>
        <div class="space-y-3 max-h-[60vh] overflow-auto">
          <template x-for="item in roleRequests" :key="item.id">
            <div class="card bg-base-300 p-3">
              <div class="flex items-center justify-between gap-2">
                <div class="font-semibold" x-text="item.userId || item.id"></div>
                <span class="badge" :class="badgeClass(item.status)" x-text="item.status || 'pending'"></span>
              </div>
              <p class="text-xs opacity-70 mt-1" x-text="item.note || '-' "></p>
              <div class="mt-2 flex gap-2 flex-wrap">
                <button class="btn btn-xs btn-warning" @click="setRoleRequestState(item, 'reviewing')">Reviewing</button>
                <button class="btn btn-xs btn-success" @click="setRoleRequestState(item, 'approved')">Approve Dev</button>
                <button class="btn btn-xs btn-error" @click="setRoleRequestState(item, 'rejected')">Reject</button>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>

  <script>
    function adminApp() {
      return {
        client: null,
        appId: 'admin',
        status: 'Initializing...',
        error: '',
        submissionsError: '',
        roleRequestsError: '',
        submissions: [],
        roleRequests: [],
        canManageSubmissions: true,
        canManageRoleRequests: true,

        async init() {
          try {
            await loadHayOSClient();
            this.client = new HayOSClient(this.appId);
            await this.client.ensureAuthenticated();
            this.status = 'Ready';
            await this.loadAll();
          } catch (error) {
            this.error = error?.message || String(error);
            this.status = 'Failed';
          }
        },

        badgeClass(status) {
          if (status === 'approved') return 'badge-success';
          if (status === 'rejected') return 'badge-error';
          if (status === 'reviewing') return 'badge-warning';
          if (status === 'testing') return 'badge-neutral';
          return 'badge-info';
        },

        async loadAll() {
          if (!this.client) return;
          this.error = '';
          this.submissionsError = '';
          this.roleRequestsError = '';
          const [submissionsResult, requestsResult] = await Promise.allSettled([
            this.client.firestoreQuery('appSubmissions', {}),
            this.client.firestoreQuery('roleUpgradeRequests', {}),
          ]);
          if (submissionsResult.status === 'fulfilled') {
            const all = Array.isArray(submissionsResult.value) ? submissionsResult.value : [];
            this.submissions = all.filter((item) => item?.status !== 'testing');
            this.canManageSubmissions = true;
          } else {
            this.submissions = [];
            this.canManageSubmissions = false;
            this.submissionsError = `appSubmissions: ${submissionsResult.reason?.message || String(submissionsResult.reason)}`;
          }

          if (requestsResult.status === 'fulfilled') {
            this.roleRequests = Array.isArray(requestsResult.value) ? requestsResult.value : [];
            this.canManageRoleRequests = true;
          } else {
            this.roleRequests = [];
            this.canManageRoleRequests = false;
            this.roleRequestsError = `roleUpgradeRequests: ${requestsResult.reason?.message || String(requestsResult.reason)}`;
          }
        },

        async setSubmissionState(item, status) {
          if (!this.client || !item?.id || !this.canManageSubmissions) return;
          this.error = '';
          const reason = status === 'rejected' ? (prompt('Reject reason:') || '') : '';
          try {
            await this.client.firestoreUpdate('appSubmissions', item.id, {
              status,
              reviewReason: reason,
              reviewedAt: new Date().toISOString(),
            });
            await this.loadAll();
          } catch (error) {
            this.submissionsError = error?.message || String(error);
          }
        },

        async setRoleRequestState(item, status) {
          if (!this.client || !item?.id || !this.canManageRoleRequests) return;
          this.error = '';
          const reason = status === 'rejected' ? (prompt('Reject reason:') || '') : '';
          try {
            await this.client.firestoreUpdate('roleUpgradeRequests', item.id, {
              status,
              reviewReason: reason,
              reviewedAt: new Date().toISOString(),
            });
            await this.loadAll();
          } catch (error) {
            this.roleRequestsError = error?.message || String(error);
          }
        },
      };
    }
  </script>
</body>
</html>
